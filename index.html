       the flipbox; the carousel ends in the ARRIVING face's animation */
    document.addEventListener("transitionend", e => {
      if (!e.target.classList || !e.target.classList.contains("flipbox") || e.propertyName !== "transform") return;
      flipLanded(e.target.closest(".d7f"));
    });
    document.addEventListener("animationend", e => {
      /* the front in-clone parks = the carousel lands (clones live in the
         overlays, outside .d7f — land the lb card directly) */
      if (e.animationName === "carInF") flipLanded(lbCard);
    });
    /* INERT since 2026-08-19: the Top/Bottom words are display:none at
       every width now (the desktop ghost took the corner — see the
       #lb-card .find rule), so this door can no longer fire. Kept with
       its markup rather than ripped out; the vault retired both.
       The Top/Bottom words are a flip control on the LIGHTBOX card only.
       The grid board-click that used to kick retired 2026-07-26 (Dylan): on a
       collection card the board IS the click target for inspecting, so putting
       a second verb on the same pixels could swallow an inspect — a pixel
       probe managing that ambiguity was the wrong answer to it. Every
       collection surface is now plainly tap/click-to-inspect. */
    document.addEventListener("click", e => {
      if (drag || dragStole) return;               /* a toss release is not a click */
      const fw = e.target.closest && e.target.closest(".d7f.canflip .find span");
      if (!fw || fw.closest(".d7f") !== lbCard) return;
      if (lbCard.classList.contains("flipping")) return;
      e.preventDefault(); e.stopPropagation();
      setFlip(lbCard, fw.classList.contains("fbot"));
    }, true);
    /* THE PHONE FLIP CHIP'S DOORS (2026-08-16). Grid cards: the chip is
       the whole flip — a dedicated corner target, so the board keeps its
       one tap-to-inspect verb (the kick-retirement ruling stands). The
       flip itself is the picks page's squash-swap-expand generalized
       (flipStage); the chip's mini always swaps to the face you are NOT
       looking at, and it is already warm — the incoming face IS the img
       the chip was showing. LB: the chip joins the words' own setFlip
       door. Picks: no handler here — the card flips on ANY tap
       (flipCaret), so the chip's tap just bubbles to it. */
    function flipStage(card, chip) {
      const img = card.querySelector(".stage img");
      const top = chip.dataset.top, bot = chip.dataset.bot;
      if (!img || !bot) return;
      /* the self-expiring token (the slideT law) — a frozen timer must
         never lock the card */
      const now = performance.now();
      if (now - (+img.dataset.flipT || 0) < 300) return;
      img.dataset.flipT = now;
      const toBot = !img.dataset.flipped;
      /* the face memory's grid writer — the chip carries its board's id */
      const fid = chip.dataset.id;
      if (fid) { if (toBot) FACE.add(fid); else FACE.delete(fid); }
      const face = chip.querySelector(".fface");
      img.style.transition = "scale .13s ease-in";
      img.style.scale = "0 1";
      setTimeout(() => {
        img.src = toBot ? bot : top;
        if (toBot) img.dataset.flipped = "1"; else delete img.dataset.flipped;
        if (face) face.src = toBot ? top : bot;   /* the chip shows the OTHER face */
        img.style.transition = "scale .16s ease-out";
        img.style.scale = "1 1";
        setTimeout(() => {
          img.style.removeProperty("scale");
          img.style.removeProperty("transition");
        }, 180);
      }, 140);
    }
    document.addEventListener("click", e => {
      const chip = e.target.closest && e.target.closest(".fflipc");
      if (!chip) return;
      const card = chip.closest(".d7f");
      if (card === lbCard) {
        /* un-dock-gated (T9, ported 2026-08-19 with the desktop ghost):
           the lb chip answers on EVERY width — the ghost is this same
           button sized up, so the door has to reach it. The gate moves
           below, where it still fences the grid chips. */
        e.preventDefault(); e.stopPropagation();
        if (!lbCard.classList.contains("canflip") || lbCard.classList.contains("flipping")) return;
        if (drag || dragStole) return;
        setFlip(lbCard, !lbCard.classList.contains("flipped"));
        return;
      }
      if (!dockActive()) return;   /* grid chips stay the phone's flip door */
      const scard = chip.closest(".scard");
      if (!scard) return;                                  /* flights, minis: not a control */
      if (scard.classList.contains("lisst-card")) return;  /* picks: bubble to flipCaret */
      e.preventDefault(); e.stopPropagation();             /* the board tap stays the inspect */
      flipStage(card, chip);
    }, true);
    /* the lb board: while the cutout is up the img click is the flip
       (the old departure to the collection page survives on photo views
       and bottomless boards — see the lbBig handler's canflip gate) */
    [lbBig, lbBot].forEach(im => im.addEventListener("click", e => {
      if (!lbCard.classList.contains("canflip") || lbCard.classList.contains("flipping")) return;
      if (drag || dragStole) return;
      const vis = lbCard.classList.contains("flipped") ? lbBot : lbBig;
      if (im !== vis || !boardHit(vis, e)) return;
      e.stopPropagation();
      setFlip(lbCard, !lbCard.classList.contains("flipped"));
    }));

    renderBay();

    /* ================= THREAD 3, MOBILE: the two ceremonies ==============
       (2026-08-16 — his spec. The CSS lives at the thread-3 block.)
       Placed at the tail of the script on purpose: everything above is
       initialised by the time any of this RUNS, and the intro kicks on a
       rAF so it fires after route() has booted the page (TDZ law). */
    const fveilEl = document.getElementById("fveil");
    const fveil = {
      up() { fveilEl.classList.remove("down"); fveilEl.classList.add("on"); },
      down() { fveilEl.classList.add("down"); },
      /* clear must SNAP: removing .down while visible would ride the frost
         back UP through the page on the transform transition */
      clear() {
        fveilEl.style.transition = "none";
        fveilEl.classList.remove("on", "down");
        void fveilEl.offsetWidth;
        fveilEl.style.transition = "";
      }
    };

    /* THE WORD IS THE DOOR: the bar's page name opens the menu with the
       engulf (openDrop dresses the organ). Desktop keeps the organ's own
       hover machinery — and the orb's real #shop-all click. */
    document.querySelector("#og-shop .orb").addEventListener("click", e => {
      if (drawnBarOn()) return;
      e.preventDefault();
      if (drop.classList.contains("open")) closeDrop(true); else openDrop();
    });

    /* ---- THE MENU-SELECT CEREMONY -------------------------------------
       Tap a row: the other rows fade and the page blurs under the veil
       while the chase dots hop to the selection, merge in, and the fill
       answers the merge (the desktop grammar, tap-clocked). The hash
       flips UNDER the veil. Then the filled box — word between two dots,
       already the exact size of the bar's word seat — rides up into the
       bar, the new name decodes back to black text between dots, and the
       veil rides down: the new section gains focus top-first. The shield
       (body.mnav::after, 6700) owns every input for the ride. */
    let mselN = 0;
    function mselReset() {
      document.querySelectorAll(".mride").forEach(n => n.remove());
      document.body.classList.remove("mnav", "mword");
      drop.classList.remove("selecting");
      dpanel.querySelectorAll(".drow").forEach(r => {
        /* .on comes off too (his catch: the picked row still wore its
           black fill the NEXT time the menu opened) — the ceremony armed
           it, so the ceremony's reset owns it; phone-only paths, so the
           desktop hover's own .on/.left custody is untouched */
        r.classList.remove("msel", "on", "left");
        r.style.visibility = "";
      });
      fveil.clear();
    }
    function playMenuSelect(row) {
      const id = (row.getAttribute("href") || "#").replace(/^#/, "");
      if (id === location.hash.replace(/^#/, "")) { closeDrop(true); return; }
      mselReset();
      const tok = ++mselN;
      const live = () => tok === mselN && document.body.classList.contains("mnav");
      document.body.classList.add("mnav");
      drop.classList.add("selecting");
      row.classList.add("msel");
      fveil.up();
      chase.to(row);   /* usually already mid-hop off the tap's pointerover */
      /* the fill answers the MERGE — read the chase's own phase rather
         than trusting a clock it may have started before the click */
      const t0 = performance.now();
      const fillWhenSeated = () => {
        if (!live()) return;
        const ph = chase.st();
        if (ph === "draw" || ph === "set" || performance.now() - t0 > 1400) {
          row.classList.remove("left");
          row.classList.add("on");
          setTimeout(lift, 420);   /* the fill + the box draw get their beat */
        } else setTimeout(fillWhenSeated, 60);
      };
      /* a TIMEOUT pump, not rAF — the chase's own clock is setTimeout, and
         a frozen frame loop (background tab, the pane) must not stall the
         ceremony a timeout-driven chase is still advancing through */
      setTimeout(fillWhenSeated, 60);
      /* the page swaps while the frost holds — this hash flip is the
         ceremony's own route, the only one the shield lets through */
      setTimeout(() => { if (live()) location.hash = id; }, 480);
      /* hard failsafe: whatever happens, the page comes back */
      setTimeout(() => { if (tok === mselN && document.body.classList.contains("mnav")) mselReset(); }, 4500);

      function lift() {
        if (!live()) return;
        const br = topbarEl.getBoundingClientRect();
        const rr = row.getBoundingClientRect();
        const nb = document.getElementById("nbar").getBoundingClientRect();
        const ms = parseFloat(getComputedStyle(topbarEl).getPropertyValue("--mspan")) || 148;
        const H = parseFloat(getComputedStyle(drop).getPropertyValue("--dbh")) || 34;
        /* born on the drawn box's seat (row centre, mspan wide — the same
           span the bar's dots keep), in the bar's own coordinate frame */
        const x0 = rr.left + rr.width / 2 - br.left, y0 = rr.top + rr.height / 2 - br.top;
        const x1 = nb.left + nb.width / 2 - br.left, y1 = nb.top + nb.height / 2 - br.top;
        const rd = document.createElement("div");
        rd.className = "mride";
        /* the ride carries the ROW'S word — for home that's HOME, not the
           bar's AVRG, or the word would swap mid-lift; touchdown's decode
           is what turns it into the brand word at the seat */
        rd.innerHTML = '<i class="md l"></i><i class="md r"></i><b class="mrw">' +
          esc(id ? barWordFor(id) : "HOME") + "</b>";
        rd.style.cssText = "left:" + (x0 - ms / 2).toFixed(1) + "px;top:" + (y0 - H / 2).toFixed(1) +
          "px;width:" + ms + "px;height:" + H + "px";
        topbarEl.appendChild(rd);
        row.style.visibility = "hidden";
        closeDrop(true);   /* the menu rewinds under the ride; the organ drains unseen */
        /* reflow, not double-rAF: the start pose must be committed before
           the transform lands or the transition never plays — and rAF can
           be frozen (the pane, background tabs) while timeouts still run */
        void rd.offsetWidth;
        rd.style.transform = "translate(" + (x1 - x0).toFixed(1) + "px," + (y1 - y0).toFixed(1) + "px)";
        setTimeout(() => touchdown(rd), 540);
      }
      function touchdown(rd) {
        if (!live()) { rd.remove(); return; }
        document.body.classList.add("mword");   /* the organ returns under the rider */
        const wl = document.querySelector("#og-shop .wlab");
        /* decode whatever the bar TRULY holds (routeReset wrote it at the
           flip) — self-healing if a back-press slipped a different route in */
        if (wl && wl.dataset.w) decodeInto(wl, wl.dataset.w);
        if (!id) playLogo();   /* home reveals mid-draw, fresh */
        rd.classList.add("gone");
        fveil.down();          /* the new section gains focus, top first */
        setTimeout(() => { if (tok === mselN) mselReset(); }, 950);
      }
    }
    dpanel.addEventListener("click", e => {
      if (drawnBarOn() || reduced) return;
      const a = e.target.closest("a.drow");
      if (!a || a.classList.contains("dm")) return;
      e.preventDefault();
      playMenuSelect(a);
    });

    /* THE MARK COMES HOME — ONE derivation, two drivers (2026-08-21).
       The inline SMIL draw ends ~2.28s (the ×2 cut — the clocks live in
       the svg, k-core.md) and the shrink beat is that end plus a 100ms
       hold. It had already been retuned once when the draw was halved,
       and it lived as a bare 2375 in the phone intro that the desktop
       landing then copied — two literals, no link, free to drift. Hoisted
       so they cannot.
       COUPLED, and NOT expressible here: the shrink's own .85s transition
       on .masthead .brand — the flight this beat starts. It is written at
       two CSS sites (body.intro.intro-shrink, and body.land.land-shrink in
       THE LANDING block, where the driver derives the seat from
       LAND_TUNE.travel and the CSS reads the same number through
       --landTravel); move this number and re-derive both. */
    const DRAW_HOME = 2375;

    /* ---- THE INTRO ------------------------------------------------------
       Armed by the top-of-body script (phone + home + motion): the first
       paint is the opaque veil with everything parked. This driver poses
       the logo big (FLIP off its real seat), lets the draw play, then
       walks the beats: shrink home + the veil ghosts to frost → the tick's
       first decode + the bar pieces ride in → the veil rides down. */
    (function () {
      if (!document.body.classList.contains("intro")) return;
      const clearIntro = () => {
        document.body.classList.remove("intro", "intro-pose", "intro-shrink", "intro-tick", "intro-bar");
        fveil.clear();
        startTick();   /* belt: however we exit, the tick lives */
      };
      const brand = document.querySelector(".masthead .brand");
      if (!brand || !fveilEl) { clearIntro(); return; }
      fveilEl.classList.add("on");
      /* a 0-TIMEOUT, not rAF: it still runs after route() has booted the
         page, but a frozen frame loop (background-tab load, the pane)
         cannot stall the whole intro — the .intro-pose gate covers any
         pre-pose frame with the opaque veil anyway */
      setTimeout(() => {
        const r = brand.getBoundingClientRect();
        if (!r.width) { clearIntro(); return; }
        const s = Math.min((innerWidth * .78) / r.width, (innerHeight * .5) / r.height);
        const dx = innerWidth / 2 - (r.left + r.width / 2);
        const dy = innerHeight * .43 - (r.top + r.height / 2);
        brand.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(" + s.toFixed(3) + ")";
        document.body.classList.add("intro-pose");
        playLogo();   /* own the clock — the draw starts at the pose */
        /* the beat map rides the draw's ×2 cut (2026-08-16): the shrink is
           DRAW_HOME (the shared derivation above), and the post-draw
           offsets (+1000 / +750 / +950) are the approved choreography
           untouched — only the draw got faster */
        setTimeout(() => {   /* the draw is done — come home */
          document.body.classList.add("intro-shrink");
          void brand.offsetWidth;   /* commit the pose under the new transition, then release it */
          brand.style.transform = "";
        }, DRAW_HOME);
        setTimeout(() => {   /* the decode's first run + the bar arrives */
          document.body.classList.add("intro-tick", "intro-bar");
          startTick();
        }, 3375);
        setTimeout(() => fveil.down(), 4125);   /* focus, top first */
        setTimeout(clearIntro, 5075);
      }, 0);
      setTimeout(() => { if (document.body.classList.contains("intro")) clearIntro(); }, 12000);
    })();

    /* ---- THE LANDING — THE DESKTOP ARRIVAL (baked 2026-08-22) -----------
       The arrival Dylan picked, tuned on the bench, and baked. The arm
       script at the top of <body> does the gating and writes body.land
       before the first paint; this walks the beats. Nothing here runs
       without the class, so an unarmed boot is untouched.

       HIS BAKE INDEX (2026-08-22), the four clocks that moved — travel
       850 → 1000 · poseY .333 → .420 · drawSpeed 1 → 2 · vidAt 0 → 300.
       Everything else ships exactly as tuned; the section choreography he
       ruled final ("you guys nailed the section load in ask. no tweaks
       there. its solid").

       EVERY CLOCK IS A KNOB — the landing is a tunable surface ("give this
       the bench treatment"). LAND_TUNE below is the one table; the driver
       derives every beat from it and writes the visual speeds out as custom
       properties so a bench override drives the same numbers the ride does.
       LAND_TUNE goes to the bench BY REFERENCE through the shim at the
       IIFE's foot, and benchLandPlay replays the ride in place so a knob
       can be judged without a reload — the wing outlives the bake.

       THREE DERIVATIONS, and nothing invents a clock:
         drawEnd  = DRAW_BASE_END / drawSpeed   (the pen actually lifting)
         shrinkAt = drawEnd + DRAW_HOLD         (the mark starts home)
         seatAt   = shrinkAt + travel           (the mark IS home)
       and the cascade, the video, the clamp and the clear all hang off
       seatAt. Change travel and the whole back half follows, in the CSS
       flight too — --landTravel is the same number.

       THE VEIL LEAVES FIRST, at shrinkAt, while the page is still empty.
       That is the fix for his "and then swipe in top to bottom": the wipe
       he saw was the veil's own edge crossing bands that were still
       arriving. Sections now land on clear ground, one at a time. */
    const LAND_TUNE = {
      /* THE POSE — the big draw's stage. poseW/poseH are the shares of the
         viewport the mark may span (the smaller wins, so it fits both
         ways); poseY is where its CENTRE sits as a share of viewport
         height. BAKED .420 (2026-08-22) — his first react asked for "2/3
         up the page" and .333 was that read literally; on the bench he
         settled it lower, still clearly above centre. TRANSFORM ONLY: the
         masthead svg width is the bench's own logo-size param and is not
         ours to move. */
      poseW: .34, poseH: .52, poseY: .420,

      /* drawSpeed multiplies the SMIL clocks (2 = twice as fast). BAKED 2
         (2026-08-22). IT SHIPS AS A RESCALE, NEVER AS A MARKUP REWRITE:
         the driver rewrites #logo-draw's begin/dur from the BASE values it
         caches on first run (so repeated changes never compound) and puts
         the base back when the ride stands down. THE REASON IS THE PHONE —
         both surfaces share this one inline svg, and the phone intro's
         whole beat map is derived from the MARKUP's clocks (DRAW_HOME,
         mobile.md). Bake the 2 into the svg and the phone's draw would
         finish a second before an intro that still waits 2375ms for it.
         drawEnd is derived from this number, so the shrink always waits
         for the pen. */
      drawSpeed: 2,

      /* travel — the shrink flight home. BAKED 1000 (2026-08-22). Mirrored
         into --landTravel for the CSS transition, and seatAt is built on
         it, so the flight and the clock cannot drift. */
      travel: 1000,

      /* THE CASCADE — a section at a time, his shape: "originals lands
         just before its carousel / the carousel lands / next section has
         started". cascade is the air after the mark seats before section
         one; head/car are per-section offsets from THAT, so the whole
         cascade slides as a unit and each section keeps its own rhythm.
         Section order is identity-keyed (originals → shaped → routed).
         RULED FINAL AT THE BAKE (2026-08-22): "you guys nailed the section
         load in ask. no tweaks there. its solid" — these seven numbers did
         not move and are not an open question. */
      cascade: 420,
      sections: [
        { head: 0,    car: 260 },
        { head: 620,  car: 880 },
        { head: 1240, car: 1500 }
      ],
      headDur: 520, carDur: 620,

      /* THE SPINE — the video slides in just after the mark seats, the
         clamp photo follows it in. vidAt BAKED 300 (2026-08-22): the seat
         gets its own moment before the column starts moving. clampAt
         counts from the VIDEO's start, so the two stay a pair when either
         moves. */
      vidAt: 300, vidDur: 620,
      clampAt: 700, clampDur: 520,

      /* the veil goes first now; veilDur mirrors .fveil's own transform
         transition (.8s) and exists so the derivation can wait for it */
      veilAt: 0, veilDur: 800,

      /* the tail sweep (the spine below the clamp, and any band the
         identity stamp missed) and the air after the last beat */
      tailAt: 700, clearPad: 200
    };
    /* the play door, replaced below — the bench calls it to replay a tuned
       ride in place. Defined out here so the shim can hand it over even on
       a page that never armed. */
    let landPlay = () => false;

    (function () {
      const brand = document.querySelector(".masthead .brand");
      const desk = matchMedia("(min-width: 941px)");
      const T = LAND_TUNE;
      const step = (...c) => document.body.classList.add(...c);
      const RS = document.documentElement.style;
      const CLS = ["land", "land-snap", "land-pose", "land-shrink",
                   "land-tick", "land-bar", "land-vid", "land-tail",
                   "land-h1", "land-h2", "land-h3", "land-c1", "land-c2", "land-c3"];
      let played = false;
      const VARS = ["--landTravel", "--landHeadDur", "--landCarDur",
                    "--landVidDur", "--landClampDur"];
      const DRAW_BASE_END = 2275;   /* the SMIL draw's own end at base clocks */
      const DRAW_HOLD = DRAW_HOME - DRAW_BASE_END;   /* the 100ms the intro holds */

      /* EVERY BEAT IS CANCELLABLE. Without this a route mid-ride left the
         arrived page under the opaque veil and the 6700 shield, and the
         veil dropped onto a page that never raised it. The shield blocks
         pointers, not FOCUS — a keyboard-activated bar link is a real door
         through it. */
      let timers = [];
      const at = (ms, fn) => timers.push(setTimeout(fn, ms));

      /* THE SMIL CLOCKS — drawSpeed IS A RESCALE, NEVER A MARKUP REWRITE.
         Each animate/set node's shipped begin/dur is cached on the node the
         first time we touch it, so a rescale is always base/speed and can
         never compound; the write lands BEFORE playLogo's rewind, so the
         new interval is what replays; and the base goes back when the ride
         stands down (drawRestore, at the foot of standDown).

         THE RESTORE IS THE LOAD-BEARING HALF, and it is why the baked
         drawSpeed of 2 ships HERE and not in the svg (2026-08-22). Both
         surfaces share this one inline svg, and the phone intro derives its
         whole beat map from the MARKUP's clocks (DRAW_HOME, mobile.md) —
         halve them at the source and the phone's pen would lift a second
         before an intro still waiting 2375ms for it. Restoring also keeps
         the plain mid-session home draw (route's playLogo rewind, no
         ceremony) on the pace it has always had. Only what OUTLIVES the
         ride goes back to base: the ride itself always draws at the speed
         in LAND_TUNE, which is what makes the knob judgeable on the bench. */
      function drawScale(speed) {
        const svg = document.getElementById("logo-draw");
        if (!svg) return;
        svg.querySelectorAll("animate, set").forEach(n => {
          if (!n.dataset.landB) n.dataset.landB = n.getAttribute("begin") || "";
          if (!n.dataset.landD && n.getAttribute("dur")) n.dataset.landD = n.getAttribute("dur");
          const b = parseFloat(n.dataset.landB), d = parseFloat(n.dataset.landD || "");
          if (!isNaN(b)) n.setAttribute("begin", (b / speed).toFixed(4) + "s");
          if (!isNaN(d)) n.setAttribute("dur", (d / speed).toFixed(4) + "s");
        });
      }
      /* nothing to put back until something was cached — an unarmed page and
         a ride that stood down before drawScale both no-op here */
      function drawRestore() {
        const svg = document.getElementById("logo-draw");
        if (!svg) return;
        svg.querySelectorAll("animate, set").forEach(n => {
          if (n.dataset.landB) n.setAttribute("begin", n.dataset.landB);
          if (n.dataset.landD) n.setAttribute("dur", n.dataset.landD);
        });
      }

      function clamper() { return document.querySelector(".land-clamp"); }

      /* stand the ride down whole. `keepClamp` is the landed case: the
         photo is the one beat that LEAVES something, so it survives the
         clear — but a ride cancelled before it landed takes its node back
         rather than parking an empty box in the column. */
      function standDown() {
        timers.forEach(clearTimeout);
        timers = [];
        removeEventListener("hashchange", standDown);
        if (desk.removeEventListener) desk.removeEventListener("change", standDown);
        document.body.classList.remove(...CLS);
        VARS.forEach(v => RS.removeProperty(v));
        document.querySelectorAll("#cols .band[data-land-chunk]")
          .forEach(b => { delete b.dataset.landChunk; });
        const c = clamper();
        if (c && !c.classList.contains("in")) c.remove();
        if (brand) brand.style.transform = "";
        startTick();   /* belt, and FIRST: nothing after it may strand the tick */
        if (fveilEl) fveil.clear();   /* the deref the bail branch could not survive */
        /* LAST on purpose: the tick and the veil are the two things a
           stand-down owes the reader, and a clock rewrite owes them
           nothing. A cancel mid-draw lands here too — the pen jumps to
           where the base clocks put it and finishes at the shipped pace,
           which is the right answer for a ceremony that is over. */
        drawRestore();
      }

      function playLanding() {
        /* THE WIDTH IS RE-READ LIVE. The arm cached it at the first paint,
           every landing rule is media-gated, and .fveil.on is NOT — so a
           stale yes leaves frost over a phone layout. The load race (a
           classic scrollbar landing after the arm can drop a ~941-956
           viewport under the gate) is this check; a mid-ride resize is the
           change listener below. */
        if (!desk.matches || !brand || !fveilEl) { standDown(); return false; }
        /* ONLY A REPLAY RESETS. The first run is already held — the arm did
           it at the first paint — and standDown's fveil.clear() carries a
           forced reflow, which would COMMIT the undressed page to the
           transition engine and then fade the whole thing out under the
           draw (measured: sections at .79 and the video mid-slide 200ms
           in). Don't flush a page that is already where you want it. */
        if (played) standDown();
        played = true;

        /* the knobs the CSS reads. One write per ride, so an override that
           lands between rides is picked up by the next one. */
        RS.setProperty("--landTravel", T.travel + "ms");
        RS.setProperty("--landHeadDur", T.headDur + "ms");
        RS.setProperty("--landCarDur", T.carDur + "ms");
        RS.setProperty("--landVidDur", T.vidDur + "ms");
        RS.setProperty("--landClampDur", T.clampDur + "ms");

        /* THE SECTIONS ARE KEYED BY COLLECTION IDENTITY, never by document
           order: data-col indexes COLLECTIONS, so the id is what we match
           on and a reshuffle of the data cannot silently reorder his
           ceremony. A collection with no boards has no band (HOME filtered
           it out) and simply leaves a gap; the tail beat sweeps up any
           band that never got a stamp. */
        ["originals", "hand-shaped", "classic"].forEach((cid, i) => {
          const ci = COLLECTIONS.findIndex(c => c.id === cid);
          const band = ci < 0 ? null : document.querySelector('#cols .band[data-col="' + ci + '"]');
          if (band) band.dataset.landChunk = String(i + 1);
        });

        /* the clamp photo's node goes in NOW, holding its box, so its
           arrival is a fade and never a reflow under the reader.
           A LANDED PRINT FROM THE LAST RIDE IS TAKEN BACK HERE, at the
           START of the new one. Its .in is its own class precisely so it
           survives the clear (the one beat that leaves something behind),
           but that also carried it into the NEXT ride ALREADY ARRIVED —
           measured on the bench at ~16ms instead of its beat, which makes
           clampAt/clampDur unjudgeable on a warm stage. The reset belongs
           here and not in standDown: an uninterrupted ride's print still
           persists through its own clear, and a ride cancelled before the
           landing still takes the node back (standDown's .in check). */
        const stale = clamper();
        if (stale) stale.remove();
        const vwrap = document.querySelector("#home .video-wrap");
        if (vwrap) {
          const fig = document.createElement("figure");
          fig.className = "land-clamp";
          const im = document.createElement("img");
          im.src = "site/media/story-clamps.jpg";
          im.alt = "A deck clamped up with every clamp in the shop";
          im.loading = "eager";   /* chrome by definition — the lazy 0x0 law */
          fig.appendChild(im);
          vwrap.insertAdjacentElement("afterend", fig);
        }

        /* take the start pose in ONE frame, transitions off (see .land-snap) */
        document.body.classList.add("land", "land-snap");
        void document.body.offsetWidth;
        document.body.classList.remove("land-snap");
        addEventListener("hashchange", standDown);
        if (desk.addEventListener) desk.addEventListener("change", standDown);
        fveilEl.classList.add("on");

        const drawEnd = DRAW_BASE_END / (T.drawSpeed || 1);
        const shrinkAt = drawEnd + DRAW_HOLD;
        const seatAt = shrinkAt + T.travel;
        const cascadeAt = seatAt + T.cascade;
        const vidAt = seatAt + T.vidAt;
        const clampAt = vidAt + T.clampAt;
        drawScale(T.drawSpeed || 1);

        /* a 0-TIMEOUT, not rAF (the intro's reasoning): it still runs after
           route() has booted the page, but a frozen frame loop must not be
           able to stall the whole ride */
        at(0, () => {
          const r = brand.getBoundingClientRect();
          if (!r.width) { standDown(); return; }
          const s = Math.min((innerWidth * T.poseW) / r.width,
                             (innerHeight * T.poseH) / r.height);
          const dx = innerWidth / 2 - (r.left + r.width / 2);
          const dy = innerHeight * T.poseY - (r.top + r.height / 2);
          brand.style.transform = "translate(" + dx.toFixed(1) + "px," +
            dy.toFixed(1) + "px) scale(" + s.toFixed(3) + ")";
          step("land-pose");
          playLogo();   /* own the clock — the draw starts at the pose */
        });

        /* the mark starts home, and THE VEIL GOES WITH IT — over an empty
           page, so its edge has nothing to wipe (his "swipe" note) */
        at(shrinkAt, () => {
          step("land-shrink", "land-bar");
          void brand.offsetWidth;   /* commit the pose under the new transition, then release */
          brand.style.transform = "";
        });
        at(shrinkAt + T.veilAt, () => fveil.down());

        /* the seat: the mark is home, its line decodes, the video arrives */
        at(seatAt, () => { step("land-tick"); startTick(); });
        at(vidAt, () => step("land-vid"));
        at(clampAt, () => { const c = clamper(); if (c) c.classList.add("in"); });
        at(clampAt + T.tailAt, () => step("land-tail"));

        /* the cascade: header, then its carousel, next section overlapping */
        T.sections.forEach((sec, i) => {
          at(cascadeAt + sec.head, () => step("land-h" + (i + 1)));
          at(cascadeAt + sec.car, () => step("land-c" + (i + 1)));
        });

        /* the clear is DERIVED, so moving any knob moves it too — a ride
           whose shield outlived its beats (or was cut before them) is the
           bug this prevents. BOTH CASCADE ORGANS COUNT: the headers used
           to be left out on the assumption their carousel always lands
           after them, and a bench find broke it (sections[1].head 1500
           with headDur 910 ran ~90ms past a carousel-only clear and read
           as a cut). headDur/carDur are shared across sections, so the
           latest offset of each organ is the latest end of each. */
        const lastCar = T.sections.reduce((m, s) => Math.max(m, s.car), 0);
        const lastHead = T.sections.reduce((m, s) => Math.max(m, s.head), 0);
        const endAt = Math.max(
          cascadeAt + lastCar + T.carDur,
          cascadeAt + lastHead + T.headDur,
          clampAt + T.clampDur,
          clampAt + T.tailAt + T.carDur,
          shrinkAt + T.veilAt + T.veilDur,
          seatAt
        ) + T.clearPad;
        at(endAt, standDown);
        at(endAt + 8000, standDown);   /* the dead-man's belt, free since standDown flushes */
        return true;
      }

      landPlay = playLanding;
      if (!document.body.classList.contains("land")) return;   /* unarmed: nothing runs */
      playLanding();
    })();
    /* --------------------- end THE LANDING ------------------------------- */

    /* the fixed span is measured at boot, re-measured when the fonts land
       (mono metrics shift the word widths) and on a settled resize (the
       raw event fires before layout settles — the debounce gotcha) */
    sizeBarWord();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeBarWord);
    let mszT = 0;
    addEventListener("resize", () => { clearTimeout(mszT); mszT = setTimeout(sizeBarWord, 120); });

    route();

    /* ── BENCH SHIM (CompUI pilot, 2026-08-19) — TEMPORARY dev chrome.
       Hands the tuning consts to the same-origin bench page by REFERENCE
       (localhost:8124/bench/ — spec at ~/projects/CompUI/pilot/BUILD-SPEC.md),
       so a property write takes effect on the const's next read. benchRepose
       re-lays geometry through the page's own resize door — no signatures
       assumed. LOCALHOST-GATED: inert on the live site and the LAN ride-along
       by construction. No DT here — v1 carries the decode dials as literals
       (the A/B's one vault-only const). Retire with the pilot. */
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      window.BENCH = { STRIP_TUNE, NB_TUNE, SUN };
      window.benchRepose = () => window.dispatchEvent(new Event("resize"));
      /* THE LANDING (2026-08-21, his "give this the bench treatment"; kept
         at the bake): LAND_TUNE joins the shim BY REFERENCE like the rest,
         and benchLandPlay REPLAYS the arrival in place. The replay door is
         what makes the tune usable at all — the ride runs once at boot, so
         without it a knob written from the bench could never be seen
         without a reload, and a reload throws the write away. The wing
         OUTLIVED the bake by design: LAND_TUNE is the shipped table now,
         not a switch's scratch pad, so these two lines retire with the
         pilot like the rest of the shim — not with the ceremony. */
      window.BENCH.LAND_TUNE = LAND_TUNE;
      window.benchLandPlay = () => landPlay();
    }

    /* ── THE OG SPREAD's column anchor (2026-08-20, shipped with the
       spread — the ogarr lab retired the same day on Dylan's pick, D won;
       the losing variants live in git history). The spread's side columns
       are absolute children of #lb-card and must top-align with the
       PANEL, but the card's padding-top is the JS-written scoot — CSS
       can't read it, so --ogpt mirrors it. A ResizeObserver, not a hook
       in the scoot's writer: padding moves the card's border box, so
       every write lands here without touching placeDeck. */
    const ogptSync = () => {
      lbCard.style.setProperty("--ogpt", lbCard.style.paddingTop || "24px");
    };
    new ResizeObserver(ogptSync).observe(lbCard);

    /* THE CLIP GATE (C4's find): the seat's video ships preload=none and
       no autoplay, so a plain visit never fetches the cut — this observer
       plays it when an og inspection is UP on the desktop dress (first
       play triggers the fetch) and pauses it when the inspection leaves.
       Muted play needs no gesture; the catch swallows the rare abort. */
    const ogClipVid = document.querySelector("#og-clipseat video");
    new MutationObserver(() => {
      const on = !lb.hidden && lb.classList.contains("og")
        && matchMedia("(min-width: 941px)").matches;
      if (on) { if (ogClipVid.paused) ogClipVid.play().catch(() => {}); }
      else if (!ogClipVid.paused) ogClipVid.pause();
    }).observe(lb, { attributes: true, attributeFilter: ["class", "hidden"] });
  })();
  </script>
</body>
</html>
