    /* board (ci,k)'s live card on the current view — grid .scard or home-belt
       .card — skipping hidden slots and deck holes. The close flight asks for
       the current board; the hole migration asks for the stepped-to one. */
    function frameFor(ci, k) {
      const view = colpage.hidden
        ? document.querySelector('#cols section[data-col="' + ci + '"] .belt')
        : colpage.querySelector('section[data-col="' + ci + '"]');
      if (!view) return null;
      const sel = colpage.hidden ? ".card" : ".scard";
      return Array.from(view.querySelectorAll(sel)).find(n =>
        +n.dataset.k === k && n.style.visibility !== "hidden" &&
        !n.classList.contains("indeck")) || null;   /* deck holes can't receive the close flight */
    }
    function sourceFrame() { return cur ? frameFor(cur.ci, cur.k) : null; }
    /* THE HOLE MIGRATES WITH THE EXCHANGE (2026-08-06, Dylan's catch: inspect
       hs14, arrow to hs09, close — "09 travels back to land ontop of its
       duplicate in collections and then hs14 pops back"). The lift-out hole is
       the proof the big card IS that card, and a shuffle made that a lie two
       ways: the stepped-to board sat on screen twice (hero + its own slot,
       breaking the one-card law behind the lb) and the close flight landed on
       the visible twin, with the original popping back after touchdown. So
       every shuffle LANDING re-seats the hole — the old card returns to its
       slot and the arriving board's card lifts out, at the same beat cur and
       the header numbers advance (behind the lb fade, so the swap is quiet).
       Case/shelf inspections keep their shelf hole: the deck is a different
       membership and the stepped-to board may not be in it. A decked board's
       slot is ALREADY a hole, so frameFor finds nothing, lbSrc empties, and
       the close routes to the fade path via the existing indeck guard. */
    function migrateHole(ci, k) {
      if (lbSrc && lbSrc.el.classList.contains("bay-item")) return;
      if (lbSrc && lbSrc.ci === ci && lbSrc.k === k) return;
      if (lbSrc) lbSrc.el.style.visibility = "";
      /* a null lbSrc still RE-ATTACHES here (not an early return): stepping
         across a decked board empties it — the decked slot is someone
         else's hole — and the next undecked board needs its own lift-out
         back, or the twin returns two boards later */
      const next = frameFor(ci, k);
      if (next) { next.style.visibility = "hidden"; lbSrc = { el: next, ci: ci, k: k }; }
      else lbSrc = null;
    }

    /* flight anchors: in fv3 the lb card and the source card are the SAME
       cqw spec, so the whole .panel anchors and every edge lands by
       construction. Other treatments open the stock lightbox (different
       aspect), so they keep the square-to-square anchor. */
    function anchors(sourceCard) {
      const fv3 = lbCard.classList.contains("d7f");
      const src = (fv3 && sourceCard.querySelector(".panel")) ||
                  sourceCard.querySelector(".stage, .frame");
      const dst = fv3 ? lbCard.querySelector(".panel") : lbCard.querySelector(".frame");
      return { src, dst };
    }

    function flipFrom(sourceCard) {
      lbCard.style.transition = "none";
      if (sourceCard) {
        const { src, dst } = anchors(sourceCard);
        const sr = src.getBoundingClientRect();
        const fr = dst.getBoundingClientRect();
        const s = sr.width / fr.width;
        const dx = (sr.left + sr.width / 2) - (fr.left + fr.width / 2);
        const dy = (sr.top + sr.height / 2) - (fr.top + fr.height / 2);
        /* pivot at the anchor's center measured off live rects — offsetTop
           chains miss the mobile sheet's card padding */
        const lr = lbCard.getBoundingClientRect();
        lbCard.style.transformOrigin = "50% " + ((fr.top + fr.height / 2) - lr.top) + "px";

      lbCard.style.transition = "";
      lbCard.style.transform = "none";

       card, and the return can't land misaligned) */
    let lbSrc = null;

      /* a pulled-out drawer steps back to the case first: the bay rides
         ABOVE the lb (5500 > 5000) and the wide panel would bury the
         inspection. unOut is a no-op when it isn't out. */
      if (!dockActive()) unOut();
      populate(ci, k);
      lb.hidden = false;
      /* THE SHEET OPENS AT ITS OWN TOP (2026-08-17, his live framing catch:
         card top cut under the bar, chrome overlapped). The sheet is
         scrollable on iOS even when the card fits — #lb-scrim's 100lvh
         floor leaves a URL-bar's worth of slack — and a stray pan's offset

      lb.scrollTop = 0;

      if (!reduced && !fromShelf) {

        const myOpen = ++lbOpenN;

        if (lbSrc && lbSrc.el !== sourceEl) lbSrc.el.style.visibility = "";

      rails.forEach(r => {

          DRESS_TEXTS.forEach(sel => { const el = lbCard.querySelector(sel); if (el) clearInterval(el._t); });

        lbCard.classList.add("stay", "dressed", "navdraw");

      }
      requestAnimationFrame(() => {
        lb.classList.add("in");
        /* the card is definitely laid out by now: populate ran while #lb was

           early-return). The ResizeObserver normally catches this same

        placeDeck();

      });

    function closeLb(instant) {

      pinchReset();   /* a zoomed rect must never anchor the flight math */
      /* THE FLIGHT FLIES THE FACE IT LANDS ON (2026-08-19 — the face
         memory reaching the exit). The old law here flew top-up because
         the slot card was reset at lift; since 2026-08-17 the pad wears
         the REMEMBERED face (faceSync below), so forcing top-up made a
         bottom-up card revert mid-flight and pop back at the handoff.
         The silent settle still stands a mid-carousel close down (clones

         silent branch sheds it, and only .flipped.fset holds the landed

      if (lbCard.classList.contains("canflip")) {

      caroKill();     /* a live train bins its clones and hands the card back

      /* a close mid-exchange: void the shuffle's landing, bin its clones, and

      xactN++;
      xactPending = null;

      xactReveal();
      headClear();       /* ...and no number left translated at opacity 0 */
      stripReset();      /* the riffle's timers and clocks die with the sheet */

         drawer borrowed by an LB TOSS stays out while you work the
         collection — its deferred shut lands HERE, behind the exit. The
         pendingSeat guard inside means a toss still in the air keeps the

         user-locked drawer never armed the flag: no-op. */
      bayCatchShut();
      deckDeal(false);   /* neighbours tuck under the hero before it flies home */

         on that board — sourceFrame() skips hidden cards, so ask it only
         after a swipe moved us to a different board */
      const onSrc = lbSrc && cur && lbSrc.ci === cur.ci && lbSrc.k === cur.k;

        : onSrc ? lbSrc.el : sourceFrame();

         shelf source: re-find it by id (fresh item, same seat), else
         fall back to the shop slot — never fly at a detached rect */
      if (backCard && !backCard.isConnected) {
        backCard = (backCard.dataset.id &&
          bay.querySelector('.bay-item[data-id="' + backCard.dataset.id + '"]:not(.preseat)')) || sourceFrame();
      }
      /* one-card law, mobile reach (2026-07-24): a decked board's shop
         slot is a HOLE — never fly a close at one (insurance: adds now
         close the lb themselves, but a case inspection or stale source
         can still route here). The fade is enough. */
      if (backCard && backCard.classList.contains("indeck")) backCard = null;
      /* the landing pad wears the remembered face BEFORE the reveal — the
         returning card may carry the bottom while the slot was rendered
         top-up, and a landing must never snap faces (2026-08-17) */
      faceSync(backCard);
      /* deck target: the close rides the same ARC as the add — the
         straight flip b-lined back through the drawer (2026-07-24) */
      if (backCard && backCard.classList.contains("bay-item")) { lbToShelfArc(backCard); return; }
      /* THE SOFT RETURN (2026-08-08 evening, Dylan): the PHONE close is
         three linear ramps, not a snap — mechanics at the .softout CSS.
         The fly stays parked on the slot for 500ms past touchdown while
         the dress finishes draining, and the real card takes over at
         930 already at rest. The landing is SILENT — no press, no
         kclick (his follow-up react: "bounce and sound should both
         go"). Desktop keeps its 430 snap-and-beat untouched; case
         inspections returned to the shelf arc above, reduced/instant
         closes never fly. */
      const soft = !reduced && !instant && !!backCard && dockActive();
      lb.classList.remove("in");
      document.body.classList.remove("lb-fade");   /* grid fades back in under the returning card */
      if (soft) document.body.classList.add("softret");   /* opacity ramp lands WITH the card */
      if (backCard) {
        /* the card flies home INTACT (2026-07-22): whatever chrome is up
           stays up. tset (the touch arrival) rides until the lb hides;
           .hold pins the hover-landed fills when the pointer was still on

           re-firing as the card slides out from under the cursor. */

           lands on a belt that's been drifting under the inspection */
        rails.forEach(r => { if (r.belt.contains(backCard)) { r.frozen = true; r.pointerX = null; } });
        lbFlying = true;
        if (canHover && lbCard.matches(":hover")) lbCard.classList.add("hold");

           comes off with .softout already on, so every dress property
           picks up its slow linear transition instead of the teardown */
        if (soft) { lbCard.classList.add("softout"); lbCard.classList.remove("tset", "blift"); }

        const sr = src.getBoundingClientRect();
        const fr = dst.getBoundingClientRect();
        const s = sr.width / fr.width;
        const dx = (sr.left + sr.width / 2) - (fr.left + fr.width / 2);
        const dy = (sr.top + sr.height / 2) - (fr.top + fr.height / 2);

      }

         react: "bounce and sound should both go"). The slide exchange
         set the phone's dialect: gestures land as visual fills, the
         percussion is desktop's. The landing statement here is the
         ramps themselves — page at full exactly as the card seats. */
      setTimeout(() => {
        lb.hidden = true;
        lbCard.style.transform = "none";
        lbCard.classList.remove("tset", "blift", "hold", "stay", "dressed", "redress", "navdraw", "softout");
        document.body.classList.remove("softret");
        lbFlying = false;
        unlockScroll();
        cur = null;
        if (lbSrc) { lbSrc.el.style.visibility = ""; lbSrc = null; }
        if (backCard && !soft) landBeat(backCard);   /* touchdown: press + click.
          The soft (phone) return was always silent by this branch; since the
          sound gate the phone is silent by RULE too, so the !soft test now
          only picks the press, not the dialect. */
        rails.forEach(r => { r.frozen = false; });   /* the line moves on once the card is home */
        /* lisst membership may have changed while the lightbox was open —
           but NEVER under a live picks ceremony (2026-08-16 A/B verify
           catch): tapping the stack from an open inspection routes to
           my-lisst, route's own renderLisst is 2ms fresher than this belt,
           and this re-render was DETACHING the ceremony's DOM — the deal
           stood down with the shield stranded up. Membership cannot have
           changed between route's render and this timeout. */
        if (location.hash.replace(/^#/, "") === "my-lisst" &&

    /* ========= flights: the deck ↔ lightbox arcs =========
       (2026-07-24, Dylan.)
       Grid ↔ lightbox keeps the straight flip zoom; anything between
       the DECK and the lightbox rides the same bayFlight arc as the
       add, in both directions — out of the case with the peak hanging
       near the case (hook), back into it with the add's fall. One
       flight dialect for the deck, so inspecting a shelved card can't
       b-line through the drawer.

       Interrupt guard: lbArcN tokens every arc; openLb/closeLb kill any
       in-flight arc first (fly removed, its settle side-effects — the
       hidden lb card or shelf item coming back — run instantly), so
       spam-clicks and Esc mid-arc can't strand a hidden card. */
    let lbArcN = 0, lbArcFly = null, lbArcSettle = null;
    /* set by lbToShelfArc when the drawer was SHUT and had to be reopened
       just to catch the returning card; consumed at that card's landing.
       Declared up here with the arc state (not down in the bay block) so
       neither openBay nor the arc can reach it in its TDZ. */
    let bayShutAfterLanding = false;
    function lbArcKill() {
      lbArcN++;

      if (lbArcSettle) { const s = lbArcSettle; lbArcSettle = null; s(); }
    }
    /* the flying card: a fresh card off the one template, texts copied
       from the source so a mid-decode pluck is seamless; rest() is the
       mid-air settle (fills drain, texts back to print) for the drain
       hook. Shared by the add flight and both deck arcs. */
    function buildFly(fromCard, ci, b, k, id) {
      const fly = document.createElement("div");
      fly.innerHTML = JCARDS.framev3(jmeta(COLLECTIONS[ci], b, k));
      const flyCard = fly.firstChild;
      /* a fly must never gamble on the lazy loader (2026-08-16, the blank-
         mini bug's sibling): a cold image on a template render is a 0×0
         box, and a zero box never intersects, so lazy never fires — the
         card flies faceless. Flights are on screen by definition: eager. */
      fly.querySelectorAll("img[loading='lazy']").forEach(i => { i.loading = "eager"; });
      [".fc-ref .ft", ".nmt", ".sttxt", ".fc-list .ft"].forEach(sel => {
        const a = fromCard.querySelector(sel), f = fly.querySelector(sel);
        if (a && f) f.textContent = a.textContent;
      });

          fromCard.classList.contains("stay")) fly.classList.add("held");

        fly.classList.remove("held");
        flyCard.classList.add("left");
        const m = jmeta(COLLECTIONS[ci], b, k);
        const put = (sel, txt) => { const el = fly.querySelector(sel); if (el) el.textContent = txt; };
        /* the name line drains to the LANDING's rest, not always the print:
           a bay-bound fly wears .dimsrest, so it settles on the dims the
           shelf under it is already showing (rest == rest) */
        put(".fc-ref .ft", m.ref); put(".nmt", restNm(flyCard) || m.nm); put(".sttxt", "");

      };

    /* deck → lightbox: the card lifts OUT of the case (hook pulls the
       peak up near the case) and arcs to the lightbox seat. The real lb
       card hides under the flight and appears exactly where it lands. */
    function shelfToLbArc(item, ci, k) {
      const b = COLLECTIONS[ci].boards[k];
      /* CARD BOX to CARD BOX (2026-08-08, Dylan's frame catch: the fly's
         inner frame read a different width than the landed card's). The
         fly div gets sr.width and contains a WHOLE template card — so a
         PANEL-rect sr rendered the fly's card at panel width, under-sized
         against both ends with visibly different chrome proportions.
         Source item and lb card are the same cqw template at equal
         aspect, so card-box anchors keep panel alignment AND render the
         fly true-sized the whole flight. (anchors() stays panel-to-panel:
         it maps the REAL card's rigid zoom, where the two are the same
         mapping.) */
      const srcCard = item.querySelector(".d7f") || item;
      if (!srcCard || !lbCard) return;

        const r = lbCard.getBoundingClientRect();

         a mid-air drain would land naked on a landed card. Touch keeps the
         drain: its card is still mid-tset-wipe at touchdown, today's look. */
      const staying = canHover && !dockActive() && CARD === "framev3";
      bayFlight(fly, sr, getEnd, { dur: SEAT_TUNE.dur, hook: 150, drain: staying ? null : rest }, () => {
        if (n !== lbArcN) return;
        lbArcFly = null;
        const s = lbArcSettle; lbArcSettle = null; if (s) s();
        kclick();   /* a case card taking center stage seats with the same voice */
      });
    }
    /* lightbox → deck (close of a case inspection): the add's arc and
       fall, landing beat and all. The lb releases instantly — the fly
       IS the card — and the shelf gap holds until touchdown.
       (The beat is DESKTOP-ONLY since 2026-08-21: this arc runs on both
       surfaces, and the sound gate mutes the phone half — the press
       animation still plays there, only the click is gone.) */
    function lbToShelfArc(item) {

      if (!lbCard.querySelector(".panel")) { closeLb(true); return; }
      /* THE CARD GOES BACK TO THE DRAWER, so the drawer must be there to
         take it (Dylan, 2026-08-01). Since a drawer click now closes the
         drawer instead of the lightbox, an inspection can outlive the
         drawer it came from — and this arc would otherwise land a card on
         a shelf inside a shut case. openBay is idempotent (the usual case
         is already locked open, where it costs one re-pose and no
         shopRoom), and getEnd re-measures every frame, so the card tracks
         its shelf while the drawer is still sliding out under the flight —
         the same thing the add flight does. Desktop only: the mobile case
         cannot be closed while the lb is up (its door handlers are
         lb-guarded), so there is nothing to reopen there.
         AND THEN IT SHUTS AGAIN (Dylan, 2026-08-01): "if someone just
         closed it they probably want it closed." So a drawer that was SHUT
         only comes back to catch the card and drains behind it; a drawer
         that was already open is left alone. The open is `transient` (no
         shop reflow, see openBay) since the net state is unchanged, and the
         drain re-arms like any explicit close, so it cannot creep back open
         under a cursor parked near the edge. Any real open during the
         flight wins — openBay clears the flag.

      const shutAfter = !dockActive() && (!bayLocked || bayShutAfterLanding);

      bayShutAfterLanding = shutAfter;   /* assigned, not OR'd: a killed arc must not leave it armed */
      const sr = lbCard.getBoundingClientRect();
      const { fly, rest } = buildFly(lbCard, ci, b, k, b.id);
      fly.classList.add("dimsrest");   /* it's going back to a shelf — THE DIMS REST */
      const id = item.dataset.id;
      lbSrc = null;        /* the instant close must NOT restore the gap early */
      closeLb(true);

      const target = () => bay.querySelector('.bay-item[data-id="' + id + '"]') || item;
      lbArcSettle = () => {

       SHADOW THROW — direction away from the cursor, through the board

         maxL  17   directional throw at a full rim graze
         lift   7   depth pop while hovered — rises slow (with the board

         drift  6   slow spring: parked, it closes the last distance

         gPow 1.7   distance ramp d^gPow — higher pushes gravity further

                    the same inline transform)

       floors the length and would cap the dark)
         aDark  .53  dense contact pool at the overhead vanish
         aFaint .19  faint end at a full graze
         aPow   .7   <1 pins the dark pool tight to the board; raise

       TEMPO
         ease      .14   fast channels: throw, arrive, ink, all drains
         driftEase .01   the creep's breath (~4s to close)
         liftEase  .045  lift + grow rise (~the old .94s hover pace)
         settle    .15   post-leave release threshold (ref-px)
       ======================================================== */

                  grow: 1.08, duck: 6,
                  aDark: .53, aFaint: .19, aPow: .7,
                  ease: .14, driftEase: .01, liftEase: .045, settle: .15 };

    let sunRaf = 0, sunOn = false, sunS = 1, sunX = 7, sunY = 9, sunTX = 7, sunTY = 9,

        sunP1X = 0, sunP1Y = 0, sunP2X = 0, sunP2Y = 0, sunUX = 0, sunUY = 0, sunD = 0;

      sunX += (sunTX - sunX) * SUN.ease;
      sunY += (sunTY - sunY) * SUN.ease;
      /* GRAVITY: two always-on springs, no park detection — a fast ARRIVE
         and a slow DRIFT both chase the cursor, targets ramped by d^gPow
         (gentle mid-card, steep at the rim). In motion the drift trails
         far behind and reads as weight; parked, it keeps closing the last
         distance — the creep IS the lag, so there is no on/off seam.
         Both drain at the fast ease once the cursor leaves. */
      const g = sunOn ? Math.pow(sunD, SUN.gPow) : 0;
      sunP1X += (sunUX * SUN.pull * g - sunP1X) * SUN.ease;
      sunP1Y += (sunUY * SUN.pull * g - sunP1Y) * SUN.ease;
      sunP2X += (sunUX * SUN.drift * g - sunP2X) * (sunOn ? SUN.driftEase : SUN.ease);
      sunP2Y += (sunUY * SUN.drift * g - sunP2Y) * (sunOn ? SUN.driftEase : SUN.ease);
      const pullX = sunP1X + sunP2X, pullY = sunP1Y + sunP2Y;
      /* lift + grow rise slow (with the board), drain fast (the .3s shrink) */
      sunLift += ((sunOn ? SUN.lift : 0) - sunLift) * (sunOn ? SUN.liftEase : SUN.ease);
      sunSc += ((sunOn ? SUN.grow : 1) - sunSc) * (sunOn ? SUN.liftEase : SUN.ease);
      /* lift stretches the drawn vector along its current direction; at
         dead center there is no direction — the overhead vanish stays.
         The lift DUCKS with the direction (ramps out below `duck` ref-px):
         crossing center the directional vector shrinks through zero, and
         a flat lift would pin the shadow at ~7 ref-px and whip it AROUND
         the board — ducked, it slides UNDER and re-emerges opposite */
      const len = Math.hypot(sunX, sunY);

         slides over it (the drift becomes board-vs-shadow parallax).
         ground < 1 leaves a whisper of follow so they stay related. */
      sunImg.style.filter = "drop-shadow(" + ((sunX * f - pullX * SUN.ground) * sunS).toFixed(2) + "px "

      sunImg.style.transform = "translate(" + (pullX * sunS).toFixed(2) + "px," + (pullY * sunS).toFixed(2) + "px) scale(" + sunSc.toFixed(4) + ")";
      sunRaf = requestAnimationFrame(sunFrame);

       voice pinned to a bare setTimeout drifts the moment its choreography
       is retuned, and the lb open's click had already drifted — 430ms
       against a .lb-card whose transform transition is .55s, so it fired
       ~120ms BEFORE the card came to rest. Ride the element's own
       transitionend instead and keep the timer only as the fallback for a

       arrives (the animationend law in gotchas.md, same shape). First one
       through wins; the other is disarmed. Scoped to the element itself —
       transitionend BUBBLES and the card's children transition transform
       too — and to the one property.

          o.frequency.exponentialRampToValueAtTime(f2, t + off + .06);

          g.gain.exponentialRampToValueAtTime(.08, t + off + .008);

       same bayFlight arc every desktop add rides, negative hook so the
       swing reads up-and-right toward the seat. The bar sits ABOVE the
       flights (z 6600 > 6500, the house ladder), so the card slides UNDER
       the chrome at arrival and the re-rendered minis ARE the reveal —
       lisstTab() fires at touchdown, not before, so the new mini appears
       exactly when the card gets there. Silent landing + buzz (the phone
       dialect); dockPing's shake answers on the minis themselves. */
    function pickCatch(id, srcCard, liveFly, liveRect) {
      const meta = BOARD_INDEX[id];
      const answer = () => { lisstTab(); dockPing(); };
      if (reduced || !meta) {
        if (liveFly) liveFly.remove();
        answer();
        return;
      }
      let fly = liveFly, sr = liveRect;
      if (!fly) {
        /* card-box anchor (the ONE CARD law): the fly is a whole template
           card, so it launches at the source CARD's box, never a panel's */
        const box = srcCard && (srcCard.classList.contains("d7f") ? srcCard
          : srcCard.querySelector(".d7f")) || srcCard;
        if (!box) { answer(); return; }
        sr = box.getBoundingClientRect();
        fly = buildFly(box, meta.ci, meta.b, meta.k, id).fly;
      }
      /* the new mini renders at lisstTab time — aim at the stack's LAST
         slot if it exists, else the picon box; re-measured per frame so a
         mid-flight layout change stays tracked (the getEnd law).
         .hpick:last-of-type, NOT lastElementChild — the count span sits
         after the minis since the tidy react, and a flight aimed at a
         9px number is a landing nobody meant */
      const getEnd = () => {
        const t = hpicksEl && hpicksEl.querySelector(".hpick:last-of-type") || hpicksEl ||
          document.getElementById("picon");
        const r = t.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + Math.max(r.height, 38) / 2,
                 h: Math.max(r.height, 38) };
      };
      bayFlight(fly, sr, getEnd, { dur: SEAT_TUNE.dur, hook: -120 }, () => {
        fly.remove();
        answer();
        buzz(12);
      });
    }

    /* ========= the deck drawer (the cart bay) =========
       a right-edge card sliver (sprint item 2).
       Driven by one master progress value (bayP) posed per frame — see
       the BAY_TUNE block below for the motor. Threshold classes on #bay
       (.inked/.shadowed/.pulled/.fullish/.locked) gate the CSS as p
       crosses them. */
    const bay = document.getElementById("bay");
    const bayPanel = document.getElementById("bay-panel");
    const bayClose = document.getElementById("bay-close");
    const bayInner = document.getElementById("bay-inner");
    const bayDot = document.getElementById("bay-dot");
    const bayHline = document.getElementById("bay-hline");
    const bayShelvesEl = document.getElementById("bay-shelves");
    const bayHead = document.getElementById("bay-head");
    const bayMsgN = document.getElementById("bay-msg-n");
    const bayTags = document.getElementById("bay-tags");
    /* the manifest points at the column (2026-08-04, same law as the
       letter's tags one level down): hover a tag, the shelf card it stands
       for wears the full hover build. No looking down at a number and then
       up at a board to check you have the right one. */
    bayTags.addEventListener("pointerover", e => {
      const t = e.target.closest && e.target.closest(".bay-tag");
      if (!t || (e.relatedTarget && t.contains(e.relatedTarget))) return;
      const item = bay.querySelector('.bay-item[data-id="' + (window.CSS && CSS.escape ? CSS.escape(t.dataset.id) : t.dataset.id) + '"]:not(.preseat)');
      cardLit(item && item.querySelector(".d7f"), true);
    });
    bayTags.addEventListener("pointerout", e => {
      const t = e.target.closest && e.target.closest(".bay-tag");
      if (!t || (e.relatedTarget && t.contains(e.relatedTarget))) return;
      const item = bay.querySelector('.bay-item[data-id="' + (window.CSS && CSS.escape ? CSS.escape(t.dataset.id) : t.dataset.id) + '"]:not(.preseat)');
      cardLit(item && item.querySelector(".d7f"), false);
    });
    /* ---- case geometry (2026-08-02, v1 item 3; REWORKED same day on
       Dylan's react): the case is STATIC — one height regardless of
       cargo (his screenshot's size, ~3/4 of the column, centered), with
       the browse visible above and below it. Rows are card + a fixed
       gap tuned to the collection grid; overflow scrolls, and a deck
       past the fit shows a partial card at the clip — the scroll hint.
       Declared HERE, next to the elements updateBayCount needs, not in
       the driver block — renderBay runs at boot and a later `let` is a
       TDZ crash (the piconPoked lesson).
       KNOBS: CASE_FRAC = the static case as a fraction of the column;
       BAY_GAP = vertical panel-to-panel spacing — the collection grid's
       44px row gap + 4 ("just slightly larger than collection view";
       both cards wear the same proportional shadow, so panel-to-panel
       is the honest comparison); card size = the BAY_SIZES stops below. */
    const CASE_FRAC = .90, BAY_GAP = 63;   /* Dylan's lab bake, 2026-08-03 */
    const HEAD_BUF = 10;   /* swallow air past the box SHADOW's bottom (the apron's reach) */
    const HEAD_DROP = 6;   /* the head shadow's vertical drop — MUST match .bay-head.hdrawn's -5px 6px */
    /* PER-RESOLUTION SIZE STOPS (Dylan round 7): (colH → card) pairs,
       art-directed at owned resolutions — MBP / 1080p / 1200p / 1440p /
       4K — linear between, clamped at the ends. This REPLACES the
       column/4 anchor (and its CARD_UP multiplier): that was the
       fit-four era's sizing, and with the static case + scroll the deck
       no longer needs to fit rows — low columns were shrinking cards
       for a constraint that no longer exists ("squeezed" at 1200).
       Tune in bay-lab (vault repo): its card slider edits the active
       screen's stop. */
    const BAY_SIZES = [[894, 162], [992, 205], [1112, 225], [1352, 250], [2072, 280]];   /* Dylan's lab bake (280 rides the 270 capW at the top) */
    /* THE SHOP DRAWS BIGGER ON BIG DISPLAYS TOO (round 8, his reframe:
       not a whole-site zoom — a max-draw ramp for the collection card).
       232 is the FLOOR: nothing at or below 1200p columns changes.
       STOPS MUST CLIMB (both tables): a stop tuned smaller than the one
       below it would make cards SHRINK while dragging a window bigger. */
    const SHOP_SIZES = [[1112, 232], [1352, 260], [2072, 300]];
    const lerpStops = (s, h) => {
      if (h <= s[0][0]) return s[0][1];
      for (let i = 1; i < s.length; i++) {
        if (h <= s[i][0]) {
          const [h0, c0] = s[i - 1], [h1, c1] = s[i];
          return Math.round(c0 + (c1 - c0) * (h - h0) / (h1 - h0));
        }
      }
      return s[s.length - 1][1];
    };
    const bayCardAt = h => lerpStops(BAY_SIZES, h);
    let bayShopLast = 0;
    let bayColH = 0, bayCaseT = 0, bayCaseC = 0, bayRowsFit = 2;
    function bayGeom() {
      if (!bayColH) return;   /* pre-measure boot call: bayMeasure re-runs this */
      /* head seat + the scroll-behind buffer + its air: the buffer hangs
         off the box SHADOW's bottom now (HEAD_DROP + HEAD_BUF — Dylan's
         nudge; the box + shadow are one object, see .bay-apron); the
         resting first card sits 6px below the apron. offsetHeight is
         the border box, so the outline + padding are in the measure. */
      const headT = 10 + bayHead.offsetHeight + HEAD_DROP + HEAD_BUF + 6;
      /* THE DRAWER SCALES AS ONE DESIGN (Dylan, 2026-08-02 round 2): the
         reference is the tall-column look — 340 wide, 270-cap card, 48
         gap — and on shorter columns the WHOLE case renders smaller
         instead of hollowing out (fixed 340 + a shrunk card read as
         horizontal dead space). Not a transform scale: the driver owns
         the transform channel and scaled hairlines go soft — instead the
         WIDTH follows the card, and since every internal measure chains
         off --bayW, narrowing the case IS scaling the design. capW
         derives from the REFERENCE width (the live one would be
         circular). Card size comes from the BAY_SIZES stops (round 7);
         the takeover keeps the old height anchor — its narrow shelf
         basis-caps the render, and rows sized for a stop card it can't
         render would re-open the giant-gap bug at phone widths. */
      /* insets are 48 left / 10 right + the shelf's 6/6 padding; the
         flex basis is FULL (1.00, the lab bake) so the card takes the
         whole shelf line and the inversion is exact: bayW = card + 70 */
      const capW = BAY_REF - 70;    /* 270 at the 340 reference */
      const card = dockActive()
        ? Math.min(capW, Math.round(Math.max(60, (Math.floor((bayColH - headT - 16) / 4) - 14) / 1.513) * 1.3))
        : Math.min(capW, bayCardAt(bayColH));
      const s = card / capW;                                 /* the design's photographic scale */
      const rowH = Math.round(card * 1.513) + Math.round(BAY_GAP * s);
      BAY_W = Math.round(card + 70);                         /* invert the shelf math: width follows the card */
      bay.style.setProperty("--bayW", BAY_W + "px");
      bayCaseT = Math.round(bayColH * CASE_FRAC);
      bayRowsFit = Math.max(1, Math.floor((bayCaseT - headT - 16) / rowH));
      /* first sizing lands without a grow performance */
      if (!bayCaseC) {
        bayCaseC = bayCaseT;
        bay.style.setProperty("--caseH", bayCaseC.toFixed(1) + "px");
        bay.style.setProperty("--caseTop", Math.round((bayColH - bayCaseC) / 2) + "px");
      }
      bay.style.setProperty("--shelfTop", headT.toFixed(1) + "px");
      bay.style.setProperty("--rowH", rowH + "px");
      bay.style.setProperty("--bayCard", card + "px");
      /* constant 16px white between the resting shadow and the strip
         (the lab bake's lift): the shadow's drop is cqw (scales with
         the card), the strip is 2px tall — the pad absorbs both */
      bay.style.setProperty("--shelfPad", (18 + card * .038793).toFixed(1) + "px");
      /* the strip hugs the card's footprint (round 6b): its reach past
         the panel is offset − spread (2.5862cqw — the SX law's number),
         +1px each side; the card centers in the shelf box, so the seat
         derives from the box's own width */
      const shExt = card * .025862;
      const shelfW = BAY_W - 58;   /* the 48/10 insets */
      bay.style.setProperty("--stripL", (shelfW / 2 - card / 2 - shExt - 1).toFixed(1) + "px");
      bay.style.setProperty("--stripW", (card + shExt + 2).toFixed(1) + "px");
      /* the head rides the SAME footprint (card-column seat, Dylan
         2026-08-03 — the bay-lab head toggle's answer): width = the
         strip's own (card + shadow reach + 2), right anchor = the shelf
         inset + the strip's right margin. One derivation with the
         strips, so the header and the cards beneath it cannot drift.
         ROUNDED whole — fractional box edges rasterize the vertical
         strokes soft at DPR 1 (the half-pixel family; ±.4px off the
         strip is invisible, a fuzzy line is not). */
      bay.style.setProperty("--headR", Math.round(10 + shelfW / 2 - card / 2 - 1) + "px");
      bay.style.setProperty("--headW", Math.round(card + shExt + 2) + "px");
      /* the apron: top tucks 2px under the box's opaque bg (its z sits
         below the head's, so the overlap is hidden — no flush seam),
         bottom is DRIVER-SNAPPED so the SWALLOW LINE (where scrolled
         cards get cut) lands on a whole pixel, HEAD_BUF past the
         SHADOW's bottom. Snapped off the live rect because the browser
         snaps the border's USED width (1.5 spec → 1 at DPR 1) — no calc
         against spec values can be trusted (Dylan's scroll-cut catch,
         2026-08-03). .bay is fixed, so the rect is scroll-stable. */
      const hbr = bayHead.getBoundingClientRect();
      if (hbr.height) {
        bay.style.setProperty("--apronTop", (10 + bayHead.offsetHeight - 2) + "px");
        bay.style.setProperty("--apronH", (Math.round(hbr.bottom + HEAD_DROP + HEAD_BUF) - (hbr.bottom - 2)).toFixed(2) + "px");
      }
      /* the drawn outline's geometry: real-px paths in a 1:1 viewBox so
         the 1.5 strokes sit exactly in the transparent border's
         footprint (.75 centerline inset — the border's own centerline).
         Two legs share the RIGHT line's center as their start and the
         left line's center as their end (the draw follows path
         direction). Rebuilt here because the box tracks the card column
         and the manifest wrap; a fonts-late height self-heals on
         bayMeasure's tick like everything else head-sized. Reading
         offsetWidth after the --headW write forces the layout, so the
         paths always match the box they outline. */
      const hlW = bayHead.offsetWidth, hlH = bayHead.offsetHeight;
      if (hlW && hlH) {
        bayHline.setAttribute("viewBox", "0 0 " + hlW + " " + hlH);
        const yMid = (hlH / 2).toFixed(1), xR = (hlW - .75).toFixed(2), yB = (hlH - .75).toFixed(2);
        const [hlA, hlB] = bayHline.querySelectorAll("path");
        hlA.setAttribute("d", "M" + xR + " " + yMid + " L" + xR + " .75 L.75 .75 L.75 " + yMid);
        hlB.setAttribute("d", "M" + xR + " " + yMid + " L" + xR + " " + yB + " L.75 " + yB + " L.75 " + yMid);
      }
      /* the shop's max-draw ramp (round 8): the grid's gaps and max
         column scale with the card so wide screens stay a 4-up; the
         d7f is a cqw container, so a wider slot scales the card
         natively — lockCardScale's ≥ref branch already stands down,
         and a re-lock refreshes any reductions when the ramp moves */
      const shop = lerpStops(SHOP_SIZES, bayColH);
      if (shop !== bayShopLast) {
        bayShopLast = shop;
        const sr = document.documentElement.style, ss = shop / 232;
        sr.setProperty("--shopCard", shop + "px");
        sr.setProperty("--shopMaxW", Math.round(1240 * ss) + "px");
        sr.setProperty("--shopGY", Math.round(44 * ss) + "px");
        sr.setProperty("--shopGX", Math.round(32 * ss) + "px");
        lockCardScale();
      }
    }

    /* boards still mid-flight render hidden (.preseat) — the flight lands
       on the hidden item's measured rect and reveals it. The count chip
       also waits for the touchdown, so the tally never runs ahead of the
       cards actually shelved. */
    const pendingSeat = new Set();
    function updateBayCount() {
      const n = myLisst.length - pendingSeat.size;
      /* the head rides the SETTLED count — a tag or a label tick
         arriving before its card lands would run the manifest ahead of
         the shelves (the retired count chip's law, kept by its heir).
         The count is the bar's right organ now (n + skateboard); the
         phrase span belongs to the announce, not the tally. */
      bayMsgN.textContent = String(n);
      bayTags.innerHTML = myLisst.filter(id => !pendingSeat.has(id)).map(id => {
        const { c, b, k } = BOARD_INDEX[id];
        /* jref, not refOf: the tag must print the SAME string as the
           corner chip on the card it stands for */
        return '<span class="bay-tag" data-id="' + esc(id) + '">' + esc(jref(c, b, k)) + '</span>';
      }).join("");
      bayGeom();   /* the manifest can wrap — the head owns the shelf top */
      if (bay.classList.contains("out")) bayDmRefresh();   /* hrefs track membership live */
    }
    /* THE LANDING OWNS THE VOICE (2026-08-21, Dylan's double-click catch:
       adding a card to the deck clicked twice). An add or a remove
       re-stacks the column on its way past, and the re-stack's settle
       click landed ~360ms ahead of the flight's OWN landing beat — two
       sounds for one gesture. So the mover raises this flag around its
       render and the settle sits that one out; the beat that answers is
       the landing, where the card actually arrives. A FLAG, not a timing
       window: 360ms is far outside any cooldown, and only the mover knows
       a beat is already booked. Every OTHER re-stack keeps its voice —
       the lisst-page uncheck, the lb un-deck, the off-stage exits, all
       re-stacks whose click IS their one sound. */
    let bayQuiet = false;
    function renderBayQuiet() {
      bayQuiet = true;
      try { renderBay(); } finally { bayQuiet = false; }
    }
    function renderBay() {
      updateBayCount();
      /* FLIP capture (2026-07-24, Dylan): a removal re-stacks the column
         — survivors must MOVE up to their new shelves, not teleport.
         Old rects by id (preseat and lifted/hidden cards sit out),
         replayed after the rebuild as a slide + settle press + ONE
         click, running WHILE the exit flight is mid-air (this render
         happens at flight start). A re-render mid-slide chains: the
         capture reads live, transformed rects. */
      const wasAt = new Map();
      if (!reduced) bay.querySelectorAll(".bay-item:not(.preseat)").forEach(el => {
        if (el.style.visibility === "hidden") return;
        const r = el.getBoundingClientRect();
        if (r.height > 0) wasAt.set(el.dataset.id, r);
      });
      /* one shelf per board now (2026-08-02): the column scrolls past
         four instead of piling shelf 4. Min two shelves so the empty
         case still reads as a display case, not a slot. innerHTML wipe
         resets scrollTop — restored below, BEFORE the FLIP measures,
         or every survivor's delta would include the phantom jump. */
      const keepScroll = bayShelvesEl.scrollTop;
      bayShelvesEl.innerHTML = "";
      const shelves = [];
      /* the case is static: empty shelves fill it to the fit line, so
         an empty case still reads as a display case awaiting cards */
      for (let i = 0; i < Math.max(bayRowsFit, myLisst.length); i++) {
        const s = document.createElement("div");
        s.className = "bay-shelf"; s.style.setProperty("--i", i);
        bayShelvesEl.appendChild(s); shelves.push(s);
      }
      myLisst.forEach((id, n) => {
        const { ci, b, k } = BOARD_INDEX[id];
        /* the shelf holds the CARD (2026-07-22) — the fv3 template at
           slot width, the cqw spec does the rest. Its ✓ chip is
           NOT a remove (2026-07-24): the capture handler falls through
           for shelf chips, so chip clicks inspect like any card click.
           The corner ✕ is the only remove. */
        const item = document.createElement("div");
        item.className = "bay-item";
        if (pendingSeat.has(id)) item.classList.add("preseat");
        item.dataset.id = id;
        item.title = lisstLabel(id);
        item.innerHTML = JCARDS.framev3(jmeta(COLLECTIONS[ci], b, k));
        /* inspecting from the case lifts the card OUT (sourceEl): the
           shelf shows its gap — the card can't appear twice — and the
           close flight lands it back on this shelf */
        item.addEventListener("click", () => openLb(ci, k, item));
        /* the floating ✕: clear without re-inspecting */
        const x = document.createElement("button");
        x.className = "bay-x"; x.type = "button";
        x.setAttribute("aria-label", "Remove from deck");
        x.textContent = "✕";
        x.addEventListener("click", e => {
          e.stopPropagation();
          toggleLisst(id);
          document.querySelectorAll('.fc-list[data-id="' + id + '"] .ft').forEach(t => {
            t.textContent = inLisst(id) ? "✓" : "";
          });
          if (dockActive()) mobileExit(item, id); else flyFromBay(item, id);
        });
        item.appendChild(x);
        /* THE LIFT SURVIVES THE REBUILD (Dylan's dupe catch, 2026-08-03):
           a mid-inspection renderBay (e.g. removing a DIFFERENT board)
           rebuilds every item — including the one whose gap the lightbox
           is holding — and a fresh item renders VISIBLE: the inspected
           card reappears on its shelf, and the close flight (which
           re-finds by id) lands on the duplicate. Re-hide it and repoint
           the source at the live element. */
        if (!lb.hidden && lbSrc && lbSrc.el && lbSrc.el.classList &&
            lbSrc.el.classList.contains("bay-item") && lbSrc.el.dataset.id === id) {
          item.style.visibility = "hidden";
          lbSrc.el = item;
        }
        shelves[n].appendChild(item);   /* one card per shelf, one shelf per card */
      });
      /* the shelf card rests on its dims (2026-08-18, THE DIMS REST) —
         landed statically at the render, so a rebuild (a removal re-stack,
         a mid-flight preseat) never replays a scramble */
      landDims(bayShelvesEl);
      bayShelvesEl.scrollTop = keepScroll;   /* the browser clamps a shrunk column */
      /* an incoming flight must land on a VISIBLE slot: the newest
         preseat is always the last shelf — bring it into view (instant;
         the flight re-measures per frame, so it converges regardless) */
      const pres = bayShelvesEl.querySelectorAll(".bay-item.preseat");
      if (pres.length) {
        const sh = pres[pres.length - 1].parentElement;
        const over = sh.offsetTop + sh.offsetHeight - bayShelvesEl.clientHeight;
        if (over > bayShelvesEl.scrollTop) bayShelvesEl.scrollTop = over;
      }
      applyDeckHoles();   /* membership changed — the shop's holes follow */
      /* FLIP replay: slide each moved survivor from its old rect to its
         new seat (top-left-origin translate+scale replays the old box
         exactly — equal card aspect), with a wee overshoot so it CLICKS
         in, then the light reseat press. One kclick for the re-stack. */
      if (wasAt.size) {
        let moved = false;
        bay.querySelectorAll(".bay-item:not(.preseat)").forEach(el => {
          const old = wasAt.get(el.dataset.id);
          if (!old) return;
          const now = el.getBoundingClientRect();
          if (!(now.height > 0)) return;
          const dx = old.left - now.left, dy = old.top - now.top, s = old.width / now.width;
          if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(s - 1) < .01) return;
          moved = true;
          el.style.transformOrigin = "top left";
          el.style.transition = "none";   /* outrank the .2s hover transition both ways */
          el.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(" + s.toFixed(4) + ")";
          requestAnimationFrame(() => requestAnimationFrame(() => {
            el.style.transition = "transform .3s cubic-bezier(.3,1.35,.45,1)";
            el.style.transform = "none";
          }));
          setTimeout(() => {
            if (!el.isConnected) return;   /* a newer render owns the column now */
            el.style.transition = ""; el.style.transform = ""; el.style.transformOrigin = "";
            el.classList.add("reseat");
            const clear = () => el.classList.remove("reseat");
            el.addEventListener("animationend", clear, { once: true });
            setTimeout(clear, 400);
          }, 320);
        });
        /* the settle answers once — unless a landing beat is already
           booked for this same gesture (bayQuiet). This one KEEPS its
           timer, unlike the lb open's (audited 2026-08-21, the sound
           pass): 320 is not a guess here, it is the .3s transition plus
           the two rAFs that arm it, and the same 320 is what the cleanup
           above runs on. Measured on the served page, the moved item's
           transitionend lands within a frame of this timer — so riding
           it would move the click ~0-20ms and hand the beat to an event
           the cleanup is racing. Nothing to win; the drift risk the lb
           had (a 430 guess against a .55s transition) does not exist. */
        if (moved && !bayQuiet) setTimeout(kclick, 320);
      }
    }

    /* deck holes (2026-07-22): one card per board — in the DECK or in the
       SHOP, never both (the lightbox lift-out idiom made persistent).
       Adds hide the shop slot behind the departing fly; removes keep the
       hole (pendingHole) until the return flight lands. Lisst-page cards
       (.lisst-card) are exempt — that page IS the deck's paper form. */
    const pendingHole = new Set();
    function applyDeckHoles() {
      /* universal since 2026-07-24 (Dylan's call): the one-card law runs
         on the phone too — in the deck OR in the shop, never both, on
         every screen. */
      const on = true;
      document.querySelectorAll(".fc-list[data-id]").forEach(ch => {
        const slot = ch.closest(".card, .scard");
        if (!slot || slot.classList.contains("lisst-card")) return;
        slot.classList.toggle("indeck", on && (inLisst(ch.dataset.id) || pendingHole.has(ch.dataset.id)));
      });
    }
    /* the visible page's shop slot for a board (the return address) */
    function gridInstance(id) {
      const page = home.hidden ? colpage : home;
      const ch = page.querySelector('.fc-list[data-id="' + id + '"]');
      const slot = ch && ch.closest(".card, .scard");
      return (slot && !slot.classList.contains("lisst-card")) ? slot : null;
    }
    /* a card exits the deck: it flies back OUT to its shop slot. The hole
       holds (pendingHole) until touchdown, then the slot takes its card
       back with the same landing beat. getEnd re-measures per frame — the
       conveyor may carry the slot mid-flight — and freezes on the last
       good rect if a re-render pulls the slot out from under it. */
    /* fly a card home to its shop slot from wherever it is — the shared
       tail of every remove (the shelf ✕, the drag-out). sr is the fly's
       launch rect; the fly may already be live in the DOM (a drag hands
       over its in-hand card, with drain to settle held chrome mid-air).
       Handles the off-stage belt exit. */
    function homeFly(id, fly, sr, drain) {
      const slot = gridInstance(id);
      if (!slot) { renderBay(); fly.remove(); return; }
      /* belt slots recycle around the loop: an off-stage hole's transform
         can park it far LEFT over the spine, and chasing that overshoots
         the page (Dylan, 2026-07-22). If the hole is off-stage or in the

    /* proximity: within 130px of the right screen edge, inside the bay's

       its own right-edge hover behavior. The emergence choreography is all
       CSS off the .near class — enter fast-then-slow, exit long and quiet. */

       rAF; every piece is posed from it each frame. The cursor is the
       motor — in the trigger zone p always climbs, but the RATE scales
       with proximity: parked at the outer bound it's a slow continuous
       crawl that completes on its own; at the page edge it's quick, so
       the approach feels like doing the pull. An ADD locks it at full;
       a click on anything that isn't a card respects the STATE — still
       moving → snap open + lock, at rest fully open → close (as does
       the arrow); otherwise leaving drains it slowly.

    const BAY_TUNE = {

      durSlow: 6.5,     /* seconds to full with the cursor parked at the outer bound */
      durFast: 1.1,     /* seconds to full with the cursor at the page edge */
      durShut: 1.4,     /* the quiet drain when nothing was clicked */
      durSnap: .45,     /* click: sped up / locked in */
      durClose: .4,     /* the arrow's quick shut */

         do, the inner line never slows), round the corner into the face
         halves, and the face only lands (connects) at max visibility.
         Horizontal motion is ONE eased distance over `travel`, split
         between body and drawer arithmetically — the corner is not a
         motion boundary, so there's nothing to stutter on. Shadow + chip
         wait for the landing. */
      seg: { inner: [0, .30], travel: [.02, 1], face: [.28, 1] },
      at: { inked: .20, shadowed: .985, pulled: .55, fullish: .9 },
      restTrim: 72,     /* ~3/4" shaved off the resting marks, top and bottom */

         marks grow to full height and pull off the edge — the familiar
         line coming closer along with the board */
      lean: { x: 20, durIn: .6, durOut: .45 },
      fade: .4,   /* the open deck's ground dim (.22 → .4, Dylan 2026-08-03: scrollable ground made .22 read too modal); the lb's .08 outranks it by cascade */

       the whole case scales as one design; bayPose's travel reads it

    const BAY_REF = parseFloat(bayCS.getPropertyValue("--bayW")) || 340;

       master p, the site fades back in exactly in step with the
       retraction. WHEEL, not the scroll position, on purpose: position

    addEventListener("wheel", e => {

       "could be the eventual drawer button"): it toggles the deck — the
       drawer's always-visible twin, since proximity was its only door.
       Still no hover fx on purpose; that costume is undesigned. */
    const barScript = document.getElementById("bar-script");
    if (barScript) {
      barScript.removeAttribute("aria-hidden");
      barScript.setAttribute("role", "button");
      barScript.setAttribute("tabindex", "0");
      barScript.setAttribute("aria-label", "The deck");
      barScript.style.cursor = "pointer";
      const scriptFlip = () => {
        if (dockActive()) return;   /* it only renders on the drawn bar anyway */
        if (bayLocked || bayP >= 1) closeBay(); else openBay();
      };
      barScript.addEventListener("click", scriptFlip);
      barScript.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); scriptFlip(); }
      });
      /* the DECK organ's inspection lean moved here with the counter
         (2026-08-08) — pointing at the deck's button is pointing at the
         deck, whichever chrome owns the door */
      barScript.addEventListener("pointerenter", () => { navLean = true; });
      barScript.addEventListener("pointerleave", () => { navLean = false; });
    }

    /* ========= mobile gestures: the deck's phone door is YOUR PICKS =========
       (react round 6.)
       The takeover case — #bay as a slide-in phone modal (2026-07-24) —
       is retired (Dylan: "the deck drawer should away on mobile"); its
       machinery lives in the vault repo's history. THE PICON IS A PLAIN
       LINK: the anchor's own #my-lisst href routes to YOUR PICKS for
       every card mode, empty deck included (the blank card's tap lands
       on the empty page, which says the same thing in words). What
       survives of the case's gesture family is below: the swipe-to-open
       (now the picks departure) and its ghost-click suppressor — a
       committed swipe's release fires a CLICK on whatever lands under
       the finger, and the capture suppressor eats exactly that one
       (time-boxed so a stale flag can never eat a real tap). */
    const SWC_TH = 70, SWC_SLOP = 10;
    let swcAte = 0;
    document.addEventListener("click", e => {
      if (!swcAte || performance.now() - swcAte > 400) return;
      swcAte = 0;
      e.preventDefault(); e.stopPropagation();
    }, true);
    /* SWIPE-TO-THE-DECK (2026-08-08 evening, Dylan: "right to left swipe on
       collections page should open the deck also") — one gesture family
       with the stack's own tap. A leftward horizontal swipe on the
       browse departs to YOUR PICKS; the commit fires the moment the pull
       crosses SWC_TH MID-MOVE, not at release, so the page starts
       arriving under the still-down finger and the open reads as the
       swipe being caught. Rightward is never claimed (Safari's edge nav
       owns that direction), vertical dominance stands down immediately
       (no preventDefault anywhere — a touch the browser takes for the
       page scroll just pointercancels us, which is the hand-back), and
       home never arms (showroom law — colpage.hidden). Grid cards are
       fair launch surface on purpose: mobile grids are tap-to-inspect
       with no horizontal verb, so the swipe collides with nothing and
       the mostly-cards page keeps a usable gesture area. A committed
       release's ghost click is eaten by the swc suppressor above —
       shared swcAte, same 400ms box. */
    let swo = null;
    document.addEventListener("pointerdown", e => {
      if (!dockActive() || e.pointerType === "mouse" || CARD !== "framev3") return;
      if (!lb.hidden || drag || colpage.hidden) return;
      if (e.target.closest(".topbar, .drop, #bay, #lb")) return;
      swo = { x: e.clientX, y: e.clientY, id: e.pointerId, on: false, done: false };
    });
    document.addEventListener("pointermove", e => {
      if (!swo || e.pointerId !== swo.id || swo.done) return;
      if (drag) { swo = null; return; }
      const dx = e.clientX - swo.x, dy = e.clientY - swo.y;
      if (!swo.on) {
        if (Math.abs(dy) > SWC_SLOP && Math.abs(dy) >= Math.abs(dx)) { swo = null; return; }
        if (dx > SWC_SLOP) { swo = null; return; }   /* rightward is not ours */
        if (Math.abs(dx) <= SWC_SLOP || Math.abs(dx) <= Math.abs(dy)) return;
        swo.on = true;
      }
      /* the commit opens YOUR PICKS (react round 6 — same mid-move commit
         beat, the page arriving IS the catch) */
      if (dx < -SWC_TH) { swo.done = true; leaveToPicks(); buzz(); }   /* the departure, same as the stack */
    });
    document.addEventListener("pointerup", e => {
      if (!swo || e.pointerId !== swo.id) return;
      if (swo.done) swcAte = performance.now();
      swo = null;
    });
    document.addEventListener("pointercancel", e => {
      if (swo && e.pointerId === swo.id) swo = null;
    });
    /* crossing the 940/hover boundary hands the deck between its two
       bodies: the drawer stands down going in (the phone's deck is YOUR
       PICKS), and takes the job back going out. (The ground used to cross
       with it — retired 2026-08-20, light is the one ground.) */
    matchMedia("(max-width: 940px)").addEventListener("change", e => {
      if (e.matches) {
        bayLocked = false; bayClosing = false; bayRearm = false;
        bayP = 0; bayPosedP = -1;
        if (document.body.classList.contains("bay-room")) shopRoom(false);
      }
      applyDeckHoles();
      /* the lisst page wears a different costume per side (YOUR PICKS vs
         My Lisst, react round 6) — a crossing mid-page must re-dress it */
      if (location.hash.replace(/^#/, "") === "my-lisst") renderLisst();
    });

    /* ========= flights: the bay flight engine =========
       (2026-07-22, card payload): the WHOLE CARD flies — a
       fresh card off the one template, its own board + panel shadows,
       chip fills held from the pluck, drained mid-air (.left) so it
       touches down at rest — and the hidden shelf item it lands on IS
       that rest state, no crossfade seam. Position/scale/rotation ride
       one progress value; the TARGET is re-measured every frame because
       every add now OPENS the deck (openBay + lock — it stays open
       until the arrow / a non-card click / Esc shuts it), so the shelf
       is still sliding out under the early flight.
       The closed-drawer dot flight is gone with the always-open rule.
       The seat is DROP (Dylan's pick 2026-07-26, the SEAT comparison row and
       its skid/seatdraw variants retired with it): the arc's peak hangs over
       the slot and the card falls the last 9px with a whisper of squash. */
    const SEAT_TUNE = {
      dur: .68,        /* flight seconds, open drawer */
      liftMax: 120,    /* arc height ceiling (lift scales with distance) */
      pickup: .07      /* early "picked up" grow, fades over the ride */
    };
    function bayFlight(fly, sr, getEnd, opts, onLand) {
      fly.classList.add("bay-fly");
      fly.style.left = sr.left + "px"; fly.style.top = sr.top + "px";
      fly.style.width = sr.width + "px";   /* height follows the card's own aspect */
      document.body.appendChild(fly);
      const sx = sr.left + sr.width / 2, sy = sr.top + sr.height / 2;
      const t0 = performance.now(), dur = opts.dur * 1000;
      let drained = false;
      (function frame(now) {
        const t = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - t, 2.6);   /* launched hard, arrives damped */
        const u = 1 - e;
        /* target re-measured every frame — the drawer is still opening
           under the early flight, and the bezier converges on wherever
           the seat actually is */
        const end = getEnd();
        const lift = Math.min(SEAT_TUNE.liftMax, 40 + Math.hypot(end.x - sx, end.y - sy) * .18) * (opts.shallow ? .5 : 1);
        /* control point: shallow arcs peak mid-route; steep ones hang the
           peak over the target so the last leg reads as a fall. opts.hook
           pulls the control LEFT of the start instead — the off-stage
           exit's pickup swing (up-left out of the case, then away). */
        const cx = opts.hook ? sx - opts.hook
          : opts.shallow ? (sx + end.x) / 2 : sx * .3 + end.x * .7;
        const cy = Math.min(sy, end.y) - lift;
        const px = u * u * sx + 2 * u * e * cx + e * e * end.x;
        const py = u * u * sy + 2 * u * e * cy + e * e * end.y;
        const s1 = end.h / sr.height;
        const sc = 1 + (s1 - 1) * e + SEAT_TUNE.pickup * Math.sin(Math.PI * Math.min(1, e / .5)) * u;
        const rot = 5 * Math.sin(Math.PI * e) + (opts.endRot || 0) * e;
        fly.style.transform = "translate(" + (px - sx).toFixed(1) + "px," + (py - sy).toFixed(1) + "px) scale(" + sc.toFixed(3) + ") rotate(" + rot.toFixed(2) + "deg)";
        if (!drained && t >= .55 && opts.drain) { drained = true; opts.drain(); }
        if (t < 1) requestAnimationFrame(frame);
        else { fly.remove(); onLand(); }
      })(performance.now());
    }
    /* seat a fly into the case: the shared tail of every add — preseat
       render, per-frame target (the drawer is still sliding out under
       the early flight), seat variant, and the landing answers. sr is
       the fly's launch rect; the fly may already be live in the DOM
       (drag hands over its in-flight card). Returns false if there was
       nothing to seat (caller cleans up its fly). */
    function seatFly(id, fly, rest, sr, opts) {
      fly.classList.add("dimsrest");   /* every seat lands on a shelf — THE DIMS REST */
      pendingSeat.add(id);
      renderBayQuiet();   /* the item now exists, hidden — its rect is the
        target. Quiet: the seat's landBeat is this add's voice. */
      const item = bay.querySelector('.bay-item.preseat[data-id="' + id + '"]');
      /* nothing to seat: the render below only undoes the one above, so
         it is silent too. Returning false tells the caller no landing is
         coming — the toss branch reads it and keeps its exchange loud. */
      if (!item) { pendingSeat.delete(id); renderBayQuiet(); return false; }
      /* the peak hangs 9px over the slot and the card falls the last of it */
      const getEnd = () => {
        const tr = item.getBoundingClientRect();
        return { x: tr.left + tr.width / 2, y: tr.top + tr.height / 2 - 9, h: tr.height };
      };
      bayFlight(fly, sr, getEnd, { dur: opts.dur, drain: rest }, () => {
        /* re-query: a renderBay may have rebuilt the shelves mid-flight */
        const seated = bay.querySelector('.bay-item.preseat[data-id="' + id + '"]');
        pendingSeat.delete(id);
        /* THE UNDONE ADD LANDS SILENT, DELIBERATELY (ruled 2026-08-21 fix
           round). The seat is gone because membership went away under the
           flight — in practice the chip was un-checked mid-air, and THAT
           gesture already spoke: its own re-stack is a loud render (it is
           on sounds.md's keep-the-voice list). A beat here would be a
           second click 200-360ms behind the first — the exact artifact the
           bayQuiet pass removed — and it would be announcing a landing
           that did not happen. Nothing landed; nothing says so. */
        if (!seated) { updateBayCount(); if (opts.after) opts.after(null); return; }
        seated.classList.remove("preseat");
        seated.classList.add("seat-drop");
        seated.addEventListener("animationend", () => seated.classList.remove("seat-drop"), { once: true });
        const shelf = seated.parentElement;
        shelf.classList.add("landed");
        setTimeout(() => shelf.classList.remove("landed"), 500);
        bayShelvesEl.classList.add("recoil");
        setTimeout(() => bayShelvesEl.classList.remove("recoil"), 250);
        updateBayCount();
        landBeat(seated);   /* the button press: panel press + click */
        if (opts.after) opts.after(seated);   /* the catch-and-shut's landing hook */
      });
      return true;
    }
    /* THE DECK'S MANNERS (Dylan, 2026-08-08): "any time you open the deck
       manually it stays open until you close it; any time you add a card
       to the deck without the deck open at the time of the add, the deck
       closes behind the add." Manual opens already lock (the bar toggle,
       the pull, drawer clicks — bayLocked never drains), so this pair
       carries the second half, generalizing the lb arc's 2026-08-01
       catch-and-shut to EVERY add path: chip, drag, lb. bayCatchOpen
       CHAINS the intent — a deck that is only open to catch an earlier
       add (flag still armed) counts as shut, so stacked quick adds keep
       the shut promise instead of the second add inheriting a "locked"
       deck nobody opened. bayCatchShut consumes the flag only once
       nothing is still inbound (pendingSeat drains first) — the drawer
       closes behind the LAST card it caught, never out from under a
       flying one. */
    function bayCatchOpen() {
      const shutAfter = !bayLocked || bayShutAfterLanding;
      openBay(shutAfter);              /* transient when it will shut again */
      bayShutAfterLanding = shutAfter; /* assigned after openBay's clear */
    }
    function bayCatchShut() {
      if (bayShutAfterLanding && !pendingSeat.size) { bayShutAfterLanding = false; closeBay(); }
    }
    function flyToBay(cardEl, id) {
      /* an add only BORROWS a shut deck now (the manners above) — it
         stays open only if it was already locked open */
      bayCatchOpen();
      const { ci, b, k } = BOARD_INDEX[id];
      const srcPanel = cardEl && cardEl.querySelector(".panel, .frame");
      if (reduced || !srcPanel) { renderBay(); bayCatchShut(); return; }
      const sr = srcPanel.getBoundingClientRect();
      /* the fly: a fresh card off the one template — intact info, both
         shadows its own (buildFly copies text state so a mid-decode
         pluck is seamless; the source stays hovered under it). */
      const { fly, rest } = buildFly(cardEl, ci, b, k, id);
      if (!seatFly(id, fly, rest, sr, { dur: SEAT_TUNE.dur, after: bayCatchShut }))
        bayCatchShut();   /* nothing seated — no landing will consume the flag */
    }

    /* +List on belt/grid fv3 cards: capture phase, so the card's own
       "open the lightbox" click never sees it. The lightbox chip keeps
       its element handler (skipped by id here). */
    document.addEventListener("click", e => {
      const chip = e.target.closest && e.target.closest(".fc-list.d7f-cta");
      if (!chip || chip.id === "lb-fv3-list") return;
      /* home-belt chips don't add (2026-07-22): ANY click on a belt card
         inspects it — adds live in the lightbox. Fall through untouched
         so the belt's own card→openLb click handler takes it. Grid
         (.scard) chips keep their jobs. */
      if (chip.closest(".card")) return;
      /* shelf-card chips don't remove either (2026-07-24, Dylan): ANY
         click on a deck card takes it to the lightbox — fall through to
         the item's own openLb click, the same lift-out flight as a grid
         card's. The corner ✕ is the remove. */
      if (chip.closest(".bay-item")) return;
      const id = chip.dataset.id;
      if (!id) return;
      e.stopPropagation(); e.preventDefault();
      const adding = !inLisst(id);
      toggleLisst(id);
      document.querySelectorAll('.fc-list[data-id="' + id + '"] .ft').forEach(t => {
        t.textContent = inLisst(id) ? "✓" : "";
      });
      if (adding) {
        if (dockActive()) {
          renderBay();   /* the hole opens under the departing fly (visibility
            keeps layout, so the flight still measures the slot's rect) */
          pickCatch(id, chip.closest(".d7f"));
        } else flyToBay(chip.closest(".d7f"), id);
      } else renderBay();   /* lisst-page chips: membership only, no shelf card to fly */
    }, true);

    /* ========= the drag engine (drag-to-deck) =========
       (2026-07-24, Dylan): pick a card up and move it.
       The site taught cards as physical objects — this answers the
       invitation. Live from the FIRST touch (no earned gate: a live
       affordance that plays dead is worse than a skipped ceremony); the
       chip keeps the ceremony, the drag stays snappy. TOSS won the
       carry/toss row (same day — row retired): the card trails the hand
       on a spring and leans into travel. The lift is LB-LITE: the page
       fades to the inspection faint (body.dragging shares the lb-fade
       rule) and the card zooms in hand — the collection→lightbox read,
       smaller. Works BOTH WAYS: shop (.scard) cards drag IN — release
       in the zone / over the drawer, or a rightward throw, = the add
       via seatFly from the hand's own rect; anywhere else springs home
       quiet. Shelf (.bay-item) cards drag OUT — release away from the
       drawer, or a leftward throw, = the remove via homeFly, landing
       beat and all; back in the zone re-shelves quiet. Belt clicks
       inspect (law), lisst-page cards are the paper form, the phone has
       its own organ (YOUR PICKS), and no pickups under an open lightbox.
       ============ DRAG TUNING LEGEND ============
       threshold  6    px of travel before a press becomes a pickup
                       (under it, the press is the normal click)
       grabScale  .13  the in-hand zoom — the lb-lite read against the
                       faded page (the flight pickup keeps its own .07)
       followEase .16  spring rate toward the hand per frame (raise
                       toward 1 to stiffen the trail)
       tiltMax    8    deg of lean into travel, driven by vx
       tiltEase   .12  how fast the lean follows the hand
       throwSpeed 650  px/s that reads as a throw (rightward = into
                       the deck, leftward = out of it)
       addDur     .5   release→seat flight (snappier than the chip's
                       .68 — the hand already did the carrying)
       homeDur    .38  the spring home on a cancel
       --- the touch door (2026-07-24, mobile) ---
       holdMs     190  press-hold (ms) that lifts the SHEET card on
                       touch — under it a press is a tap; moving
                       > holdSlop first hands the touch back to the
                       sheet's native jobs (swipe-nav)
       holdSlop   9    px of pre-hold travel that cancels the pending
                       lift (it was a swipe, not a grab)
       holdPop    .05  the lift's grab cue on the already-zoomed
                       sheet card (desktop fromLb stays at 1)
       touchTh    12   px of travel that lifts a CASE card (no hold —
                       the case is our surface; thumbs wobble bigger
                       than mice, so 6 would misfire taps)
       dockZone   92   px from the RIGHT edge that reads "at the
                       dock" on release — the sliver's catch zone
                       (the toss-OUT zone is not a knob: it's the
                       half-screen case's own left face — release
                       anywhere over the browse = the remove)
       ============================================ */
    const DRAG_TUNE = {
      threshold: 6, grabScale: .13, followEase: .16, tiltMax: 8,
      tiltEase: .12, throwSpeed: 650, addDur: .5, homeDur: .38,
      holdMs: 190, holdSlop: 9, holdPop: .05, touchTh: 12,
      dockZone: 92,
      /* the distance fade (2026-08-08): fadeGrab = the slight dim the
         moment the card is in hand; fadeFar = the settled lb faint,
         reached fadeRange px of card-travel from home; fadeEase = the
         per-frame chase (the followEase family) */
      fadeGrab: .8, fadeFar: .08, fadeRange: 520, fadeEase: .14,
      /* the patient grab (2026-08-08): a click held this long IS the
         pickup — no travel required. Spec'd at a second, tuned to .35s
         on the first mouse pass (Dylan: "a second there feels like 5" —
         nothing else lives on a long press, so there's no accident to
         guard against) */
      holdLiftMs: 350
    };
    let drag = null, dragStole = false;
    document.addEventListener("pointerdown", e => {
      if (e.button !== 0 || drag) return;
      if (reduced || CARD !== "framev3") return;
      /* the touch door (2026-07-24): in the dock's world the drag runs
         on touch too — the SHEET card lifts on a press-HOLD (a plain
         swipe stays the sesh's; hold-then-drag is the iOS pickup
         idiom), a CASE card lifts on travel alone (our surface,
         nothing to fight). Desktop keeps mouse/pen only. */
      const mob = dockActive();
      if (!mob && e.pointerType === "touch") return;   /* desktop: touch scrolls */
      if (e.target.closest && e.target.closest(".fc-list, button, a")) return;   /* chips/✕/nav keep their clicks */
      let kind, src, id, fromLb = false;
      if (!lb.hidden) {
        /* the inspected card itself is grabbable (2026-07-24, Dylan):
           dragging it converts the inspection into a carry — the lb
           releases at lift, the fly in hand IS the card, and the same
           release rules apply (decked → back/out, undecked → in/home).
           On MOBILE the inspection is NOT converted: the sheet stays
           up, the card lifts out of it, and a cancel springs back to
           the sheet seat (an accidental lift must not eject the
           swipe sesh). Thumbs keep their taps; the affordance
           language (hand vs pointer cursor art) is a later pass.
           NO PICKUPS FROM A HOME-OPENED INSPECTION (2026-08-01): the
           front page takes no adds, and a drag's only jobs are adds
           and removes — on home the card is a click-and-look object. */
        /* THE PHONE INSPECTION LOST ITS GRAB (2026-08-17, Dylan: "remove
           the ability to grab a card in lightbox on mobile") — the hold
           pickup kept stealing the pinch's FIRST finger (holdMs fired
           while the second finger was still landing, and the card stuck
           to the thumb). ADD is the phone's whole add path; the carry
           was desktop grammar visiting. Desktop lb grabs are untouched,
           and with the hold gone the pinch owns two fingers anywhere on
           the sheet, uncontested. */
        if (mob) return;
        if (colpage.hidden) return;
        if (!cur || !e.target.closest("#lb-card") || e.target.closest("#lb-thumbs")) return;
        id = lbListBtn.dataset.id;
        if (!id || !BOARD_INDEX[id]) return;
        kind = inLisst(id) ? "deck" : "shop";
        /* the lb seat is what a cancel returns to — BOTH surfaces since
           2026-08-15 (the desktop convert-and-close retired; the shop/shelf
           lookup went with it — every fromLb flight is id-based or a
           spring back to this seat, see the fromLb branch in dragEnd) */
        src = lbCard;
        fromLb = true;
      } else {
        /* two page surfaces: shop grid cards (IN) and shelf cards (OUT).
           Mobile grids stay tap-to-inspect — adds live in the sheet
           (thumb territory, the 2026-07-20 dock ruling) — so only CASE
           cards take the touch door here. */
        const item = e.target.closest && e.target.closest(".bay-item");
        const slot = !item && e.target.closest && e.target.closest(".scard");
        if (item && !item.classList.contains("preseat")) {
          kind = "deck"; src = item; id = item.dataset.id;
          if (!id || !inLisst(id) || !BOARD_INDEX[id]) return;
        } else if (slot && !slot.classList.contains("lisst-card") && !slot.classList.contains("indeck")) {
          if (mob) return;
          kind = "shop"; src = slot;
          const ch = slot.querySelector(".fc-list[data-id]");
          id = ch && ch.dataset.id;
          if (!id || inLisst(id) || !BOARD_INDEX[id]) return;
        } else return;
      }
      e.preventDefault();   /* no text selection / native img drag under the press */
      drag = { id, kind, src, fromLb, mobLb: mob && fromLb,
               liftAt: mob && !fromLb ? DRAG_TUNE.touchTh : DRAG_TUNE.threshold,
               px: e.clientX, py: e.clientY, lpx: e.clientX, lpy: e.clientY,
               downX: e.clientX, downY: e.clientY, vx: 0, vy: 0, tilt: 0, scale: 1,
               active: false, pointerId: e.pointerId, raf: 0, t: performance.now() };
      /* the sheet hold: the lift arms on TIME, not travel */
      if (drag.mobLb) drag.pendHold = setTimeout(() => {
        if (drag && drag.pendHold) dragLift();
      }, DRAG_TUNE.holdMs);
      /* THE PATIENT GRAB (Dylan, 2026-08-08: "if you hold click for more
         than a second, trigger the grab"): desktop arms on time as well
         as travel — a still press past holdLiftMs lifts without the
         smidge of movement the threshold used to demand. Travel past
         the threshold still lifts first (dragLift clears the timer);
         a quick click releases under it (dragEnd clears it) and stays
         a click. Unlike the sheet hold, movement never CANCELS this
         one — under 6px it's jitter, over 6px it's the lift itself. */
      else if (!mob) drag.deskHold = setTimeout(() => {
        if (drag && drag.deskHold && !drag.active) dragLift();
      }, DRAG_TUNE.holdLiftMs);
    });
    document.addEventListener("dragstart", e => { if (drag) e.preventDefault(); });
    function dragLift() {
      const d = drag;
      if (d.pendHold) { clearTimeout(d.pendHold); d.pendHold = null; }
      if (d.deskHold) { clearTimeout(d.deskHold); d.deskHold = null; }
      buzz(15);   /* the grab, in the hand as well as on screen */
      /* a lifted card travels top-up: the fly copies texts, and the spring
         home must land on the face the slot shows. lb-GRABS ONLY — .canflip
         lives on lbCard and nowhere else (rendered cards ship one face), so
         the grid-source half of this was dead and went with the 2026-08-01
         sweep. This half is not: it resets a flipped lightbox card that gets
         dragged out of its inspection. */
      if (d.fromLb && lbCard.classList.contains("canflip")) setFlip(lbCard, false, true);
      const { ci, b, k } = BOARD_INDEX[d.id];
      /* the fly is born from the card under the hand — for an lb grab
         that's the big inspection card itself (measured BEFORE the lb
         releases) */
      const fromCard = d.fromLb ? lbCard : d.src;
      const srcPanel = fromCard.querySelector(".panel") || fromCard;
      const pr = srcPanel.getBoundingClientRect();
      const built = buildFly(fromCard, ci, b, k, d.id);
