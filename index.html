    display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
    color: #fff;
  }
  body.light #lb .lbhead .lbh-chip { color: #000; }
  .lbhead .lbh-tag { font-size: 36px; letter-spacing: .1em; }
  /* 20px → 13px (2026-08-19): the counter is TIED TO THE LIFTED MINI now
     (his ask: "sits right above the mini. same width as the mini card or
     close"), and a 20px line was nearly twice the popped mini's 54px. At
     13px "7 / 19" measures ~59 — the "or close" — so it reads as that
     card's label instead of a banner over the sheet. The tag line is
     display:none here, so this is the whole header. */
  .lbhead .lbh-pos { font-size: 13px; letter-spacing: .16em; opacity: .62;
    /* NOWRAP IS LOAD-BEARING: the box is the popped mini's width (53.6) and
       "7 / 19" measures ~59, so without it the line breaks after the slash
       and the counter becomes two stacked rows. It overhangs ~3px each side
       instead, centred and pointer-events:none — nothing to collide with,
       and the box stays honestly tied to the mini. */
    white-space: nowrap; }
  /* THE TAG RETIRED TO THE STRIP (2026-08-12, Dylan: "remove the HS03 id tag
     that was tied to our position counter ... the new card row can take its
     place"): the collection strip above carries the board's identity now —
     the popped mini's own corner chip prints the same refOf string — so the
     header keeps only the position line. HIDDEN, not deleted: setHead still
     writes the tag spans (one write path, both paths agree by construction)
     and headSwap's tag-number choreography simply has nothing to show. */
  #lb .lbhead .lbh-tag { display: none; }

  /* ---- THE TWO NUMBERS COUNTER-ROTATE THROUGH A SHUFFLE ----------------
     Dylan, 2026-08-01: "lets have the HS number exit up and enter right to
     left. and the 4 in '4 / 14' exit down and enter left to right. make the
     animation start on card swap and end on new card land."

     So the board number leaves UP and arrives from the RIGHT; the position
     number leaves DOWN and arrives from the LEFT. Opposed on both axes, which
     is what stops the pair reading as one block sliding — they are two facts
     changing, not one label being replaced.

     ONLY THE NUMBERS MOVE. The prefix ("HS") and the total ("/ 14") are
     constant inside a collection — the deck's ends CLAMP rather than wrap, so
     a shuffle can never cross into another collection — and animating a
     character that is not changing would be motion with nothing behind it.

     THIS DOES NOT REOPEN THE STATIC RULING ("the counter fades between card
     rotations, lets make it static"). What he killed was the whole header
     blinking out and back on its opacity transition. The header block itself
     still does not move, does not fade, and does not reflow; the digits
     inside it change with a gesture. Different object, different verb.

     Displacement is em so it tracks each number's own size (the 36px board
     number travels further than the 20px position number, proportionally the
     same distance), and both are inline-block because transforms do not apply
     to inline boxes. */
  /* THE STATIC PARTS HOLD STILL (Dylan, 2026-08-01: "lets make HS and 14 both
     static ... the movement there is slightly jarring"). They were never
     animated — they were being REFLOWED. The line is centred, so a number
     going 18 -> 4 narrows it and drags "HS" and "/ 14" sideways to re-centre,
     and because the two lines are at different sizes they dragged by
     different amounts, which is what read as uncoordinated.

     Fixed-width slots fix it at the source: reserve two digits and centre the
     value inside, so the changing number never changes the line's width. The
     label font is monospace, so 1ch IS the digit advance — but CSS puts a
     letter-space after EVERY character including the last, so N digits occupy
     N*(1ch + tracking) and the slot needs 2 of each. The tracking differs per
     line (.1em on the tag, .16em on the position), hence the two values.
     Two digits covers the inventory with room (the highest ref is CL 27, the
     largest collection is 19); a three-digit board would want 3ch here. */
  .lbh-num, .lbh-cur { display: inline-block; text-align: center; }
  .lbh-num { min-width: calc(2ch + .2em); }
  .lbh-cur { min-width: calc(2ch + .32em); }
  .lbhead.swapping .lbh-num { animation: hnumOut var(--hout, 170ms) ease-in both; }
  .lbhead.swapping .lbh-cur { animation: hcurOut var(--hout, 170ms) ease-in both; }
  .lbhead.swapped .lbh-num { animation: hnumIn var(--hin, 250ms) var(--hease) both; }
  .lbhead.swapped .lbh-cur { animation: hcurIn var(--hin, 250ms) var(--hease) both; }
  @keyframes hnumOut { to { transform: translateY(-.5em); opacity: 0; } }
  @keyframes hcurOut { to { transform: translateY(.5em);  opacity: 0; } }
  @keyframes hnumIn  { from { transform: translateX(.66em);  opacity: 0; } }
  @keyframes hcurIn  { from { transform: translateX(-.66em); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .lbhead.swapping .lbh-num, .lbhead.swapping .lbh-cur,
    .lbhead.swapped .lbh-num, .lbhead.swapped .lbh-cur { animation: none; }
  }
  /* THE PHONE HEADER JOINS THE CHROME (2026-08-07, Dylan — the 15 Pro sim
     side-by-side: "git rid of the CL 04 up top and move the position counter
     top left opposite of close and give the whole inspection some room").
     The TAG is a duplicate on a phone: the card's own corner chip prints the
     same refOf string — the never-disagree law is exactly what makes it safe
     to drop — and it was charging ~70pt of sheet the card needed (the header
     room pass pushed the card's bottom row below the fold on 852pt phones;
     the 17's 874 sat just above the tip point, which hid it in that sim).
     The POSITION is the one fact the card doesn't carry, so it alone stays:
     FIXED top-left, CLOSE's mirror seat — chrome now, not a card label, so
     the pair frame the sheet and neither rides the scroll. deckGeom stands
     down under 720 (H forced 0: no headroom pass, no inline top write) and
     the card takes the room back through its own margin:auto. Desktop keeps
     the 08-01 stacked header and its counter-rotation untouched; the
     position number's own down/left swap still plays here. */
  /* THE PHONE COUNTER IS GONE (2026-08-12 evening, Dylan's strip react:
     "remove the number indicator out of the top left") — the strip does the
     wayfinding on phones now, so the fixed top-left n/N was saying the same
     thing twice; CLOSE holds the chrome row alone. Hidden, not unwired: the
     setHead/lbhCur writes keep running (one write path law — desktop shares
     them), which is safe because headSwap's cleanup has a timeout fallback
     beside its animationend (a hidden element never fires the event). */
  @media (max-width: 720px) {
    /* must match the show rule's compound selector — a plain #lb .lbhead
       loses to body[data-lb="deck"] #lb.fv3 .lbhead on specificity and the
       counter comes back (bitten on first cut); same selector, later in
       source, wins the tie */
    body[data-lb="deck"] #lb.fv3 .lbhead { display: none; }
  }

  .lbnb {
    position: absolute; z-index: 0; display: none; cursor: pointer;
    opacity: 0; transition: opacity .4s ease .2s, transform .4s cubic-bezier(.22,1,.36,1);
  }
  body[data-lb="deck"] #lb.fv3 .lbnb.live { display: block; }
  #lb.in .lbnb.live { opacity: var(--nbfade, .5); }
  #lb:not(.in) .lbnb { transition: opacity .1s ease; }
  /* a neighbour is a QUIET object: the card inside it takes no pointer, so
     none of the delegated hover choreography fires and its +List chip is not
     a live button (a neighbour add is undesigned). The click is the wrapper's,
     and it means "step to this board". */
  .lbnb > * { pointer-events: none; }
  @media (hover: hover) {
    /* the lean answers the hover by pointing at the hero seat */
    #lb.fv3 .lbnb.live:hover {
      opacity: var(--nbhov, .62);
      transform: translate(var(--nbx, 0px), var(--nby, 0px));
    }
  }
  /* exchange actors: clones rendered at the hero's width and transform-mapped
     onto their seats. origin 0 0 makes translate+scale an exact box mapping;
     they are inert (the real elements own every interaction). */
  .lbnb.xact { transform-origin: 0 0; pointer-events: none; }
  /* end of the collection: the arrow drops to the house .22 faint and stops
     taking clicks. It reads as spent rather than absent (a live affordance
     never plays dead, the end is STATED). Three classes so it outranks the
     #lb.in reveal at any source order. */
  #lb.fv3 .lb-deknav.off { opacity: .22; pointer-events: none; }

  /* ---- THE COLLECTION STRIP (2026-08-12, the strip-lab port) --------------
     Every board in the collection strung as mini cards above the counter —
     the deck header's wayfinding done graphically (Dylan's mockup, built in
     redesign/strip-lab.html — vault repo; knobs + legend at STRIP_TUNE in the JS).
     Minis are the REAL fv3 template rendered at the 232 REFERENCE width and
     transform-scaled down — lockCardScale's trick (true reductions that duck
     minimum-font clamps), and the one-spec law: a second mini card spec
     would drift. They are QUIET objects like the neighbours: every pointer
     job lives on ONE static lane (the moving-hitbox law — a raised card must
     never be its own hover target, and the lane pads by the popped end
     card's overhang so riding its shoulder can't release it). THE RIFFLE:
     sweeping the lane raises the card under the cursor in the SEAT grammar —
     the raised card sits fully before the next lifts, one card up at a time
     by construction (Dylan's pick over the clearance-gap variant: "not worth
     the space, doesnt deserve the ceremony") — click jumps to the board,
     cursor-off hands the pop back to the inspected one. Desktop-only:
     dockActive stands the whole organ down (phone wayfinding is the swipe
     plus the counter). Deck-held boards get NO slot and NO ghost (his
     2026-08-11 ruling — the deck literally holds the card); the counter
     number-jumps over them because positions belong to the full collection. */
  .lbstrip {
    position: absolute; left: 0; right: 0; top: 0; height: 0;
    z-index: 3; display: none;
    opacity: 0; transition: opacity .4s ease .18s;
  }
  /* BOTH SIDES NOW (2026-08-12 evening, Dylan: "the minis up top" on the
     phone too) — the 941 media gate retired with the desktop-only rule it
     enforced; the boundary listener re-poses across a crossing and each
     side seats itself (desktop off the header line, phone off the chrome
     row — see placeStrip's phone branch). */
  body[data-lb="deck"] #lb.fv3 .lbstrip { display: block; }
  #lb.in .lbstrip { opacity: 1; }
  #lb:not(.in) .lbstrip { transition: opacity .1s ease; }
  .lbsmini {
    position: absolute; top: 0; left: 0; width: 232px;
    transform-origin: 50% 100%;
    transition: transform var(--sdur, 360ms) cubic-bezier(.22,1,.36,1),
                opacity var(--sdur, 360ms) cubic-bezier(.22,1,.36,1);
  }
  .lbsmini, .lbsmini * { pointer-events: none; }
  .lbsmini.held { display: none; }   /* deck-held: the slot closes, no ghost */
  /* THE DRESS CAME OFF AGAIN (2026-08-12 same day, Dylan on the deployed
     look: at 46px BOTH chip bars show on every card — the lab's clean
     one-bar-per-flank read needed more overlap than the site has — so the
     minis rest UNDRESSED, matching the flanking cards' rest state. The
     rest-dress pass lives in vault repo history, 6d42983, if the marker
     idea returns. */
  /* SITE-SCALE LEGIBILITY (2026-08-12, Dylan vs the lab side by side: "the
     tops of the cards are hard to see ... increase the board to card size
     ratio, make the borders a little stronger"): a pure photographic
     reduction puts the big card's 1.5px edge at a THIRD of a pixel at
     46px wide, and white card tops vanish into white neighbours. STRIP
     COSTUME ONLY — the big card's spec is untouched; values are cqw (still
     photographic across the strip's own sizes) at the lab minis' own
     proportions: a 1px edge at 46 = 2.1552cqw. */
  .lbsmini .panel { border-width: 2.1552cqw; }
  .lbsmini .inframe::before, .lbsmini .inframe::after { border-width: 2.1552cqw; }
  .lbsmini .stage img, .lbsmini .frame img { max-height: 93%; max-width: 92%; }
  /* the pop handoff's two phases carry their own clocks (stripTo writes the
     vars per gesture: a PRESS splits the exchange's xDur like the counter's
     numbers — land WITH the card — while the hand keeps the lab clock).
     Source order is the law here: same specificity, later phase wins while
     both classes are on — hovlive < sitting < lifting. */
  .lbstrip.hovlive .lbsmini { transition-duration: var(--shd, 400ms); }
  .lbstrip.sitting .lbsmini { transition-duration: var(--ssit, 250ms); }
  .lbstrip.lifting .lbsmini { transition-duration: var(--slift, 400ms); }
  /* the lane rides both sides too — on touch its pointermove/click pair is
     tap-to-jump for free (a tap fires one move, then click; the lifted
     finger's synthetic pointerleave clears the focus — the menu gotcha,
     working FOR us here). touch-action stays default: vertical stays the
     sheet's. */
  /* touch-action none: the band scrub owns the whole move stream (the
     #lb-card precedent) — the band is chrome, a sheet scroll never needs
     to START on it; mouse is untouched */
  .lbs-lane { position: absolute; z-index: 4; cursor: pointer; display: none;
              touch-action: none; }
  body[data-lb="deck"] #lb.fv3 .lbs-lane { display: block; }
  /* THE STRIP'S CHROME (2026-08-17, the screen-recording pass — "mini
     cards were almost out of frame and didnt read as swipe-able"):
     phone-only (≤720, the below-card band's own boundary). Arrows flank
     the lane and step ONE board — the card swipe's verb through step(),
     ends at the .22 faint (the .lb-deknav law). Below the band, the
     LINE—DOT—LINE: the dot rides under the current board's mini. It
     tracks a scrub RAW (no transition — the finger owns it) and GLIDES
     on a press (.glide, stripTo's stamp) so an arrow step never pops it
     spot to spot. Every box is placeStrip's, same as the lane. */
  .lbs-arr {
    position: absolute; z-index: 4; display: none;
    align-items: center; justify-content: center;
    width: 34px; height: 48px;
    background: none; border: 0; padding: 0; margin: 0;
    color: #fff; cursor: pointer;
    opacity: 0; transition: opacity .25s ease .12s;
  }
  body.light .lbs-arr { color: #000; }
  .lbs-arr svg { display: block; width: 11px; height: 18px; overflow: visible; }
  .lbs-arr path { fill: none; stroke: currentColor; stroke-width: 2.5px;
                  stroke-linecap: butt; stroke-linejoin: miter; }
  .lbs-prog { position: absolute; z-index: 3; display: none; height: 5px;
              color: #fff; pointer-events: none;
              opacity: 0; transition: opacity .25s ease .12s; }
  body.light .lbs-prog { color: #000; }
  /* the line—dot—line rides BOTH costumes (2026-08-19); the arrows stay
     the phone's, since desktop steps from the on-card nav chevrons */
  body[data-lb="deck"] #lb.fv3 .lbs-prog { display: block; }
  @media (max-width: 720px) {
    body[data-lb="deck"] #lb.fv3 .lbs-arr { display: flex; }
  }
  #lb.in .lbs-arr, #lb.in .lbs-prog { opacity: 1; }
  #lb.in .lbs-arr.off { opacity: .22; }
  /* THE DOT AND THE GAP ARE ONE VALUE, NOT THREE ANIMATIONS (2026-08-19,
     his catch: "the dot can out pace the gap in the line ... both have a
     jutter while swipping through the minis").

     THE BUG: --px fed three separate transitions — the dot's `transform`,
     segment A's `width`, segment B's `left`. A transform transition is
     handed to the COMPOSITOR; width and left are main-thread LAYOUT. One
     clean travel kept them locked (measured 9.00–9.02px of gap the whole
     way), but the riffle RETARGETS on every slot crossing, and on each
     interruption the three restart from whatever each one currently reads —
     which is not the same instant for a composited property as for a laid
     out one. The error accumulates: a two-pass scrub measured the gap
     drifting 41.6px, the dot ending up clean past the break in its own line.

     THE FIX: register --px so it is INTERPOLATABLE, and transition the
     custom property itself on the parent. Now there is ONE animation and
     the dot and both segments are plain readers of the same number every
     frame — they cannot disagree, no matter how often it is retargeted,
     because they are no longer racing. (Registration is also what makes
     descendants reliably invalidate in Chromium — the standing lesson from
     drop-lab's `@property` gotcha, arrived at from the other direction.)

     THE CURVE WAS TESTED AND KEPT. The theory was that an ease-OUT starts
     at its highest speed, so each retarget would lurch — and that a gentle
     onset would chain more smoothly. Measured across a 16-step scrub, the
     opposite: a near-zero onset (.45,0,.35,1) never builds speed under
     constant retargeting and the dot crawls 22px while the row travels
     490 — it simply stops following. Softer ease-outs (.3,.55,.35,1 and
     quad) followed but stepped LESS evenly than the original. The shipped
     cubic-out both follows best (321px travelled, 165 lag) and has the
     smallest step-to-step change of the four. The race was the judder;
     the curve was never the problem. Do not re-walk this ladder. */
  @property --px {
    syntax: "<length>";
    inherits: true;
    initial-value: 0px;
  }
  .lbs-prog .lp, .lbs-prog .lpd { position: absolute; top: 50%; background: currentColor; }
  .lbs-prog .lp { height: 1.5px; margin-top: -.75px; }
  /* the segments break at the dot — 9px of air each side, the divider read */
  .lbs-prog .lp.a { left: 0; width: max(0px, calc(var(--px, 0px) - 9px)); }
  .lbs-prog .lp.b { left: min(100%, calc(var(--px, 0px) + 9px)); right: 0; }
  .lbs-prog .lpd { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
                   border-radius: 50%; left: 0;
                   transform: translateX(var(--px, 0px)); }
  /* ONE transition, on the value itself — the dot and both segments follow */
  .lbs-prog.glide { transition: --px .6s cubic-bezier(.22,1,.36,1); }
  /* the riffle's trail is dotAim's frame loop now, not a transition —
     see its comment in the JS for why a tween cannot chase a moving
     target. Only the press keeps a stated clock. */
  @media (prefers-reduced-motion: reduce) {
    .lbsmini { transition: none; }
    .lbs-prog.glide { transition: none; }
  }

  /* ---- THE DECK NAV (2026-08-16 A/B, supersedes the on-card build;
     re-seated same day on his react) ---------
     Plain chevrons perched just ABOVE each flanker's inner top corner —
     no seat, no fill, no gesture: the chevron IS the control, and it
     answers ITS card (the diagonal deck means the two ride at different
     heights). Boxes written by placeDeck off deckGeom (the flanks' own
     source, so a knob change moves both). Ink per ground: white on the
     dark ground, ink on light — the .lbh-chip law. z 1 with the card:
     they sit in the flanks' own air, never on the hero, and #carfront
     (z 2, later in source) keeps the flip legs riding over everything. */
  .lb-deknav {
    position: absolute; z-index: 1;
    background: none; border: 0; padding: 0; margin: 0;
    color: #fff; cursor: pointer;
    opacity: 0; transition: opacity .25s ease .12s;
  }
  body.light .lb-deknav { color: #000; }
  #lb.in .lb-deknav { opacity: 1; }
  .lb-deknav svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .lb-deknav path { fill: none; stroke: currentColor; stroke-width: 3px;
                    stroke-linecap: butt; stroke-linejoin: miter; }
  /* the hover thickens the stroke — the tighten's quiet cousin; a
     hover-without-click must not answer as loudly as a click */
  @media (hover: hover) { .lb-deknav:hover path { stroke-width: 4.5px; } }
  /* touch arrival (.tset, applied by openLb under the dock gate): the tap IS
     the hover — chip fills wipe in and the rails close while the card zooms,
     so it settles into the decoded state instead of arriving unfilled */
  #lb.fv3 .lb-card.tset .fc-ref::before { transform-origin: left center; animation: chipwipe .44s ease .22s forwards; }
  /* the deck chip's fill pulls RIGHT→LEFT from the card's edge (2026-08-13
     round 5, Dylan: "start from the right of the card and pull left" —
     reversing the 2026-08-08 L→R mark-grab choreography, retired to git
     with the mark itself; the chip is flush right, so the origin IS the
     card's edge): tset is dock-gated by construction, so this IS the
     mobile rule — no extra gate needed. ADD decodes in via dockDress on
     the same beat. */
  #lb.fv3 .lb-card.tset .fc-list::before { transform-origin: right center; animation: chipwipe .44s ease .22s forwards; }
  #lb.fv3 .lb-card.tset .fchip :is(.ft, .fscript) { color: #fff; transition: color .2s ease .44s; }
  #lb.fv3 .lb-card.tset .inframe::before, #lb.fv3 .lb-card.tset .inframe::after { height: calc(50% - 6px); height: calc(50% - 2.5862cqw); }
  /* THE BOARD LIFT (2026-08-08 evening, Dylan: "half way through [the
     fill + inner-edge draw] the board starts to lift slowly to light
     box inspection's extra height and shadow") — the desktop hover
     grow's RESTING translation for a cursorless screen: same 1.07 and
     the same deeper throw as the (hover:hover) rule above, but arriving
     as a state, on its own slow ease, half way through the dress
     (dockDress arms it at 440ms — see the token there). The var
     composes with --face, so the flip carousel is untouched. */
  #lb.fv3 .lb-card.blift .frame img {
    --bgrow: 1.07;
    filter: drop-shadow(11px 14px 0 rgba(0, 0, 0, .3));
    filter: drop-shadow(4.7414cqw 6.0345cqw 0 rgba(0, 0, 0, .3));
    transition: transform .8s ease, filter .8s ease;
  }
  /* the un-dress SNAP (2026-08-08, Dylan's catch: the lb rails played
     closed → open → closed across an arrival — the card still wore the
     LAST inspection's tset when it came back on screen, and shedding it
     visible let the rails' base transition play the teardown mid-flight).
     One frame of muted transitions on the DRESS SURFACES while tset comes
     off, so the card is simply AT REST when it shows. Descendants only,
     never the card node itself — the slide's transform transition lives
     there and must survive the same beat. */
  #lb.fv3 .lb-card.snap0 *, #lb.fv3 .lb-card.snap0 *::before, #lb.fv3 .lb-card.snap0 *::after { transition: none !important; }
  /* THE SOFT RETURN (2026-08-08 evening, Dylan: "on the phone it should be
     more fluid" — desktop's snap + sounds stay, the phone close becomes
     three staggered LINEAR ramps). .softout is .snap0's slow sibling:
     where the snap mutes the dress teardown to nothing, this stretches it
     across the return flight and past the landing. closeLb adds it and
     sheds .tset in the SAME beat, so every dress property glides from its
     held value — the fills un-wipe (the armed transform transition picks
     up from the forwards-held scale the moment the animation leaves the
     cascade), chip text ramps back to ink, the rails re-open to their
     gap, the deck mark's shadow re-flips. His three clocks: the ambient
     throw is GONE by half the flight (.215s); the page's opacity is back
     to full AT touchdown (.43s, body.softret below); the dress finishes
     half a second AFTER the landing (.93s) — which is why the fly stays
     parked on the slot until 930ms and the real card only takes over once
     the drain has left the fly at rest (rest == rest, no seam at the
     swap). The landing is SILENT — no press, no kclick (his follow-up:
     "bounce and sound should both go"; the slide exchange set the
     phone's dialect). Descendants only, the .snap0 law — the card node's
     own transform transition IS the flight and must not be touched. */
  /* the fills DRAIN BY ANIMATION, not transition — an animation-held
     value does not hand off to a transition on class removal (verified:
     the fill snapped to scaleY(0) in the first frame), but a NEW
     animation starting at the held pose does. chipdrop is the house
     exit and already draws exactly this drain — run slow. */
  #lb.fv3 .lb-card.softout .fc-ref::before,
  #lb.fv3 .lb-card.softout .fc-list::before { animation: chipdrop .93s linear forwards; }
  #lb.fv3 .lb-card.softout .fchip :is(.ft, .fscript) { transition: color .93s linear; }
  /* (the retired +'s drain rule left with the + — round 5; the ADD text
     rides the .ft color ramp above, and the mark's .sh flip below only
     ever mattered where the mark shows) */
  #lb.fv3 .lb-card.softout .fc-list .fscript .sh { transition: transform .93s linear; }
  #lb.fv3 .lb-card.softout .inframe::before,
  #lb.fv3 .lb-card.softout .inframe::after { transition: height .93s linear; }
  #lb.fv3 .lb-card.softout .find,
  #lb.fv3 .lb-card.softout .fst .sttxt { opacity: 0; transition: opacity .93s linear; }
  /* the board settles out of its lift on the same drain clock — blift
     comes off with tset, and the img's declared values glide home */
  #lb.fv3 .lb-card.softout .frame img { transition: transform .93s linear, filter .93s linear; }
  #lb.fv3 .lb-card.softout .panel {
    /* the hard offset slab is the card's BODY and stays verbatim — only
       the ambient throw's alpha drains, so the interpolation never
       touches the first layer */
    box-shadow: 7px 9px 0 -1px rgba(0, 0, 0, .85), 0 34px 90px rgba(0, 0, 0, 0);
    box-shadow: 3.0172cqw 3.8793cqw 0 -.431cqw rgba(0, 0, 0, .85), 0 34px 90px rgba(0, 0, 0, 0);
    transition: box-shadow .215s linear;
  }
  body.softret #home, body.softret #colpage { transition: opacity .43s linear; }
  /* flight hold (.hold, applied by closeLb): an Esc/scrim close with the
     pointer still on the card would un-match :hover mid-flight and snap
     the chrome off in the air. These rules MIRROR the :hover values
     VERBATIM — gaining .hold while still hovered changes no computed
     value, so nothing restarts (a different animation shorthand, even
     just a delay, would blink the fills).
     .redress SHARES this ruleset on purpose (2026-08-01, the rotate
     landing): it is the same job from the other end — a class supplying
     the hover build without the cursor. deckExchange adds it in the
     landing frame so the arriving hero plays the ENTIRE entry (rails via
     the base .56s transition, fills from scaleY(0), colour ramps) exactly
     as the old under-cursor redraw did; a cursor that IS on the card at
     the reveal computes the same values through :hover, so the build
     plays once either way. One selector list, two names — a separate
     copy could drift, and any computed difference blinks (the law above). */
  @media (hover: hover) {
    #lb.fv3 .lb-card:is(.hold, .redress) .fc-ref::before { transform-origin: left center; animation: chipwipe .44s ease forwards; }
    #lb.fv3 .lb-card:is(.hold, .redress) .fc-list::before { transform-origin: right center; animation: chipwipe .44s ease forwards; }
    #lb.fv3 .lb-card:is(.hold, .redress) .fchip :is(.ft, .fscript) { color: #fff; }
    #lb.fv3 .lb-card:is(.hold, .redress) .inframe::before, #lb.fv3 .lb-card:is(.hold, .redress) .inframe::after { height: calc(50% - 6px); height: calc(50% - 2.5862cqw); }
  }
  /* THE LB DRESS REGIME (2026-08-01, settled over three of Dylan's calls).
     .stay (JS gate, whole inspection): the delegated decode handlers skip
     the card both ways — no re-decode on entry, no .left drain on exit —
     and the board is the ONLY hover answer left (grow, panel shadow, sun).
     .dressed (from COLLECTIONS): the source card wore the landed chrome
     under the cursor at the click, so the lb card arrives ALREADY DRAWN —
     negative delay renders every fill pre-finished from frame one (the
     .bay-fly.held idiom) and transitions are cut so nothing fades in over
     the carried state. Outranks the :hover mirrors by specificity, so
     hover on/off changes no computed value and nothing can restart.
     .redress (each ROTATE landing, rules shared with .hold above): the
     arriving hero was never drawn — it plays the ENTIRE entry build from
     the reveal frame, cursor or no cursor.
     TEXTS are stayLand() in JS: only reads that differ from the landed
     targets decode, which makes the from-collections open silent (texts
     rode over) and every rotate landing a full decode (populate just
     reset them to print). */
  @media (hover: hover) {
    #lb.fv3 .lb-card.dressed .fc-ref::before { transform-origin: left center; animation: chipwipe .44s ease -.44s forwards; }
    #lb.fv3 .lb-card.dressed .fc-list::before { transform-origin: right center; animation: chipwipe .44s ease -.44s forwards; }
    #lb.fv3 .lb-card.dressed .fchip :is(.ft, .fscript) { color: #fff; transition: none; }
    #lb.fv3 .lb-card.dressed .inframe::before, #lb.fv3 .lb-card.dressed .inframe::after { height: calc(50% - 6px); height: calc(50% - 2.5862cqw); transition: none; }
    /* the chip-hover accent rung retired here too (2026-08-08 late, with
       the grid's) — the lb chip answers the aim like every chip: shadow
       flip + the ADD+ decode. The delegated chip handlers reach
       #lb-fv3-list because the lb card is a .d7f like any other. */
    /* (.navdraw retired with the on-card nav build, 2026-08-16 A/B — the
       deck nav is standing chrome; the class adds in JS stay, inert) */
  }

  /* the landing: the close flight ends like a button press. .landpress rides
     the panel/frame so card, board, and BOTH shadows compress in one transform
     — depth motion only, no ink dynamics (the card-shadow law). The press IS
     the landing now; the LAND row's pad/flash flourishes retired 2026-07-26. */
  @keyframes landpress {
    0% { transform: scale(1); }
    38% { transform: scale(.965); }
    100% { transform: scale(1); }
  }
  .landpress { animation: landpress .22s cubic-bezier(.33, 0, .36, 1); }
  /* re-stack settle (2026-07-24): a survivor sliding up to its new
     shelf presses into the seat — the landpress at half voice (the
     exit flight owns the loud part of a removal) */
  @keyframes reseatpress {
    0% { transform: scale(1); }
    45% { transform: scale(.985); }
    100% { transform: scale(1); }
  }
  .reseat .panel { animation: reseatpress .18s ease; }
  #lb.fv3 .lb-prev, #lb.fv3 .lb-next { display: none; }
  /* width-only per the WIDTH RULING: ≤940 has no flanks (renderNeighbors
     stands down under dockActive) so there are no gaps to seat arrows in —
     the phone keeps the swipe. Wide-touch iPads KEEP these: unlike the old
     hover-built nav they are visible at rest, so tappable is honest. */
  @media (max-width: 940px) { #lb.fv3 .lb-deknav { display: none; } }
  #lb.fv3 .lb-card .frame img { transition: transform .3s ease, filter .3s ease; }
  @media (hover: hover) { #lb.fv3 .lb-card:hover .frame img {
    transform: scale(1.08);
    filter: drop-shadow(11px 14px 0 rgba(0, 0, 0, .3));
    filter: drop-shadow(4.7414cqw 6.0345cqw 0 rgba(0, 0, 0, .3));
    transition: transform .94s ease, filter .94s ease;
  } }
  /* while the lb sun is live it owns the img's WHOLE pose — shadow (filter)
     AND transform (the gravity pull composes with the 1.08 grow, and a
     transition restarted every pointermove trails the hand) — so nothing
     transitions; the JS lerps do all easing. The :hover grow above still
     serves reduced-motion and the pre-takeover instant. */
  #lb.fv3 .lb-card.suntrack .frame img { transition-property: none; }
  /* THE PINCH'S STAGE (2026-08-17 — the board-only zoom): per-frame writes
     ride muted transitions (suntrack's touch cousin), and the panel's
     load-bearing clip OPENS for the session so the lifted board can
     outgrow the card under the fingers — the clip returns at release.
     The parked flip face stays hidden through it: its z−1 rides paint
     order against the panel's background, not the clip. */
  #lb.fv3 .lb-card.pzoom .frame img { transition: none; }
  #lb.fv3 .lb-card.pzoom .panel { overflow: visible; }
  /* ---- UNDERSIDES: the lb card runs the CAROUSEL (the behind-the-back
     switch — lb-only, it needs the lateral room). Dylan's landed sketch
     (re-drawn 2026-07-26 — the lab's symmetric far-station excursion
     was code drift, not the pick): the OUTGOING rides off center across
     the face IN FRONT, whole, fully outside the LEFT border, layer-flips
     out there, and is swallowed back in behind to a parked sliver; the
     INCOMING appears FROM BEHIND — it slides rightward hidden behind
     the card, emerges progressively through the RIGHT border (the
     border is the reveal; the sketch's half-out pose), swings around
     the edge, and rides in front over the face straight to center. One
     continuous sweep each, no far-side station, NO clip wipes (the
     round-7 misdiagnosis). The flipbox here is display:contents — no
     box, no stacking context, so the preserve-3d trap can't exist and
     the grid kick's .stage-scoped rules never reach it. THE LEGS RIDE
     OVERLAYS (2026-07-26): Dylan's live Chrome clipped in-card legs at
     the card box no matter what — every primitive passed isolated
     headless probes on his exact binary, so the clip only exists on
     the live composited page (stale-clip/raster-cull family, root
     cause never pinned) — so the traveling pixels live OUTSIDE the
     card subtree: clone faces in #carback (under the card z1 — the
     opaque card itself swallows, plain painter's order) and #carfront
     (over it), visibility-swapped mid-keyframe at the layer-change
     beats. No overflow window (the panel keeps its load-bearing hidden
     overflow full-time), no z-index inside keyframes, nothing under a
     clipping ancestor. The REAL faces hide for the 1.05s (the #lb.caring
     rule) and take back over at landing (.fset); only the resting
     parked pose still uses the z−1-behind-panel trick — static, and
     probe-verified fine on his build. */
  #lb #lb-bot { display: none; }
  #lb.fv3 { overflow-x: hidden; }   /* the legs must never grow the sheet a scrollbar */
  #lb.fv3 .lb-card .frame .flipbox { display: contents; }
  #lb.fv3 .lb-card.canflip #lb-bot { display: block; }
  #lb.fv3 .lb-card .frame .top { z-index: 1; }
  /* rest-state law (round 8): the hidden face RESTS in its parked pose —
     behind the card body, matching carOut's end / carIn's launch, so
     gestures pick it up seamlessly and silhouette diffs can't fringe.
     ALL carousel travel is calc(--carw × factor), NOT cqw: container
     units inside @keyframes silently resolve to nothing on some Chrome
     builds (Dylan's — the invisible saboteur of the whole flip-lab
     carousel loop: faces z-swapped in place with zero travel while
     other builds showed full flight). setFlip feeds --carw the panel's
     measured px width at every gesture; the 430px fallback only ever
     serves the parked pose, which hides behind the panel regardless. */
  #lb.fv3 .lb-card.canflip:not(.flipped):not(.unflipped) .frame .bot {
    transform: translateX(calc(var(--carw, 430px) * -.06)) scale(.46); z-index: -1;
  }
  /* the overlays: positioned over the frame's live rect by setFlip;
     container-type so the clones reuse the card's cqw shadow spec.
     carback z0 sits under the card (z1) — the card swallows; carfront
     z2 rides over. Both display only while the gesture runs. */
  /* DESIGN LAW (Dylan, 2026-07-26): the card + its hard offset shadow are
     ONE OBJECT — the black slab is the card's body, not a ground shadow.
     Back legs paint UNDER both (they emerge from behind the whole unit;
     a slab re-home that put the board between card and shadow split the
     object and was reverted); front legs ride over both. The per-board
     cleared stations are what keep the shadow band from cutting a parked
     pose's neck. */
  .carlay { position: absolute; display: none; pointer-events: none; container-type: inline-size; }
  #carback { z-index: 0; }
  #carfront { z-index: 2; }
  #lb.caring .carlay { display: block; }
  #lb.caring .frame img { visibility: hidden; }   /* the clones perform */
  .carlay img {
    position: absolute; inset: 0; margin: auto;
    max-height: 79%; max-width: 78%; width: auto; height: auto;
    filter: drop-shadow(3.0172cqw 3.8793cqw 0 rgba(0, 0, 0, .3));
    visibility: hidden;
    will-change: transform;
  }
  /* leg assignments: the leaving face runs the OUT track (front copy for
     the ride-off, back copy for the retreat); the arriving face runs the
     IN track (back copy for the emergence, front copy for the ride-in).
     data-car picks which face is which per direction. */
  #lb.caring[data-car="flip"] .ctop.cf { animation: carOutF 1.05s cubic-bezier(.45, .05, .3, 1) both; }
  #lb.caring[data-car="flip"] .ctop.cb { animation: carOutB 1.05s cubic-bezier(.45, .05, .3, 1) both; }
  #lb.caring[data-car="flip"] .cbot.cb { animation: carInB 1.05s cubic-bezier(.45, .05, .3, 1) both; }
  #lb.caring[data-car="flip"] .cbot.cf { animation: carInF 1.05s cubic-bezier(.45, .05, .3, 1) both; }
  #lb.caring[data-car="unflip"] .cbot.cf { animation: carOutF 1.05s cubic-bezier(.45, .05, .3, 1) both; }
  #lb.caring[data-car="unflip"] .cbot.cb { animation: carOutB 1.05s cubic-bezier(.45, .05, .3, 1) both; }
  #lb.caring[data-car="unflip"] .ctop.cb { animation: carInB 1.05s cubic-bezier(.45, .05, .3, 1) both; }
  #lb.caring[data-car="unflip"] .ctop.cf { animation: carInF 1.05s cubic-bezier(.45, .05, .3, 1) both; }
  /* identical transform tracks per pair; the visibility endpoints do the
     layer handoff (discrete visibility flips exactly AT the shared pose,
     so the copies exchange with pixel-identical frames) */
  /* per-segment timing functions keep each leg ONE glide (every keyframe
     boundary re-eases — that read as chop); the outgoing's retreat is
     retimed to linger beside the card through the emergence and retreat
     WHILE the incoming rides in — the lock-step exchange (Dylan) */
  @keyframes carOutF {
    0%    { transform: translateX(0) scale(1); visibility: visible; animation-timing-function: cubic-bezier(.5, .06, .4, 1); }
    42%   { transform: translateX(calc(var(--carox, 280px) * -1)) scale(.62); visibility: visible; animation-timing-function: linear; }
    50%   { transform: translateX(calc(var(--carox, 280px) * -1)) scale(.61); visibility: hidden; }
    100%  { transform: translateX(calc(var(--carw, 430px) * -.06)) scale(.46); visibility: hidden; }
  }
  @keyframes carOutB {
    0%     { transform: translateX(0) scale(1); visibility: hidden; }
    49.99% { transform: translateX(calc(var(--carox, 280px) * -1)) scale(.6101); visibility: hidden; }
    50%    { transform: translateX(calc(var(--carox, 280px) * -1)) scale(.61); visibility: visible; animation-timing-function: linear; }
    70%    { transform: translateX(calc(var(--carox, 280px) * -1 + var(--carw, 430px) * .11)) scale(.57); visibility: visible; animation-timing-function: cubic-bezier(.45, .05, .55, .95); }
    100%   { transform: translateX(calc(var(--carw, 430px) * -.06)) scale(.46); visibility: visible; }
  }
  @keyframes carInB {
    0%    { transform: translateX(calc(var(--carw, 430px) * -.06)) scale(.46); visibility: visible; animation-timing-function: cubic-bezier(.22, .61, .3, 1); }
    62%   { transform: translateX(var(--carix, 280px)) scale(.62); visibility: visible; animation-timing-function: linear; }   /* one glide from behind to the CLEARED pose — past the card and its shadow */
    66%   { transform: translateX(var(--carix, 280px)) scale(.62); visibility: hidden; }    /* around the edge: the front copy takes it */
    100%  { transform: translateX(0) scale(1); visibility: hidden; }
  }
  @keyframes carInF {
    0%     { transform: translateX(calc(var(--carw, 430px) * -.06)) scale(.46); visibility: hidden; animation-timing-function: cubic-bezier(.22, .61, .3, 1); }
    62%    { transform: translateX(var(--carix, 280px)) scale(.62); visibility: hidden; animation-timing-function: linear; }
    65.99% { transform: translateX(var(--carix, 280px)) scale(.62); visibility: hidden; }
    66%    { transform: translateX(var(--carix, 280px)) scale(.62); visibility: visible; animation-timing-function: cubic-bezier(.3, 0, .25, 1); }
    100%   { transform: translateX(0) scale(1); visibility: visible; }                                 /* rides over the face to center */
  }
  /* settled-flipped rest (.fset, added at carIn's landing): static rules
     replace the animation holds — a both-fill would outrank the sun's
     inline writes and pin the visible face against its pointermoves */
  #lb.fv3 .lb-card.flipped.fset .frame .top { animation: none; transform: translateX(calc(var(--carw, 430px) * -.06)) scale(.46); z-index: -1; }
  #lb.fv3 .lb-card.flipped.fset .frame .bot { animation: none; transform: none; z-index: 2; }
  /* the landing press rides the PANEL (pressing the arriving face would
     replace its both-held animation and replay the whole entrance when
     .landed drops); the parked face sits the press out — the transform
     animation makes .panel a stacking context for .22s, which would
     hoist a z−1 leg over its own white */
  /* the flip landing press. This keyframe used to live in the grid kick block;
     when the kick retired 2026-07-26 the lb became its only consumer, so it
     moved here to sit with it. */
  @keyframes flipland { 40% { transform: scale(.982); } }
  #lb.fv3 .lb-card.landed .panel { animation: flipland .22s ease; }
  #lb.fv3 .lb-card.landed.flipped .frame .top,
  #lb.fv3 .lb-card.landed:not(.flipped) .frame .bot { visibility: hidden; }

  /* ================= cart bay (sprint item 2) =================
     A card bay docked to the right screen edge, speaking fv3. At REST
     only the inner frame exists: two rail lines and the mid dot, floating
     on the page ground near the edge — a strange mark, not yet a card.
     On PROXIMITY the drawer starts its slow pull: the inner frame
     converges onto its dot while riding toward center screen; the outer
     frame's top and bottom lines emerge from the page edge and make
     their way to the outside edge; then the outside edge closes
     vertically onto itself (the face connecting echoes the inner
     gesture). The connected card keeps pulling — a slow drawer — until
     the bay is at full size. A CLICK anywhere on the drawer speeds it up
     and locks it in; the inner collapse arrow shuts it quickly; with no
     clicks, leaving lets the drawer slowly shut again. Marks are
     page-colored at rest (bone on black, ink on white) and flip to ink
     as the white body slides beneath them. The card shadow, count chip
     and status dot land with the face connection. +List sends the
     board's cutout flying onto a shelf (or onto the resting dot when
     closed, answered by a dot pulse). fv3 card mode only; hidden on
     touch/mobile.
     PROGRESS-DRIVEN: a JS rAF driver advances one master progress value
     p (0..1) and poses every piece from it each frame. The cursor is the
     motor — p always advances while in the trigger zone, but the RATE
     scales with proximity: parked at the outer bound it's a slow
     continuous crawl that completes on its own; closing the distance
     speeds the playback, so approaching feels like pulling the drawer
     yourself. Threshold classes fire off p (.inked marks-to-ink,
     .shadowed frame-complete → shadow/chip fade, .pulled shelf shadows,
     .fullish collapse arrow). Speed knobs live in the JS driver
     (BAY_TUNE); geometry knobs live here. */
  .bay {
    --bayW: 340px;
    --sliver: 62px;        /* drawer face position when the frame connects */
    --inner-rest: 4px;     /* rail's distance from the screen edge at rest */
    --inner-slide: 46px;   /* how far the inner frame rides toward center */
    --rp: 0;               /* rail-converge progress, written by the driver */
    --fp: 0;               /* face-draw progress, written by the driver */
    /* stage-2 pull-out width — MOST OF THE SCREEN now (Dylan's contact
       spec, 2026-08-03; was the proportional 1.824× case). 48px of page
       stays visible at the left: the drawer is still a drawer. */
    --outW: calc(100vw - 48px);
    /* full-column case (2026-07-22, Dylan annotation): top tucked under
       the live topbar, bottom 12px off the page edge — same width as
       before, so the taller drawer reads proportionally slimmer.
       (Was: top 50% / height 74vh / translateY(-50%).) */
    position: fixed; top: calc(var(--tbh, 0px) + 12px); bottom: 12px;
    right: 0; width: var(--bayW);
    z-index: 5500; pointer-events: none;
  }
  body:not([data-card="framev3"]) .bay { display: none; }
  /* proximity is detected on document pointermove (not an overlay zone —
     an overlay would steal the belt's right-edge scroll acceleration);
     only the true card body captures clicks */
  .bay:not(.locked) .bay-panel { cursor: pointer; }
  /* stage-2 carrier: the pull from connected face to full drawer. The
     panel (stage 1) and the inner frame both ride it, so the connected
     card travels as one piece. All transforms are posed by the driver —
     no transitions on them. */
  .bay-drawer { position: absolute; inset: 0; will-change: transform; }
  /* the body: white fill with only top/bottom frame lines — sliding in
     from the page edge IS those lines making their way to the outside
     edge. The left (outside) edge is drawn separately by .bf-face. */
  .bay-panel {
    /* the case fits its contents now (2026-08-02, v1 item 3): height is
       --caseH (JS-written, driver-eased so the rails move in the same
       frame — a CSS transition here would trail the per-frame rail pose),
       centered on the rails' mid dot. Width is the stage-1 body; the
       stage-2 pull-out (.bay.out) widens it toward page center — width,
       never transform, because the drawer's transforms belong to the
       driver. Shelves + head are right-anchored, so the case's contents
       stay put while the body grows under them. */
    position: absolute; right: 0; width: 100%;
    /* --caseTop is the JS-rounded seat (whole px): a centered calc can
       land the border box on a .5, and at DPR 1 the top-left corner's
       two 1.5px lines then rasterize into different rows (Dylan's
       overlap-nub catch, 2026-08-03 — invisible on the 2x panel, plain
       on the 1x external). The calc is the pre-JS fallback. */
    top: var(--caseTop, calc(50% - var(--caseH, 100%) / 2)); height: var(--caseH, 100%);
    background: #fff;
    border: 0 solid #000; border-top-width: 1.5px; border-bottom-width: 1.5px;
    transform: translateX(calc(var(--bayW) + 10px));   /* parked off-page */
    transition: box-shadow .45s ease, width .45s cubic-bezier(.3, .9, .3, 1);
    box-shadow: -7px 9px 0 -1px rgba(0, 0, 0, 0);
    pointer-events: auto; will-change: transform;
  }
  .bay.out .bay-panel { width: var(--outW); }
  /* the shadow waits for the frame to complete — .shadowed fires off p */
  .bay.shadowed .bay-panel { box-shadow: -7px 9px 0 -1px rgba(0, 0, 0, .85); }
  /* black ground: a black drop is invisible on the page — announce with the
     d5 idiom instead (faint white rim + solid black behind it) */
  body:not(.light) .bay.shadowed .bay-panel {
    box-shadow: -7px 9px 0 -1px rgba(255, 255, 255, .12), -7px 9px 0 0 rgba(0, 0, 0, .9);
  }
  /* the outside edge: two vertical halves closing onto themselves after
     the top/bottom lines arrive — the face connecting, echoing the inner */
  .bf-face { position: absolute; left: 0; top: -1.5px; bottom: -1.5px; width: 1.5px; pointer-events: none; }
  .bf-face::before, .bf-face::after {
    content: ""; position: absolute; left: 0; width: 1.5px; height: 50%;
    background: #000; transform: scaleY(var(--fp));
  }
  .bf-face::before { top: 0; transform-origin: center top; }
  .bf-face::after { bottom: 0; transform-origin: center bottom; }
  /* the inner frame: rails + dot, riding the drawer but sliding on its own.
     Marks are page-colored until the white body slides beneath (.inked). */
  .bay-inner {
    /* resting marks are trimmed ~3/4" top and bottom (82 = 10 + 72);
       the driver grows them back to full card height (10px) when the
       drawer assembles or a board is under inspection (the lean) */
    position: absolute; top: 82px; bottom: 82px; right: var(--inner-rest);
    width: 2px; z-index: 2; pointer-events: none;
    color: #000;
    /* opacity here is stage-2's: the rails are BAY-anchored (driver
       transforms), so the pull-out would strand them mid-panel — they
       dip out with the pull and return with the push-back. Safe on the
       base rule because the driver never writes opacity. */
    transition: color .35s ease, opacity .3s ease; will-change: transform;
  }
  .bay.out .bay-inner { opacity: 0; }
  body:not(.light) .bay-inner { color: var(--bone); }
  body:not(.light) .bay.inked .bay-inner { color: #000; }
  .bay-rail { position: absolute; inset: 0; }
  /* rails converge with --rp: height rides 41% → calc(50% - 6px) */
  .bay-rail::before, .bay-rail::after {
    content: ""; position: absolute; left: 0; width: 2px;
    height: calc(41% + var(--rp) * 9% - var(--rp) * 6px);
    background: currentColor;
  }
  .bay-rail::before { top: 0; }
  .bay-rail::after { bottom: 0; }
  .bay-dot {
    position: absolute; left: -1.5px; top: 50%; width: 5px; height: 5px;
    margin-top: -2.5px; border-radius: 50%; background: currentColor;
    transition: opacity .15s ease .12s;
  }
  /* the dot YIELDS to the close seat (round 5 fix): .bay-inner (z2)
     paints over the panel's subtree — the panel's transform makes it a
     stacking context capped below the rails — so the dot cannot be
     occluded by the button and would print over its chevron. It fades
     on the same .shadowed beat the seat swells in on, timed to vanish
     as the growing seat covers it; the drain reverses both. */
  .bay.shadowed .bay-dot { opacity: 0; }
  /* closed-bay receive: the dot answers the landing */
  /* the independent `scale` property, NOT transform — composes with any
     held transform on the pulsing element. (The bar dots' completion pulse
     retired 2026-08-01; the bay dot below is the remaining consumer.) */
  @keyframes dotPulse { 0%, 100% { scale: 1; } 45% { scale: 2.4; } }
  .bay-inner.pulse .bay-dot { animation: dotPulse .5s ease; }
  /* the count chip + status dot RETIRED 2026-08-03 (Dylan: the manifest
     carries the count now — "MSG ABOUT N BOARDS" + the tags — and the
     green dot had just been sitting there) */
  /* ---- BAY CLOSE: THE DOT IS THE HANDLE NOW (2026-08-02 round 5).
     The standard chip (left-column 32px box, its fill wipe, the whole
     chrome-column seat) is DELETED — at the end of the open the inner
     frame's mid dot swells into the close: a 24px black seat, white
     chevron, NO outer border (the lb nav's chevron-only grammar — the
     seat IS the fill, a stroked rect would outline its own ink).
     GEOMETRY: the rail lands 12px inside the case face at full open, so
     24px centered on the dot sits FLUSH to the face — left: 0 on the
     panel. The button never moves with the rails (they travel at their
     own rate mid-open); it only EXISTS at .shadowed — the connection
     beat — scaling up FROM the dot it then
     covers. The drain fades it and the dot re-emerges beneath: the
     swap is occlusion, both ways.
     top round(50%) = the even-box-on-odd-panel parity snap (see
     CLAUDE.md's half-pixel gotcha; 24 is EVEN on purpose — round()
     handles any panel parity). Hover keeps the tighten (inset, not
     transform — .18s in, .24s out on the resting rule). */
  .bxi {
    position: relative; z-index: 1;
    width: 20px; height: 20px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .bay-close {
    /* top is JS-OWNED (bayPose writes it off the snapped center line —
       see the cy note there); this 50% is only the pre-JS fallback.
       round(50%) was RETIRED here: it rounds within the PANEL, whose
       own top can sit on a .5, so seat and rails disagreed by a half
       pixel (the 2px-top/1px-bottom gap catch, 2026-08-03). */
    /* left 2: the fill (inset 2) then starts 4px in — 2.5 CSS px of
       white past the 1.5px face line, reading as the rails' own 2px
       clearance. At left 0 the white was a DESIGNED .5px sliver (face
       1.5, fill 2.0) — hairline at DPR 2, smudge at DPR 1 (Dylan's
       browser-vs-pane catch, 2026-08-03). Integer edges everywhere. */
    position: absolute; left: 2px; top: 50%; margin-top: -12px; z-index: 2;
    width: 24px; height: 24px; padding: 0; border: 0; background: none;
    display: grid; place-items: center; color: #fff;
    opacity: 0; pointer-events: none; cursor: pointer;
    transform: scale(.21); transform-origin: center;   /* born the dot's size */
    transition: opacity .18s ease, transform .22s ease;
  }
  .bay.shadowed .bay-close {
    opacity: 1; pointer-events: auto; transform: none;
    transition: opacity .22s ease .08s, transform .3s cubic-bezier(.3, .9, .3, 1) .08s;
  }
  /* the TIGHTENED box is the REST state (Dylan round 5b: "make this
     smaller hover size the default") — fill inset 2 in the 24 hit box;
     hover takes the same gesture one step further. The hit area stays
     the full 24 (drawn ⊆ hit, the safe direction of the hit-area law). */
  .bay-close::before {
    content: ""; position: absolute; inset: 2px; background: #000; border-radius: 4px;
    transition: top .24s ease, right .24s ease, bottom .24s ease, left .24s ease, border-radius .24s ease;
  }
  .bay-close:hover::before {
    inset: 4px; border-radius: 3px;
    transition: top .18s ease, right .18s ease, bottom .18s ease, left .18s ease, border-radius .18s ease;
  }
  .bay-close .bxi { width: 16px; height: 16px; }
  /* THE SEAT GETS THE DOT'S CLEARANCE (round 5b): the rails stop 2px
     short of the seat's black — the same gap language they keep with
     the dot. A white border on the seat can't do it (the rails paint
     ABOVE the panel subtree — the dot-yield lesson), so the RAILS pull
     back. Heights are JS vars (bayPose), anchored to the same snapped
     center line as the seat so both gaps are EXACTLY 2px at any box
     parity (2026-08-03 — calc(50%−12) left the ends on .5s while the
     seat rounded, reading 2-top/1-bottom). Transition scoped to this
     rule ON PURPOSE — on the base rule it would tween the driver's
     per-frame --rp heights into mush; leaving .shadowed snaps back
     under a case already in motion. */
  .bay.shadowed .bay-rail::before {
    height: var(--railTopH, calc(50% - 12px));
    transition: height .25s ease .08s;
  }
  .bay.shadowed .bay-rail::after {
    height: var(--railBotH, calc(50% - 12px));
    transition: height .25s ease .08s;
  }
  /* ---- the drawer head (2026-08-02, v1 item 3): contact + the manifest.
     Contact is the one path that must never need discovering (the
     progressive-disclosure rule's own exception) — the MSG bar is the
     biggest object in the case, top seat, arriving with the chrome
     (.shadowed). It is a DM button, so it wears the DM glitch, not the
     decode. The tags beneath are the manifest of what's shelved — the
     corner-chip idiom, settled count only, labels not controls. */
  .bay-head {
    /* CARD-COLUMN SEAT (Dylan, 2026-08-03 — the bay-lab toggle's answer):
       the head sits on the CARD column now, not the old chrome column —
       same left/right edges as the landing strips (shadow reach + 1px
       each side, the SX law), so the header is the top shelf of the same
       stack the cards live in. --headR/--headW are bayGeom's (derived
       beside --stripL/--stripW so the two can never drift); the calc is
       the pre-JS fallback (the old chrome seat, close enough for a
       frame). Right-anchored like the shelves — the stage-2 pull must
       leave it put. */
    /* HALF-PIXEL NOTE (Dylan's scroll-cut catch, 2026-08-03 — measured,
       not assumed): the browser SNAPS a border's used width to device
       pixels, so the panel's specified 1.5px top border is USED as 1px
       at DPR 1 — inside offsets are already whole there, and a plain
       10 seat lands the box on the grid. The hazard is any calc against
       the SPECIFIED 1.5 (it opens a .5 seam against the snapped ink) —
       which is why the apron sits UNDER the box's own paint and the
       swallow line is JS-snapped (see ::after + bayGeom). */
    position: absolute; top: 10px; right: var(--headR, 16px); z-index: 3;
    width: var(--headW, calc(var(--bayW) - 68px));
    display: flex; flex-direction: column; gap: 7px;
    /* the box (Dylan's ask, same day): opaque white so the scrolling
       column slides BEHIND it (the head outranks the shelves' z). The
       border is a transparent LAYOUT KEEPER — the visible outline is
       .bay-hline, which DRAWS (below). box-shadow rides the transition
       list so the drawn shadow can land softly. */
    background: #fff; border: 1.5px solid transparent; padding: 8px;
    opacity: 0; transition: opacity .4s ease, box-shadow .35s ease;
  }
  /* THE OUTLINE DRAWS (Dylan's spec, 2026-08-03): born at the RIGHT
     line's center, two legs travel both directions at once — around the
     corners, along top and bottom — and MEET at the left line's center.
     Real-px paths + a 1:1 viewBox written by bayGeom, so the 1.5 stroke
     sits exactly in the transparent border's footprint (.75 centerline
     inset). pathLength 1 + the 1.05 dash idiom (dash exactly equal to
     the normalized length can round to an all-gap phase — header-lab's
     lesson). The svg's -1.5 inset spans the padding box + border =
     the border box, 1:1 with the measured viewBox. */
  .bay-hline { position: absolute; inset: -1.5px; pointer-events: none; overflow: visible; }
  .bay-hline path {
    fill: none; stroke: #000; stroke-width: 1.5;
    stroke-dasharray: 1.05; stroke-dashoffset: 1.05;
  }
  .bay.shadowed .bay-hline path { animation: headDraw .55s ease .18s both; }
  @keyframes headDraw { to { stroke-dashoffset: 0; } }
  /* the completed box becomes an OBJECT: .hdrawn (JS, on the draw's
     animationend) pins the strokes and lands the CARD SHADOW — the
     case's own left-thrown light, card magnitude. It must sit AFTER
     the .shadowed animation rule (equal specificity, source order):
     a reopened mid-drain box is still .hdrawn and must not replay the
     draw. Cleared invisibly once the drain's fade-out completes —
     clearing at drain START would un-draw a still-fading box. */
  .bay-head.hdrawn .bay-hline path { stroke-dashoffset: 0; animation: none; }
  .bay-head.hdrawn { box-shadow: -5px 6px 0 rgba(0, 0, 0, .85); }
  @media (prefers-reduced-motion: reduce) {
    .bay.shadowed .bay-hline path { animation: none; stroke-dashoffset: 0; }
  }
  /* the BUFFER (Dylan's ask; re-hung 2026-08-03 off the SHADOW): an
     invisible white apron below the box — cards scrolling up are
     swallowed at its bottom edge, HEAD_BUF px past the box SHADOW's
     bottom. The box + its shadow are one object, so the buffer spaces
     from the shadow edge (the SX law read vertically — his nudge).
     A SIBLING below the head's z ON PURPOSE: as the head's own ::after
     it could only paint ABOVE the box-shadow (negative-z children
     outrank the root element's own background/shadow layer) and its
     white blocked the shadow's bottom band — out here the shadow inks
     over the apron exactly as it inks over the panel. Top tucks 2px
     under the box's opaque bg (no flush seam; z 2 < 3 hides the
     overlap); bottom is DRIVER-SNAPPED whole-px (--apronH, bayGeom) —
     the cut edge is the one line here that must be crisp. White on the
     white panel: invisible by construction, so it never needs to fade.
     Z LADDER, measured live 2026-08-03: the cards' own chip layers
     (.fchip/.fst) are z2 — the SAME rung — because .d7f is NOT a
     stacking context in live Chrome (container-type alone doesn't make
     one; the old note claiming it does is wrong at least here). The
     apron therefore sits AFTER the shelves in source: equal z resolves
     by DOM order, chips lose, and the head's z3 still shades it all. */
  .bay-apron {
    position: absolute; right: var(--headR, 16px); width: var(--headW, calc(var(--bayW) - 68px));
    top: var(--apronTop, 96px); height: var(--apronH, 18px); z-index: 2;
    background: #fff; pointer-events: none;
  }
  /* box-shadow stays in the list — this rule owns `transition` while
     .shadowed, and dropping it would snap the .hdrawn shadow in */
  .bay.shadowed .bay-head { opacity: 1; transition: opacity .35s ease .15s, box-shadow .35s ease; }
  /* THE BAR EXITS UP LIKE A CHIP on the contact pull (Dylan, 2026-08-03):
     the whole head — bar + manifest — collapses onto the drawer's top
     line as the slide starts, and the REAL cards pile into its vacated
     seat (the labels leave, the things themselves arrive). Children ride
     the squash frozen (the chip-drain law, for free via scaleY). AFTER
     the .shadowed rule on purpose — equal specificity, this must win
     while .out. Returns on the push-back; the head's transitionend hook
     ignores .out-state transitions so the exit can't fire the announce. */
  .bay.out .bay-head {
    transform: translateY(-16px) scaleY(0); transform-origin: center top;
    opacity: 0; pointer-events: none;
    transition: transform .28s ease, opacity .22s ease .04s;
  }
  /* the WIND-UP (same spec): the drawer compresses a touch — pure
     anticipation — then springs into the big slide. Width, never
     transform (the driver owns the transform channel). */
  .bay.windup .bay-panel {
    width: calc(100% - 12px);
    transition: box-shadow .45s ease, width .13s ease-in;
  }
  .bay-msg {
    /* gap = the floor between the two organs under space-between — at
       narrow cases the phrase otherwise runs flush into the count and
       "CONTACT ME" + "6" reads as one word (seen at the 162 stop) */
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    height: 36px; padding: 0 12px; border: 0; background: #000; color: #fff;
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
  }
  /* the bar's organs (2026-08-03): icon + phrase left, count + board
     right. Mono font keeps the decode's junk frames the same width as
     the landed phrase; the left group clips if a long phrase meets a
     narrow case (the right group is the anchor, flex: none). Icons are
     stroke glyphs on currentColor, so the DM glitch inverts them free. */
  /* the mask: at the narrowest stop (162) the longest phrase overruns —
     a hard clip slices a glyph mid-stroke, so the overflow edge
     dissolves instead. The 14px right padding is what makes the mask
     inert when the phrase FITS (Dylan's catch: without it, a fitting
     phrase ends exactly at the box edge and its tail sits in the fade
     zone — the D of INTERESTED went ghost). Fitting text stops before
     the fade; only true overflow reaches into it. */
  .bay-msg-l {
    display: inline-flex; align-items: center; gap: 8px; min-width: 0;
    overflow: hidden; padding-right: 14px;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent);
    mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent);
  }
  #bay-msg-t { white-space: nowrap; }
  .bay-msg-r { display: inline-flex; align-items: center; gap: 5px; flex: none; }
  .bay-mic, .bay-sk {
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; flex: none;
  }
  .bay-mic { width: 15px; height: 15px; }
  .bay-sk { width: 16px; height: 16px; }
  /* the glitch inverts to white ON the white panel — the inset ink ring
     holds the bar's silhouette through the flash */
  /* ---- ?msgfx= — the post-open attention pass (design variants,
     2026-08-03). Dylan's spec: the button gets a SECOND animation that
     starts only after the deck has FULLY opened — nothing is drawn or
     confined on the drawer pull; a fresh trigger after the case lands
     is what makes the button unmissable. Fired off the head's own
     fade-in transitionend (the arrival beat), once per full open.
     React, then delete the losers.
     wipe: the bar has NO rest state in this variant — it is BORN by
     the gesture (the lb-nav grammar), sweeping in from the left once
     the outlined box has landed. A TRANSITION, not an animation, ON
     PURPOSE (Dylan's frozen-hover catch, 2026-08-03): the DM glitch
     needs the bar's `animation` slot, and a forwards-filling msgWipe
     outranked it — dm-glitch never played, so its animationend never
     fired and .glitch-run stayed painted forever. The whole msgfx
     block also sits ABOVE the glitch rule so the glitch wins any
     remaining animation-slot tie (the pulse) by source order. */
  .bay.msgfx-wipe .bay-msg {
    clip-path: inset(0 100% 0 0);
    transition: clip-path .5s cubic-bezier(.3, .9, .3, 1);
  }
  .bay.msgfx-wipe .bay-msg.msgon { clip-path: inset(0 0 0 0); }
  /* pulse: one press — the button answers the case landing; felt, not
     annotated (the landpress family). A mid-pulse hover hands the slot
     to the glitch (cancel is cleaned up in JS alongside the end). */
  .bay-msg.msgpulse { animation: msgPulse .38s ease; }
  @keyframes msgPulse { 40% { transform: scale(.955); } }
  .bay-msg.glitch-run {
    animation: dm-glitch .26s steps(1, end) 1;
    background: #fff; color: #000; box-shadow: inset 0 0 0 1.5px #000;
  }
  /* min-height reserves the manifest's first line — the MSG bar must not
     shift when the first tag lands (the chip-box-never-resizes idiom),
     and the head must hold still for the STATIC case height */
  /* the manifest is LIVE now (2026-08-04, Dylan): hovering a tag lights
     the shelf card it stands for, so you never have to read a number here
     and then go hunting for it in the column. The box stays inert; only
     the tags take the pointer. */
  .bay-tags { display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; min-height: 14px; }
  .bay-tag {
    font-family: var(--mono); font-size: 8px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    background: #000; color: #fff; padding: 3px 6px;
    pointer-events: auto; cursor: default;
    transition: transform .16s cubic-bezier(.3, .9, .3, 1);
  }
  @media (hover: hover) { .bay-tag:hover { transform: scale(1.12); } }
  /* ---- stage 2: the pull-out. The MSG bar pulls the drawer out
     ENTIRELY; the DM options live on the revealed left region. Hidden by
     visibility+opacity (not display — the fade needs a box), arriving
     after the pull the way the chip waits for the frame. left 60 clears
     the arrow strip; right clears the head's wider column. */
  .bay-dm {
    /* the CONTACT STAGE (2026-08-03, Dylan's spec — skeleton pass): the
       revealed region left of the case column. Anatomy: the dealt-card
       row up top (each card + its comment square), the dropdowns, the
       message PREVIEW (the builder — a clear default, sendable with
       zero interaction), send. Placeholder dress on purpose — react
       first, costumes after. */
    /* SYMMETRIC in the full drawer (Dylan, 2026-08-03): the stage used
       to clear the case column, but the head, strips and cards all exit
       during the pull — clearing a column that empties itself left a
       dead white band on the right. The pile still forms up at the
       head's old seat mid-choreography; the dealt row then owns the
       whole width. */
    position: absolute; left: 24px; right: 24px; top: 12px; bottom: 16px;
    /* the white between the dealt row and the ENVELOPE'S OWN EDGE (the paper
       edge is what reads, not the composer card inside it). A var so it can
       be dialled from the URL — see the ?rowgap= override.
       IT YIELDS FIRST ON A SHORT STAGE, hence the clamp rather than the flat
       40 Dylan dialled. 40 is his number and it holds from ~950px of viewport
       up; below that the paper starts starving, and this is pure white space
       — the cheapest thing on the stage to spend. The alternative was letting
       the row give the room back, and it CANNOT at that size: at 1280x700 the
       dealt cards are already pinned to dealMin, so the squeeze pass has
       nothing left to trade and 7px of SEND hung off the paper. Tuned so 1080
       and 950 both sit at the full 40 and a 700-tall viewport lands back on
       the old 14. */
    display: flex; flex-direction: column; gap: var(--stageGap, clamp(14px, 10.5vh - 60px, 40px)); z-index: 3; color: #000;
    /* ONE AIR NUMBER for the dealt row, corrected for the card's own hard
       shadow in each direction (2026-08-04, Dylan: the cards "need more
       breathing room horizontally and ... vertically from their
       ask/offer buttons"). Per the SHADOW LAW the card and its offset
       shadow are ONE object, so a gap measured off the panel box is short
       by the shadow's reach on the side it throws — the old flat 18px
       horizontal was 15px of white on one side of a card and 18 on the
       other, and the flat 10px card-to-button gap was 6px of actual white,
       which reads as a mistake rather than a margin (the .bdm-body
       lesson). Reach comes straight off the fv3 spec
       (3.0172cqw 3.8793cqw 0 -.431cqw): 2.5862% of card width to the
       right, 3.4483% below. 24px is NOT a new number — it is the stage's
       own ENV_TUNE.airMin, the same white the send floats in, so the row
       and the send are spaced by one value instead of two eyeballed ones.
       Raise --dealAir and the cards give the room back on their own:
       bdmDealW solves the row's height budget against this. */
    --dealAir: 24px;
    /* SPLIT FROM --dealAir (2026-08-04, his ask for "more horizontal
       breathing room" on the board cards while the vertical gap stayed put).
       It was deliberately ONE number and the note above still explains why
       that was right — both directions were the same 24px of white and there
       was no reason for them to differ. There is now: horizontally these are
       separate objects that need telling apart, and the extra room is also
       what lets the ask box overhang its card (see .bdm-ask). Vertically the
       gap binds the card to its OWN button, and 24 was right for that. Two
       numbers because they answer two questions. */
    /* 44 → 90 (2026-08-05, Dylan on a real 1920×1080: the cards read "too
       small / tightly grouped"). Of his three complaints this is the only
       one that is FREE: the row is 1824px wide holding ~750px of cards, so
       horizontal air comes out of slack nobody was using. Card SIZE is the
       expensive one — the envelope is height-bound, so every px the row
       grows costs the paper 2.303px of width — which is why the answer to
       "too small / too tight" is spent entirely on the TIGHT half first. */
    --dealAirX: 90px;
    /* (--askH/--askOver retired with the ask box, 2026-08-09 — bdmDealW
       stopped budgeting for a button band, so the freed height comes back
       as dealt-card size on short stages) */
    /* the dealt card's width, single-sourced: the slot wears it and both
       gaps correct against it. --dealW is bdmDealW's cap, --bayCard the
       deck's own size — the smaller wins. */
    --dealCard: min(var(--bayCard, 232px), var(--dealW, 232px));
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .22s ease, visibility 0s .22s;
  }
  .bay.out .bay-dm {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .3s ease .2s, visibility 0s .2s;
  }
  /* the dealt row: slots at deck-card width; overflow scrolls (decks are
     1-2 boards mostly, 4-5 tops — but better safe, the lb-sheet
     precedent for the hidden bar) */
  /* STRETCH, not flex-start (2026-08-04): the fv3 card is not a fixed
     aspect — its name row is content-height, so a board whose name wraps
     to two lines ("PURPLE PURPLE" at the 78px floor) is 8px taller than
     its neighbours and used to drag its ask button out of line with the
     rest. The buttons are six copies of one control sitting side by side,
     which makes any raggedness among them read as a bug, so they bottom-
     align into a straight band (.bdm-ask takes margin-top: auto) and the
     cards keep top-aligning. Consequence worth knowing: --dealAir is
     therefore the MINIMUM white under a card — the tallest card in the row
     gets exactly it, shorter ones get it plus their own shortfall. That is
     the right way round: the band is shared furniture and the air is not. */
  .bdm-row { position: relative; display: flex; gap: calc(var(--dealAirX) + var(--dealCard) * .025862); align-items: stretch; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 8px; min-height: 40px; flex: none; }
  .bdm-row::-webkit-scrollbar { display: none; }
  /* centered when it fits, scrollable when it doesn't: auto margins on
     the END slots — a justify-content: center would strand the left end
     of an overflowing row outside the scroll origin */
  /* OF-TYPE, not -child (2026-08-11, the right-hugging deal bug): the
     copied line lives in this row as a <p> — it is absolutely positioned
     so it takes no slot, but it IS a last child, and :last-child on the
     slot silently stopped matching, dropping the right auto margin and
     sliding the whole hand to the row's end. Slots are the row's only
     divs, so -of-type keeps the centering pair on the END SLOTS whatever
     else shares the row. */
  .bdm-slot:first-of-type { margin-left: auto; }
  .bdm-slot:last-of-type { margin-right: auto; }
  /* the dealt row GIVES WAY FIRST on a short stage (--dealW, set by
     bdmDealW): the row is a reminder of what is attached, the composer is
     the thing you are using. At 1024x768 the row was taking 52% of the
     stage and squeezing the envelope's type past legible. */
  .bdm-slot { flex: none; width: var(--dealCard); display: flex; flex-direction: column; gap: calc(var(--dealAir) + var(--dealCard) * .034483); }
  /* THE CARD IS THE OFFER (2026-08-09 pre-jam): the ask box retired and
     the dealt card became the control — pointer events back on, and the
     delegated hover dress rides along free. .offering = flagged "open to
     offers"; the ref chip holds its fill as the mark. */
  .bdm-slot .d7f { width: 100%; cursor: pointer; }
  .bdm-slot.offering .d7f .fc-ref::before { transform-origin: left center; animation: chipwipe .44s ease forwards; }
  .bdm-slot.offering .d7f .fc-ref .ft { color: #fff; transition: none; }
  /* THE DEALT CARD HAS NO BOTTOM ROW (Dylan, 2026-08-05). Both the +List
     chip and the AVAILABLE status are shop furniture and neither has a job
     on this screen:
       - the board is ALREADY in the deck — that is the only reason it is
         dealt here at all — so +List is a DEAD CONTROL. Same law that
         hides the chip on a home-opened inspection and on a sold board,
         and it is doubly true here because .bdm-slot .d7f takes no pointer
         anyway: it could never have been pressed.
       - availability is BROWSE context, and you are well past browsing —
         you are writing to him about this exact board.
     Suppressed rather than un-rendered because the cards come from the
     shared JCARDS.framev3 template: cardDressOn/cardDressOff and the .lit
     path still write into .fc-list .ft and .sttxt, and writing to a hidden
     node is harmless where a missing one would need every caller guarded.
     RECLAIMING THE STRIP IS PART OF THE SAME CHANGE, not a bonus — .info
     was reserving 18.9655cqw of bottom padding solely to keep the board
     clear of those two, so hiding them without this would leave a
     conspicuous empty band and read worse than before. It also makes the
     card ~4.6% shorter, and bdmDealW solves the row's height budget, so
     that comes back on its own as a WIDER dealt card. */
  .bdm-slot .d7f :is(.fc-list, .fst) { display: none; }
  .bdm-slot .d7f .info { padding-bottom: 19.5px; padding-bottom: 8.4cqw; }
  /* the deal clones: absolute in the PANEL (its transform is the
     containing context), posed by transform only, house flight ease.
     RIGHT-anchored (2026-08-03): the climbs run WHILE the width is
     flying, and the panel's right edge is the one line that holds
     still — a left anchor would drag every pose with the growing edge. */
  .bdm-fly { position: absolute; right: 0; top: 0; z-index: 4; will-change: transform; transition: transform .38s cubic-bezier(.3, .9, .3, 1); }
  .bdm-fly .d7f { width: 100%; }
  /* THE PER-BOARD ASK RETIRED (2026-08-09 pre-jam, Dylan: "remove our
     offer info box. move the offer portion of the box to the card") —
     the split button and its input went; the dealt CARD is the offer
     control now (see bdmBuild) and a price is typed on the letter's own
     line, which was already the shared string. */
  /* THE MSG COMPOSER — the four-dot card treatment lives HERE (Dylan's
     correction, 2026-08-03): smaller than the stage, breathing room at
     the edges, centered. The preview IS the message. Its four dots are
     CSS-seated (%) so they exist through the PULL — revealed with the
     stage as the drawer stretches: the frame's seeds, waiting. Then, in
     order (bdmCompose): the OUTER edge draws left-center → right-center
     (the head draw MIRRORED — the two boxes face each other across the
     drawer), the dots CONNECT into the inner edge (8 legs welding at
     the corners), the box takes its card shadow (right-thrown, the
     stage's light), and the message decodes in. The line svg is
     real-px, built at compose time — the flex height isn't known until
     the pull lands. Dash transitions only: the animation slot stays
     free (the bar-freeze lesson). */
  /* THE PIXEL GRID (2026-08-04, Dylan's half-pixel catch on the sealed
     envelope — settled by a real pixel audit at DPR 1). Every line in
     this box is axis-aligned, and exactly three things keep them crisp:
       · an INTEGER WIDTH — round() below, because the svg's viewBox is
         integer and a 920.4px box would scale every coordinate;
       · an INTEGER HEIGHT — bdmLockBox, because this box is `flex: 1 1
         auto` and its laid-out height is fractional while every drawn
         coordinate comes from the rounded offsetHeight. That mismatch
         put the bottom silhouette half a row off the white it outlines,
         at every viewport, fold or no fold;
       · STROKE PARITY — every axis-aligned stroke ODD width on a .5
         centre. An even stroke on an integer covers half of two device
         rows and renders as two grey rows: the "faint line". Diagonals
         are exempt, they antialias regardless.
     WHAT IS NOT ON THE LIST: snapping the box ORIGIN. An earlier pass
     translated the box by a sub-pixel amount to park a fractional origin
     on the grid, and it CAUSED the blur it meant to fix — Chrome already
     snaps this subtree's paint, so an explicit sub-pixel transform is
     honoured on top of that snap. Measured both ways; see bdmClearTf.
     This box must stay transform-free.
     Same family as the bay-close parity gotcha; a DPR-1 problem, so his
     external monitor is the QA device, not the laptop panel. */
