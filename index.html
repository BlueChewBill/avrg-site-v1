      if (mq.matches) {
        if (vid.parentElement !== vtile) { const f = document.createElement("div"); f.className = "tframe"; f.appendChild(vid); vtile.innerHTML = ""; vtile.appendChild(f); }
      } else if (vid.parentElement !== vwrap) { vtile.innerHTML = ""; vwrap.insertBefore(vid, vwrap.firstChild); }
      /* only roll when the home frame is actually showing */
      if (document.getElementById("colpage").hidden) {
        const p = vid.play(); if (p && p.catch) p.catch(() => {});
      }
    }
    (mq.addEventListener ? mq.addEventListener("change", placeVideo) : mq.addListener(placeVideo));
    placeVideo();

    /* ---- video lightbox: click the video to pull it forward, card-style.
       The cover slot reuses the live spine <video> (placeVideo pattern), so
       enlarging never restarts it. Other clips ride below as thumbs and
       swap in place, the way board photos do. */
    const VIDEOS = [
      { id: "cover", src: "site/media/covercard.mp4",      poster: "site/media/covercard-poster.jpg" },
      { id: "clip1", src: "site/media/clip-1.mp4", poster: "site/media/clip-1-poster.jpg" },
      { id: "clip2", src: "site/media/clip-2.mp4", poster: "site/media/clip-2-poster.jpg" },
    ];
    const vlb = document.getElementById("vlb");
    const vlbCard = document.getElementById("vlb-card");
    const vlbFrame = document.getElementById("vlb-frame");
    const vlbThumbs = document.getElementById("vlb-thumbs");
    const clipEls = { cover: vid };   /* the spine video IS the cover entry */
    function clipEl(v) {
      if (!clipEls[v.id]) {
        const el = document.createElement("video");
        el.src = v.src; el.poster = v.poster;
        el.muted = true; el.loop = true; el.playsInline = true; el.preload = "metadata";
        clipEls[v.id] = el;
      }
      return clipEls[v.id];
    }
    vlbThumbs.innerHTML = VIDEOS.map((v, i) =>
      '<img src="' + v.poster + '" data-v="' + v.id + '" alt="clip ' + (i + 1) + '">').join("");
    function vlbShow(id) {
      const el = clipEl(VIDEOS.find(x => x.id === id));
      Object.values(clipEls).forEach(x => {
        if (x !== el) { x.pause(); x.style.display = "none"; }
      });
      if (el.parentElement !== vlbFrame) vlbFrame.appendChild(el);
      el.style.display = "";
      el.controls = true;
      const p = el.play(); if (p && p.catch) p.catch(() => {});
      vlbThumbs.querySelectorAll("img").forEach(t => t.classList.toggle("on", t.dataset.v === id));
    }
    vlbThumbs.addEventListener("click", e => {
      const id = e.target.dataset && e.target.dataset.v;
      if (id) vlbShow(id);
    });
    /* scroll lock that doesn't reflow the page: body overflow:hidden
       drops the scrollbar and widens the content ~15px — enough to
       re-column the shelf grids (3→4 and back) at some window widths,
       and to shift the ground under the return flight's landing. Pad
       the body by the vanished bar's width for the lock's duration
       (the sticky topbar rides body sizing, so it stays put too).
       Overlay-scrollbar platforms (iOS, macOS default) measure 0 → no-op.
       (scrollbar-gutter: stable was tried first — the spec only reserves
       the gutter for overflow scroll/auto, not hidden, so it can't
       cover a scroll lock.) */
    /* iOS Safari ignores body overflow:hidden for touch scrolling — the
       mobile lock PINS the body (position:fixed at -scrollY) and the
       unlock restores the exact spot, so nothing moves on screen either
       way (Dylan's phone react, 2026-07-24: the page scrolled under an
       open overlay). Desktop keeps the overflow+gutter-pad lock. The
       fixed guard makes re-entrant locks (one overlay opening over
       another) keep the FIRST scroll position instead of clobbering it
       with 0. */
    let lockY = 0;
    function lockScroll() {
      const sbw = window.innerWidth - document.documentElement.clientWidth;
      if (dockActive() && document.body.style.position !== "fixed") {
        lockY = window.scrollY;
        document.body.style.position = "fixed";
        document.body.style.top = -lockY + "px";
        document.body.style.left = "0";
        document.body.style.right = "0";
      }
      document.body.style.overflow = "hidden";
      if (sbw > 0) document.body.style.paddingRight = sbw + "px";
    }
    function unlockScroll() {
      const wasPinned = document.body.style.position === "fixed";
      document.body.style.overflow = "";
      document.body.style.paddingRight = "";
      document.body.style.position = "";
      document.body.style.top = "";
      document.body.style.left = "";
      document.body.style.right = "";
      /* behavior instant is LOAD-BEARING (2026-08-08, Dylan's close-flash
         catch): html carries scroll-behavior smooth, so a plain scrollTo
         ANIMATES — the unpin painted the page at scroll 0 (the collection's
         top, his "arbitrary scroll") and then glided ~500ms back to the
         card. Instant lands the restore in the same frame as the unpin, so
         nothing ever shows but the spot you left. */
      if (wasPinned) window.scrollTo({ top: lockY, left: 0, behavior: "instant" });
    }
    function openVlb() {
      const srcRect = reduced ? null : vid.getBoundingClientRect();
      vlb.hidden = false;
      document.body.classList.add("lb-fade");
      lockScroll();
      vlbShow("cover");
      if (srcRect) {
        const fr = vlbFrame.getBoundingClientRect();
        const s = srcRect.width / fr.width;
        const dx = (srcRect.left + srcRect.width / 2) - (fr.left + fr.width / 2);
        const dy = (srcRect.top + srcRect.height / 2) - (fr.top + fr.height / 2);
        vlbCard.style.transition = "none";
        vlbCard.style.transformOrigin = "50% " + (vlbFrame.offsetTop + vlbFrame.offsetHeight / 2) + "px";
        vlbCard.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + s + ")";
        void vlbCard.offsetWidth;
        vlbCard.style.transition = "";
        vlbCard.style.transform = "none";
      }
      requestAnimationFrame(() => vlb.classList.add("in"));
    }
    function closeVlb(instant) {
      vlb.classList.remove("in");
      document.body.classList.remove("lb-fade");
      setTimeout(() => {
        vlb.hidden = true;
        unlockScroll();
        Object.values(clipEls).forEach(x => { if (x !== vid) x.pause(); });
        vid.controls = false; vid.muted = true; vid.style.display = "";
        placeVideo();   /* the cover video rides home, still playing */
      }, (reduced || instant) ? 0 : 330);
    }
    vid.addEventListener("click", () => { if (vlb.hidden) openVlb(); });
    document.getElementById("vlb-close").addEventListener("click", () => closeVlb());
    document.getElementById("vlb-scrim").addEventListener("click", () => closeVlb());
    document.addEventListener("keydown", e => {
      if (!vlb.hidden && e.key === "Escape") closeVlb();
    });

    /* ========= routing: home <-> collection page ========= */
    const home = document.getElementById("home");
    const colpage = document.getElementById("colpage");

    /* ========= the foot ========= */
    /* THE FOOT GOES HOME (2026-08-15, Dylan: "remove the old buttons from
       the bottom of the collections scroll... change that to the same logo
       as our top left page header, and give it '· home ·' underneath it") —
       the loop icon (LOOP_SVG) and the collection chips retired: the drop
       is the nav now, so the scroll's end states ONE door. The mark is the
       bar's own logo — the circle sticker, since light is the one ground. */
    function colnavHtml() {
      return '<div class="colnav">' +
          '<a class="colnav-home" href="#" title="Back to the main page" aria-label="Back to the main page">' +
            '<img src="' + IMG("img/logo-circle.png") + '" alt="AVRG" />' +
            '<span class="label">·&#8195;HOME&#8195;·</span>' +
          '</a>' +
        '</div>';
    }

    /* THE COMMENT LIVES OUT HERE ON PURPOSE — a multi-line comment between
       `return` and its value is a LineTerminator, so ASI closes the statement
       and the function silently returns undefined. Cost a render of six empty
       sections and zero console errors. */
    function colSectionHtml(c, i, afterH2) {
      /* the subtext is the SHORT line now (2026-08-08 late — "shorten our
         subtext"): BARLINE is Dylan's authored copy, SUB the fallback; the
         full .description retired from the page with the section bar.
         .secbody wraps EVERYTHING (2026-08-14): it is the scroll relay's
         sticky pin — the whole section holds still while the wrapper's
         runway is consumed. Inert on the phone (the sticky is
         desktop-gated). */
      return '<div class="secbody"><h2>' + titleHtml(c) + '</h2>' +
        (afterH2 || "") +
        '<p class="desc">' + esc(BARLINE[c.id] || SUB[c.id] || "") + '</p>' +
        (c.boards.length
          ? '<div class="shelfgrid">' +
              c.boards.map((b, k) => '<div class="scard" data-k="' + k + '" role="button" tabindex="0">' + cardInner(b, k, DUAL[c.id], c) + '</div>').join("") +
            '</div>'
          : '<div class="restock label">Restocking — check back</div>') +
        '</div><i class="runway" aria-hidden="true"></i>';
    }

    /* THE SECTION BAR RETIRED (2026-08-08 late) — the pinned-bar
       observer, the ?colbar= costume rack (condense/bar/sketch/rail), and
       the rail scrollspy all went when the header moved back in with its
       collection. See the CSS note at the shop-all block. */

    /* proportion lock: shelf-grid cards render at the desktop reference width
       (232px — the j-card spec) and scale down to their slot, so a narrow-grid
       card is a photographic reduction of the desktop card instead of the
       desktop chrome squeezed onto a smaller footprint. Desktop slots are
       232px, so this is a no-op there — no breakpoint, one continuous law.
       Photo cards keep their fluid layout (designed that way). */
    const CARD_REF_W = 232;
    function lockCardScale() {
      document.querySelectorAll(".shelfgrid .scard").forEach(sc => {
        const inner = sc.querySelector(":scope > .d7f, :scope > .paper, :scope > .d6z, :scope > .d5");
        if (!inner) return;
        const w = sc.clientWidth;
        if (!w) return;               /* grid hidden (route() re-runs us once it shows) */
        if (w >= CARD_REF_W - 1) {
          inner.style.width = inner.style.transform = sc.style.height = "";
          return;
        }
        const s = w / CARD_REF_W;
        inner.style.width = CARD_REF_W + "px";
        inner.style.transformOrigin = "0 0";
        inner.style.transform = "scale(" + s + ")";
        sc.style.height = inner.offsetHeight * s + "px";
      });
    }
    function bindScards() {
      lockCardScale();
      colpage.querySelectorAll("section[data-col]").forEach(sec => {
        const i = +sec.dataset.col;
        sec.querySelectorAll(".scard").forEach(s => {
          s.addEventListener("click", () => openLb(i, +s.dataset.k, s));
          s.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(i, +s.dataset.k, s); }
          });
        });
      });
    }

    /* no collection gets its own page: the selection leads, then the whole
       set continues below it — one scroll through everything, on every
       screen size */
    function renderColPage(c, i) {
      /* the "← Back to collections" link retired (2026-08-15, Dylan's
         launch-day trim) — the drop and the foot's home mark carry the
         wayfinding; the masthead stands alone over its boards */
      const order = [i].concat(COLLECTIONS.map((_, j) => j).filter(j => j !== i));
      colpage.innerHTML =
        order.map((j, n) =>
          '<section class="colpage-inner' + (n ? " shopall-sec" : "") + '" data-col="' + j + '" style="--acc:' + accOf(COLLECTIONS[j]) + '">' +
            colSectionHtml(COLLECTIONS[j], j) +
          '</section>'
        ).join("") +
        '<section class="colpage-inner shopall-foot">' + colnavHtml() + '</section>';
      bindScards();
      landWants(colpage);   /* the phone chips speak (round 4) */
    }

    /* shop all: every collection page stitched into one scroll */
    function renderShopAll() {
      /* no "All" masthead, no back-link block (2026-08-08 late): the page
         opens straight onto the first collection — the header lives with
         its section, and the topbar + footer nav carry the wayfinding */
      colpage.innerHTML =
        COLLECTIONS.map((c, i) =>
          '<section class="colpage-inner shopall-sec" data-col="' + i + '" style="--acc:' + accOf(c) + '">' +
            colSectionHtml(c, i) +
          '</section>'
        ).join("") +
        '<section class="colpage-inner shopall-foot">' + colnavHtml() + '</section>';
      bindScards();
      landWants(colpage);   /* the phone chips speak (round 4) */
    }

    /* ========= the scroll relay — ASLEEP for v1 behind RELAY_ON ========= */
    /* ================= THE SCROLL RELAY (2026-08-14) =================
       See the CSS block for the design; this is the machine. p is PURE
       GEOMETRY per section — how far the wrapper has carried its pinned
       .secbody through the runway — recomputed every scroll frame, so
       reversal rewinds for free and there are no observers to miss an
       instant jump (the section bar's sentinel lesson). Only one section
       can sit in 0<p<1 at a time: the pinned body owns the bar zone.
       STATE per boundary: done (name earned) + gave (give-back fired this
       up-journey) + from (the word the ceremony is replacing). Down-mode
       (not done): scrub the ceremony off p — masthead shrink+duck, word
       relay, window width lerped so the flanking dots travel smoothly.
       Completed + p<1: UP-MODE — dry give-back to COLLECTIONS (his rule:
       upward always reads the door word, so a fast up-scan parks there),
       masthead rides the runway FULL SIZE. p back to 1 re-earns with a dry
       swap; p to 0 re-arms. Route/jump: routeReset — scroll is already at
       0, so everything re-arms and the bar wears the door word. */
    const relay = (() => {
      /* THE KILL SWITCH (2026-08-15): the ceremony sleeps for v1 —
         Dylan's launch-clock call ("we can come back to it down the
         line"). RELAY_ON is the ONE switch: it stamps body.relayon
         (which the sticky/runway CSS requires) and gates bind (no
         sections → every frame inert, the bar keeps COLLECTIONS).
         Flip the const and the whole relay wakes — machine, ceremony,
         approach shrink, all of it. The collection air stays live
         either way. */
      const RELAY_ON = false;
      if (RELAY_ON) document.body.classList.add("relayon");
      const DOOR = "COLLECTIONS";
      const R = 160;       /* the runway: px of paused scroll per boundary */
      const S_END = .16;   /* the masthead's landing scale ≈ the bar word */
      const MDONE = .75;   /* masthead fully ducked by this p */
      const wlab = document.querySelector("#og-shop .wlab");
      const shopOrb = document.querySelector("#og-shop .orb");
      /* the ghost measures word widths in the wlab's own dress (min-width
         included) so the window can lerp between the two words' widths —
         without it the flanking dots would JUMP at the settle */
      const ghost = document.createElement("span");
      ghost.className = "wlab";
      ghost.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap";
      shopOrb.appendChild(ghost);
      const wordW = t => { ghost.textContent = t; return ghost.offsetWidth; };
      const label = () => wlab.dataset.w;
      let secs = [], tbh = 64, raf = 0, gbT = 0;

      /* settled: one word, natural width, seat geometry rebuilt (the word
         box changed, and buildSeatFx is the bar's single geometry source) */
      const clearWord = t => {
        clearTimeout(gbT);
        wlab.classList.remove("relaying");
        wlab.textContent = t;
        wlab.dataset.w = t;
        wlab.style.width = wlab.style.transition = "";
        /* the phone door's presence rides the word (2026-08-16): no word =
           no dots, no tap target (#nbar.noword). Home wears AVRG since the
           A/B pass, so this is a BELT now, not home's costume. Stamped HERE
           because this is the word's one writer; :empty could not carry it
           (the measuring ghost is a second, usually-empty .wlab in the
           same orb). */
        const nb = document.getElementById("nbar");
        if (nb) nb.classList.toggle("noword", !t);
        buildSeatFx();
      };
      const spans = () => {
        clearTimeout(gbT);
        if (!wlab.classList.contains("relaying")) {
          wlab.classList.add("relaying");
          wlab.innerHTML = "<b class='rw'></b><b class='rw'></b>";
        }
        const a = wlab.children[0], b = wlab.children[1];
        a.style.transition = b.style.transition = wlab.style.transition = "";
        return [a, b];
      };
      /* the scrubbed relay: out rides up and away, in surfaces from below */
      const scrubWord = (from, to, q) => {
        const [a, b] = spans();
        a.textContent = from; b.textContent = to;
        const qo = Math.min(1, q / .6), qi = Math.max(0, Math.min(1, (q - .4) / .6));
        a.style.transform = "translateY(" + (-1.25 * qo).toFixed(3) + "em)";
        b.style.transform = "translateY(" + (1.25 * (1 - qi)).toFixed(3) + "em)";
        wlab.style.width = (wordW(from) + (wordW(to) - wordW(from)) * q).toFixed(1) + "px";
      };
      /* the dry swap on its own clock: give-backs ride DOWN (the mirror of
         earning), re-earns ride up */
      const drySwap = (to, downward) => {
        const from = label();
        if (from === to) return;
        const [a, b] = spans();
        a.textContent = from; b.textContent = to;
        const e = downward ? 1 : -1;
        b.style.transform = "translateY(" + (-1.25 * e) + "em)";
        wlab.style.width = wordW(from) + "px";
        wlab.dataset.w = to;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          a.style.transition = b.style.transition = "transform .24s ease";
          wlab.style.transition = "width .24s ease";
          a.style.transform = "translateY(" + (1.25 * e) + "em)";
          b.style.transform = "translateY(0)";
          wlab.style.width = wordW(to) + "px";
        }));
        gbT = setTimeout(() => clearWord(to), 300);
      };

      /* the pin leg (2026-08-15: now mostly the DUCK): the approach did
         the shrinking, so the masthead arrives at S_END and the pin just
         slides it under the bar. Arrival scale is 1 only on a
         home-suppressed re-approach (s.home — see the approach branch),
         where the old full shrink-at-the-bar plays instead. */
      const down = (s, p) => {
        if (reduced) return;
        const q = Math.min(1, p / MDONE);
        const s0 = s.home ? 1 : S_END;
        const sc = s0 - (s0 - S_END) * q;
        s.h2.style.transform =
          "translateY(" + (-q * (s.h2h * S_END + 18)).toFixed(1) + "px) scale(" + sc.toFixed(4) + ")";
      };
      const up = (s, p) => {
        if (reduced) return;
        s.h2.style.transform = p <= 0 ? "" :
          "translateY(" + (-p * (s.h2h + 18)).toFixed(1) + "px)";
      };

      function step(s, p, d) {
        if (p === s.p && d === s.d) return;
        if (!s.done) {
          if (p >= 1) {
            s.done = true; s.gave = false; s.from = null; s.home = false;
            down(s, 1);
            clearWord(s.name);
          } else if (p > 0) {
            if (s.from == null) s.from = label();
            if (reduced) {
              /* no motion: threshold swaps, full ceremony skipped */
              if (p > .6 && label() !== s.name) clearWord(s.name);
              else if (p < .4 && label() !== s.from) clearWord(s.from);
            } else {
              down(s, p);
              scrubWord(s.from, s.name, Math.max(0, Math.min(1, (p - .2) / .75)));
            }
          } else {
            if (s.from != null) { clearWord(s.from); s.from = null; }
            /* THE APPROACH (2026-08-15): the collection air is the
               shrink's runway. d is how far the masthead still has to
               ride to the bar; over the last s.cap px (the air, capped
               at the section's own resting distance so the first
               masthead can't borrow room it doesn't have) the title
               scales 1 → S_END in place — it arrives at word size and
               the pin only ducks it. Pure geometry: reversal rewinds
               for free. s.home suppresses the scrub on the post-earn
               ride home (travel, not transformation — Dylan's law)
               until the masthead is fully home. */
            if (s.home) {
              if (d >= s.cap) s.home = false;
              s.h2.style.transform = "";
            } else if (!reduced && s.cap > 0 && d < s.cap) {
              const a = 1 - d / s.cap;
              s.h2.style.transform = "scale(" + (1 - (1 - S_END) * a).toFixed(4) + ")";
            } else {
              s.h2.style.transform = "";
            }
          }
        } else {
          if (p >= 1) {
            if (s.gave) { drySwap(s.name, false); s.gave = false; }
            down(s, 1);
          } else if (p > 0) {
            if (!s.gave) { drySwap(DOOR, true); s.gave = true; }
            up(s, p);
          } else {
            /* an INSTANT jump can land at 0 without ever passing the
               give-back window — a single frame goes 1 → 0 (the section
               bar's sentinel lesson wearing new clothes). If this section
               still owns the bar, hand the door word back now. */
            if (label() === s.name) drySwap(DOOR, true);
            s.done = false; s.gave = false; s.from = null;
            s.home = true;   /* the ride home stays full size — the
                                approach scrub waits until d ≥ cap */
            s.h2.style.transform = "";
          }
        }
        s.p = p; s.d = d;
      }

      function frame() {
        raf = 0;
        if (colpage.hidden) return;
        if (!drawnBarOn()) { mframe(); return; }
        if (!secs.length) return;
        for (const s of secs) {
          const wr = s.sec.getBoundingClientRect();
          const pr = ((tbh - s.off) - wr.top) / R;
          step(s, Math.max(0, Math.min(1, pr)), Math.max(0, -pr) * R);
        }
      }
      addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(frame); }, { passive: true });

      /* THE PHONE WATCHER (2026-08-16 A/B — "the header on the mobile site
         needs to reflect where you are in collections. right now you can
         select 'hand shaped' and then scroll the entire collection"). The
         relay's mobile half woken as a WATCHER only: no pin, no runway, no
         masthead ceremony — those stay asleep behind RELAY_ON with their
         unrun feel pass. The one-writer law holds: the routed page's name
         is the RESTING word (mrest, stamped by routeReset) and the last
         masthead to duck under the bar overrides it; drySwap animates the
         change on the relay's own clock (its 300ms clearWord timeout is
         the frozen-frame belt, so a stalled rAF still lands the word).
         Words derive from the drop's own rows via barWordFor — the menu
         is where Dylan named these, so bar and menu cannot drift. Runs on
         #shop-all too (its sections carry data-col); YOUR PICKS has no
         data-col sections, so the word rests there by construction. */
      let msecs = [], mrest = "";
      function mbind() {
        msecs = [];
        if (drawnBarOn() || colpage.hidden) return;
        msecs = [...colpage.querySelectorAll("section[data-col]")].map(sec => {
          const h2 = sec.querySelector("h2");
          const word = barWordFor((COLLECTIONS[+sec.dataset.col] || {}).id);
          return (h2 && word) ? { h2, word } : null;
        }).filter(Boolean);
      }
      function mframe() {
        if (!msecs.length) return;
        const bar = parseFloat(getComputedStyle(document.body).getPropertyValue("--tbh")) || 64;
        let w = mrest;
        for (const s of msecs)
          if (s.h2.getBoundingClientRect().bottom <= bar + 4) w = s.word;
        const cur = label();
        if (!w || w === cur) return;
        /* direction mirrors the desktop grammar: earning a later section
           rides up, giving back toward the top rides down. mrest (not a
           section word on shop-all) indexes as -1 — above everything. */
        const idx = t => msecs.findIndex(s => s.word === t);
        drySwap(w, idx(w) < idx(cur));
      }

      function bind() {
        mbind();
        if (!RELAY_ON) { secs = []; return; }
        tbh = parseFloat(getComputedStyle(document.body).getPropertyValue("--tbh")) || 64;
        secs = [...colpage.querySelectorAll("section[data-col]")].map(sec => {
          const body = sec.querySelector(".secbody"), h2 = sec.querySelector("h2");
          if (!body || !h2) return null;
          h2.style.transform = "";
          const sr = sec.getBoundingClientRect(), br = body.getBoundingClientRect();
          return { sec, h2, name: h2.textContent.trim(), off: br.top - sr.top,
                   h2h: h2.getBoundingClientRect().height,
                   cap: br.top + scrollY - tbh,   /* resting distance to the bar */
                   p: 0, d: -1, done: false, gave: false, home: false, from: null };
        }).filter(Boolean);

        data.access_key = SPLITFORMS_KEY;

        data.subject = "AVRG inquiry — " + (refs.length ? refs.join(", ") : "general");
        data.page = siteUrl();
        status.textContent = "sending…";
        try {
          const r = await fetch("https://splitforms.com/api/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(data)
          });
          if (r.ok) { status.textContent = "sent — talk soon ✓"; form.reset(); }
          else { status.textContent = "something broke — try the DM button instead"; }
        } catch (err) {
          status.textContent = "something broke — try the DM button instead";
        }
      });
    }

    /* ===================== THE PICKS CEREMONY =====================
       The beat list and the reasoning live at the CSS block; this is the
       clock. Called from ONE place: route()'s my-lisst branch. NOT from
       the remove-a-pick re-render (re-dealing the whole deck because you
       dropped one board is the strip's redraw complaint again), not from
       · done · (the send ceremony has its own), not from the lb's soft
       close back onto the page (you never left it), not from the 940
       boundary re-dress. */
    const PX = {
      leave: 300,   /* the site's drain before the hash flips — pairs with the CSS transition */
      mast:  660,   /* · YOUR PICKS · states and pulses before the first card launches */
      /* the deal beats have been cut twice on react: 25% first ("lets
         speed the deal up a bit... by 25%", 190→143 / 620→465), then the
         whole CARD DEAL ×2 (2026-08-16, "lets speed up the card deal
         x2") — hand/deal/settle/ask all halved. The CLOSING went the
         OTHER way the same day (round 2): the deal is quick, the
         statements are slow — tail/rest around the .92s stamps and their
         word pops, home doubled and rAF-driven. ROUND 5 folded the
         deal's own scroll into ONE ride (walk + seat knobs retired — the
         page-down glide is timed to the whole deal; see the ride block
         in the ceremony) and tightened tail so the two pops read as a
         pair. The mini's own slide-out (hpOut, .09s) and the hp-gone
         timeout track the hand number: three places, one beat. */
      hand:  72,    /* the mini clears the stack before its card is in the air */
      deal:  233,   /* one card's flight, stack → slot */
      settle: 100,  /* the landed card holds alone before its offer box answers */
      ask:   130,   /* the offer box's own beat before the next card launches */
      rideX: 1.5,   /* the page-down ride's length as a MULTIPLE of the deal
                       (round 6: "the scroll out paces the deal... slow the
                       scroll a bit") — the ride outlasts the deal, MESSAGE
                       stamps mid-ride and its pop lands ≈ as the page parks */
      tail:  1000,  /* MESSAGE → SEND, tightened (round 5: "arrive sooner, that way
                       the pops can happen closer together") — SEND's stamp lands
                       as MESSAGE's pop settles */
      rest:  1600,  /* the pair stands through SEND's own word pop before the page goes back up */
      home:  1240   /* the ride home — ×2 his round-2 ask, DRIVEN by glide (native smooth owns its own clock) */
    };
    /* THE DRAWN CARET — see the .pa-caret CSS for why it is drawn rather
       than focused. Seated off the real input because the row is a flex
       box whose label width moves with the copy; retires on first touch of
       the field, and on any re-render (renderLisst rebuilds the row). */
    function showOfferCaret(inner, target) {
      /* round 5: the caret WALKS — a picks-card tap re-seats it in that
         card's own box (target); the ceremony still plants it in the
         first (no target). One caret on the page, ever. */
      const ask = target || inner.querySelector(".pick-ask");
      const inp = ask && ask.querySelector(".pick-in");
      if (!ask || !inp) return;
      const old = inner.querySelector(".pa-caret");
      if (old) { if (old.parentElement === ask) return; old.remove(); }
      const caret = document.createElement("i");
      caret.className = "pa-caret";
      caret.setAttribute("aria-hidden", "true");
      ask.appendChild(caret);
      /* offsetLeft/Top read against .pick-ask, which is already
         position: relative for the rails that hang off it */
      caret.style.left = (inp.offsetLeft + 3) + "px";
      caret.style.top = (inp.offsetTop + 4) + "px";
      caret.style.height = Math.max(12, inp.offsetHeight - 10) + "px";
      const drop = () => caret.remove();
      inp.addEventListener("focus", drop, { once: true });
      ask.addEventListener("pointerdown", drop, { once: true });
    }

    /* THE OFFER FIELD'S KEYBOARD — see body.kbd in the CSS for what iOS
       actually does here. Two moves, and the first is the one that
       matters most: SEAT THE FIELD OURSELVES BEFORE THE FOCUS LANDS. iOS
       only hauls the viewport around because the field it is about to
       focus sits where the keyboard is going to be — put it in the upper
       third first and there is little or nothing left for Safari to
       correct, so the chrome is never displaced in the first place. The
       --vvTop tracking is the safety net for whatever correction it still
       makes. pointerdown, not focus: this has to run BEFORE the browser
       starts its own scroll. */
    (function offerFieldKeyboard() {
      const vv = window.visualViewport;
      const sync = () => document.body.style.setProperty(
        "--vvTop", Math.max(0, Math.round(vv.offsetTop)) + "px");
      document.addEventListener("pointerdown", e => {
        const inp = e.target.closest && e.target.closest(".pick-in");
        if (!inp || !dockActive()) return;
        const r = inp.getBoundingClientRect();
        const delta = Math.round(r.top - innerHeight * .3);
        if (Math.abs(delta) > 24)
          window.scrollTo({ top: Math.max(0, scrollY + delta), left: 0, behavior: "instant" });
      }, true);
      if (!vv) return;
      document.addEventListener("focusin", e => {
        if (!(e.target.closest && e.target.closest(".pick-in")) || !dockActive()) return;
        document.body.classList.add("kbd");
        sync();
        vv.addEventListener("resize", sync);
        vv.addEventListener("scroll", sync);
      });
      document.addEventListener("focusout", e => {
        if (!(e.target.closest && e.target.closest(".pick-in"))) return;
        document.body.classList.remove("kbd");
        document.body.style.removeProperty("--vvTop");
        vv.removeEventListener("resize", sync);
        vv.removeEventListener("scroll", sync);
      });
    })();

    let dealN = 0;
    function playPicksDeal() {
      const n = ++dealN;
      const inner = colpage.querySelector(".colpage-inner");
      if (!inner) return;
      /* desktop has no stack to deal from and no ceremony; reduced motion
         gets the page whole. Both leave .picks-deal off entirely, so the
         CSS held-states never apply and nothing can be left hidden. */
      if (!dockActive() || reduced) return;
      inner.classList.add("picks-deal");
      /* the shield goes up with the gate — see body.dealing in the CSS */
      document.body.classList.add("dealing");
      const mast  = inner.querySelector(".picks-mast");
      const cells = [...inner.querySelectorAll(".pick-cell")];
      const empty = inner.querySelector(".lisst-empty");
      const msg   = inner.querySelector(".picks-msg");
      const send  = inner.querySelector(".picks-copy");
      const wait  = ms => new Promise(r => setTimeout(r, ms));
      /* the ceremony owns the page only while all three stay true: it is
         the newest deal, its DOM is still attached, and we are still on
         the picks page. Any of them false and it stands down silently. */
      const alive = () => n === dealN && inner.isConnected &&
                          location.hash.replace(/^#/, "") === "my-lisst";
      /* a stand-down WITHOUT a route must drop its own shield (2026-08-16
         A/B verify catch): route() removes body.dealing on every routed
         exit, but an inner DETACHED by a same-page re-render (closeLb's
         landing belt, a 940 boundary re-dress) stands the ceremony down
         with the z-6700 shield still up — the page reads frozen until the
         next route. Newest-deal-guarded so a successor ceremony's shield
         can never be stripped by its predecessor's bail. */
      const bail = () => { if (n === dealN) document.body.classList.remove("dealing"); };
      /* THE CEREMONY'S SCROLLS ARE DRIVEN, NOT DELEGATED (round 2 built
         glide for the ride home; round 4 widened it; round 5 settled the
         shape: TWO rides total — the deal's single page-down, timed to
         the whole deal, and the ride home) — a native smooth scroll owns
         its own duration (~.4s, not ours to set). rAF + eased writes
         instead; each write must be behavior:"instant" or html's
         scroll-behavior:smooth turns every frame's write into its own
         animation (route()'s scrollTo lesson). THE AWAIT IS THE ORDERING
         GUARANTEE: nothing lands or stamps until its ride finishes —
         "the message box doesnt get drawn before its in frame" is
         structural, not timed. Bails quietly mid-glide if the ceremony
         loses the page — route()'s own instant reset owns the scroll
         from there. */
      const glide = (top, ms) => new Promise(res => {
        const y0 = scrollY, dy = top - y0, t0 = performance.now();
        const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        const step = now => {
          const p = Math.min(1, (now - t0) / ms);
          window.scrollTo({ top: y0 + dy * ease(p), left: 0, behavior: "instant" });
          if (p < 1 && alive()) requestAnimationFrame(step); else res();
        };
        requestAnimationFrame(step);
      });

      /* an interrupted deal must not leave the stack half-dealt: route()
         repopulates on the way out, and this is the belt to that braces */
      const clearMinis = () => hpicksEl && hpicksEl.querySelectorAll(".hpick")
        .forEach(m => m.classList.remove("hp-out"));
      clearMinis();

      /* ONE PICK'S DEAL — the flight is pickCatch run backwards: the bar
         caught this card on the way in, so the bar deals it on the way
         out. EVERY deal comes off the TOP of the stack (his call) and the
         mini STAYS GONE. "Top" is the last mini still standing: the boxes
         are all 8px and each one's artwork spills right over its
         neighbour, so the last one is the only card fully in view — take
         it away and the next is revealed as the new top for free, no
         re-render and no z-index. Target is the real card's own slot,
         re-measured every frame by bayFlight in case the page is still
         settling under it. */
      const dealCard = async (cell, idx) => {
        const card = cell.querySelector(".scard");
        const ask  = cell.querySelector(".pick-ask");
        if (!card || !hpicksEl) { cell.classList.add("dealt"); return; }
        const ci = +card.dataset.ci, k = +card.dataset.k;
        const c = COLLECTIONS[ci], b = c && c.boards[k];
        /* the FRONT card is the leftmost one still standing (the stack
           faces left now) — take it away and the next slides forward into
           the front seat on its own, no re-render. Past HPICK_MAX there
           are more picks than minis: the fallback below launches the
           remainder from the stack's own seat, which still reads as
           coming out of the bar. */
        const standing = [...hpicksEl.querySelectorAll(".hpick")].filter(m => !m.classList.contains("hp-gone"));
        const mini = standing[0];
        /* measure the mini's ARTWORK, not its box: the box is the 8px
           clipping window, the .d7f inside it is the actual 25px-wide
           card the eye sees, and that is what the flight leaves from */
        const art = (mini && mini.querySelector(".d7f")) || mini || hpicksEl;
        const mr = art.getBoundingClientRect();
        const cr = card.getBoundingClientRect();
        if (!b || !cr.height || !mr.height) { cell.classList.add("dealt"); return; }
        /* THE MINI LEAVES FIRST, AND FOR GOOD — his beat, "exit to the
           right just before the card is in flight... and have it stay
           gone on deal". .hp-gone collapses the box so the stack really
           shrinks behind the front seat (the count holds that corner and
           the locked box keeps the bar word still), which is what sells
           the minis as the cards themselves. */
        if (mini) {
          mini.classList.add("hp-out");
          setTimeout(() => mini.classList.add("hp-gone"), 90);   /* = the hpOut duration */
        }
        await wait(PX.hand);
        if (!alive()) return;
        /* the launch rect is CARD-SIZED but centred on the mini, so the
           template renders at its drawn width while the flight still
           starts from the stack (see .deal-grow for why) */
        const sr = {
          left: mr.left + mr.width / 2 - cr.width / 2,
          top:  mr.top + mr.height / 2 - cr.height / 2,
          width: cr.width, height: cr.height
        };
        const { fly } = buildFly(card, ci, b, k, b.id);
        /* the fly must wear the PICKS dress, not the rest dress: these
           cards are pre-finished by the .lisst-card chipwipe rules, so a
           bare fly would land undressed against a dressed card and the
           handoff would flash (rest == rest, the soft-return law). The
           class goes on the fly WRAPPER — .lisst-card sits on .scard in
           renderLisst's markup, and the rules read its descendants. */
        fly.classList.add("lisst-card");
        /* the growth rides an INNER wrapper — bayFlight writes the fly's
           own transform every frame and would overwrite a scale set here */
        const grow = document.createElement("div");
        grow.className = "deal-grow";
        grow.style.setProperty("--g0", Math.max(.05, mr.height / cr.height).toFixed(3));
        grow.style.animationDuration = PX.deal + "ms";
        while (fly.firstChild) grow.appendChild(fly.firstChild);
        fly.appendChild(grow);
        const getEnd = () => {
          const tr = card.getBoundingClientRect();
          return { x: tr.left + tr.width / 2, y: tr.top + tr.height / 2, h: tr.height };
        };
        /* no drain: the fly stays dressed the whole way down, because
           what it lands on is dressed. (The deck's flights drain because
           they land on a rest card — the opposite case.) */
        await new Promise(done => {
          bayFlight(fly, sr, getEnd, { dur: PX.deal / 1000 }, done);
        });
        cell.classList.add("dealt");
        if (!alive()) return;
        await wait(PX.settle);
        if (ask) ask.classList.add("in");
        await wait(PX.ask);
      };

      (async () => {
        await wait(30);
        if (!alive()) return bail();
        if (mast) mast.classList.add("in");
        await wait(PX.mast);
        if (!alive()) return bail();
        if (empty) {
          empty.classList.add("in");
          inner.classList.remove("picks-deal");
          document.body.classList.remove("dealing");
          return;
        }
        /* ONE CONTINUOUS RIDE DOWN (round 5: "have the scroll to the
           bottom be one continuous motion. time the scroll from deal
           start to message box entrance") — the per-row walks and the
           closing seat scroll folded into a single glide, launched with
           the first card and timed to the deal × PX.rideX (round 6 — at
           1:1 the scroll outpaced the deal), ending at the seat that
           leaves SEND its 150px of toolbar room. Layout never moves
           during the ceremony (the held-state law), so the end seat is
           measurable before the first card flies; bayFlight re-measures
           landings per frame, so cards land true on the moving page (the
           getEnd law). Below-fold slots arrive into frame in step with
           their cards — the eased ride is fastest mid-deal, where the
           middle rows live. */
        let ride = null;
        if (send) {
          const r = send.getBoundingClientRect();
          const max = document.documentElement.scrollHeight - innerHeight;
          const target = Math.min(max, Math.max(0, Math.round(scrollY + r.bottom - (innerHeight - 150))));
          const dealTotal = cells.length * (PX.hand + PX.deal + PX.settle + PX.ask);
          if (target > scrollY + 6) ride = glide(target, dealTotal * PX.rideX);
        }
        for (let i = 0; i < cells.length; i++) {
          if (!alive()) { clearMinis(); return bail(); }
          await dealCard(cells[i], i);
        }
        /* the bar is empty now and the page holds every pick — from here
           any re-render on this page must agree (renderPicks self-gates
           on this flag) until a route puts the cards back in your hand.
           The re-render is run RIGHT HERE rather than left to the next
           caller, so the two ways of arriving at an empty bar are the
           same code: otherwise a freshly-dealt stack kept its count
           hanging in the corner ("4" beside nothing) while a stack that
           had been re-rendered since showed nothing at all. */
        stackDealt = true;
        renderPicks();
        if (!alive()) return bail();
        /* THE CLOSING ARC (re-sequenced round 6: "its okay if the
           message box gets drawn [as the deal ends], pulses should
           still fire around [the parked seat]") — the ride outlasts the
           deal now, so MESSAGE stamps WHILE the page is still riding:
           in frame by construction, since the ride is headed to the
           seat that frames it. Its .82s pop then lands roughly as the
           page parks. The ride await moved BELOW msg.in — SEND still
           waits for the parked seat plus the full tail. */
        if (msg) msg.classList.add("in");     /* — here's the message */
        if (ride) await ride;
        if (!alive()) return bail();
        await wait(PX.tail);
        if (!alive()) return bail();
        if (send) send.classList.add("in");   /* — and here's how you send it */
        /* the page is YOURS the moment SEND appears (round 5's lock law);
           its pop plays on an unlocked page */
        document.body.classList.remove("dealing");
        /* let the pair stand, then take the page home and point at the
           first offer box: the last thing the reader is shown is the
           thing they are meant to do next */
        await wait(PX.rest);
        if (!alive()) return bail();
        await glide(0, PX.home);
        if (!alive()) return bail();
        showOfferCaret(inner);
        /* the gate comes off at the end: every held state drops with it,
           so an interrupted or mis-stepped ceremony can never strand a
           part invisible. The .in / .dealt classes are inert once it is
           gone (their rules are all scoped under .picks-deal). */
        await wait(500);
        inner.classList.remove("picks-deal");
        document.body.classList.remove("dealing");   /* belt — send.in already dropped it */
      })();
    }

    /* THE DEPARTURE — his ask: "regardless of where you are on the site,
       if you click the stack in the header, the rest of the site below it
       fades out." So the picks route is the one route that leaves before
       it arrives: drain the page under the bar, THEN flip the hash. The
       bar is deliberately exempt — it is what you tapped, and it is where
       the cards are about to come from. */
    function leaveToPicks() {
      if (location.hash.replace(/^#/, "") === "my-lisst") return;
      if (!dockActive() || reduced) { location.hash = "my-lisst"; return; }
      document.body.classList.add("pxleave");
      setTimeout(() => { location.hash = "my-lisst"; }, PX.leave);
    }
    /* the stack is the door his ask names. It stays a real #my-lisst
       link in the markup — the href is the fallback for no-JS, for
       desktop, and for reduced motion; the handler only takes over the
       phone's ceremonial path. The other two doors that reach YOUR PICKS
       from elsewhere (the browse's left-swipe commit and the case's MSG
       bar) route through the same departure, so the page can never
       arrive two different ways. */
    const piconEl = document.getElementById("picon");
    if (piconEl) piconEl.addEventListener("click", e => {
      if (!dockActive() || reduced) return;   /* let the href do its job */
      e.preventDefault();
      leaveToPicks();
    });

    /* the word the phone bar carries for a given route (see routeReset).
       The four collection words are read back out of the drop's own rows,
       so the bar and the menu share one vocabulary by construction. */
    function barWordFor(id) {
      if (id === "my-lisst") return "YOUR PICKS";
      if (id === "shop-all") return "COLLECTIONS";
      if (!id) return "AVRG";   /* home wears the brand word (2026-08-16 A/B —
                                   supersedes the noword/mark-is-the-name rule;
                                   the word is the door on home too) */
      const row = document.querySelector('#drop .drow[href="#' + id + '"]');
      return row ? row.textContent.trim().toUpperCase() : "";
    }

    /* THE LOGO DRAWS ITSELF ON EVERY HOME ARRIVAL (2026-08-16, thread 1
       opens). SMIL's begins run on wall-clock from document load, so a
       boot on a collection page would leave the drawing long finished
       by the first visit home — the rewind is what makes the draw an
       ARRIVAL beat rather than a load beat. Reduced motion gets the
       finished mark (jump past the timeline's end; fill=freeze holds
       it): the logo is content, the drawing is theater. */
    const logoDraw = document.getElementById("logo-draw");
    function playLogo() {
      if (!logoDraw || !logoDraw.setCurrentTime) return;
      try { logoDraw.setCurrentTime(reduced ? 9 : 0); } catch (e) {}
    }
    /* ========= the router: every hash lands here ========= */
    let picksArriving = false;
    function route() {
      sendUnlock();
      /* a route mid-ceremony must not leave the page sealed — the deal
         shield's belt (its buckle is send.in, in playPicksDeal) */
      document.body.classList.remove("dealing");
      picksArriving = false;
      /* the departure's drain ends HERE, without a transition (the rule
         is scoped to the class, so dropping it snaps): the arriving page
         holds itself hidden through .picks-deal, and fading it in over
         the top of its own ceremony would state everything twice */
      document.body.classList.remove("pxleave");
      if (!lb.hidden) closeLb(true);
      if (!vlb.hidden) closeVlb(true);
      const id = (location.hash || "").replace(/^#/, "");
      const i = COLLECTIONS.findIndex(c => c.id === id);
      /* the picks page wears an opaque bar — see body.on-picks in the CSS */
      document.body.classList.toggle("on-picks", id === "my-lisst");
      if (id === "shop-all") {
        renderShopAll();
        home.hidden = true; colpage.hidden = false;
        vid.pause();
      } else if (id === "my-lisst") {
        renderLisst();
        home.hidden = true; colpage.hidden = false;
        vid.pause();
        picksArriving = true;   /* played below, AFTER lockCardScale has sized the cards */
      } else if (i >= 0) {
        renderColPage(COLLECTIONS[i], i);
        home.hidden = true; colpage.hidden = false;
        vid.pause();
      } else {
        colpage.hidden = true; home.hidden = false;
        const p = vid.play(); if (p && p.catch) p.catch(() => {});
        playLogo();   /* the arrival draw — every visit home, not just boot */
      }
      /* the menu never lists the page you're on: home's own row hides
         while home is showing (body.on-home gates the CSS) */
      document.body.classList.toggle("on-home", !home.hidden);
      lockCardScale();   /* after visibility settles — hidden grids measure 0 */
      applyDeckHoles();  /* fresh renders don't know which boards the deck holds */
      /* THE STACK REPOPULATES ON THE WAY OUT — his rule: "a move anywhere
         else should repopulate them". Every route clears the dealt flag
         and re-renders, so leaving refills the bar AND arriving hands the
         ceremony a full stack to deal from. */
      stackDealt = false;
      benched.clear();   /* the bench is per-visit — every route resets the curation */
      renderPicks();
      /* THE ARRIVAL LANDS AT THE TOP — instant, same as unlockScroll's
         restore, and load-bearing for the same reason (2026-08-15): html
         carries scroll-behavior smooth, so a plain scrollTo ANIMATED. A
         route fired from a scrolled page painted the NEW page at the OLD
         offset — YOUR PICKS arriving already past its own masthead — then
         glided ~420ms to 0 under the reader. Measured 515 → 515 → 484 →
         208 → … → 0. That is Dylan's "strange collections viewing" AND
         the drop menu's page-jump: one line, both complaints. Instant
         puts the top of the page in the same frame as its render. */
      /* AND THE LOCK'S RESTORE POINT MOVES WITH IT (2026-08-17, his live
         catch: stack tap from an open lightbox on a scrolled collection
         dealt the picks page at the OLD BOTTOM — blank screen, last card's
         lower half). Mechanism: the scrollTo below fires while the body is
         still PINNED by the closing sheet's lock (position:fixed — nothing
         to scroll, silent no-op), then closeLb's 0ms landing runs
         unlockScroll ONE MACROTASK LATER and restores lockY, the departed
         page's offset. Zeroing lockY makes that deferred restore land at
         the top too — whichever writer fires last, the answer is 0. */
      lockY = 0;
      window.scrollTo({ top: 0, left: 0, behavior: "instant" });
      /* the ceremony plays LAST — after lockCardScale has sized the cards
         and after the instant landing, so the first beat is painted at
         the top of the page with the grid already at its final geometry.
         Every landing rect the deal measures depends on that. */
      if (picksArriving) playPicksDeal();
      /* every jump lands as COLLECTIONS — the relay's door-state law:
         scroll is at 0 now (TRUE only since the instant landing above),
         so all boundaries re-arm and the name is earned again by
         scrolling, never granted by the click */
      /* the phone's bar word — see routeReset. The collection words come
         OUT OF THE DROP'S OWN ROWS rather than a second list: the menu is
         where Dylan named these four, and reading them back means the bar
         and the menu can never drift apart. Home passes "" on purpose —
         the showroom names itself with the mark. */
      relay.routeReset(dockActive() ? barWordFor(id) : null);
    }
    window.addEventListener("hashchange", route);
    document.getElementById("home-link").addEventListener("click", () => { location.hash = ""; });
    /* On a phone the LOGO IS THE MENU (2026-08-06) — the pill tab row is
       retired down here, so the logo takes the nav's job. Home moves into the
       menu's first row rather than simply vanishing: taking the logo's old
       job without giving it somewhere else to live would strand the home
       page with no door. Desktop is untouched — up there the logo still
       just goes home, because the drawn bar already carries the nav. */
    document.getElementById("bar-brand").addEventListener("click", e => {
      if (!drawnBarOn()) {
        e.preventDefault();
        if (drop.classList.contains("open")) closeDrop(true); else openDrop();
        return;

       hide behind — which is exactly why it reads as dealing off a deck. */
    const deckMap = (g, box) =>
      "translate(" + (box.x - g.H.x) + "px," + (box.y - g.H.y) + "px) scale(" + (box.w / g.H.w) + ")";

    let xactN = 0, xactEls = [], xactPending = null;
    function xactClear() {
      xactEls.forEach(el => el.remove());
      xactEls = [];
    }
    /* the real furniture sits out a shuffle; this hands it back. (navdraw is
       deliberately NOT re-added here: closeLb also reveals, and a close mid-
       shuffle flies home without arrows — they left with the card.) */
    function xactReveal() {
      lbCard.style.visibility = "";
      NBS.forEach(([el]) => { el.style.visibility = ""; });
    }
    /* An in-flight shuffle LANDS INSTANTLY when the next press arrives — the same
       idiom as lbArcKill ("an in-flight deck arc settles instantly first"). This
       is load-bearing, not tidiness: step() derives its target from cur.k, and
       cur only advances at the landing, so without settling first a second press
       inside the 420ms window would recompute the SAME target and silently drop
       the press. Settling makes every press count and keeps each shuffle a
       correct one-board move. */
    /* ---- the header's two numbers, counter-rotating across a shuffle ----
       Exit from the press, new values landing with the card (see the .lbhead
       keyframes for the directions and for why this is not the fade Dylan
       killed). Tokened on xactN like every other actor in the exchange, so a
       second press inside the window cannot strand a half-played swap with a
       number sitting translated at opacity 0. */
    let headT = null;
    function headClear() {
      clearTimeout(headT);
      headT = null;
      lbHead.classList.remove("swapping", "swapped");
    }
    function headSwap(ci, k, my) {
      const T = innerWidth <= 720 ? Object.assign({}, NB_TUNE, NB_TUNE.mob) : NB_TUNE;
      const out = Math.round(T.xDur * T.headOut), inn = T.xDur - out;
      /* the exit's DURATION is shorter than its SLOT. A CSS animation starts
         on the frame after the class lands, so an exit given the full slot is
         still ~2 frames from finishing when the swap timer fires, and gets
         cancelled at ~92% — a small pop right where an ease-in moves fastest.
         Ending it early and letting `both` hold the landed state costs
         nothing visually and makes the swap a clean cut. (The ENTER cannot
         use the same trick because it must finish ON the card's landing, so
         it is timed generously and cleaned by its own animationend.) */
      headClear();
      lbHead.style.setProperty("--hout", Math.max(60, out - 30) + "ms");
      lbHead.style.setProperty("--hin", inn + "ms");
      lbHead.style.setProperty("--hease", T.xEase);
      lbHead.classList.add("swapping");
      headT = setTimeout(() => {
        if (my !== xactN) return;
        const c = COLLECTIONS[ci];
        /* setHead re-seats the counter as it writes the number, and this is
           the moment INSIDE the fade — the out has just finished, the in has
           not started — so the counter is at opacity 0 and its travel across
           the band is never seen */
        setHead(c, c.boards[k], k);
        lbHead.classList.remove("swapping");
        lbHead.classList.add("swapped");
        /* cleanup rides the ENTER'S OWN animationend, not a timer. A timer
           has to guess when the enter actually began — the class flip lands
           on the next frame, and the measured slop was ~2 frames — so an
           inn-length timeout cut the last 15% of the settle and snapped it.
           The timeout survives only as the fallback for a tab hidden
           mid-gesture, where CSS animations freeze and the event never
           fires (the same hazard that governed the LAND flourish). */
        const done = () => { if (my === xactN) lbHead.classList.remove("swapped"); };
        /* lbhCur, not lbhNum: the tag is display:none since the strip took
           its seat (2026-08-12), and a hidden element never fires the event */
        lbhCur.addEventListener("animationend", done, { once: true });
        headT = setTimeout(done, inn + 160);
      }, out);
    }
    function xactSettle() {
      if (!xactPending) return;
      const p = xactPending;
      xactPending = null;
      xactN++;                     /* void the pending landing */
      headClear();                 /* ...and any half-played number swap with it */
      populate(p.ci, p.k, 0);
      migrateHole(p.ci, p.k);      /* the lift-out hole re-seats at the landing */
      /* the settled hero rebuilds its dress too — step() settles BEFORE its
         end clamp, so this may be the only landing this press produces */
      if (lbCard.classList.contains("stay")) lbCard.classList.add("redress", "navdraw");
      /* the slide family's instant settle is a landing too — it must not
         leave the card stranded clean (populate just reset the status word,
         so the decode is fresh either way; re-adding a present tset is a
         no-op, no restart) */
      if (dockActive() && CARD === "framev3" && !lb.hidden) dockDress();
      /* the SLIDE family (mobile) moves the real card, not clones — an
         instant settle must also park it back on its seat. Transition is
         muted for the snap and handed back a frame later so the very next
         slide can take it over cleanly; desktop exchanges hold no inline
         transform here (sun released, card ridden out hidden), so this is
         a no-op for them. */
      lbCard.style.transition = "none";
      lbCard.style.transform = "";
      lbCard.style.opacity = "";
      requestAnimationFrame(() => { lbCard.style.transition = ""; });
      xactReveal();
      xactClear();
    }
    /* the touch dress, one packet: the fills (.tset) + the status word's
       decode. Called at LANDING beats only, never at flight start — the
       dress grammar (Dylan, 2026-08-08): "the inspected card arrives
       undressed and dresses on landing." */
    let dressN = 0;   /* tokens the board lift: an undress voids a pending one */
    function dockDress() {
      lbCard.classList.add("tset");
      /* THE BOARD LIFT (2026-08-08 evening): the fills run .22s–.66s
         after the dress lands; the lift arms at the .44 midpoint and
         rides its own slow ease (.blift CSS — the desktop hover grow as
         a resting state). Tokened so a swipe's undress can't hand the
         last card's timer to the arriving one mid-flight; the tset
         guard keeps a lift off any card that has already undressed. */
      const my = ++dressN;
      setTimeout(() => {
        if (my === dressN && lbCard.classList.contains("tset")) lbCard.classList.add("blift");
      }, 440);
      const stx = document.getElementById("lb-fv3-sttxt");
      if (stx && stx.dataset.txt) {
        if (reduced) stx.textContent = stx.dataset.txt; else decodeInto(stx, stx.dataset.txt);
      }
      /* the chip's word rides the mobile arrival (round 4, revised round
         5: ADD, not a want word — "bottom right decodes now read
         ADD+blank mini card"); a ✓ board prints Mine ! (populate wrote
         the glyph fresh, so this re-says it in the phone's words every
         exchange) */
      const lft = lbCard.querySelector(".fc-list .ft");
      if (lft) {
        if (/✓/.test(lft.textContent)) lft.textContent = "Mine !";
        else if (reduced) lft.textContent = "ADD";
        else decodeInto(lft, "ADD");
      }
      /* the name line decodes to real dims at the landing (2026-08-16,
         the mobile dims pass — the lb is the inspection, it always
         speaks; populate resets the print name, so every arrival plays).
         Boards without a DIMS_MM row keep their name. The flipped guard
         is belt: populate stands a flip down silently before any
         landing, but a dress must never talk over UNDERSIDE. */
      const dnm = document.getElementById("lb-fv3-nmt");
      if (dnm && dnm.dataset.dims && !lbCard.classList.contains("flipped")) {
        if (reduced) dnm.textContent = dnm.dataset.dims;
        else decodeCollapse(dnm, dnm.dataset.dims);   /* the lb dims read rides THE COLLAPSE (item 2) */
      }
    }
    /* ...and its inverse: shed the previous inspection's dress as a SNAP,
       never a transition (see the .snap0 CSS note — the rails otherwise
       play their teardown on screen). Reflow commits the muted frame;
       the class drops on the next painted frame. */
    function dockUndress() {
      dressN++;   /* void any lift still on the clock */
      lbCard.classList.add("snap0");
      lbCard.classList.remove("tset", "blift");
      void lbCard.offsetWidth;
      requestAnimationFrame(() => lbCard.classList.remove("snap0"));
    }
    /* ---- THE PHONE EXCHANGE IS A SLIDE (2026-08-07, Dylan's pre-event spec:
       "only 1 card visible at a time ... no click into place, no sound
       effect ... swipe along a natural path — no one wants to fight a
       phone"). The four-body conveyor is desktop physics: clones, flank
       seats, a kclick at settle. On touch the exchange is the SWIPE ITSELF —
       the real card rides off along the finger's line, the next board rides
       in from the opposite edge, silent, no landing press. fromX carries the
       finger-follow offset so a tracked swipe commits from wherever the
       thumb left the card instead of snapping to center first. Tokened on
       xactN + xactPending exactly like deckExchange, so a second swipe
       mid-flight lands this one instantly (every press counts) and closeLb
       voids it. THE ARRIVING CARD COMES IN CLEAN (2026-08-08 — this
       REVERSES the 08-07 keep-tset call, on Dylan's own react: "right now
       a swipe pulls in a card thats already animated"): tset is shed at
       the populate beat, invisibly off-edge, and the dress replays at the
       IN glide's landing — the desktop's redraw-at-the-landing grammar in
       the slide's dialect. Silent as ever: the dress is a visual fill,
       no kclick. */
    function slideExchange(ci, k, dir) {
      slideT = performance.now();   /* arms the tracker's cool-down */
      buzz(8);                      /* the page-turn tick — no sound on purpose */
      sunRelease();
      pinchReset();   /* a held zoom must not ride into the exchange */
      if (lbCard.classList.contains("flipped") || lbCard.classList.contains("fset")) {
        setFlip(lbCard, false, true);
      }
      const my = ++xactN;
      xactClear();
      headSwap(ci, k, my);         /* the counter's two numbers keep their choreography */
      stripTo(k);                  /* the strip pop rides the same press (sit/lift off the mob 420) */
      const W = lb.clientWidth || innerWidth;
      const OUT = 240, IN = 300;
      xactPending = { ci: ci, k: k };
      /* out: from wherever the card is (0, or the finger's parked offset) */
      lbCard.style.transition = "transform " + OUT + "ms ease-in";
      lbCard.style.transform = "translateX(" + (-dir * W) + "px)";
      setTimeout(() => {
        if (my !== xactN) return;
        xactPending = null;
        populate(ci, k, 0);
        migrateHole(ci, k);
        dockUndress();   /* off-edge: the card arrives CLEAN — snapped, so no teardown rides the re-entry */
        lbCard.style.transition = "none";
        lbCard.style.transform = "translateX(" + (dir * W) + "px)";
        void lbCard.offsetWidth;
        lbCard.style.transition = "transform " + IN + "ms cubic-bezier(.22,1,.36,1)";
        lbCard.style.transform = "";
        setTimeout(() => {
          if (my !== xactN) return;
          lbCard.style.transition = "";
          dockDress();   /* the dress plays AT the landing — one gesture */
        }, IN + 30);
      }, OUT);
    }
    /* ---- THE BAND'S TRAIN (born 2026-08-12 as the card-swipe momentum
       carousel; DEMOTED the same day, react round 4 — Dylan: "the LB card
       swipe should actually go back to how it functioned before we had the
       mini cards … swipe is one card at a time. if you want to thumb
       though, thats the minis job. so keep the tie there"). The card swipe
       is the ONE-STEP SLIDE again (the restored tracker below); this engine
       survives as THE BAND SCRUB'S ONLY, driven absolutely by the finger on
       the lane. The real card hides and bare clones convey (the exchange
       idiom — the dress leaves with the hidden card), the strip and the
       counter follow every CROSSING on the hand's clock, release SNAPS the
       nearest board and the landing is the slide's own law — populate,
       arrive clean, dress AT the settle. Silent throughout (phone dialect).
       The momentum half — flick, coast, catch-the-train, wall exit — and
       round 3's arc pose (edgeScale/edgeDrop grow-shrink) live in vault
       repo history, d25ee4a, if either is ever wanted back; "the spacing between LB cards
       can stay" kept the widened gap. Clones ride .lbnb.xact with
       transitions MUTED inline: the base .lbnb transition is deckActor's
       tween, and a per-frame pose written through a live transition is

    const CARO_TUNE = {
      gap: 34,       /* px between train cards, panel edge to panel edge
                        (22 read "a bit too tight" — Dylan, react round 3) */
      snapMs: 240    /* the snap tween's clock (ease-out, the settle's feel) */
    };
    let caro = null, caroRaf = 0;
    function caroStart() {
      const g = deckGeom();
      if (!g || !cur) return false;
      sunRelease();
      if (lbCard.classList.contains("flipped") || lbCard.classList.contains("fset"))
        setFlip(lbCard, false, true);
      xactSettle();                     /* a pending slide lands first */
      const c = COLLECTIONS[cur.ci], vis = [];
      /* the strip's own visibility law: held boards have no slot, the
         inspected one keeps its seat (the case-inspection exception) */
      c.boards.forEach((b, i) => { if (!inLisst(b.id) || i === cur.k) vis.push(i); });
      const ord = {};
      vis.forEach((bi, o) => { ord[bi] = o; });
      const o0 = ord[cur.k] ?? 0;
      caro = { ci: cur.ci, vis, ord, g, pitch: g.H.w + CARO_TUNE.gap,
               pos: o0, near: o0, els: new Map() };
      dockUndress();                    /* clones are bare — the dress returns at the landing */
      lbCard.style.visibility = "hidden";
      caroPose();
      return true;
    }
    function caroPose() {
      const c = caro;
      if (!c) return;
      const coll = COLLECTIONS[c.ci];
      const lo = Math.max(0, Math.floor(c.pos) - 1),
            hi = Math.min(c.vis.length - 1, Math.ceil(c.pos) + 1);
      for (const [k, el] of c.els)
        if (c.ord[k] < lo || c.ord[k] > hi) { el.remove(); c.els.delete(k); }
      for (let o = lo; o <= hi; o++) {
        const k = c.vis[o];
        let el = c.els.get(k);
        if (!el) {
          el = document.createElement("div");
          el.className = "lbnb live xact";
          el.style.cssText = "left:" + c.g.H.x + "px;top:" + c.g.H.y +
            "px;width:" + c.g.H.w + "px;opacity:1;transition:none";
          el.innerHTML = JCARDS.framev3(jmeta(coll, coll.boards[k], k));
          lb.insertBefore(el, carBack);   /* the neighbours' stacking slot */
          c.els.set(k, el);
        }
        /* flat conveyor — round 3's arc pose (grow/shrink + t² sink) was
           removed in round 4 ("lets remove the grow and the shrink"); it
           lives at git d25ee4a with its edgeScale/edgeDrop knobs */
        el.style.transform = "translateX(" + ((o - c.pos) * c.pitch) + "px)";
      }
      /* the dot rides the scrub RAW — c.pos is already slot-order space,
         and the snap tween pumps through here too, so the settle is
         smooth for free (no transition to fight the per-frame writes) */
      progTo(c.pos, false);
      const near = Math.max(0, Math.min(c.vis.length - 1, Math.round(c.pos)));
      if (near !== c.near) {            /* a crossing — strip + counter follow the hand */
        c.near = near;
        buzz(6);
        /* plain write, not headSwap: the swap choreography belongs to the
           press's one-step beat; a coast crosses too fast to spend it */
        lbhCur.textContent = c.vis[near] + 1;
        sFocus = c.vis[near];
        clearTimeout(sHovT);
        lbStrip.classList.add("hovlive");
        stripTo();
      }
    }
    function caroSnap(o) {
      const c = caro;
      const from = c.pos, d = o - from;
      if (Math.abs(d) < .002) { caroSettle(o); return; }
      const t0 = performance.now();
      const tween = () => {
        if (caro !== c) return;
        const t = Math.min((performance.now() - t0) / CARO_TUNE.snapMs, 1);
        c.pos = from + d * (1 - Math.pow(1 - t, 3));

      };
      caroRaf = requestAnimationFrame(tween);
    }
    function caroSettle(o) {

      const k = c.vis[Math.max(0, Math.min(c.vis.length - 1, o))];
      const ci = c.ci;

      slideT = performance.now();       /* a settle is a landing — arm the cool-down */
      populate(ci, k, 0);
      migrateHole(ci, k);
      lbCard.style.visibility = "";
      dockDress();                      /* arrive clean, dress at the landing */
      sFocus = null;
      stripTo();                        /* the pop hands back to the landed board */

      if (!caro) return;
      cancelAnimationFrame(caroRaf);

      caro = null;
      if (restore) { lbCard.style.visibility = ""; sFocus = null; }
    }

    function deckActor(ci, k, from, to, g, fade, dur) {
      const c = COLLECTIONS[ci];
      const el = document.createElement("div");
      /* .live passes the display gate; .xact adds origin + inertness */
      el.className = "lbnb live xact";
      el.style.left = g.H.x + "px";
      el.style.top = g.H.y + "px";
      el.style.width = g.H.w + "px";
      el.innerHTML = JCARDS.framev3(jmeta(c, c.boards[k], k));
      el.style.transform = deckMap(g, from);
      el.style.opacity = fade[0];
      lb.insertBefore(el, carBack);   /* the neighbours' stacking slot, under carback */
      void el.offsetWidth;            /* commit the start pose before transitioning */
      el.style.transition = "transform " + dur + "ms " + g.T.xEase + ", opacity " + dur + "ms ease";
      el.style.transform = deckMap(g, to);
      el.style.opacity = fade[1];
      xactEls.push(el);
      return el;
    }

    function deckExchange(ci, k, dir) {
      const g = deckGeom();
      const c = COLLECTIONS[ci], n = c.boards.length, T = g && g.T;
      if (!g || reduced) { populate(ci, k, 0); migrateHole(ci, k); return; }
      /* the hero's transform is contested property — the sun writes it inline and

         writes. Hand it back before anything moves (the discipline closeLb runs),

      sunRelease();
      if (lbCard.classList.contains("flipped") || lbCard.classList.contains("fset")) {
        setFlip(lbCard, false, true);

      const my = ++xactN;
      xactClear();
      /* the header's numbers leave on this press and arrive with the card */

      /* and the strip's pop starts its sit-then-lift on the same beat */
      stripTo(k);
      const dur = T.xDur;
      const fromSeat = dir > 0 ? g.R : g.L;        /* the promoting card's seat */
      const toSeat = dir > 0 ? g.L : g.R;          /* where the hero demotes to */
      const inFrom = dir > 0 ? g.offR : g.offL;    /* the entrant stages off-sheet */
      const outTo = dir > 0 ? g.offL : g.offR;     /* the leaver exits the far side */

      /* 1 - the hero demotes to the far flank (plain cards convey — Dylan,

         dress is rebuilt at the LANDING, not carried through the flight) */
      const staying = lbCard.classList.contains("stay");
      deckActor(ci, cur.k, g.H, toSeat, g, [1, T.fade], dur);
      /* 2 - the arriving board promotes into the hero seat */
      deckActor(ci, k, fromSeat, g.H, g, [T.fade, 1], dur);
      /* 3 - the next board along enters from off-sheet, if there is one —
         nextVis, so the entrant is the board the NEW flank will actually
         show (a deck-held board conveying in and vanishing at the landing
         would be a pop-out nobody pressed for) */
      const enterK = nextVis(c, k, dir);
      if (enterK !== null) deckActor(ci, enterK, inFrom, fromSeat, g, rest, dur);
      /* 4 - the board falling off the back exits, if there was one */
      const exitK = nextVis(c, cur.k, -dir);
      if (exitK !== null) deckActor(ci, exitK, toSeat, outTo, g, rest, dur);

      /* the real furniture sits out the flight and is revealed re-populated.
         THE WHOLE DRESS LEAVES WITH THE CARD (Dylan, 2026-08-01): shed every
         fill state while hidden — the teardown transitions play out
         invisibly behind the visibility, so the reveal starts from a cleanly
         undrawn card and the landing re-add replays the entire entry. */
      lbCard.style.visibility = "hidden";
      lbCard.classList.remove("navdraw", "dressed", "redress", "hold");
      NBS.forEach(([el]) => { el.style.visibility = "hidden"; });
      /* THE HEADER IS STATIC THROUGH A ROTATION (Dylan, 2026-08-01: "right now
         the counter fades between card rotations. lets make it static on the
         light box view"). It used to sit the shuffle out with the rest of the
         furniture, and coming back re-triggered the open fade — so every arrow
         press blinked the chip. It stays put now and its TEXT swaps at the
         landing, inside populate(), which is the same beat the card lands on.
         The open/close fade is untouched; only the per-rotation blink is gone. */
      xactPending = { ci: ci, k: k };

      setTimeout(() => {
        if (my !== xactN) return;    /* a newer shuffle owns the deck now */
        xactPending = null;
        populate(ci, k, 0);          /* -> renderNeighbors -> placeDeck */
        migrateHole(ci, k);          /* the lift-out hole re-seats at the landing */
        /* THE LANDING IS THE ENTRY (Dylan, 2026-08-01): the arriving hero
           was never drawn, so the reveal frame plays the whole build —
           rails close, fills wipe, tag draws (.redress), arrows assemble
           (.navdraw), texts decode (stayLand inside populate) — the old
           under-cursor redraw, no longer needing the cursor */
        if (staying) lbCard.classList.add("redress", "navdraw");
        xactReveal();
        xactClear();
        kclick();                    /* the re-stack's one voice at settle */
      }, dur);
    }

    /* THE TOSS EXCHANGE (2026-08-15, Dylan: "toss the card to the deck...

       should not exit lb view"): deckExchange minus the demote actor — the

    /* `quiet` (2026-08-21 fix round) — ONE GESTURE, ONE VOICE; THE LANDING

    function tossExchange(quiet) {
      if (!cur) return;
      xactSettle();
      const ci = cur.ci, c = COLLECTIONS[ci];
      const back = nextVis(c, cur.k, -1);
      const k = back !== null ? back : nextVis(c, cur.k, 1);
      if (k === null) { closeLb(true); return; }
      const dir = back !== null ? -1 : 1;
      const g = deckGeom();
      if (!g || reduced) { populate(ci, k, 0); migrateHole(ci, k); return; }
      sunRelease();
      if (lbCard.classList.contains("flipped") || lbCard.classList.contains("fset")) {
        setFlip(lbCard, false, true);
      }
      const my = ++xactN;
      xactClear();
      headSwap(ci, k, my);
      /* THE STRIP HOLDS ITS STRING (2026-08-15 round 4, Dylan: "can we

         changes the held-set, so the landing's renderStrip would REBUILD
         and re-deal the whole strip mid-inspection — the deal is an
         arrival gesture, not an update. Close the tossed slot IN PLACE

    function deckDeal(inward) {

      if (!g) return;

      if (!live.length) return;

    let sDotX = null, sDotTgt = null, sDotRAF = 0, sDotT0 = 0;

       the judder, and no curve fixes a chain of them (the curve table
       above measured which lurch was least bad, not smoothness). A frame

       every frame closes a fixed FRACTION of whatever gap is left.

       `1 − e^(−dt/tau)` — so the motion is identical at 60 and 120Hz and a
       dropped frame is caught up rather than skipped. tau is the trail's

       tau, ~95% in three. It owns BOTH halves of the hover grammar — the
       chase while the hand sweeps and the travel home when it leaves —

    function dotStop() { if (sDotRAF) cancelAnimationFrame(sDotRAF); sDotRAF = 0; }

            if (src) im.src = src; else im.removeAttribute("src");
          });
        });
      }
      cur = { ci, k, j };
      renderNeighbors(ci, k);
      /* a mid-inspection populate (deck exchange, settle) resets the reads to
         print; the persistent dress lands them again — changed ones only */
      stayLand();
