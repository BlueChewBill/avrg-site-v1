<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AVRG</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  /* K — home page. h-blackout cloned; since 2026-08-20 LIGHT IS THE ONE
     GROUND (the switch retired) — the body.light override block at the end
     of this stylesheet is the live dress, speaking the j-cards-white idiom
     (#fff ground, #000 max-contrast, #444 soft, #767676 hints); the dark
     h-blackout baseline underneath is unreachable, pending the sweep.
     Engine and markup are otherwise identical to h. */
  /* Satoshi Black: the heading voice (approved in the Type & Button Lab
     mockup). One weight only — 46KB, shipped from site/fonts/. */
  @font-face {
    font-family: "Satoshi";
    src: url("site/fonts/Satoshi-Black.otf") format("opentype");
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #000;
    --bone: #ddd1b6;
    --ink: #201a15;
    --soft: #c7bda4;
    --hint: #a29a89;
    --line: #6b6d71;
    --disp: "Bricolage Grotesque", -apple-system, sans-serif;
    --mono: "Space Mono", ui-monospace, monospace;
    --cbh: 52px;   /* section-bar height — see THE SECTION BAR */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background-color: var(--bg); color: var(--bone);
    font-family: var(--disp); font-weight: 400;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  ::selection { background: var(--bone); color: var(--ink); }
  img, video { display: block; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  .label {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase;
  }

  /* ---- top bar ---- */
  .topbar {
    /* z 6600 (was 1000, Dylan's catch 2026-08-03): the bar must ride
       ABOVE the flights (6500) — a deck remove whose shop slot is
       scrolled above the viewport flew its card OVER the header; page
       content, flights included, slides UNDER the fixed chrome. The
       lb/bay organs never overlap the bar spatially (they seat below
       tbh); #vlb, the one true full-screen modal, moves above the bar
       so its dark scrim keeps covering everything. */
    position: sticky; top: 0; z-index: 6600;
    display: flex; align-items: center; justify-content: center;
    gap: clamp(14px, 2.6vw, 30px);
    padding: 14px clamp(18px, 3vw, 40px);
    background-color: rgba(0, 0, 0, .86);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-bottom: 1px solid #1c1c1c;
  }
  .topbar .tab {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    color: #fff; border: 2px solid #fff; border-radius: 8px;
    padding: 10px 14px;
    transition: background .15s ease, color .15s ease;
  }
  .topbar .tab:hover { background: #fff; color: #000; }
  .topbar .dm-mini { position: absolute; right: clamp(18px, 3vw, 40px); }
  .bar-brand {
    position: absolute; left: clamp(18px, 3vw, 40px);
    display: flex; align-items: center; cursor: pointer;
  }
  .bar-brand img { width: 38px; height: 38px; border-radius: 50%; }
  /* ---- THE MOBILE BAR IS TWO ANCHORS (2026-08-06, ported from bar-lab — vault repo) ----
     The pill tab row is retired. It could not fit — ALL/ORIGINAL/SHAPED/
     ROUTED/CONTACT ME needs more width than a phone has, so the bar scrolled
     sideways and the DECK AND ITS COUNT sat off-screen on arrival. Confirmed
     on a real iPhone 17 (402pt): the receipt icon was sliced by the right
     edge with ~6px showing. A cart nobody can see is worse than no cart.
     What replaces it needs no middle space at all: the logo (which opens the
     drop) at one edge, DM and the deck at the other. That fits at 320px with
     room to spare, so it can never reflow or scroll again. */
  @media (max-width: 940px) {
    .topbar { justify-content: flex-start; gap: 8px; overflow-x: visible; }
    /* the tabs are GONE on phones — the drop is the nav now */
    #topnav .tab { display: none; }
    .topbar .dm-mini, .topbar .bar-brand { flex: 0 0 auto; white-space: nowrap; }
    .bar-brand { position: static; cursor: pointer; }
    .bar-brand img { width: 32px; height: 32px; }
    /* no rail: the bar stops being a BAND, so the scroll reads unbroken
       underneath it (Dylan's call — the mobile site is one long scroll) */
    .topbar { border-bottom: 0; }
    /* the deck mark takes the receipt glyph's seat. #picon KEEPS ITS ID AND
       ITS HANDLERS — the count bump, the picks departure — because this is
       a change of costume, not of job. Re-wiring the phone's only deck door
       two days before the event would be the one risk not worth taking. */
    /* margin-left auto, not the old 14px gap-from-DM: the phone bar's DM
       seat retired 2026-08-12 (the tidy react) and IT carried the bar's
       right-push — the picks stack inherits the job with the seat */
    .picon { margin-left: auto; padding: 8px 0; gap: 7px; }
    /* white, not bone: this mark is the same artwork as the bar's and the
       card chips', and those are page-coloured. Bone made it read as a
       different object wearing a warmer ink. */
    .picon .deckmark { width: 34px; height: 34px; display: block; color: #fff; }
    body.light .picon .deckmark { color: #000; }
    /* THE COUNT LOSES ITS BADGE. A filled pill beside a drawn mark is a
       second object competing with it; in the lab the count is just a
       number standing next to the mark, and that is what makes the pair
       read as one control. Two digits are reserved so the mark cannot
       shift when 9 becomes 10 (the centred-label reflow law). */
    /* SCOPED THROUGH .topbar ON PURPOSE, and this is the cascade gotcha
       already in the notes, met again: this block sits near the top of the
       file while the base .picon .pcnt rules sit ~3500 lines below it. At
       EQUAL specificity the later rule wins no matter which media query it
       is in, so a bare `.picon .pcnt` here loses silently and the badge
       keeps its bone fill. .topbar adds the class it needs to win without
       moving three thousand lines around. */
    .topbar .picon .pcnt {
      background: none; color: #fff; padding: 0;
      font-size: 10px; letter-spacing: 1.4px;
      min-width: calc(2ch + 2.8px); text-align: center;
    }
    body.light .topbar .picon .pcnt { background: none; color: #000; }
  }
  /* Home and DM are MOBILE-ONLY rows: on desktop the logo still goes home
     by itself and the drawn bar carries its own DM organ, so both would be
     duplicate doors inside the same header. */
  @media (min-width: 941px) { .drow.home, .drow.dm { display: none; } }
  /* No self-row: on the home page the menu lists only the places you can
     GO — the home row sits out (2026-08-17, the screen-recording pass).
     body.on-home is stamped by route(). */
  body.on-home .drow.home { display: none; }
  /* THE ROW FURNITURE RETIRED with the drop-lab dress (2026-08-14): rows are
     centred bare words now — no rdots, no counts, no DM hairline. The chase
     dots (see the drop block) are the drop's only dots. (The GROUND row and
     its .rn readout retired 2026-08-20 — light is the one ground.) The old
     accent-dot/count dress is in git history. */
  /* (.anchor-left RETIRED 2026-08-16 with the word-is-the-door rework: the
     phone drop centres under the bar word's seat now — parkDrop's phone
     branch centres on #nbar — so it shares the desktop's translateX(-50%)
     parking and the flush-off-the-logo special case is gone.) */

  /* ---- the drawn bar (2026-07-25, ported from header-lab — vault repo: the locked
     header — BAR drawn · DRAW engulf · TAG on). Full-width rails top and
     bottom, naked words between structural dots at rest. Hover: button-width
     horizontals peel off the INTACT rails and slide in, THE FLANKING DOTS
     PULL IN toward the word (2026-08-01, Dylan — the old slab overshot 9px
     PAST each dot, so adjacent buttons' drawn extents overlapped around a
     shared dot "in a way nothing else really does on the site"; now the
     card lands INSIDE the dots' rest posts with card-grid spacing), the
     slab grows to meet them — its edge stays 9px past the frame line, the
     mini card's own frame inset — the dots flip as the fill arrives under
     them, then the inner frame REACHES for them: four ring quarters born
     at the top/bottom centres draw outward and dock into the newly-placed
     dots (2026-08-01, reversed from the old weld-at-centre; docks ~.88s),
     and the label decodes. NO completion pulse — the dock IS the finish
     (same session; the old weld-answering pulse retired with the weld). The pull distance is
     --dotpull below (0 = the old flush-past-the-dots geometry; buildSeatFx
     clamps it per organ so the frame can never close into the word box).
     Retreat: the whole assembled mini-card drains as ONE chip, flooring on
     the seat's own bottom edge (--dfloor) — it retreats into itself; the
     horizontals never return home and the dots ease back to their posts.
     THE WIDTH RULING (2026-08-15, Dylan: "ipad should behave the same as
     laptop size basically"): the dress is decided by WIDTH ALONE — ≥941
     wears the drawn bar, ≤940 the two-anchor phone bar. The old
     (hover:hover)+width desktop gates left wide-touch iPads in a crack
     where NEITHER dress applied and the retired tab row + old picon
     leaked through (the pill row retired 08-06; this note used to keep it
     as the hover:none fallback — that fallback is dead). Hover EFFECTS
     stay (hover:hover)-gated: an iPad gets the desktop chrome but not the
     hover choreography; taps drive it (pointerenter fires on tap → the
     word opens the drop; the outside-tap dismiss is hover-capability
     gated at the drop's document click handler).
     Overlays are measured/built by buildSeatFx() — engulf-only
     port; the lab's other costumes were comparison chrome, retired here. */
  .nbar { display: none; }
  /* film-script, top right (2026-08-01, Dylan's ask): desktop drawn bar
     only — ≤940's right edge belongs to the dm-mini/picon. Absolute like
     the brand, so the flex line still centers it vertically for free. */
  .bar-script { display: none; }
  @media (min-width: 941px) {
    #topnav .tab, .topbar .dm-mini { display: none; }
    .nbar { display: contents; }
    .bar-script {
      display: flex; align-items: center; gap: 7px;
      position: absolute; right: clamp(18px, 3vw, 40px);
      color: #fff;
    }
    body.light .bar-script { color: #000; }
    /* 38px = the .bar-brand logo's own size — Dylan's call (2026-08-05):
       the deck mark is the brand's mirror seat and may outsize the organs */
    .bar-script svg { width: 38px; height: 38px; display: block; }
    /* the deck count stands beside the mark (2026-08-08, moved home when
       the DECK organ retired): naked number, no badge — the phone picon's
       no-pill law, same pair-reads-as-one-control reasoning. Two digits
       reserved so the mark cannot shift when 9 becomes 10. */
    .bar-script .pcnt {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: 1.4px; color: #fff;
      min-width: 2ch; text-align: center;
    }
    body.light .bar-script .pcnt { color: #000; }
    /* --dotpull: how far each flanking dot travels in toward the hovered
       word, and so how far the drawn card pulls inside the dots' rest
       posts. THE KNOB for the button's card-spacing read: 0 = the old
       geometry (slab flush 9px past the dots, adjacent extents overlap);
       9px = adjacent extents exactly meet at the shared dot; beyond that,
       every extra px is a px of clear bar between the card edge and the
       dot's post. Read by buildSeatFx, so CSS travel and drawn geometry
       cannot drift. */
    /* border-bottom: 0, not color: transparent (2026-08-01, Dylan's catch —
       "a visible underline below the buttons"): the transparent border kept
       its 1px of LAYOUT, so the real bottom rail (::after, positioned on the
       padding box) sat at H-3..H-1 while the overlays' resting horizontals
       (drawn against the full border box at H-1) painted H-2..H — one pixel
       of ink hanging below the rail under every organ. Removing the border
       from layout makes the rest overlap exact by construction; the ≤940
       bar keeps the base border untouched. */
    .topbar { border-bottom: 0; padding-top: 12px; padding-bottom: 12px; --dotpull: 12px; }
    .topbar::before, .topbar::after {
      content: ""; position: absolute; left: 0; right: 0; height: 2px;
      background: #fff; pointer-events: none;
    }
    .topbar::before { top: 0; }
    .topbar::after { bottom: 0; }
    body.light .topbar::before, body.light .topbar::after { background: #000; }
    /* pointer-events: none is LOAD-BEARING (2026-08-06, Dylan's spazz
       catch): the hover pulls a dot 12px toward the word — park the
       cursor where the dot lands and it slid UNDER the cursor, stole the
       hit from the organ, un-hovered it, slid home, and re-hovered it at
       ~28Hz (measured 69 cycles / 2.5s). Dots are furniture; they must
       never hit-test. */
    .bardot { position: relative; width: 5px; height: 5px; border-radius: 50%; background: #fff; flex: 0 0 auto; transition: background .15s ease, transform .45s ease; pointer-events: none; }
    body.light .bardot { background: #000; }
    .organ { position: relative; display: flex; }
    .orb {
      --fg: #fff; --bg: #000;
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      width: auto; height: 40px; padding: 0 14px; color: var(--fg);
    }
    body.light .orb { --fg: #000; --bg: #fff; }
    /* THE HIT AREA IS THE DRAWN CARD, not the label box (2026-08-01).
       The engulf slab spans dot-centre to dot-centre plus the 9px swallow,
       so the button READS ~139px wide while .orb's own box is ~60px — a
       cursor well inside the card sat outside the listener and the whole
       assembly drained under it. Insets are measured by buildSeatFx (the
       single geometry source for this bar) because the bar gap is a clamp()
       and cannot be hardcoded here.
       IT RIDES ON .orb — THE ANCHOR — NOT .organ: that buys the CLICK the
       same width as the hover. On .organ the card would light across its
       full width while only the label navigated, which is the same bug
       wearing a nicer coat. */
    .orb::before {
      content: ""; position: absolute; top: 0; bottom: 0;
      left: calc(var(--hitl, 0px) * -1);
      right: calc(var(--hitr, 0px) * -1);
    }
    /* THE LEAVE RANGE OUTGROWS THE TRIGGER (2026-08-14, Dylan's hysteresis
       ask): ENTERING still arms on the drawn card — the trigger stays the
       promise (red box). Once ON, the hit grows to the bar's full height
       (blue box: orb 40px in the 64px bar, 12px each side), so edge-jitter
       at the card's top/bottom and the ride down toward the drop cannot
       flap the button. Horizontal deliberately stays put — interior edges
       must keep tiling at the shared dot centre (the crossing law). */
    .organ.on .orb::before { top: -12px; bottom: -12px; }
    .orb .wlab {
      display: inline-block; position: relative; z-index: 1;
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase;
      min-width: 4.5ch; text-align: center;
    }
    /* the DECK organ's badge retired with the organ (2026-08-08) — the
       count lives beside the bar-script mark now, styled below */
    /* overflow HIDDEN on purpose: all seat geometry fits the bar-height box,
       and un-clipped stroke paint leaked a full-viewport vertical ghost line
       in Chrome 150 (header-lab lesson, GPU and software rasterizers both) */
    .seatfx { position: absolute; pointer-events: none; color: #fff; overflow: hidden; z-index: 0; --ringc: #000; }
    body.light .seatfx { color: #000; --ringc: #fff; }
    /* the ring quarters wear the fill's inverse (--ringc) */
    .seatfx .st { fill: none; stroke: var(--ringc); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1.05; stroke-dashoffset: 1.05; }
    .seatfx .fr { fill: currentColor; transform: scaleX(0); transform-box: fill-box; transform-origin: left center; }
    /* nrail transition scoped to .on/.left ONLY — after the drain, the reset
       to home must SNAP invisibly (a base transition would ghost-slide two
       bare lines back to the rails at .left removal) */
    .seatfx .nrail { fill: none; stroke: currentColor; stroke-width: 2; transform-box: fill-box; }
    :is(.organ.on, .organ.left) .seatfx .nrail { transition: transform .22s ease; }
    .organ.on .seatfx .nrail.t { transform: translateY(var(--ny, 0px)); }
    .organ.on .seatfx .nrail.b { transform: translateY(calc(var(--ny, 0px) * -1)); }
    /* the ring draws OUTWARD from the top/bottom centres to the docked dots
       (2026-08-01) — .4s, deliberately slower than the old .22s weld: the
       reach is the beat, and it completes ~.88s so the .925s pulse peak
       answers the lines arriving at the dots */
    .organ.on .seatfx .st { animation: idraw .4s ease both; animation-delay: var(--sd, 0s); }
    .organ.on .seatfx .fr { animation: chipwipe .24s ease .26s forwards; }
    .organ.on .orb { color: var(--bg); transition: color .15s ease .42s; }
    /* THE PULL (2026-08-01): the flanking dots travel in toward the word and
       dock at the drawn card's frame line — pure CSS sibling selectors, no
       JS. Per-dot distances (--dpl / --dpr) are written by buildSeatFx
       because a shared dot serves two organs and the pull is clamped per
       organ; the flip to the fill's inverse keeps its .4s wait (the fill
       arrives beneath mid-travel) while the travel itself starts at once —
       hence the split transition-delay (background, transform). */
    .organ.on + .bardot, .bardot:has(+ .organ.on) { z-index: 2; background: #000; transition-delay: .4s, 0s; }
    .bardot:has(+ .organ.on) { transform: translateX(var(--dpl, 0px)); }
    .organ.on + .bardot { transform: translateX(calc(var(--dpr, 0px) * -1)); }
    body.light .organ.on + .bardot, body.light .bardot:has(+ .organ.on) { background: #fff; }
    /* retreat: ONE chipdrop across the assembled button, children FROZEN at
       their landed states (strokes drawn, fill full, nrails held displaced);
       `both` holds it hidden through the .left window, then the reset snaps */
    .organ.left .seatfx { transform-origin: center var(--dfloor, 100%); animation: chipdrop .3s ease both; }
    .organ.left .seatfx .st { stroke-dashoffset: 0; }
    .organ.left .seatfx .fr { transform: scale(1, 1); }
    .organ.left .seatfx .nrail.t { transform: translateY(var(--ny)); }
    .organ.left .seatfx .nrail.b { transform: translateY(calc(var(--ny) * -1)); }
    /* (the DM organ's glitch-in-drawn-clothes rules left with the organ,
       2026-08-08 — dm-glitch itself stays for the buttons that still DM) */

  }

  /* ---- THE DROP IS NO LONGER DESKTOP-ONLY (2026-08-06) --------------------
     These rules used to sit INSIDE the (hover:hover) and (min-width:941px)
     block above, which is closed one line up now. Nothing here changed — the
     block simply ends before them, so the same menu is available to a phone.
     It had to move because the mobile header's whole nav is this drop now;
     leaving it gated meant a phone could open a menu that could not paint. */

    /* the shop mini-bay (the collections live here now) — bar-anchored, not
       organ-anchored. THE DROP-LAB DRESS (2026-08-14, drop-lab.html —
       vault repo; the lab born in claude.design and moved local): the 2px border draws
       (rails down, face halves close at the foot) fading 0→100%, the white
       body inks in, rows chip in as CENTRED BARE WORDS. Inside: the fv3
       inner card edge — two vertical lines, each split by a gap, whose
       inner edge lands under the BAR'S OWN DOTS (panel width is DERIVED
       from the shop organ's flanking-dot span — sizeDrop; ≤940 has no
       bardots and keeps the 212px fallback). The dots in those gaps are the
       bar button's dots one level down: they HOP down the inner line to the
       hovered row, PULL in to flank its label, SEAT, and the outline box is
       DRAWN FROM THEM — four svg quarters born at each seated dot, welding
       at the top/bottom centres, each edge keeping a ±--bgap gap where its
       dot sits (the engulf grammar one level down). The row's black chip is
       the cursor's own instant readout; the dots take their time and always
       finish what they start. difference blending does the chase's colour
       work on both grounds for free. Exit = drawer rewind. */
    .drop {
      position: absolute; top: 100%; width: var(--dw, 212px); margin-top: -1px;
      transform: translateX(-50%); transform-origin: center top;
      z-index: 90; visibility: hidden;
      --iin: 9px;      /* inner edge inset off the border */
      --igap: 11px;    /* half-gap the dot rides in */
      --idot: 5px;     /* the dot */
      --travel: 16px;  /* dots' dock distance in from the inner line — STATIC:
                          the box is one size on every row, whatever the word
                          (clamped per open so it never crosses the widest row).
                          16 lands the dot 9px inside the chip edge — the bar
                          button's own slab-past-frame inset (Dylan 2026-08-14:
                          fill-to-box ratio matches the header button) */
      --dbh: 34px;     /* the drawn box's height (NOT --cbh — that is the
                          section-bar height on :root). 34 in the 42px row =
                          the bar ring's own 4px inset inside its slab */
      --bgap: 5px;     /* half-gap the dots keep in the box's own edges */
      --tv: 380ms;     /* the vertical hop — slower than the pull/draw on
                          purpose (Dylan 2026-08-14: 240 juttered down the
                          list; the dot should glide to catch up) */
      --tp: 170ms;     /* the pull in */
      --tdc: 360ms;    /* the box draw — JS shortens it when a draw reverses out */
      --cy: 50%; --clx: 10px; --crx: 188px;   /* the chase seat (JS-written) */
    }
    .drop.open, .drop.closing { visibility: visible; }
    .drop.closing { transform: translateX(-50%) scaleY(0); opacity: 0; transition: transform .18s ease, opacity .15s ease; }
    /* the veil: the page reads at ~60% around the drop, ramping to nothing.
       DESKTOP-ONLY for now — the phone menu already owns an approved
       full-page dim (body.menu-fade, 2026-08-06) and two dimming systems on
       one gesture would fight; veil-vs-fade on the phone is a mobile-pass
       call, made on the sim. */
    .dveil { display: none; }
    @media (min-width: 941px) {
      /* VEIL 2 (2026-08-14, Dylan: "turn the opacity down a bit more…and
         remove it from the header"): weaker peak (.4 → .3) and OUT OF THE
         BAR — anchored to the drop's top with the ellipse centred at 40%
         of its height, closest-side, so the vertical radius equals the
         distance to the TOP edge and the bloom fades to exactly nothing at
         the bar line: the header and the engulfed COLLECTIONS fill above
         stay full ink the whole time, no hard clip edge. The 1px top nudge
         covers the drop's -1px bar overlap. */
      .dveil {
        display: block; position: absolute; left: 50%; top: 1px;
        width: 1000px; height: 620px; transform: translateX(-50%);
        z-index: -1; pointer-events: none; opacity: 0; transition: opacity .3s ease;
        background: radial-gradient(ellipse closest-side at 50% 40%, rgba(var(--veilc, 0, 0, 0), .3) 0%, rgba(var(--veilc, 0, 0, 0), .3) 32%, rgba(var(--veilc, 0, 0, 0), .19) 58%, rgba(var(--veilc, 0, 0, 0), 0) 100%);
      }
      .drop.open .dveil { opacity: 1; transition: opacity .34s ease .1s; }
    }
    body.light .drop { --veilc: 255, 255, 255; }
    .drail { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; transform: scaleY(0); transform-origin: center top; z-index: 2; }
    .drail.l { left: 0; }
    .drail.r { right: 0; }
    .dface { position: absolute; bottom: 0; width: 50%; height: 2px; background: #fff; transform: scaleX(0); z-index: 2; }
    .dface.l { left: 0; transform-origin: left center; }
    .dface.r { right: 0; transform-origin: right center; }
    body.light .drail, body.light .dface { background: #000; }
    .dpanel { position: relative; background: #fff; padding: calc(var(--iin) + 6px) 0; clip-path: inset(0 0 100% 0); transition: box-shadow .3s ease; }
    .drop.open .drail { animation: drailgrow .26s ease .04s both; }
    .drop.open .dface { animation: dfacegrow .18s ease .26s both; }
    .drop.open .dpanel { animation: dink .17s ease .34s both; }
    /* marks go page-colored -> ink as the body slides beneath (.inked read) */
    .drop.open .drail, .drop.open .dface { transition: background .15s ease .44s; background: #000; }
    /* shadow waits for the frame to complete — d5 idiom on the black ground */
    .drop.open .dpanel {
      box-shadow: 7px 9px 0 -1px rgba(255, 255, 255, .12), 7px 9px 0 0 rgba(0, 0, 0, .9);
      transition: box-shadow .25s ease .52s;
    }
    body.light .drop.open .dpanel { box-shadow: 7px 9px 0 -1px rgba(0, 0, 0, .85); }
    /* ---- inner card edge: the lines, gapped where the dots are.
       The gap rides in PANEL coords (the drop-lab lesson): --cy is measured
       from the panel top but these segments live inside .iv, which starts
       --iin lower — hence the --iin correction, the dot's own bezier, and a
       px rest --cy from JS (50% of .iv is not 50% of the panel). */
    .iv { position: absolute; top: var(--iin); bottom: var(--iin); width: 2px; z-index: 3; pointer-events: none; opacity: 0; }
    .iv.l { left: var(--iin); }
    .iv.r { right: var(--iin); }
    .drop.open .iv { animation: ivin .3s ease .5s both; }
    .sg { position: absolute; left: 0; width: 2px; background: #000; transition: height var(--tv) cubic-bezier(.32, .72, .3, 1), top var(--tv) cubic-bezier(.32, .72, .3, 1); }
    .sg.up { top: 0; height: max(0px, calc(var(--cy) - var(--iin) - var(--igap))); }
    .sg.dn { top: min(100%, calc(var(--cy) - var(--iin) + var(--igap))); bottom: 0; }
    /* ---- the chase: dots + the drawn box. THE BOX IS STAMPED, NOT BOUND
       (drop-lab): its geometry is written once at draw time from the dots'
       landing spots, so a re-target retracts the quarters back INTO the
       dots in place while the dots ride home and re-hop at once. */
    .chase { position: absolute; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: difference; opacity: 0; }
    .drop.open .chase { animation: ivin .3s ease .5s both; }
    .cdot { position: absolute; top: var(--cy); width: var(--idot); height: var(--idot); border-radius: 50%; background: #fff; transform: translate(-50%, -50%); transition: top var(--tv) cubic-bezier(.32, .72, .3, 1), left var(--tp) ease; }
    .cdot.l { left: var(--clx); }
    .cdot.r { left: var(--crx); }
    .cbox { position: absolute; overflow: visible; }
    .cbox path { fill: none; stroke: #fff; stroke-width: 2; shape-rendering: crispEdges; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset var(--tdc) ease; }
    .chase.drawn .cbox path { stroke-dashoffset: 0; }
    /* ---- rows: words, centred ---- */
    .dlist { position: relative; padding: 0 calc(var(--iin) + 8px); }
    .drow {
      position: relative; overflow: hidden; z-index: 0;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      width: 100%; height: 42px; padding: 0 12px;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase; color: #000;
      background: none; border: 0; cursor: pointer;
      clip-path: inset(0 100% 0 0); opacity: 0;
    }
    .drop.open .drow { animation: rowin .2s ease both; animation-delay: calc(.46s + var(--r, 0) * .05s); }
    .drow::before { content: ""; position: absolute; inset: 0; background: #000; transform: scaleX(0); z-index: 0; }
    .drow.on::before { transform-origin: left center; animation: chipwipe .3s ease forwards; }
    .drow.left::before { transform-origin: center bottom; animation: chipdrop .28s ease; }
    .drow > * { position: relative; z-index: 1; }
    .rt { transition: color .15s ease .08s; }
    .rn { font-size: 9px; color: #767676; transition: color .15s ease .08s; }
    .drow.on .rt { color: #fff; }
    .drow.on .rn { color: #bbb; }
  /* REGISTERED (the drop-lab lesson): inherited custom properties consumed
     by descendants' left/top/width — unregistered, Chromium does not
     reliably invalidate the descendant. */
  @property --cy { syntax: "<length-percentage>"; inherits: true; initial-value: 50%; }
  @property --clx { syntax: "<length>"; inherits: true; initial-value: 10px; }
  @property --crx { syntax: "<length>"; inherits: true; initial-value: 188px; }
  @keyframes drailgrow { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
  @keyframes dfacegrow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes dink { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 -14px 0); } }
  @keyframes ivin { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rowin { from { clip-path: inset(0 100% 0 0); opacity: .4; } to { clip-path: inset(0 0 0 0); opacity: 1; } }

  /* ---- the split ---- */
  .split {

  .spine { text-align: center; }

  /* the drawn logo (2026-08-16): sized like the PNG it replaced; colour
     IS the ground story now (white on dark, ink on light — the invert
     filter retired with the PNG). height:auto resolves off the viewBox
     ratio, so the box keeps the artwork's own proportion. */
  .masthead svg { width: 150px; height: auto; margin: 0 auto; display: block; color: #fff; }
  #logo-draw path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  /* fixed two-line box: swapping taglines never moves what's below.
     sits low, near the video, rather than tight under the logo */
  .tick { margin-top: clamp(36px, 8vh, 96px); color: #fff; line-height: 1.8; height: 36px; transition: opacity .45s ease; }
  .tick.out { opacity: 0; }
  .masthead .mono {

  .made-row .note { text-align: left; margin-top: 10px; }
  .made-row .pitch { margin: 0; flex: 1; }
  .video-wrap video, .vtile video {

  /* DM buttons wear the reserved glitch: a choppy slice-jitter on entry.
     every other button gets the quiet text decode (JS, same glyph set as
     the taglines). Class-driven, not :hover-driven — the clip-path slices
     punch holes in hit-testing mid-run, which a :hover animation reads as
     leave/re-enter and re-queues itself forever. The class also holds the
     inverted colors so the hover style can't flicker during the run. */
  .dm-mini.glitch-run, .lb-dm-btn.glitch-run {
    animation: dm-glitch .26s steps(1, end) 1;
    background: #fff; color: #000;
  }
  @keyframes dm-glitch {
    0%   { transform: translate(2px, -1px) skewX(-6deg); clip-path: inset(0 0 44% 0); }
    33%  { transform: translate(-2px, 1px) skewX(4deg);  clip-path: inset(52% 0 0 0); }
    66%  { transform: translate(1px, 0);                 clip-path: inset(14% 0 26% 0); }
    100% { transform: none; clip-path: none; }
  }

  /* ---- shop column: conveyor shelves ---- */
  .shop { min-width: 0; }
  section.band { padding: 0 0 clamp(26px, 4vh, 44px); }
  .bandhead {
    display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
    /* indented off the belt's left edge so the titles don't spotlight the
       boundary the shelf fade is there to soften */
    padding: 2px 4px 0 112px;
  }
  .band h2 {
    font-family: "Satoshi", var(--disp);
    font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: 1.05;
    font-size: clamp(22px, 2.3vw, 30px);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .band h2 .hl { color: #fff; }
  .bandsub { color: #fff; font-size: 12px; letter-spacing: .16em; }

  /* ======================= CATEGORY HEADER POSTS =========================
     v1 list item 1 (Dylan): the section titles "need better site coherence /
     need to feel like a button". They already navigate — this was the READ.

     FOUR COSTUMES WERE BUILT AND THREE WERE REJECTED (2026-08-01, one pass):
     `posts` (the drawn bar's engulf one level down), `frame` (the fv3 inner
     frame closing on hover), `chip` (the lb nav seat assembling at the end of
     the line) and `plate` (the title as a card). Dylan's call on seeing them:
     *"something a little more subtle on these. can we go with just the dots
     and their movement and no card draw or chip fill. the larger chip on the
     main gallery page looks a tad harsh."* So the answer is the POSTS ALONE —
     the part of the bar's language that is structure rather than button.

     WHAT THAT MEANS, and why it is the right read: a section title is not a
     control the way SHOP/LISST/DM are, it is a PLACE. The bar's dots say
     "words live in furniture here"; the fill and the ring say "this is a
     button you are pressing". Taking the first without the second is what
     gives the coherence he asked for without the weight he rejected — and it
     leaves the drawn card as the bar's own signature rather than a house
     style applied everywhere until it means nothing.

     NO NEW NUMBERS: the dot is 5px, the site's structural dot everywhere
     (bar dots, card mid dots, the bay's mid dot — and 5 is ODD, so it lands
     whole on a half-pixel centre, see the parity gotcha). The travel is 12px,
     the bar's own --dotpull. Only the gap from the word is em, because that
     must scale between the 30px band title and the 68px collection title.

     Pure CSS, no JS: the dots are the h2's own ::before/::after. The pull
     rides `translate` rather than `transform` so it composes with the
     centring transform — the same reason dotPulse was re-keyed to `scale`.
     Class-driven state is not needed here (the organs need it because their
     FX mutate the hit target and outlive the pointer; a dot inside the h2's
     own padding does neither), so this is plain :hover behind the usual
     capability gate.

     The furniture grows OUTWARD from the word: padding makes the room and a
     matching negative left margin puts the band title back on its 112px
     indent, so the composition is unchanged from bare type.
  ====================================================================== */
  .band h2, .colpage-inner h2 { position: relative; --hdrpull: 12px; }
  .band h2 { padding: 0 .95em; margin-left: -.95em; }
  /* the collection title's padding lives on its OWN rule further down — this
     one would lose the tie to it on source order, and the dots would land
     inside the word */
  .band h2::before, .band h2::after,
  .colpage-inner h2::before, .colpage-inner h2::after {
    content: ""; position: absolute; top: 50%;
    width: 5px; height: 5px; border-radius: 50%;
    background: #fff; transform: translateY(-50%); pointer-events: none;
    transition: translate .45s ease;
  }
  body.light .band h2::before, body.light .band h2::after,
  body.light .colpage-inner h2::before, body.light .colpage-inner h2::after { background: #000; }
  .band h2::before, .colpage-inner h2::before { left: .32em; }
  .band h2::after, .colpage-inner h2::after { right: .32em; }
  /* only the band titles answer the hand — the collection title is a page
     title with nothing to click, and furniture that reacts to a hover it
     cannot honour is the live-affordance law read backwards */
  @media (hover: hover) {
    .band h2:hover::before { translate: var(--hdrpull); }
    .band h2:hover::after { translate: calc(var(--hdrpull) * -1); }
  }

  /* ---- card (shared with lightbox + grids) ---- */
  .frame {
    aspect-ratio: 4/5; overflow: hidden; border-radius: 6px;
    background: #16120e;
    box-shadow: 0 0 0 2px var(--ink), 7px 9px 0 -1px rgba(32, 26, 21, .34);
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  /* dual card: both sides of one board in a single frame */
  .frame.dual { display: flex; gap: 2px; }
  .frame.dual img { width: calc(50% - 1px); }
  /* belt cards: shadow x tracks position on the shelf (virtual light above shelf
     center) — --shx is set per-frame by the conveyor engine */
  .card .frame {
    box-shadow: 0 0 0 2px var(--ink), var(--shx, 7px) 9px 0 -1px rgba(32, 26, 21, .34);
  }
  .cap { margin-top: 12px; text-align: center; }
  .cap .nm { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .cap .rf {
    display: block; margin-top: 4px;
    font-family: var(--mono); font-size: 8.5px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase; color: #fff;
  }

  /* ---- conveyor ---- */
  .belt {
    position: relative; z-index: 0;
    margin-top: 14px; height: var(--beltH, 330px);
    overflow: hidden; cursor: grab; touch-action: pan-y;
    /* the shelf: gray band with long horizontal fades, feathered softly at the
       top and bottom (the vertical layer fades to page-black over the gray) */
    background:
      linear-gradient(180deg,
        rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 13%,
        rgba(0, 0, 0, 0) 87%, rgba(0, 0, 0, 1) 100%),
      linear-gradient(90deg,
        rgba(74, 74, 74, 0) 0%, rgba(74, 74, 74, 1) 18%,
        rgba(74, 74, 74, 1) 82%, rgba(74, 74, 74, 0) 100%);
  }
  .belt.dragging { cursor: grabbing; }
  .belt::before, .belt::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 8%; z-index: 5; pointer-events: none;
  }
  .belt::before { left: 0; background: linear-gradient(to right, var(--bg), transparent); }
  .belt::after { right: 0; background: linear-gradient(to left, var(--bg), transparent); }
  .card {
    position: absolute; left: 0; top: 50%;
    width: var(--cardW, 172px); will-change: transform, opacity;
    user-select: none; -webkit-user-drag: none; cursor: pointer;
  }

  /* ---- mobile tile grid ---- */
  .tilegrid { display: none; }

  /* ---- collection page (unchanged from the current site) ---- */
  #colpage { max-width: var(--shopMaxW, 1240px); margin: 0 auto; }   /* rides the shop's max-draw ramp (round 8) */
  /* the shop makes ROOM for the locked-open case (2026-07-24): a right
     inset on #colpage so no card ever hides under the drawer — sized to
     the case footprint (355px at the right edge, measured) + 24px air,
     minus whatever viewport margin the centered 1240 box already has
     (calc(999px − 50vw) = 379px − (100vw − 1240px)/2). The auto-fill
     grids re-column on their own (4→3 at most widths); shopRoom() FLIPs
     the cards to their new homes. bayLocked ONLY — proximity peeks
     never reflow; belts flow BEHIND the case by design (Dylan). */
  @media (min-width: 941px) {
    body.bay-room #colpage { padding-right: clamp(0px, calc(999px - 50vw), 379px); }
  }
  .colpage-inner { text-align: center; padding: clamp(30px, 5vh, 56px) 0 0; }
  /* "← Back to collections" + .colpage-links retired 2026-08-15 (the
     launch-day trim) — the drop and the foot's home mark carry it */
  .colpage-inner h2 {
    display: inline-block; color: #fff;
    font-family: "Satoshi", var(--disp);
    font-weight: 900; text-transform: uppercase; letter-spacing: -0.025em; line-height: 1.04;
    /* padding holds the posts (see CATEGORY HEADER POSTS) — em, not the old
       16px, so the gap scales with a title that clamps 34→68px */
    font-size: clamp(34px, 6vw, 68px); margin: 8px 0 0; padding: 0 .95em;
  }
  .colpage-inner .desc {
    max-width: 52ch; margin: 18px auto 0; padding: 0 20px;
    font-size: 15px; font-weight: 500; line-height: 1.8; color: var(--soft);
  }
  .shelfgrid {
    /* the shop's max-draw ramp (round 8): --shopCard/--shopMaxW/--shopG*
       are JS-written stops (232 floor — nothing at or below 1200p
       columns changes); px fallbacks are the pre-JS frame */
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--shopCard, 232px), 42vw), 1fr));
    gap: var(--shopGY, 44px) var(--shopGX, 32px); justify-items: center;
    max-width: var(--shopMaxW, 1240px); margin: 0 auto;
    padding: clamp(30px, 5vh, 52px) clamp(20px, 5vw, 64px) 40px;
  }
  .scard {
    width: min(var(--shopCard, 232px), 58vw);   /* rides the shop's max-draw ramp (round 8) */
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease;
  }
  /* card hover choreography is pointer-only: iOS applies sticky :hover on
     tap, which fired the chip wipes as a truncated prelude to the lightbox.
     Every card :hover rule below sits in an (hover:hover) gate — touch gets
     its own scripts (lightbox n/N decode, dock flight) instead. */
  @media (hover: hover) { .scard:hover { transform: translateY(-4px); } }
  /* A HOVER MUST NOT LIFT ITS OWN HIT BOX OFF THE CURSOR (2026-08-06,
     Dylan's catch: park the cursor on a card's bottom edge and the hover
     spazzes on repeat — measured 30 enter/leave cycles in 2.5s). The
     lift carries the box up off a parked cursor, un-hovers, drops back
     onto it, forever. The lift stays; the HOVERED state grows an
     invisible apron below the card covering the vacated strip, so the
     rest box's promise holds through the travel — the drawn-extent hit
     law read in reverse. It rides .d7f (the dress's own :hover owner,
     so fills/decodes latch too, not just the lift) and only under the
     lifted surfaces; .d7f's container-type already anchors the abs
     pseudo. Covers the -4px (.scard) and -3px (.bay-item) lifts. */
  @media (hover: hover) {
    :is(.scard, .bay-item) .d7f:hover::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 9px; }
  }
  .restock {
    max-width: 420px; margin: 38px auto 0; padding: 40px 20px;
    border: 2.5px dashed var(--bone); border-radius: 14px; opacity: .5;
  }
  .colnav { margin-top: clamp(44px, 7vh, 72px); text-align: center; }
  /* THE FOOT GOES HOME (2026-08-15): the loop chip + collection buttons
     retired (the drop is the nav) — the scroll ends on the brand mark
     over a · HOME · label, one door. The img asset is the circle sticker
     (colnavHtml at render — light is the one ground). */
  .colnav-home {
    display: inline-flex; flex-direction: column; align-items: center;
    gap: 16px; transition: transform .3s ease;
  }
  .colnav-home img { width: 56px; height: 56px; border-radius: 50%; display: block; }
  .colnav-home .label { color: var(--hint); transition: color .15s ease; }
  .colnav-home:hover { transform: scale(1.06); }
  .colnav-home:hover .label { color: var(--bone); }

  /* ---- shop all: collection pages stitched into one scroll ---- */
  .shopall-sec { padding-top: clamp(40px, 7vh, 80px); }
  .shopall-foot { padding-top: 0; }
  .shopall-foot .colnav { margin-top: clamp(28px, 5vh, 52px); padding-bottom: clamp(36px, 6vh, 64px); }

  /* THE SECTION BAR RETIRED (2026-08-08 late — Dylan: "the header lives
     with its collection again and doesnt present up top. keep the scroll
     simple"). The whole ?colbar= costume rack (condense/bar/sketch/rail,
     the coldiv seam, the #colrail window) went with it — desktop joins the
     phone's static-masthead ruling from last night, and the subtext is the
     short BARLINE line now, living under the big title. */
  @media (max-width: 940px) {
    /* the phone keeps last night's "no explainer" — masthead only.
       (Descendant selector since 2026-08-14: the relay's .secbody wrap
       moved .desc one level down — the old `>` silently stopped matching,
       which would have re-shown every explainer on the phone.) */
    .colpage-inner[data-col] .desc { display: none; }
  }
  /* the jump target only clears the topbar now — no bar pins under it */
  .colpage-inner { scroll-margin-top: var(--tbh, 0px); }
  /* ================= THE SCROLL RELAY (2026-08-14) =================
     The bar's centre word is WHERE YOU'VE BEEN. Scrolling DOWN past a
     section masthead plays the ceremony: the whole section PINS (the
     sticky .secbody inside a wrapper --relayR taller — the boards pause,
     that extra height IS the runway), the masthead shrinks on its ride up
     and ducks under the bar, and the section's name surfaces between the
     bar dots while the old word rides up and out — two elements, read as
     one word passing through. Scrolling UP is the give-back: a quick dry
     swap to COLLECTIONS and the masthead rides back down FULL SIZE over
     the runway (travel, not transformation — the ceremony is
     downward-only, Dylan's rule). Every route/jump lands as COLLECTIONS
     (route() resets scroll — the door-state law: the name is EARNED by
     scrolling, never granted by clicking). The word stays the door the
     whole time — the drop opens on it regardless of what it says.
     DESKTOP-ONLY: the phone has no bar word; its translation is a
     mobile-pass design. Mechanics + state machine live at the relay JS. */
  /* THE RUNWAY IS A REAL ELEMENT, not padding (bitten 2026-08-14): a
     sticky child's room to stick is the parent's CONTENT box — padding
     doesn't count, and a margin-bottom on .secbody would collapse through
     the parent's bottom edge and escape. The spacer sits inside the
     content box, so the pinned body has exactly --relayR px to hold. */
  .colpage-inner .runway { display: none; }
  /* THE RELAY SLEEPS FOR V1 (2026-08-15): these rules require
     body.relayon, which only the relay JS's RELAY_ON const stamps — ONE
     switch wakes the whole ceremony (CSS + machine together, no twin to
     forget). While asleep: no runway space, no pin, static mastheads,
     the bar always reads COLLECTIONS. Dylan's launch-clock call — the
     ceremony returns for its polish pass after v1. */
  @media (min-width: 941px) {
    body.relayon .colpage-inner[data-col] .runway { display: block; height: var(--relayR, 160px); }
    body.relayon .colpage-inner[data-col] .secbody { position: sticky; top: var(--tbh, 64px); }
    body.relayon .colpage-inner[data-col] h2 { transform-origin: center top; }
  }
  /* THE COLLECTION AIR (2026-08-15): breathing room above and below
     every colpage masthead — the header floats between the collection
     it closes and the one it opens. HALF a card since the launch trim
     (same day — a full card left smaller resolutions under-populated,
     Dylan's call; the full-card round is in git history at 7f9032e).
     Sized off the live card (--shopCard × half the 350/232 card box) so
     the air rides the shop's max-draw ramp. [data-col]-scoped: YOUR
     PICKS shares .shelfgrid and keeps its own rhythm; the phone
     (ungated below 941) keeps the reacted mobile pass. The sibling rule
     REPLACES .shopall-sec's clamp padding — the air lives ON the
     section / IN the grid, never as margin on .secbody (it would escape
     the sticky's stick-room: see the runway law in gotchas.md). The air
     is also the masthead shrink's APPROACH RUNWAY when the relay is
     awake — the relay JS reads this padding off a live section (one
     source), so the shrink always spans exactly this room. */
  @media (min-width: 941px) {
    .colpage-inner[data-col] { --colAir: calc(var(--shopCard, 232px) * .755); }
    .colpage-inner[data-col] + .colpage-inner[data-col] { padding-top: var(--colAir); }

     fades over its own ground — no dark scrim — so the lifted card's

     card. Mobile learned this first (every scrim variant banded at the
     iOS bar); desktop adopted it with the lift-out. The scrim element

  /* the card lightbox is the mobile scroll sheet on EVERY size: starts

  #lb {

  #lb .lb-count { position: fixed; bottom: 12px; pointer-events: none; }
  .topbar, #home, #colpage { transition: opacity .45s ease; }
  /* THE ROOM DIMS WITH THE PULL (2026-08-03): the open deck fades the
     ground toward BAY_TUNE.fade — the inspection read at the deck's own
     intensity (.22, the house faint), tied to the animation
     because it rides the drawer's master p (driver-written --bayFade).
     A VAR on the base rule on purpose: the lb/drag/case rules below win
     by specificity, so an inspection's .08 owns the ground while it's
     up and closing the deck under it changes nothing. NO pointer-events
     here — the faded shop stays clickable (chip adds with the drawer
     open are a real path). bay-fading kills the base transition while
     the driver is mid-flight: per-frame writes + a transition = the
     trailing-hand mush; at rest it drops and lb-fade eases normally. */
  #home, #colpage { opacity: var(--bayFade, 1); }
  body.bay-fading #home, body.bay-fading #colpage { transition: none; }
  /* the MOBILE MENU dims the page behind it (2026-08-07): the drop's white
     panel vanished into the white ground and the page collaged straight
     through the menu. A dim is ground-neutral — no new ink on either theme —
     and makes the drop read as the top layer, the lb-fade grammar one level
     lighter. BEFORE the lb-fade rules on purpose: equal specificity, so an
     inspection's harder fade wins by source order if both are ever up. */
  body.menu-fade #home, body.menu-fade #colpage { opacity: .15; }
  /* inspection fade (2026-07-22): desktop dims to FAINT — the shop keeps
     moving behind the inspected card (the other belt rows keep drifting;
     the tapped row freezes and holds its gap). Mobile keeps the full
     white/black-out. A drag lift shares the faint (2026-07-24): the card in
     hand is the focus, lb-lite.
     THE KNOB, taken .22 -> .12 -> .08 (Dylan, 2026-08-01: "a little more
     fade", then "nudge the fade up a bit" once the counter's new seat put it
     on top of the collection page's own ghosted title): the intent is
     unchanged — the shop still moves back there, it just stops competing,
     first with the inspection and then with the counter. Not 0, which is the
     mobile behaviour and would take the moving shop away entirely. */
  body.lb-fade #home, body.lb-fade #colpage,
  body.dragging #home, body.dragging #colpage { opacity: .08; pointer-events: none; }
  /* THE DRAG FADE RIDES THE DISTANCE (Dylan, 2026-08-08: "you pick the
     card up and the site slightly dims and the dim increases the farther
     away the card gets from home"). Desktop only — the flat faint above
     stays for the phone's case/sheet grabs, and it stays the DESKTOP
     rule too whenever the pose loop isn't writing (--dragFade defaults
     to its old .08). The loop writes --dragFade every frame: pickup dim
     → the lb faint across fadeRange px of card-from-home distance,
     smoothstepped, JS-eased. It MULTIPLIES with the drawer's own
     --bayFade channel (carrying a card to the drawer stacks both dims);
     transitions off while the loop drives (the bay-fading law) — the
     release drops the class and rides the base .45s ease home. */
  @media (min-width: 941px) {

    .tile .tcard {

    font-family: var(--mono); font-size: 8.5px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;

  .st.avail { color: #58a852; } .st.avail .dot { background: #58a852; }
  .st.pend { color: #c98a12; } .st.pend .dot { background: #c98a12; animation: pulse 1.6s ease-in-out infinite; }
  .st.gone { color: #8b8175; } .st.gone .dot { background: #8b8175; }
  @keyframes pulse { 50% { opacity: .35; } }
  .spark { color: #d8511f; font-size: 12px; line-height: 1; cursor: help; }
  .sold { opacity: .55; }
  .sold:not(.d7f):hover .stage img { transform: none !important; }
  .d7f.sold:hover .stage img { --bgrow: 1; }   /* fv3 composes its transform — killing it outright would drop the bot face's parked rotation */
  .sold .wchip.rfc { text-decoration: line-through; }

  /* d5 slab base (zoned builds on it) */
  .d5 { width: 100%; cursor: pointer; }
  .d5 .panel {
    border-radius: 6px; background: #0b0b0b; overflow: hidden;
    box-shadow: 7px 9px 0 -1px rgba(255, 255, 255, .07), 7px 9px 0 0 rgba(0, 0, 0, .9);
    transition: box-shadow .22s ease;
  }
  @media (hover: hover) { .d5:hover .panel { box-shadow: 12px 15px 0 -1px rgba(255, 255, 255, .09), 12px 15px 0 0 rgba(0, 0, 0, .9); } }
  .d5 .stage {
    position: relative; height: auto; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .d5 .stage img {
    position: absolute; inset: 0; margin: auto;   /* iOS: see .d7f .stage img */
    max-height: 84%; max-width: 86%; width: auto; height: auto;
    filter: drop-shadow(7px 9px 0 rgba(0, 0, 0, .6));
    transition: transform .22s ease, filter .22s ease;
  }
  @media (hover: hover) { .d5:hover .stage img {
    transform: scale(1.07);

  .d5 .info { padding: 11px 13px 13px; color: #fff; }
  .d5 .nm { font-size: 11.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  .d5 .dims {

  .d5 .r2 { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; }
  .d5 .corner {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    display: flex; align-items: center; gap: 7px;
  }
  .d5.spread .info { text-align: center; padding-top: 0; }
  .d5.spread .nm { display: block; }
  .d5.spread .r2 { margin-top: 12px; }
  .d5.sold .stage img { filter: grayscale(.7) drop-shadow(7px 9px 0 rgba(0, 0, 0, .4)); }

  /* zoned: grey plate stage inside a white-bordered black card */
  .d6z .panel { border: 2px solid #fff; background: #0b0b0b; }
  .d6z .plate { background: #a49d92; }
  .d6z .plate .nm { display: block; text-align: center; color: #16120e; padding-bottom: 15px; letter-spacing: .13em; }
  .d6z .plate .stage img { filter: drop-shadow(7px 9px 0 rgba(22, 18, 14, .45)); }
  @media (hover: hover) { .d6z:hover .plate .stage img { filter: drop-shadow(11px 14px 0 rgba(22, 18, 14, .45)); } }
  .d6z.sold .plate .stage img { filter: grayscale(.7) drop-shadow(7px 9px 0 rgba(22, 18, 14, .3)); }
  .d6z .info { padding-top: 12px; }
  .d6z .corner .wchip { box-shadow: 0 0 0 1.5px #16120e; }
  /* white ground: the white border vanishes on white — hold the edge in ink
     (tool adaptation, not part of the treatment) */
  body.light .d6z .panel { border-color: #000; }

  /* paper: white card, black border, ink text, black chips */
  .paper { width: 100%; cursor: pointer; }
  .paper .panel {
    border-radius: 6px; background: #fff; overflow: hidden;
    border: 2px solid #000;
    box-shadow: 7px 9px 0 -1px rgba(0, 0, 0, .85);
    transition: box-shadow .22s ease;
  }
  @media (hover: hover) { .paper:hover .panel { box-shadow: 12px 15px 0 -1px rgba(0, 0, 0, .85); } }
  .paper .stage {
    position: relative; height: auto; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .paper .stage img {
    position: absolute; inset: 0; margin: auto;   /* iOS: see .d7f .stage img */
    max-height: 84%; max-width: 86%; width: auto; height: auto;
    filter: drop-shadow(7px 9px 0 rgba(0, 0, 0, .3));
    transition: transform .22s ease, filter .22s ease;
  }
  @media (hover: hover) { .paper:hover .stage img {
    transform: scale(1.07);
    filter: drop-shadow(11px 14px 0 rgba(0, 0, 0, .3));
  } }
  .paper .corner {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    display: flex; align-items: center; gap: 7px;
  }
  .paper .info { text-align: center; padding: 0 13px 13px; color: #000; }
  .paper .nm { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  .paper .dims {
    margin-top: 6px; font-family: var(--mono); font-size: 8px;
    letter-spacing: .18em; text-transform: uppercase; color: #000;
  }
  .paper .r2 { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }

  /* frame v3: the ⸺·⸺ card — flush chips wipe in from the frame edge,
     exits recede into the rails, whole card at half speed. Enter and exit
     animate on different axes, so BOTH are keyframes and the exit is armed
     by a JS-applied .left class (a transition can't pick up from an
     animation-held value; an unarmed exit would fire on page load). */
  .d7f {
    width: 100%; cursor: pointer;
    /* ONE SPEC, EVERY SIZE: the card is a CSS container and every internal
       dimension below is declared twice — px (the 232 reference values,
       kept as fallbacks for pre-2022 Safari) then cqw (the same number as
       a fraction of card width: Npx at 232 = N × 0.431034cqw). Any home
       (shelf slot, belt slot, blown-up lightbox) now renders the same
       card, photographically bigger or smaller — width/height ratio can't
       drift, so the open/close flight lands every edge. */
    container-type: inline-size;
  }
  .d7f .panel {
    position: relative; border-radius: 6px; background: #fff; overflow: hidden;
    border: 1.5px solid #000;
    box-shadow: 7px 9px 0 -1px rgba(0, 0, 0, .85);
    border-radius: 2.5862cqw;
    border-width: .6466cqw;
    box-shadow: 3.0172cqw 3.8793cqw 0 -.431cqw rgba(0, 0, 0, .85);
    transition: box-shadow .44s ease;
    /* top room so the board sits optically centered — the caption zone
       weighs the bottom (~66px of chrome below the stage vs ~24px above
       the board without this) */
    padding-top: 52px;
    padding-top: 22.4138cqw;
  }
  /* .lit — THE HOVER BUILD WITHOUT A CURSOR (2026-08-04, for the letter's
     tag↔board link). Same law as .hold/.redress on the lightbox card: the
     mirror shares the :hover rules' own declaration blocks rather than
     copying them, because any computed difference restarts a fill
     animation and blinks. :is() takes the highest specificity of its
     arguments, so the cascade is untouched. Applied to a dealt card when
     its tag is hovered in the letter (and to a shelf card from the
     drawer head's manifest); cardLit() fires the decodes alongside. */
  @media (hover: hover) { :is(.d7f:hover, .d7f.lit) .panel {
    box-shadow: 12px 15px 0 -1px rgba(0, 0, 0, .85);
    box-shadow: 5.1724cqw 6.4655cqw 0 -.431cqw rgba(0, 0, 0, .85);
  } }
  .d7f .inframe { position: absolute; inset: 10px; inset: 4.3103cqw; z-index: 1; pointer-events: none; }
  .d7f .inframe::before, .d7f .inframe::after {
    content: ""; position: absolute; left: 0; width: calc(100% - 4px);
    height: 41%; border: 2px solid #000;
    width: calc(100% - 1.7241cqw);
    border-width: .8621cqw;
    transition: height .56s ease;
  }
  .d7f .inframe::before { top: 0; border-bottom: 0; }
  .d7f .inframe::after { bottom: 0; border-top: 0; }
  @media (hover: hover) { :is(.d7f:hover, .d7f.lit) .inframe::before, :is(.d7f:hover, .d7f.lit) .inframe::after { height: calc(50% - 6px); height: calc(50% - 2.5862cqw); } }
  .d7f .dgl, .d7f .dgr {
    position: absolute; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    width: 2.1552cqw; height: 2.1552cqw;
    background: #000; transform: translateY(-50%);
  }
  .d7f .dgl { left: -1.5px; left: -.6466cqw; }
  .d7f .dgr { right: -1.5px; right: -.6466cqw; }
  .d7f .inframe .ctl, .d7f .inframe .cbr { position: absolute; display: block; }
  .d7f .inframe .ctl { width: 4px; height: 4px; top: -1px; left: -1px; background: #000; width: 1.7241cqw; height: 1.7241cqw; top: -.431cqw; left: -.431cqw; }
  .d7f .inframe .cbr { width: 6px; height: 6px; bottom: -1px; right: -1px; background: #FF4655; width: 2.5862cqw; height: 2.5862cqw; bottom: -.431cqw; right: -.431cqw; }
  /* .frame rides the same square spec: the fv3 lightbox card is the same
     markup shape with .frame where the grid card has .stage */
  .d7f .stage, .d7f .frame {
    position: relative; height: auto; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .d7f .stage img, .d7f .frame img {
    /* absolute + inset/margin centering: iOS Safari ignores %-max-height
       against an aspect-ratio (indefinite) height on in-flow children —
       abs-positioned children resolve % against the laid-out box instead */
    position: absolute; inset: 0; margin: auto;
    max-height: 79%; max-width: 78%; width: auto; height: auto;
    filter: drop-shadow(7px 9px 0 rgba(0, 0, 0, .3));
    filter: drop-shadow(3.0172cqw 3.8793cqw 0 rgba(0, 0, 0, .3));
    /* the transform COMPOSES from vars (undersides port): --face is the
       bot face's parked 180, --bgrow the hover grow — one property, two
       owners, no fights */
    transform: rotateY(var(--face, 0deg)) scale(var(--bgrow, 1));
    transition: transform .44s ease, filter .44s ease;
  }
  /* THE SHADOW TAKES PRECEDENCE OVER THE TEXT (2026-08-17, his ruling:
     "on all the card renders") — the board + its thrown shadow ride z1,
     over the info line's z0, under every chip/control's z2: a shadow
     crossing the name/dims line dims it like a real shadow crossing
     print, instead of sliding beneath. STAGE ONLY here: the lb card's
     .frame faces carry their own z choreography (top z1 / parked z−1 —
     the carousel's hide-behind-the-panel trick) and must never gain a
     stacking context between them and the panel. */
  .d7f .stage img { z-index: 1; }
  /* THE SOLD BOARD DIMS ITS COLOUR, NOT ITS CARD (2026-08-19, his ask:
     "keep its opacity just fade / dim its color so its neighboring card
     cant be seen through it"). The blanket `.sold { opacity: .55 }` made
     the whole CARD translucent, so anywhere cards overlap — the strip's
     shingle above all — you read the neighbour straight through a sold
     one. The card is opaque again here and the BOARD carries the sold
     read instead: desaturated and lifted, no transparency anywhere.
     The filter goes on the IMG, never on .stage — a filter makes a
     stacking context, and one on .stage would trap the flip faces'
     parked z:−1 exactly as the 2026-08-17 z lesson describes — which
     means the drop-shadow has to be restated alongside it (both the px
     fallback and the cqw, in that order, like the base rule). */
  .d7f.sold { opacity: 1; }
  .d7f.sold .stage img, .d7f.sold .frame img {
    filter: grayscale(.85) brightness(1.12) drop-shadow(7px 9px 0 rgba(0, 0, 0, .18));
    filter: grayscale(.85) brightness(1.12) drop-shadow(3.0172cqw 3.8793cqw 0 rgba(0, 0, 0, .18));
  }
  @media (hover: hover) { :is(.d7f:hover, .d7f.lit) .stage img {
    --bgrow: 1.07;
    filter: drop-shadow(11px 14px 0 rgba(0, 0, 0, .3));
    filter: drop-shadow(4.7414cqw 6.0345cqw 0 rgba(0, 0, 0, .3));
  } }
  /* the sold read SURVIVES the hover: the rule above outranks the sold
     block on specificity (:is takes its widest arm), so the grey would
     wash out the moment the cursor landed. Restated at hover weight,
     with the hover shadow — a sold card still answers the hand, it just
     never gets its colour back. */
  @media (hover: hover) { :is(.d7f.sold:hover, .d7f.sold.lit) .stage img {
    filter: grayscale(.85) brightness(1.12) drop-shadow(11px 14px 0 rgba(0, 0, 0, .18));
    filter: grayscale(.85) brightness(1.12) drop-shadow(4.7414cqw 6.0345cqw 0 rgba(0, 0, 0, .18));
  } }
  /* ---- UNDERSIDES (flip-lab port — vault repo, 2026-07-25) ----
     Board click flips to the underside — the object is the control.
     THE FLIP LIVES IN THE LIGHTBOX ONLY, as the carousel — see the
     #lb.fv3 block, which is `.frame`-scoped. Only .canflip cards flip
     (BOT() resolves a canva pair's other face; an original flips once its
     reshoot pair lands in CANVA — 07 has one, 01-06 still ride the interim
     no-flip). Nothing here is collection-aware: canflip is toggled purely
     on whether BOT() resolves, so a pair is the whole switch.
     GRID/SHELF CARDS DO NOT FLIP (Dylan, 2026-07-26): "i dont think kick
     belongs on a collections board click. it gets in the way of the
     lightbox / could inadvertently hide a card click to inspect." So
     rendered cards use the template's plain-img branch and carry ONE
     image instead of two, and every collection surface is plainly
     click-to-inspect rather than a pixel probe managing two verbs on the
     same pixels. */
  /* words indicator (Dylan's sketch): Top/Bottom stacked top-right, the
     shown face at full ink, the hidden one at the .22 faint; the words
     are controls too. State-driven, not hover — no .tset/.hold mirror. */
  .d7f .find {
    position: absolute; top: 13px; right: 14px; z-index: 2;
    top: 5.6034cqw; right: 6.0345cqw;
    display: none; flex-direction: column; align-items: flex-end;
    gap: 3px; gap: 1.2931cqw;
    font-family: var(--mono); font-size: 8.5px; font-weight: 700;
    font-size: max(6px, 3.6638cqw);
    letter-spacing: .2em; text-transform: uppercase; color: #000;
    text-align: right;
  }
  .d7f.canflip .find { display: flex; }
  .d7f .find span { cursor: pointer; opacity: .22; transition: opacity .3s ease; }
  .d7f:not(.flipped) .find .ftop { opacity: 1; }
  .d7f.flipped .find .fbot { opacity: 1; }
  /* the builder's mark owns the top-right corner — words drop below it */
  .d7f .tspark ~ .find { top: 30px; top: 12.931cqw; }
  /* the per-surface suppressions (belts, bay shelves, flights, lb neighbours)
     retired with the kick — the template no longer renders .find at all, so
     the only .find on the page is the lightbox card's own static markup. */
  /* THE PHONE FLIP CHIP (2026-08-16, his spec: "the top right of the card
     should show whichever side of the board is not currently centered on
     the card with flip written above it") — the .find words' phone
     translation: the hidden face ITSELF as a mini cutout, the verb above
     it. Template-rendered wherever a canva pair exists (m.bot), but
     display-gated: only grid .scards and the lb card show it, and only
     ≤940 — so tiny renditions (header minis, band clones, bay items,
     flights) stay silent per the proportion law, and the desktop keeps
     its Top/Bottom words on the lb. The chip is the GRID's whole flip
     door (a dedicated corner target — the board keeps its one tap-to-
     inspect verb, the kick-retirement ruling stands). */
  .d7f .fflipc {
    position: absolute; top: 13px; right: 14px; z-index: 2;
    top: 5.6034cqw; right: 6.0345cqw;
    display: none; flex-direction: column; align-items: flex-end;
    background: none; border: none; border-radius: 0; padding: 0;
    cursor: pointer;
  }
  /* the builder's mark owns the top-right corner — the chip drops below
     it, the .find precedent */
  .d7f .tspark ~ .fflipc { top: 30px; top: 12.931cqw; }
  /* THE FLIP MARK (2026-08-19, his pick: lucide refresh-ccw) — the verb
     the corner lost when the FLIP word retired, DRAWN not typed (the
     mark-lab's seat-A ruling: a typed label picks up the mono face's
     weight, a drawn glyph keeps the card's cut). It sits where the word
     sat, above the mini, right-aligned by the chip's own column. Same
     lucide dress as .bay-mic/.bay-sk — 2px round caps at 24 units, so
     it scales without the crispEdges mud that put the deck mark in the
     lab in the first place. Sized in cqw like everything else on the
     card; the lb ghost re-sizes it below with its own face. */
  .d7f .fflipc .fmark {
    fill: none; stroke: #fff; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    /* ON the board, dead centre (his call 2026-08-19) — out of flow, so
       the chip's box stays exactly the mini's box and "centre of the
       chip" IS "centre of the board". The chip is position:absolute, so
       it is this mark's containing block. */
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 1; pointer-events: none;
    width: 13px; height: 13px; width: 5.6034cqw; height: 5.6034cqw;
  }
  /* the mini needs a REAL box pre-load (the lazy 0×0 law) — cutouts are
     tall portraits; contain keeps every shape honest in one slot */
  .d7f .fflipc .fface {
    width: 22px; height: 58px; width: 9.4827cqw; height: 25cqw;
    object-fit: contain; object-position: top right; display: block;
  }
  /* THE DESKTOP GHOST (T9, 2026-08-17, Dylan: "lets add the boards other
     side back to the card. about the size of the box in the screen shot.
     no text in the corner. 60 pct opacity") — PORTED HERE 2026-08-19, his
     call, after the flip-mark port found it missing: the lb chip was still
     phone-only in this repo, so the desktop lb had no corner at all and
     kept the Top/Bottom words the ghost replaced. The chip shows on EVERY
     width now; the ≥941 block below sizes it up into the ghost. The
     non-fv3 hide still wins this tie (.lb-fv3only, later in source). */
  #lb-card.canflip .fflipc { display: flex; }
  /* the words stand down where the chip speaks, at every width now (id
     outranks the .d7f.canflip .find show rule — no !important needed).
     The lb card's static markup is the only .find left on the page, so
     this is the words' retirement, the vault's outcome reached without
     ripping the markup out. */
  #lb-card .find { display: none; }
  @media (max-width: 940px) {
    /* .bay-fly too: a phone flight must fly the chip it will land
       beside — rest == rest, no touchdown pop (desktop flights stay
       chip-less; the lb ghost above is the desktop's one chip) */
    .scard .d7f .fflipc, .bay-fly .d7f .fflipc { display: flex; }
  }
  @media (min-width: 941px) {
    /* his screenshot's box: ~80×120 at a 553 card — wider, a touch
       shorter than the phone mini's proportions. 60% at rest (his
       number), a quiet rise toward ink on hover — full strength would
       compete with the hero board; the ghost stays a ghost. The opacity
       dresses the FACE, never the button: on the button it would ghost
       the flip mark sitting on the board too (2026-08-19, his call —
       "keep the white at full opacity"). */
    #lb-card .fflipc .fface { opacity: .6; transition: opacity .3s ease; }
    #lb-card .fflipc:hover .fface { opacity: .85; }
    /* THE SLOT HUGS THE BOARD: the cutouts all sit at ~0.36 wide-to-tall
       (0.345–0.391 across the canva set) and `contain` fits them by
       HEIGHT, so a slot much wider than that leaves dead air down its
       left side and the centred mark reads left of the board. The slot
       carries the grid mini's own 0.379 ratio; the board neither moves
       nor resizes (height-limited already, and `object-position: top
       right` pins it to the edge the slot keeps). */
    #lb-card .fflipc .fface {
      width: 19px; height: 50px;
      width: 8.2242cqw; height: 21.6998cqw;
    }
    /* the ghost's face is proportionally WIDER than the grid mini's, so
       the mark takes its own ratio here rather than riding the base */
    #lb-card .fflipc .fmark {
      width: 22px; height: 22px;
      width: 4.3399cqw; height: 4.3399cqw;
    }
  }
  .d7f .corner {
    /* panel-anchored — the grid template and the lb card both put .corner
       directly in .panel now. 11px, not 12: the chip box tucks 1px (at
       reference) UNDER the 2px frame line — exactly flush edges round to
       different device pixels at fractional widths and leak a white seam
       between fill and frame; chips paint above the frame, so the overlap
       is invisible. fc-ref's padding puts the glyphs back at the 12px spot. */
    position: absolute; top: 11px; left: 11px; z-index: 2;
    top: 4.7414cqw; left: 4.7414cqw;
    display: flex; align-items: center; gap: 7px; gap: 3.0172cqw;
  }
  .d7f .info { position: relative; z-index: 0; text-align: center; padding: 8px 28px 44px; padding: 3.4483cqw 12.069cqw 18.9655cqw; color: #000; }
  .d7f .nm { display: block; font-size: 11.5px; font-size: max(6px, 4.9569cqw); font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  /* the collapse decode's position-lock cells (decodeCollapse) — each
     char frozen at its measured width so the churn never shoves the line */
  .nmt .dcell { display: inline-block; text-align: center; white-space: pre; }
  .d7f .tspark { position: absolute; top: 13px; right: 14px; top: 5.6034cqw; right: 6.0345cqw; font-size: 12px; font-size: 5.1724cqw; z-index: 2; }
  .d7f .fchip {
    position: relative; overflow: hidden;
    font-family: var(--mono); font-size: 8.5px; font-weight: 700;
    font-size: max(6px, 3.6638cqw);
    letter-spacing: .2em; text-transform: uppercase;
    color: #000; background: none; border: none; border-radius: 0;
    padding: 6px 9px;
    padding: 2.5862cqw 3.8793cqw;
  }
  .d7f .fchip::before {
    content: ""; position: absolute; inset: 0; background: #000;
    transform: scaleY(0);
  }
  .d7f .fchip :is(.ft, .fscript) { position: relative; z-index: 1; transition: color .2s ease .18s; }
  @media (hover: hover) { :is(.d7f:hover, .d7f.lit) .fchip :is(.ft, .fscript) { color: #fff; } }
  button.d7f-cta { cursor: pointer; }
  .d7f .fc-ref {
    /* +1px top/left padding pairs with .corner's 1px frame tuck — the box
       edge sits inside the frame line, the glyphs stay at the flush spot */
    padding: 7px 9px 6px 10px;
    padding: 3.0172cqw 3.8793cqw 2.5862cqw 4.3103cqw;
  }
  .d7f .fc-ref::before { transform-origin: center top; }
  .d7f .fc-list {
    /* 11px = the same 1px frame tuck as .corner (seam seal); the extra
       bottom/right padding holds the glyphs at the 12px flush spot */
    position: absolute; bottom: 11px; right: 11px; z-index: 2;
    bottom: 4.7414cqw; right: 4.7414cqw;
    letter-spacing: .16em;

  .d7f .fc-list .fl { display: inline-flex; align-items: center; justify-content: space-between; gap: 5px; gap: 2.1552cqw; min-width: calc(6ch + .96em + 23px); min-width: calc(6ch + .96em + 9.9138cqw); }
  /* the deck mark (2026-08-05, round 2 — Dylan: "mimic the deck more

  #lb:not(.fv3) .lb-fv3only { display: none; }

  #lb.fv3 .lb-card { width: min(430px, 73vw); }
  @media (max-width: 720px) {

    #lb.fv3 .lb-card .frame img,

  @media (min-width: 721px) {

       lb only, the ONE CARD SPEC base (79/78) untouched, exactly as the
       phone block works. The CLONES ride the same numbers (.lbnb — the
       exchange/scrub actors are the grid template's .stage dialect) or a
       promoted flank would pop to a different board size at the landing:
       the phone's own ratio law, and it is why the resting neighbours
       grow with the hero rather than being left behind. */
    #lb.fv3 .lb-card .frame img,
    #lb.fv3 .lbnb .stage img { max-height: 94.8%; max-width: 93.6%; }
    /* the one-spec card is taller (~1.52:1): the height term keeps the
       WHOLE INSPECTION inside the window (2026-08-16 A/B — "at 1440x790
       the lightbox view should hold all its components comfortably").
       The old 120px budget predated the strip. RE-DERIVED 2026-08-19 with
       the counter-leads re-order and the smaller minis: the head stack is
       headClr 12 + counter ~16 (13px type) + drop 12 + band ~91 (mini 37
       at pop 1.3) + prog 18 + dot 5 + clr 72 ≈ 219 — but the LANDED stack is bigger than
       that sum (the scoot's margin:auto share grows with the card), so
       this number is TUNED against the measured dims-line slack, not
       derived: 282 left it 2-3px over the fold, 292 lands it inside, plus the card's 24px bottom pad and the dims
       line (~39 with its margin — a first-class component now that the
       desc retired) — 292 is that stack stated once (re-derive if
       STRIP_TUNE or the dims spec moves; gapB left the stack with the
       counter). Assets come down on short displays by

    #lb.fv3 .lb-card { width: max(260px, min(430px, calc((100dvh - var(--tbh, 0px) - 292px) / 1.53))); }

  /* THE HEADER IS ONE LINE ON A CHIP (Dylan, 2026-08-01, replacing the

     fraction read, so the eye takes "HS 3" as one object, the board's name.

     THEN IT STACKED (same session). One line could not carry both facts,
     because THE TAG AND THE POSITION ARE DIFFERENT NUMBERS: refs are
     non-contiguous by design (CLAUDE.md's inventory-ID thread — classic
     position 1 is CL 3, hand-shaped position 5 is HS 10), so "HS 10 / 14"
     put an honest tag beside a total that no longer said where you were.
     Shown that, Dylan took BOTH, stacked:

         HS 10
          5 / 14

     Tag on top and dominant — it is the board's NAME, and naming the board
     is the header's first job now. Position underneath, small and quiet:
     still there for wayfinding through the deck, no longer competing to be
     read as the board's identity. The card's own corner chip prints the
     same tag (refOf), so header and card can never disagree.

     NEXT (his order, not yet built): dial the placement in, then design how
     the two numbers ANIMATE from board to board — which is why the digits
     have their own spans. Note this does not reopen the static ruling: the
     CHIP stays put through a rotation, and the numbers changing inside it is
     a different gesture from the whole header blinking out and back.

     THE CHIP IS BLACK ON BOTH GROUNDS, deliberately NOT the ground's inverse
     that the drawn bar and the nav seat use. Two reasons: it matches the
     card's own chips, which are black on a white card regardless of ground,
     so the header reads as the same family of object; and on the dark ground
     a black square against the faded shop is invisible except that it OCCLUDES
     the ghost content behind the line — which is the same complaint the fade
     knob answers. Simple square, no radius, no animation: his ask, and the
     one thing here that must never compete with the card's own build. */
  /* absolute, not fixed, and JS-placed just above the card (Dylan, 2026-07-26 —
     moved off the topbar line down onto the card): it labels the CARD, so it
     travels with it through the sheet's scroll instead of hanging in the
     chrome. The top here is only the pre-placement fallback — placeDeck() owns
     it, and falls back to this line when a short viewport leaves no room. */
  #lb .lbhead {
    position: absolute; left: 0; right: 0; top: 14px;
    z-index: 3; display: none;
    justify-content: center; align-items: center;
    pointer-events: none; text-align: center;
    opacity: 0; transition: opacity .4s ease .18s;
  }
  body[data-lb="deck"] #lb.fv3 .lbhead { display: flex; }
  #lb.in .lbhead { opacity: 1; }
  /* closing: the header must not ride the card home (the .lb-rest law) */
  #lb:not(.in) .lbhead { transition: opacity .1s ease; }
  /* KEEP IT SIMPLE (Dylan, 2026-08-01, closing the header A/B — "not
     especially stoked on either. lets just keep it simple. no colored text.
     no black back drop. lets double the size on both fonts"):

     The filled black chip AND the accent-outlined box are both DELETED, and
     so is the ?lbh= plumbing that compared them — do not rebuild either from
     the git log. What is left is the two facts at type scale on the ground:

         HS 15        36px, ground ink, the board's NAME
         8 / 14       20px, dimmed, the deck's position

     No fill, no outline, no accent. The hierarchy is carried by SIZE alone,
     which is the one thing neither costume was doing — both were spending a
     drawn object on a label, and this page already has a drawn object in it:
     the card. The dim on the position is opacity, not a colour, so it reads
     the same on either ground. */
  .lbhead .lbh-chip {
