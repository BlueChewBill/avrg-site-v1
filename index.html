  /* THE ENVELOPE PROPORTION (2026-08-04, Dylan: "lock it to a proportion
     that's real envelope size or close — it can draw square at certain
     resolutions and it looks way off"). The box used to take whatever the
     flex line had left over, so its shape was a side effect of the
     viewport: long and letterboxed on a wide short stage, near SQUARE on
     a tall narrow one, and a square envelope reads as a box, not a
     letter. bdmShape() now fits a real envelope rectangle into the space
     instead — see ENV_TUNE for the ratio and the alternatives.
     These rules are the PRE-SHAPE state only: they hold through the pull,
     when the stage is still flying and approximate is right. bdmShape
     takes over the moment the pull lands and writes flex/width/height
     directly, which is also the integer-size half of THE PIXEL GRID. */
  .bdm-prev {
    position: relative; flex: 1 1 auto; min-height: 110px;
    /* 1440 mirrors ENV_TUNE.maxW — this is only the pre-JS fallback, but a
       stale number here means the no-JS look and the real look disagree.
       Raise both together (it read 920 for one commit after the cap moved). */
    width: min(1440px, calc(100% - 96px));
    width: round(down, min(1440px, calc(100% - 96px)), 1px);
    /* margin AUTO ON BOTH AXES (2026-08-11, Dylan: big displays "get
       cramped up top — add some space between the cards and the envelope
       without distorting the page at lower resolutions"). On a laptop the
       ratio-fit consumes the whole height budget, the auto margins
       resolve to 0 and NOTHING changes — that is the no-distortion
       guarantee, by construction rather than by breakpoint. On a large
       display the paper hits maxW (1440) and stops growing, and the
       leftover height used to pile up entirely BELOW it — the cramp was
       never a budget shortage, it was all the slack parking on one side.
       Auto margins split that slack around the paper, so the card row
       gets its air exactly when there is air to give.
       (Was `margin: 0 auto` — horizontal only — from the 2026-08-04
       send-into-the-card pass, which assumed the height budget was
       always fully spent. True until the paper could hit its width cap.) */
    margin: auto;
    background: #fff;
    transition: box-shadow .3s ease;
  }
  .bdm-prev.pshadow { box-shadow: 5px 6px 0 rgba(0, 0, 0, .85); }
  /* dots stay the site's 5px structural dot (ODD — it lands whole on the
     .5 crease centre); round() seats them at a whole px at EITHER box
     parity, which a fixed calc() cannot (the bay-close lesson) */
  .bdm-prev .pdot { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #000; }
  .bdm-prev .pd-t { left: calc(50% - 2.5px); left: round(calc(50% - 2.5px), 1px); top: 10px; }
  .bdm-prev .pd-b { left: calc(50% - 2.5px); left: round(calc(50% - 2.5px), 1px); bottom: 10px; }
  .bdm-prev .pd-l { top: calc(50% - 2.5px); top: round(calc(50% - 2.5px), 1px); left: 10px; }
  .bdm-prev .pd-r { top: calc(50% - 2.5px); top: round(calc(50% - 2.5px), 1px); right: 10px; }
  .bdm-pline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .bdm-pline path { fill: none; stroke: #000; stroke-dasharray: 1.05; stroke-dashoffset: 1.05; }
  /* BOLDER (his item 1): the silhouette doubles to 3. The hierarchy is
     silhouette 3 > flap seam 2 > crease 1 — an envelope's outline is a
     cut edge, its seams are paper over paper, its creases are a fold. */
  .bdm-pline .po { stroke-width: 3; }
  .bdm-pline .pi { stroke-width: 1; }
  .bdm-prev.pdraw .po { stroke-dashoffset: 0; transition: stroke-dashoffset .48s ease; }
  .bdm-prev.pconnect .pi { stroke-dashoffset: 0; transition: stroke-dashoffset .35s ease; }
  /* ONE SVG OWNS THE ENVELOPE (2026-08-04, the trace bug's real fix): the
     moment the fold starts the composer's whole line svg goes dark and
     .bdm-fold draws the silhouette itself. Before this the two svgs split
     the picture across two paint stacks, and — the actual ghost — a
     resize re-ran bdmPlineGeom, whose innerHTML rebuild WIPED the
     per-path visibility the fold had written, resurrecting the composer's
     gapped inner legs underneath the fold's own creases. Hiding the
     PARENT can't be undone by a child rebuild, which is the whole point:
     the fix is structural, not more bookkeeping. */
  .bdm-prev.folding .bdm-pline { visibility: hidden; }
  /* the LETTER goes into the envelope with the boards: once the fold
     starts, the message stops being legible through the opening — you are
     looking at paper from the outside now, not at the sheet. It also
     un-collides the text from the stuffed cards, which shared that top
     quadrant and read as debris behind them. Delayed past the first flap
     so the sheet is still the thing you pressed send on. */
  /* TARGETS THE TWO CONTENT HALVES, NOT .bdm-body (2026-08-04): the send
     moved inside the body when it became part of the card, and it has to
     OUTLIVE the fold — press one folds, press two is MAIL IT. Opacity on a
     parent cannot be undone by a child, so dimming the body would have
     taken the button with it and left gesture two with nothing to press.
     Dimming the form and the sheet hides exactly the same picture. Any
     future body child must be added to this list deliberately: the default
     is now "survives the fold", which is the wrong default for content. */
  .bdm-prev.folding .bdm-sheet { opacity: 0; pointer-events: none; transition: opacity .34s ease .18s; }
  /* the composer's inner body: the form over the message, both inside the
     drawn inner frame. Everything in here scales off --envk, a plain
     number bdmShape writes from the envelope's own width (610 = 1), so
     the type tracks the paper instead of being right at one viewport and
     wrong at the rest. Clamped in JS, because a form that shrinks past
     legible is worse than one that stops scaling. */
  .bdm-body {
    /* CLEARANCE, not coincidence (Dylan, 2026-08-04): 12.5px is the drawn
       inner frame's own line (BDM_INSET) and the rest is real air off it,
       so nothing in here rides that edge. It was 16px flat — three and a
       half pixels of clearance, which reads as a mistake rather than a
       margin. The gap between the two halves is the same order as the gap
       to the frame, which is what makes them read as halves of one thing
       instead of a stack. */
    /* THE LETTER OWNS THE PAPER (2026-08-09 pre-jam — the tray retired,
       and with it the two-column sketch). One column: the sheet takes
       everything above SEND. The inset grew with the same call ("more
       space between it and the inner edge... same size across the
       envelope") — uniform on all four sides on purpose, the margin IS
       the design now that the paper holds one thing. */
    /* the TOP and BOTTOM insets run shallower than the sides (2026-08-11,
       Dylan: "move our 'yo interested' header up a bit" / "move the send
       button down a bit") — the greeting rides closer to the frame's top
       line, the send closer to its bottom, and the letter takes the
       freed air between */
    position: absolute; min-height: 0;
    inset: calc(12.5px + 14px * var(--envk, 1)) calc(12.5px + 30px * var(--envk, 1)) calc(12.5px + 16px * var(--envk, 1));
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
    gap: calc(14px * var(--envk, 1));
  }
  /* the send keeps the capped scale (--trayk) so it stops at legible while
     the letter grows with the paper — the one survivor of the tray's law */
  .bdm-body > .bdm-actions { --envk: var(--trayk, 1); grid-area: 2 / 1; align-self: end; }
  .bdm-body > .bdm-sheet { grid-area: 1 / 1; }
  /* THE TRAY RETIRED (2026-08-09 pre-jam, Dylan: "remove the contact
     and send info") — name/channel/handle rules went with the markup; a
     reddit DM already says who is sending it. The letter owns the whole
     paper and SEND rides alone at its foot. */
  .bdm-sheet {
    min-height: 0; overflow-y: auto; scrollbar-width: none;
    /* the message asks for less: space and an INDENT, no frame. It is the
       written half — a box around prose would make it look like another
       field to fill rather than the thing you are writing. */
    padding: calc(2px * var(--envk, 1)) calc(12px * var(--envk, 1)) 0;
    /* BIGGER (2026-08-09 pre-jam, "make the text portion of the card
       bigger") — 9.5 → 12.5 at reference; the letter is the whole paper
       now and reads at letter size, not form-print size */
    font-family: var(--mono); font-size: max(11px, calc(12.5px * var(--envk, 1)));
    letter-spacing: .06em; line-height: 1.75;
    /* A TAG RAIL AND A TEXT ROOM (2026-08-04, his sketch: green is the deck
       tags, black the text room that follows them). Each board is now a ROW
       — chip in column one, its own line beside it — instead of a chip with
       its text stacked underneath. That is the fix for the clipping: adding
       a board costs one row of width the envelope already has, rather than
       vertical space it does not.
       `auto` for the rail, so the column is exactly as wide as the widest
       ref and every text room starts on the same line — which is only true
       because padRef makes every ref the same width in the first place.
       align-content: start keeps the letter at the top; without it the rows
       stretch to fill a tall sheet and the lines drift apart. */
    /* THREE columns (2026-08-04, his flow: "tag - Dot - writing line"). The
       dot is the site's own connector grammar — the same 5px structural dot
       the card rails converge on and the bar welds to — so the letter stops
       being loose type and starts being drawn furniture like everything
       else. His diagnosis was the point: "some of the lines read weak
       against the rest of the site where board zooms and shadow movement
       were doing a lot of lifting."
       Rail sized to the widest ref, which only lines up because padRef makes
       every ref one width. align-content: start keeps the letter at the top;
       without it the rows stretch and the lines drift apart in a tall
       sheet. The row gap is the breathing room he asked for. */
    display: grid; grid-template-columns: auto auto 1fr; align-content: start;
    column-gap: calc(9px * var(--envk, 1));
    /* 6, not 7: at a full 6-board deck the ruled rows plus the free lines
       ran the letter 12px past the sheet. The gap is the breathing room he
       asked for, so it pays last — a pixel off each row buys the overflow
       back without touching the rules or the free lines. */
    row-gap: calc(6px * var(--envk, 1));
  }
  /* the connector dot. ODD 5px so it lands whole on a half-pixel centre (the
     parity gotcha), and align-self centres it on the FIRST text line rather
     than on a wrapped block's middle. */
  .bdm-sheet .lndot {
    width: 5px; height: 5px; border-radius: 50%; background: #000;
    align-self: start; margin-top: .72em; justify-self: center;
  }
  .bdm-sheet::-webkit-scrollbar { display: none; }
  /* display: contents — the line keeps existing as a DOM node (bdmApply
     tracks it by data-key, the decode writes into its body, bdmTagOf finds
     its chip) but stops being a box, so its tag and its body become direct
     grid items of the sheet and land in the two columns. A wrapper box here
     would make each line its own one-row grid and the rails would not line
     up between boards.
     The min-height moves to the BODY: an empty line still has to hold its
     row open, and a grid item is blockified, so min-height applies there
     even though .lnb's own display is `inline`. */
  .bdm-sheet .ln { display: contents; }
  .bdm-sheet .lnb { min-height: 1.75em; }
  /* the lines with no tag — the opener, the free lines, the reach-me-at, the
     link — span the whole width. */
  .bdm-sheet .ln:not([data-id]) .lnb { grid-column: 1 / -1; }
  /* THE WRITING LINE: a board's text sits ON a rule, ruled-paper style, so an
     empty room still says "write here" instead of reading as a gap. This is
     the "announce" half of his note — the rule is what makes the row an
     invitation rather than blank space. */
  .bdm-sheet .ln[data-id] .lnb {
    border-bottom: 1.5px solid #000;
    padding: 0 0 calc(3px * var(--envk, 1));
  }
  /* THE OPENER: bolder, the sentence every other line hangs off. ITS RULE
     IS GONE (2026-08-11, Dylan: "remove its text underline") — with the
     header riding higher the underline read as a second frame line; the
     weight and the centering carry the title alone now. */
  .bdm-sheet .ln[data-key="greet"] .lnb {
    text-align: center;   /* centered (2026-08-09, Dylan) — the letter's title line, not a list entry */
    font-weight: 700;
    padding-bottom: calc(5px * var(--envk, 1));
    /* THREE SECTIONS, NOT A STACK OF LINES (his 2026-08-04 read: "freeing up
       room so the right side of the card reads more like 3 sections rather
       than a bunch of lines"). This margin and the free block's top margin are
       the two section breaks — header · the boards · anything else. The row
       gap inside the board block is left ALONE because he said that spacing
       was already right; what was missing was air between the groups, not
       between the rows. Dropping the opener dropdown and the link line is what
       paid for it. */
    margin-bottom: calc(20px * var(--envk, 1));
  }
  /* (THE FREE LINES RETIRED 2026-08-11 — Dylan: "the extra section is
     redundant. the msg is being pushed to another messaging platform
     anyways." The 4-row stock design IS the letter; the ruled-gradient
     idiom lives in git if a ruled free field is ever wanted back.) */
  /* TUNED FOR FOUR, COMPRESSES PAST IT (his "optimize the tags for 4"). The
     section breaks above are sized so a 4-board deck sits with real air around
     the tag block. A 5th and 6th board would then push the letter into a
     hidden-bar scroll — and content behind an invisible scroll is what read as
     BROKEN earlier in this same composer, so the gaps give way instead. The
     board rows keep their spacing either way; only the air between the groups
     pays, because the rows are what he said was already right.
     Four is his number and his reasoning: "if anyone is interested in more
     than a couple im already probably a pretty solid back and forth with
     them" — so past four this stops being the design target and starts being
     a case that only has to stay legible. */
  .bay-dm.deck-many .bdm-sheet .ln[data-key="greet"] .lnb { margin-bottom: calc(8px * var(--envk, 1)); }
  .bay-dm.deck-many .bdm-sheet { row-gap: calc(4px * var(--envk, 1)); }
  /* the empty-state hint (the goofy board line). A
     PSEUDO on purpose: it can never reach textContent, so it cannot be sent,
     selected or copied — which is the only reason it is safe to put "$3.50"
     in a field that mails a real person. */
  /* THE INVITATION CARET (2026-08-09, Dylan: "a blinking block text
     indicator ... what the hell is the, you are typing here thing
     called?" — it's a CARET, and this is the terminal's block flavour).
     Hovering a board's tag chip — or its dealt card above (.caret, set
     by the card's own hover in bdmBuild) — parks a blinking block at
     the end of that board's writing line: "you type here". It yields to
     the real caret the moment the line takes focus. */
  @keyframes bdmblink { 50% { opacity: 0; } }
  .bdm-sheet .lntag:hover ~ .lnb:not(:focus)::after,
  .bdm-sheet .ln.caret .lnb:not(:focus)::after {
    content: ""; display: inline-block;
    width: .55em; height: 1.05em; margin-left: 2px;
    background: currentColor; vertical-align: -0.18em;
    animation: bdmblink 1.06s steps(1) infinite;
  }
  .bdm-sheet .lnb[data-ph]:empty::before {
    content: attr(data-ph); color: #b4b4b4;
    pointer-events: none; user-select: none;
  }
  /* THE LETTER IS EDITABLE (Dylan, 2026-08-04): whatever you put in from a
     board's ask box has to be changeable here too, and everything is
     deletable — EXCEPT the board tags, which are ironed in. That is why
     the tag lives OUTSIDE the editable region rather than being an
     un-deletable inline node inside one: you cannot backspace through
     something that was never in the text. Emptying a board's body in the
     letter resets that board's ask (the split button returns), which is
     the same fact stated from the other end. */
  .bdm-sheet .lnb {
    display: inline; white-space: pre-wrap; outline: none; caret-color: #000;
    min-width: 1px;
  }
  .bdm-sheet .lnb:focus { background: rgba(0, 0, 0, .05); }
  /* THE TAG PRINTS AT REST (2026-08-11, Dylan: "'HS 06' is black text
     normally... give the send button room to read like a button") — the
     standing black chips competed with the send, which is now the
     stage's ONLY resting black box. Attention fills the tag: cursor on
     the tag, its dealt card hovered (.caret rides the same class the
     invitation caret uses), or the caret in its line (.editing, rewired
     — the toggle had died in an earlier rework) wipes the black chip in
     LEFT→RIGHT; leaving drains it DOWNWARD. Padding is unchanged from
     the chip era so the fill lands with zero reflow. */
  .bdm-sheet .lntag {
    /* a grid item in the rail now: the .5em right margin was the gap to its
       own text and the sheet's column-gap owns that; align-self keeps the
       chip on the FIRST line of a body that wraps to several, so the rail
       stays a rail instead of centring chips against ragged text blocks. */
    justify-self: start; align-self: start; margin-top: .18em;
    display: inline-block; position: relative;
    font-family: var(--mono); font-size: .84em; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    color: #000; padding: 1px 5px;
    overflow: hidden;   /* the exit drains down OUT of the box */
    user-select: none; cursor: default; white-space: nowrap;
    transition: transform .16s cubic-bezier(.3, .9, .3, 1);
  }
  /* the grow keeps its job (his keep): hover = "this is the one I'm
     pointing at", and the board lights at the same moment (cardLit) */
  @media (hover: hover) { .bdm-sheet .lntag:hover { transform: scale(1.09); } }
  /* ENTER and EXIT animate on DIFFERENT AXES (wipe across, drain down),
     so BOTH are keyframes and the exit is armed by a JS-applied .left —
     the fv3 chip gotcha verbatim: a transition cannot pick up from an
     animation-held value, and an unarmed exit animation would fire on
     page load. tagdrop carries scaleX(1) in both frames because the
     enter's held value dies with its animation. .left sits AFTER the
     fill rule in source: at equal specificity the drain must win the
     one frame both apply. */
  .bdm-sheet .lntag::before {
    content: ""; position: absolute; inset: 0; background: #000; z-index: 0;
    transform: scaleX(0); transform-origin: left center;
  }
  @keyframes tagfill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes tagdrop {
    from { transform: scaleX(1) translateY(0); }
    to { transform: scaleX(1) translateY(103%); }
  }
  .bdm-sheet .lntag > span { position: relative; z-index: 1; transition: color .12s ease; }
  :is(.bdm-sheet .lntag:hover, .bdm-sheet .ln.caret .lntag, .bdm-sheet .lntag.editing)::before {
    animation: tagfill .22s cubic-bezier(.3, .9, .3, 1) forwards;
  }
  :is(.bdm-sheet .lntag:hover, .bdm-sheet .ln.caret .lntag, .bdm-sheet .lntag.editing) > span { color: #fff; }
  .bdm-sheet .lntag.left::before { animation: tagdrop .24s ease forwards; }
  /* THE NO (his spec: an error noise plus a slight jostle pointing at the
     empty field). The site's first negative voice, so it is deliberately
     small and dry: the card throws a few px TOWARD the offender and
     settles, the field takes focus, kbonk fires. No red, no alert copy —
     the motion is the message, and it points.
     `translate`, NOT transform: this box must stay transform-free for its
     lines to raster crisp (THE PIXEL GRID). Same channel as envPress. */
  @keyframes envNope {
    0%, 100% { translate: 0; }
    18% { translate: calc(var(--jx, -1) * 9px); }
    46% { translate: calc(var(--jx, -1) * -5px); }
    74% { translate: calc(var(--jx, -1) * 2px); }
  }
  .bdm-prev.nope { animation: envNope .42s cubic-bezier(.3, .9, .3, 1); }
  /* THE ENVELOPE (Dylan's payoff spec, 2026-08-03): on send the card
     folds itself shut. Each flap is a TRIANGLE by construction — the
     inner-edge legs stay welded at the corners, so a dot pulling its
     line's middle drags a triangle whose base is pinned corner to
     corner. Sequence: bottom dot extends DOWN over the edge + shadow,
     then folds through its own base to the center (the 2D fold is
     free: the apex crossing the base line inverts the triangle);
     left + right do the same in unison; the four folded triangles
     tile the inner rect exactly, so after three folds only the TOP
     quarter shows — the boards' final flight stuffs them through that
     opening (clones live between the sheet and the fold svg, so the
     flaps swallow them by plain paint order); the top dot seals it.
     Apexes are rAF-driven (attributes, not CSS). */
  /* LAYERED, not interleaved (2026-08-04 — the other half of his
     "unclean lines" catch): the flaps used to be appended poly/legs/dot
     per flap, so a LATER flap's white fill painted over an EARLIER
     flap's stroke. Every folded flap tiles its quadrant exactly, so the
     overlap is precisely the diagonal seam — which is why the X read
     thin and grey. Now: one <g> per role, fills first and strokes never
     under a fill. Creases live in the fold svg too (not the composer's
     .pi legs beneath it) for the same reason — a polygon edge sitting
     exactly on a line eats half of it. */
  .bdm-fold { pointer-events: none; }
  .bdm-fold polygon { fill: #fff; }
  .bdm-fold path { fill: none; stroke: #000; }
  /* the weight hierarchy, and the parity rule that keeps it crisp: an
     envelope's outline is a CUT EDGE (3), its seams are paper over paper
     (2), its creases are a fold (1). Axis-aligned strokes are ODD width
     on a .5 centre so they cover whole device rows; the 2px seams are
     exempt because they only ever run diagonally. */
  .bdm-fold .fed { stroke-width: 3; }     /* the silhouette, drawn HERE now */
  .bdm-fold .fleg { stroke-width: 2; }    /* the seam: paper over paper */
  .bdm-fold .fcr { stroke-width: 1; }     /* the crease: a fold, crisp on its .5 centre */
  .bdm-fold circle { fill: #000; }
  /* CENTRE origin (2026-08-04, with the sloppy pile): the pose is
     translate → rotate → scale, and a 0 0 origin would swing each card
     around its own top-left corner, so where it landed would depend on
     the angle it wears. Centre origin puts the visible box exactly where
     stuffPose asks for it at any rotation. */
  .bdm-stuff { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; transition: transform .52s cubic-bezier(.3, .9, .3, 1); }
  .bdm-stuff .d7f { width: 100%; }
  /* mid-mailing the rest of the stage settles to the .45 read and goes
     quiet — the envelope is the only live thing until the flip. The dim
     rides the SLOTS, not the row: the copied line (below) lives in the
     row's box, and opacity on a parent cannot be undone by a child. */
  .bay-dm.mailing .bdm-row { pointer-events: none; }
  .bay-dm.mailing .bdm-slot { opacity: .45; transition: opacity .4s ease; }
  /* THE COPIED LINE (2026-08-11, Dylan's flow: "the space that the cards
     up top occupied should read 'your message about x y z has been
     copied'"). It overlays the row the stuffing vacated — the slots go
     visibility:hidden as their boards fly in, so the box holds its
     height and the words take the empty room. Empty until the seal
     stamps; decodeEl writes it, so no reveal class is needed. */
  .bdm-copied {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    gap: calc(6px * var(--envk, 1)); margin: 0; padding: 0 24px; pointer-events: none;
    /* the addressee line's own size (.bb-line) — the two voices are one
       announcement split across the flip, so they match by law */
    font-size: calc(13px * var(--envk, 1)); letter-spacing: .12em; color: #000;
  }
  /* THE SEAL (Dylan, 2026-08-03): the AVRG mark — a black disc wearing
     the white line logo — stamps the sealed envelope's center like wax.
     The drop is an accelerating stamp (ease-in, not a landing feather);
     the whole envelope answers with a button press (the landpress
     family, depth only: scale + the shadow compressing) + kclick, and
     only then does MAIL IT arm. */
  /* THE SEAL'S ENTRANCE (2026-08-04, his item 4 — "needs a little more
     to it"): it no longer just fades down onto the middle. It DROPS in
     at the top of the stage, lands with the card-into-deck squash, then
     is TOSSED at the envelope — shrinking, turning, landing OFF-AXIS.
     The drop is a transition (one eased fall); the toss is rAF (bezier +
     scale + rotation on one progress value, the bayFlight shape), so
     `.tossing` kills the transition or every frame write would tween. */
  .bdm-seal {
    position: absolute; z-index: 2; border-radius: 50%;
    background: #000; display: grid; place-items: center;
    transition: transform .3s cubic-bezier(.55, 0, .8, .6);
    will-change: transform;
  }
  .bdm-seal.tossing { transition: none; }
  .bdm-seal img { width: 74%; height: auto; }
  /* the impact squash quotes seatDrop's grammar (the card-into-deck
     landing he asked it to borrow) on the INDEPENDENT scale property —
     transform is the drop/toss pose's, and an animation there would
     outrank the inline writes for the length of the beat */
  @keyframes sealLand {
    0%   { scale: 1 1; }
    45%  { scale: 1.05 .92; }
    100% { scale: 1 1; }
  }
  /* NOT bottom-origin like seatDrop's: the seal carries a live scale() in
     its transform, and re-anchoring an existing scale mid-gesture pops it
     a visible few px. A disc squashing about its own centre reads right
     anyway — it is landing on stage air, not seating on a shelf. */
  .bdm-seal.sland { animation: sealLand .22s cubic-bezier(.2, .8, .3, 1); }
  /* the press rides the INDEPENDENT `scale` property, not transform: this
     box must stay transform-free for its lines to raster crisp (see THE
     PIXEL GRID above), and `scale` is the one channel that can press it
     without writing one. It still puts the box off-grid for the 320ms of
     the squash — which is fine, that beat is meant to feel physical —
     but it must never be left holding a value (the dotPulse precedent). */
  @keyframes envPress {
    40% { scale: .985; box-shadow: 3px 4px 0 rgba(0, 0, 0, .85); }
  }
  .bdm-prev.envpress { animation: envPress .32s ease; }
  /* THE FLIP + THE ADDRESS FACE (2026-08-11, Dylan's flow rework: "the
     envelope flips over. on the blank envelope 'paste it to me here
     [reddit] [mail]'"). The letter is already ON THE CLIPBOARD — copied
     at the SEND press, inside that gesture (clipboard writes are
     popup-jail family) — so the sealed envelope turns over to its blank
     back and the DESTINATIONS live there: each logo is a plain
     fresh-click door, which is what retires MAIL IT (gesture two's whole
     reason was popup jail, and a real click on the back face is its own
     gesture). The flip is the site's 2D paper grammar: squeeze to a
     sliver on the independent `scale` channel, swap faces at the waist,
     grow back — the box starts and ENDS transform-free (THE PIXEL GRID:
     the only thing this box may ever wear is a transient scale). */
  /* X-AXIS (Dylan's react, 2026-08-11): the envelope tips over top-to-
     bottom — a letter turned in the hand, not a card spun on a lazy
     susan — so the squeeze rides Y about the box centre */
  .bdm-prev.flip1 { scale: 1 .04; transition: scale .24s cubic-bezier(.55, 0, .85, .6); }
  .bdm-prev.flip2 { scale: 1 1; transition: scale .26s cubic-bezier(.2, .7, .3, 1); }
  /* the back is pure CSS geometry — a 3px border on the integer-locked
     box rasters as crisp as the front's svg silhouette, and a resize
     refit after the flip has nothing to redraw */
  .bdm-back { display: none; position: absolute; inset: 0; z-index: 4; box-sizing: border-box; background: #fff; border: 3px solid #000; }
  .bdm-prev.flipped .bdm-back { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(16px * var(--envk, 1)); }
  .bdm-prev.flipped :is(.bdm-fold, .bdm-seal, .bdm-body, .bdm-pline, .pdot) { display: none; }
  /* the POSTAGE STAMP: the wax seal's own mark in the stamp's seat — a
     thin ink frame, the black disc inside. Decoration in envelope
     grammar so the blank face reads as a real addressed back. */
  .bb-stamp {
    position: absolute; top: calc(14px * var(--envk, 1)); right: calc(14px * var(--envk, 1));
    width: calc(50px * var(--envk, 1)); height: calc(58px * var(--envk, 1));
    border: 1px solid #000; display: grid; place-items: center;
  }
  .bb-stamp > span {
    width: calc(34px * var(--envk, 1)); height: calc(34px * var(--envk, 1));
    border-radius: 50%; background: #000; display: grid; place-items: center;
  }
  .bb-stamp img { width: 74%; height: auto; }
  /* the addressee line — content, so it scales with the paper (--envk),
     like the letter did on the front */
  .bb-line { font-size: calc(13px * var(--envk, 1)); letter-spacing: .12em; color: #000; }
  .bb-chans { display: flex; gap: calc(30px * var(--envk, 1)); }
  .bb-chan { display: flex; flex-direction: column; align-items: center; gap: calc(7px * var(--envk, 1)); text-decoration: none; }
  /* the chip is the drawer grammar: black soft square, white glyph, and
     the hover TIGHTENS (the bay-close breathe — inset, never a
     transform; the glyph never moves). The label under each chip is the
     DESTINATION itself — the send button's old law ("you never have to
     look elsewhere to know where it goes") carried onto the back. */
  .bb-chan .bbq {
    position: relative; width: calc(44px * var(--envk, 1)); height: calc(44px * var(--envk, 1));
    display: grid; place-items: center;
  }
  .bb-chan .bbq::before {
    content: ""; position: absolute; inset: 0; background: #000;
    border-radius: calc(7px * var(--envk, 1));
    transition: inset .18s ease, border-radius .18s ease;
  }
  .bb-chan:hover .bbq::before { inset: calc(2.5px * var(--envk, 1)); border-radius: calc(6px * var(--envk, 1)); }
  /* THE CHIPS LAND WITH A BOUNCE (2026-08-16 A/B): the back face used to
     just BE there at the flip — now each chip overshoots and settles
     (the paStamp grammar at chip scale). display:none → flex restarts
     the animation exactly at the face swap, so this costs zero JS; the
     re-flip guard in bdmFlip means it can never replay mid-ceremony.
     Transform is a TRANSIENT here and ends at identity — the pixel-grid
     law binds the .bdm-prev box, not its children; the press stays the
     inset breathe. Pure scale, so no --envk term needed. */
  .bdm-prev.flipped .bb-chan .bbq { animation: bbLand .5s cubic-bezier(.2, .8, .3, 1) backwards; }
  .bdm-prev.flipped #bb-mail .bbq { animation-delay: .08s; }
  @keyframes bbLand {
    0% { opacity: 0; transform: scale(.55); }
    55% { opacity: 1; transform: scale(1.09); }
    78% { transform: scale(.97); }
    100% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bdm-prev.flipped .bb-chan .bbq { animation: none; }
  }
  .bb-chan svg { position: relative; z-index: 1; width: calc(24px * var(--envk, 1)); height: calc(24px * var(--envk, 1)); }
  .bb-chan .bbrand { fill: #fff; }
  .bb-chan .bstroke { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bb-chan .label { font-size: calc(8.5px * var(--envk, 1)); color: #767676; letter-spacing: .08em; transition: color .18s ease; }
  .bb-chan:hover .label { color: #000; }
  /* THE SEND (his 2026-08-04 call). Envelope-width and directly beneath
     it, so the paper and the press read as one object; black fill because
     this is the only thing on the stage you are meant to press, and the
     MSG bar that opened all this is the same colour. Two lines in ONE
     button: the verb big, the destination under it — you never have to
     look elsewhere to know where it goes. */
  /* NO AUTO MARGIN ANY MORE (2026-08-04, the send moved into the card). It
     used to carry `margin: auto 0` to centre itself in the gap between the
     paper and the drawer floor — "split the difference" — but that gap no
     longer exists: this now sits at the bottom of the card's own interior,
     under the sheet, and .bdm-sheet's `flex: 1 1 auto` is what pushes it
     there. An auto margin left on here would fight the sheet for the slack
     and float the button up into the letter. */
  .bdm-actions { flex: none; display: flex; flex-direction: column; align-items: center; width: 100%; }
  /* (the "OR THE LONG FORM →" footnote is GONE — Dylan, 2026-08-04. It was
     the last thing on the stage and the one item below the send, so it was
     charging the envelope its own height plus a stage gap for a link the
     LISST organ in the bar already carries. The long form is not orphaned;
     it just isn't advertised from inside the composer, which is the one
     place someone has already chosen how to write.) */
  .bdm-send {
    /* CONTENT-SIZED (2026-08-11, his annotation: the red box hugging
       `· SEND ·` — "resize the black outline even more"): the black is
       the seat now, not a bar. Width comes from the word + dots + this
       padding; the 24k sides keep the engulf slab's 9k swallow well
       inside the box. (.33 of the paper before this, .45 and two-thirds
       before that — the whole ladder walked in one day.) */
    box-sizing: border-box; width: auto;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: calc(26px * var(--envk, 1));   /* the dots' rest posts, flanking the word */
    padding: calc(13px * var(--envk, 1)) calc(24px * var(--envk, 1)) calc(12px * var(--envk, 1));
    background: #000; color: #fff; text-decoration: none; cursor: pointer;
    border: 1.5px solid #000;
  }
  .bdm-send .bs-main {
    position: relative; z-index: 2;
    font-family: var(--mono); font-weight: 700;
    font-size: max(15px, calc(17px * var(--envk, 1)));
    letter-spacing: .22em; text-indent: .22em;   /* the tracking's trailing space, taken back */
    line-height: 1;
    transition: color .16s ease;
  }
  /* THE ENGULF, INVERTED (2026-08-11, Dylan: the '· collections ·'
     treatment on the black button). Rest = naked word between white
     structural dots, the bar organ's own grammar. Hover assembles the
     mini fv3 card in negative: dots pull toward the word (travel starts
     at once), the WHITE slab wipes from its centre and lands beneath,
     dots and word flip to ink as it does, and the black inner frame
     draws OUTWARD from the edge centres into the pulled dots (the
     2026-08-01 bar rework's direction — the lines docking into the dots
     IS the finish, no pulse). Geometry is JS-measured (bdmSendFx, the
     buildSeatFx idiom): --sfl/--sfw seat the slab dot-to-dot + the 9px
     swallow, the ring paths are exact px with pathLength normalized.
     Split transition-delay idiom throughout: delays live on the :hover
     rules only, so the exit reverts promptly on the base clocks. Plain
     :hover is safe here — the fill lives INSIDE the button and the hit
     box never moves (the drawn-extent law's safe direction). */
  .bdm-send .bs-dot {
    position: relative; z-index: 2; flex: none;
    width: 5px; height: 5px; border-radius: 50%; background: #fff;
    transition: translate .3s cubic-bezier(.3, .9, .3, 1), background-color .16s ease;
  }
  .bdm-send::before {
    content: ""; position: absolute; z-index: 0;
    left: var(--sfl, 18%); width: var(--sfw, 64%);
    top: calc(6px * var(--envk, 1)); bottom: calc(6px * var(--envk, 1));
    background: #fff; transform: scaleX(0);
    transition: transform .26s cubic-bezier(.3, .9, .3, 1);
  }
  .bs-ring { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .bs-ring path {
    fill: none; stroke: #000; stroke-width: 1.5;
    stroke-dasharray: 1.05; stroke-dashoffset: 1.05;
    transition: stroke-dashoffset .24s ease;
  }
  @media (hover: hover) {
    .bdm-send:hover::before { transform: scaleX(1); }
    .bdm-send:hover .bs-dot {
      translate: var(--sdp, 12px) 0; background: #000;
      transition: translate .3s cubic-bezier(.3, .9, .3, 1), background-color .16s ease .26s;
    }
    .bdm-send:hover .bs-dot:last-of-type { translate: calc(var(--sdp, 12px) * -1) 0; }
    .bdm-send:hover .bs-main { color: #000; transition: color .16s ease .18s; }
    .bdm-send:hover .bs-ring path { stroke-dashoffset: 0; transition: stroke-dashoffset .4s ease .28s; }
  }
  .bdm-send[hidden] { display: none; }
  /* THE LAST THING THAT ANIMATES (his order): the whole chip fills in from
     the left after the letter has finished writing itself. Clip-path, so
     the black slab and the words inside it arrive as ONE object — the
     same wipe the stage's other furniture uses, held back to its own beat
     rather than riding the sweep. It is the last thing now — the long-form
     line that used to follow it is gone. */
  .bay-dm .bdm-send { clip-path: inset(0 100% 0 0); transition: clip-path .46s cubic-bezier(.3, .9, .3, 1); }
  .bay-dm.sendin .bdm-send { clip-path: inset(0); }
  /* the furniture DRAWS IN left to right AFTER the deal (Dylan,
     2026-08-03: squares → dropdowns → the default msg; fine if it takes
     a second — nobody fills anything in while cards are mid-flight).
     Clipped at rest, so the row reads empty through the pull; .furnish
     + per-element transitionDelay (JS) run the sweep. The shown state
     is NEGATIVE inset, not none — none doesn't interpolate, and a 0
     inset would clip the preview's own card shadow and the squares'
     focus shadow at their box edges. Transitions, not animations (the
     bar-freeze lesson: keep the animation slot free). */
  /* (the composer is NOT in this sweep — its dots pre-exist the furnish
     and its build is its own multi-stage gesture, bdmCompose) */
  .bay-dm .bdm-actions {
    clip-path: inset(0 100% 0 0);
    transition: clip-path .34s cubic-bezier(.3, .9, .3, 1), box-shadow .3s ease;
  }
  .bay-dm.furnish .bdm-actions {
    clip-path: inset(-8px -14px -14px -8px);
  }
  /* (.bay-dm-opt retired 2026-08-04 with the small send — the stage's one
     button is .bdm-send now, which answers a hover by inverting and so
     has no use for the DM glitch.) */

  /* shelves: one line per shelved board now (2026-08-02) — the column
     scrolls past four (hidden bar, the lb sheet precedent; the wheel is
     the affordance). Right-anchored so the stage-2 pull leaves it put. */
  .bay-shelves {
    /* 48/10 (the lab bake, 2026-08-03; was 20/8): a real left column of
       air under the left-thrown shadows. Cards can still reach the
       close seat's strip (his call; the arrow keeps z2 so the control
       stays on top and usable) */
    /* SCROLL-BEHIND (2026-08-03, with the head's outline): the box now
       starts under the head's top line and reserves the head zone as
       padding — overflow clips at the padding box, so a scrolled card
       stays visible riding up through the reserved zone until the
       head's opaque box + apron swallow it (z, not clip). Rest layout
       is unchanged: content still starts at --shelfTop. Top 12 tucks
       the clip edge UNDER the box's ink (Dylan's half-pixel catch,
       same day: the clip line rides the panel border's structural .5,
       and flush with the head's top it printed a soft row — overlap,
       never flush; behind the opaque box its fraction cannot print). */
    position: absolute; right: 10px; width: calc(var(--bayW) - 58px);
    top: 12px; bottom: 16px; padding-top: calc(var(--shelfTop, 96px) - 12px);
    display: flex; flex-direction: column;
    overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
  }
  .bay-shelves::-webkit-scrollbar { display: none; }
  .bay-shelf {
    position: relative; flex: 0 0 var(--rowH, 25%);
    /* bottom pad is JS-derived (--shelfPad, bayGeom): the card's hard
       shadow drops 3.8793cqw — it SCALES with the card — so a fixed pad
       made the shadow-to-strip white drift with resolution (Dylan's
       round-6 catch). Pad = 4px white + the strip's own 2 + the scaled
       drop, so the gap reads 4 at every size. */
    display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding: 0 6px var(--shelfPad, 13px);
  }
  .bay-shelf::after {
    /* the strip hugs the CARD'S footprint now (round 6b): 1px past the
       resting shadow on the left, 1px past the panel on the shadowless
       right — sized/seated by JS vars (bayGeom) because the shadow's
       reach is cqw. Fallbacks = the old full-width strip (pre-JS).
       Mobile restores full width (the takeover's shelf box is not the
       desktop bayW the vars are derived from). */
    content: ""; position: absolute; bottom: 0; height: 2px;
    left: var(--stripL, 0); right: auto; width: var(--stripW, 100%);
    background: #000;
    box-shadow: 3px 4px 0 rgba(0, 0, 0, 0); transition: box-shadow .4s ease;
  }
  .bay.pulled .bay-shelf::after {
    box-shadow: 3px 4px 0 rgba(0, 0, 0, .15);
    transition-delay: calc(var(--i, 0) * .1s);
  }
  /* the strips EXIT STAGE RIGHT as the cards stack (Dylan, 2026-08-03:
     the emptied case's bare strips + the invisible scroll cut read as
     off spacing). Consumed toward the right end via clip — a translate
     would grow the scroll box (overflow-y auto makes x non-visible
     too). JS adds per shelf on the climb cadence; the return snaps
     (transition lives here, not on the base rule) behind the push-back. */
  .bay-shelf.strip-out::after {
    clip-path: inset(0 0 0 100%);
    transition: clip-path .32s ease-in;
  }
  /* deck-held boards: ONE card per board — in the deck OR in the shop,
     never both. Class-based on purpose: the lb close restores INLINE
     visibility, which must not resurrect a deck hole. BELTS stay true
     holes (the recycler stomps inline visibility per frame, .indeck-
     guarded — a costume would fight that write); GRID slots wear the
     BLANK CARD instead (2026-08-16 A/B): panel + inframe stay drawn,
     board/texts/chips hidden, NO shadow, the buttonflip art centered
     at half ink. visibility/opacity only — lockCardScale measures the
     .d7f's offsetHeight and display:none collapses the row. The flight
     guards (frameFor, closeLb, drag) are all class-checks, costume-safe;
     pointer-events:none keeps a visible blank from catching the taps
     the hidden hole never could. */
  .card.indeck { visibility: hidden; }
  .scard.indeck { pointer-events: none; }
  .scard.indeck .stage img, .scard.indeck .info, .scard.indeck .corner,
  .scard.indeck .fflipc, .scard.indeck .fc-list, .scard.indeck .fst,
  .scard.indeck .tspark { visibility: hidden; }
  .scard.indeck .panel { box-shadow: none; }
  .scard.indeck .panel::after {
    content: ""; position: absolute; inset: 0;
    background: url(site/img/avrgbg-buttonflip.png) center / 58% auto no-repeat;
    opacity: .5;
  }
  .bay-item {
    /* a CARD slot now (2026-07-22), not a cutout: the deck is a display
       case for the cards. ONE per shelf, centered — Dylan sized it by
       hand (~62% of the shelf width); overflow items past four pile on
       the last shelf and flex-shrink compresses them (the cqw spec
       keeps any width a true card). The dvh cap keeps card height
       inside the shelf row on short viewports (row = 88dvh/4, minus
       shelf padding, / aspect). If this still reads small: 3 shelves
       instead of 4 (grid rows + the /4 here + the shelf index in
       renderBay). */
    /* the width basis asks big; the max-width is the real fit — one
       shelf row (--bayCard, JS: (rowH − 14 padding+air) / aspect). The
       row height derives from the FULL column so four shelves fill it
       exactly and a fifth scrolls; the calc line is the pre-JS fallback
       (the old 4-rows-of-the-column formula, close enough for a frame).
       The 3-shelves-if-small escalation note is superseded by the
       scroll (2026-08-02). */
    flex: 0 1 100%; min-width: 0;   /* full basis (lab bake): the card IS the shelf line; bayW inverts as card + 70 */
    max-width: calc(((100dvh - var(--tbh, 0px) - 24px) * .22 - 14px) / 1.513);
    max-width: var(--bayCard, calc(((100dvh - var(--tbh, 0px) - 24px) * .22 - 14px) / 1.513));

  /* the floating ✕ (2026-07-22): clear a board from the case without
     re-inspecting. Square chip in the card's angular language, floating
     off the top-right corner; hover-revealed (the case is desktop-only). */
  .bay-item .bay-x {
    position: absolute; top: -8px; right: -8px; z-index: 3;
    width: 22px; height: 22px; padding: 0;
