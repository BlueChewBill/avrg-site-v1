  /* THE CASE'S LIGHT (Dylan, 2026-08-02 round 4): shelved cards throw
     their shadows LEFT, matching the drawer's own -7px 9px — inside the
     case a card lives in the case's shadow grammar; everywhere else the
     site's right-thrown light stands. THE SWITCH COSTS NOTHING: the fly
     is a separate element wearing the site shadow, and the preseat item
     beneath it wears this one — the reveal at touchdown (seat-drop
     squash + kclick) IS the flip, masked by the bounce. The reverse
     flip rides the lift the same way (buildFly renders site-lit).
     Same-scope hover mirrors, or the grow would snap the shadow back
     to the right mid-hover. */
  .bay-item .d7f .panel {
    box-shadow: -7px 9px 0 -1px rgba(0, 0, 0, .85);
    box-shadow: -3.0172cqw 3.8793cqw 0 -.431cqw rgba(0, 0, 0, .85);
  }
  @media (hover: hover) { .bay-item .d7f:hover .panel {
    box-shadow: -12px 15px 0 -1px rgba(0, 0, 0, .85);
    box-shadow: -5.1724cqw 6.4655cqw 0 -.431cqw rgba(0, 0, 0, .85);
  } }
  .bay-item .d7f .stage img {
    filter: drop-shadow(-7px 9px 0 rgba(0, 0, 0, .3));
    filter: drop-shadow(-3.0172cqw 3.8793cqw 0 rgba(0, 0, 0, .3));
  }
  @media (hover: hover) { .bay-item .d7f:hover .stage img {
    filter: drop-shadow(-11px 14px 0 rgba(0, 0, 0, .3));
    filter: drop-shadow(-4.7414cqw 6.0345cqw 0 rgba(0, 0, 0, .3));
  } }
  /* the flight: a fresh card from the one template riding from the
     source card to the shelf. Posed per-frame by the flight driver
     (position, scale, rotation ride one progress value — same
     one-master-p lesson as the drawer); no transitions here on purpose.
     NO posed shadow: the card carries its own board + panel shadows. */
  .bay-fly {
    position: fixed; z-index: 6500; pointer-events: none;
    will-change: transform;
  }
  /* held fills for the fly: the source card is hovered when its chip is
     clicked, so the fly launches with the landed chrome — the -.44s
     delay renders the wipe already finished from frame one. Mid-flight
     the fly gets .left and the fills drain in the air (the card settles
     for shelf life as it descends), so touchdown state = rest = the
     hidden shelf item it becomes. */
  /* a card in hand: the whole page shows the grabbing hand, and text
     can't smear under a fast carry */
  body.dragging, body.dragging * { cursor: grabbing !important; }
  body.dragging { user-select: none; -webkit-user-select: none; }
  .bay-fly.held .fc-ref::before { transform-origin: left center; animation: chipwipe .44s ease -.44s forwards; }
  .bay-fly.held .fc-list::before { transform-origin: right center; animation: chipwipe .44s ease -.44s forwards; }
  .bay-fly.held .fchip :is(.ft, .fscript) { color: #fff; transition: none; }
  .bay-fly.held .inframe::before, .bay-fly.held .inframe::after { height: calc(50% - 6px); height: calc(50% - 2.5862cqw); }
  /* seating: the real shelf item exists (hidden) from the moment the
     flight launches — the flight lands on its measured rect, then the
     item takes over in the same frame. No crossfade seam. */
  .bay-item.preseat { visibility: hidden; }
  /* Drop: last inches are a fall — touch, a whisper of squash, done */
  .bay-item.seat-drop { animation: seatDrop .2s cubic-bezier(.2, .8, .3, 1) both; transform-origin: bottom center; }
  @keyframes seatDrop {
    0%   { transform: translateY(-9px); }
    70%  { transform: translateY(0) scaleY(.965); }
    100% { transform: none; }
  }
  /* the landing answered: the target shelf's shadow thunks darker for a
     beat, and the whole rack absorbs a couple px of the hit */
  .bay-shelf.landed::after { animation: shelfThunk .45s ease; }
  @keyframes shelfThunk {
    0% { box-shadow: 3px 4px 0 rgba(0, 0, 0, .15); }
    25% { box-shadow: 4px 5px 0 rgba(0, 0, 0, .4); }
    100% { box-shadow: 3px 4px 0 rgba(0, 0, 0, .15); }
  }
  .bay-shelves.recoil { animation: bayRecoil .2s ease; }
  @keyframes bayRecoil {
    30% { transform: translateX(3px); }
    100% { transform: none; }
  }
  /* the landing's answers are the seat-drop, the recoil and landBeat */

  /* ========= the bay's phone costume (the deck's door is YOUR PICKS) =========
     The takeover case — the deck's old phone form — retired react round 6
     ("the deck drawer should away on mobile"); its history lives in the
     vault repo. What stays here is load-bearing: at phone widths the bay
     PARKS off-screen right (the resting translateX) so the desktop
     drawer never shows, the !importants retire any stale inline pose the
     desktop driver left behind (a resize across 940px mid-open), and the
     #lb-card touch rules at the bottom are the mobile lightbox's.
     This block lives BELOW the desktop bay CSS on purpose — same-
     specificity overrides must come later in the sheet to win the
     cascade. */
  @media (max-width: 940px) {
    .bay {
      /* JUST PAST HALF the screen (Dylan, 2026-08-08 evening: "3/4 is to
         much" — the morning rework's 25vw walked back toward the original
         50vw, landing at 46): the case is a cabinet hung over the browse;
         the shop's left near-half stays in view at the case-fade faint.
         Height is dvh-DERIVED, not bottom: 0 — a fixed bottom anchors to
         the layout viewport, which iOS extends UNDER Safari's dynamic
         bottom bar (safe-area insets don't cover the address bar); 100dvh
         tracks the bar, so the case's bottom edge rides just above it. */
      left: 46vw; width: auto; top: var(--tbh, 0px);
      bottom: auto; height: calc(100dvh - var(--tbh, 0px));
      /* the face marks render converged (--rp 1): the driver that poses
         them is desktop's and bails under dockActive */
      --rp: 1;
      z-index: 4800;
      transform: translateX(calc(100% + 18px));   /* +18 clears the announce shadow */
      transition: transform .42s cubic-bezier(.3, .9, .3, 1);
    }
    .bay .bay-panel, .bay .bay-inner, .bay .bay-drawer { transform: none !important; }
    /* the phone costume fills its half-screen — the desktop
       content-height case (--caseH) and the stage-2 pull-out don't exist
       here (later in source at equal specificity, so these win the
       cascade) */
    .bay-panel, .bay.out .bay-panel { top: 0; bottom: 0; height: auto; width: 100%; }
    .bay-panel { touch-action: none; }   /* the case owns its touches — no scroll-chain to the page */
    /* THE FACE IS LINE—DOT—LINE (2026-08-08, the case rework): the solid
       border-left is gone — the phone bay's left edge wears the fv3 rail—dot—
       rail grammar, the desktop bay's own resting marks re-homed onto the
       face. .bay-inner is that organ: re-shown, pulled from the desktop's
       --inner-rest seat to the edge itself, spanning the borders' outer
       line so the rails meet the top/bottom corners. --rp 1 (on .bay
       above) converges the rails to the dot's 6px clearance; bf-face
       (the desktop's separately-drawn outside edge) stands down or it
       would print a solid line straight through the gap. */
    .bay-inner {
      /* INSET, not flush (first cut sat them at left 0 and they merged
         with the panel's -7px announce shadow into one thick slab): the
         marks ride 8px onto the white, the fv3 inner-frame read — the
         shadow is the edge's own ink, the rail—dot—rail is the frame
         line inside it. 10px trim = the desktop assembled-drawer trim. */
      display: block; left: 8px; right: auto; top: 10px; bottom: 10px;
      opacity: 1; color: #000;
    }
    .bf-face { display: none; }
    /* the dot is a PLAIN DOT here — no close seat swells over it, so the
       desktop's .shadowed hand-off (dot yields to the seat) must not fire */
    .bay.shadowed .bay-dot { opacity: 1; }
    /* no pull-out on the phone: the MSG bar routes to #my-lisst (the
       visible twin — that page IS the long form) */
    .bay-dm { display: none; }
    /* the ✕ arrow is desktop chrome — nothing to close on the phone */
    .bay-close { display: none; }
    .bay-head { left: 14px; right: 10px; width: auto; }
    .bay-apron { left: 14px; right: 10px; width: auto; }   /* rides the head's phone seat */
    .bay-shelves { left: 14px; right: 10px; width: auto; }
    /* head = the MSG bar alone (2026-08-08): the board tags come off on
       the phone — the manifest is desktop furniture, the shelf cards ARE
       the manifest here */
    .bay-tags { display: none; }
    /* the head PHRASE comes off on the phone (2026-08-07, the 15 Pro
       audit): at half-screen width "INTERESTED" clipped to "INTE" and
       MAKE UM YOURS is longer still — a clipped word on the money button
       reads broken. Dylan's pick of the offered cuts: msg icon + count +
       skateboard only, "for the time being". The rotating phrase and the
       ?msgfx= announce stay desktop things; the decode still writes into
       the hidden span, which costs nothing and keeps the JS untouched. */
    #bay-msg-t { display: none; }
    /* shelf-air touches scroll the column; card touches stay the drag's
       (.bay-item keeps touch-action none below) */
    .bay-shelves, .bay-shelf { touch-action: pan-y; }
    /* the hugging strip's vars are desktop-bayW numbers — the phone
       costume keeps the full-width strip until the mobile pass */
    .bay-shelf::after { left: 0; right: 0; width: auto; }
    /* CARDS SIT ON THEIR STRIPS (2026-08-08, the case rework): the
       desktop --shelfPad is a bayGeom number (4px air + strip + the cqw
       shadow drop) that inflated here and left each card hanging ~40px
       above its own strip — its TOP kissing the strip above instead, the
       hanging-file read. 6px ≈ the strip's 2 + the ~101px card's shadow
       drop, so the SHADOW EDGE (the card+shadow one-object law) lands on
       the strip and the card reads seated. Flights re-measure per frame
       (getEnd), so landings follow for free. */
    .bay-shelf { padding-bottom: 6px; }
    /* no hover on touch: the floating ✕ is furniture, not a reveal */
    .bay-item .bay-x { opacity: 1; }
    /* DECK CARDS STAY DRESSED (2026-08-08, Dylan's dress grammar: "a card
       on a shelf is always chips-filled"): the .bay-fly.held idiom — the
       negative delay renders every wipe pre-finished from frame one, so
       rest IS the landed state. Mirrors the .held ruleset (chip fills,
       white glyphs, rails closed, mark shadow flipped to the drawer's
       light); flights ride CLEAN off these cards on purpose — buildFly's
       held check reads classes, not CSS — so a pluck undresses in one
       gesture and the landing dresses in one. */
    .bay-item .fc-ref::before { transform-origin: left center; animation: chipwipe .44s ease -.44s forwards; }
    .bay-item .fc-list::before { transform-origin: right center; animation: chipwipe .44s ease -.44s forwards; }
    .bay-item .fchip :is(.ft, .fscript) { color: #fff; transition: none; }
    .bay-item .inframe::before, .bay-item .inframe::after { height: calc(50% - 6px); height: calc(50% - 2.5862cqw); }
    .bay-item .fc-list .fscript .sh { transform: scaleX(1); }
    /* cards are grabbable objects — no iOS callout/selection under a
       hold, and the browser never owns their touches (touch-action none
       keeps pointermove alive mid-carry — no pointercancel ambush; the
       swipe-nav is pure JS touch events, which still fire) */
    .bay-item, #lb-card {
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      touch-action: none;
    }
  }
  @media (prefers-reduced-motion: reduce) { .bay, .bay-panel, .bay-dm { transition: none; } }

  /* the receipt icon below is the phone's confirmation organ */
  /* topbar receipt icon: replaces the lisst text tab on mobile */
  .picon { display: none; position: relative; align-items: center; gap: 7px; padding: 8px 8px; flex: 0 0 auto; cursor: pointer; }
  .picon svg { display: block; }
  .picon .pcnt {
    font-family: var(--mono); background: #ddd1b6; color: #000;
    font-size: 10px; font-weight: 700; padding: 2px 6px; min-width: 10px; text-align: center;
  }
  body.light .picon svg { stroke: #000; }
  body.light .picon .pcnt { background: #000; color: #fff; }
  /* the add's ping on the receipt icon (dockPing rides .shake + .bump) */
  .picon.shake { animation: kpshake .45s ease; }
  @keyframes kpshake {
    20% { transform: translateX(-2.5px) rotate(-4deg); }
    45% { transform: translateX(2.5px) rotate(3deg); }
    70% { transform: translateX(-1.5px) rotate(-2deg); }
    100% { transform: none; }
  }
  .picon .pcnt.bump { animation: kcbump .32s ease; }
  @keyframes kcbump { 35% { transform: scale(1.35); } 100% { transform: none; } }
  @media (max-width: 940px) {
    .picon { display: flex; }
    #nav-lisst { display: none; }
    /* YOUR PICKS IN THE BAR (react round 6): the minis take the seat, the
       deck mark + count stand down. Same gate that shows the picon — the
       two costumes can never coexist. */
    .picon .deckmark, .topbar .picon .pcnt { display: none; }
    .picon .hpicks { display: flex; }
  }
  /* the header minis: real fv3 templates at the 232 reference, scaled to a
     25px token (lockCardScale's trick at bar scale) and SHINGLED — each
     slot shows a 12px sliver, later siblings paint over, so the newest
     add sits on top; the seat's width is LOCKED now and the 4-card cap
     keeps the deck inside it (the compress idiom retired). Quiet
     objects: the anchor owns the click. Ink re-proportioned, geometry
     untouched (the SITE-SCALE LEGIBILITY law): 4.31cqw ≈ 1px painted at
     the token size. */
  /* THE STACK RESERVES ITS OWN HEIGHT (2026-08-15). The bar is as tall as
     its tallest child, and that child is this stack — so an EMPTY stack
     used to collapse the whole bar from 84px to 60px. --tbh is measured
     once at boot, so everything pinned to it (the picks masthead, the lb
     sheet) went on believing in the taller bar and hung 24px below the
     shorter one. That gap is what Dylan saw the offer boxes scrolling
     through after the ceremony deals the stack away, and I had wrongly
     blamed iOS's toolbar for it (the .picks-mast bleed added then still
     earns its keep as insurance, but this is the actual cause).
     min-height holds the seat whether the stack is full, capped, or
     dealt to nothing — and it has to, now that the bar carries a word:
     a header that changed height as its cards left would take the title
     with it.
     AND THE WIDTH IS LOCKED TOO (2026-08-16, his catch: "your picks...
     moves to the right a hair every time a card leaves the stack on the
     picks deal"): the bar word centres against the picon's box, so a
     stack that narrowed as cards left walked the title sideways. width
     = the full fan, (HPICK_MAX − 1) slivers + the 22px front artwork =
     3×5 + 22 (the count is already out of flow). Cards anchor left, so
     the FRONT seat is constant — adds, deals and the empty blank all
     keep the same left edge and the air opens on the right, against the
     bar's own padding. */
  .hpicks {
    display: none; position: relative; align-items: flex-end;
    width: 37px; min-height: 39px;   /* = mini 33 + the diagonal's 3 × 2px */
  }
  /* THE STACK FACES LEFT AND FANS BEHIND ITSELF (2026-08-15, his react:
     "our card stack should show its front facing left and stack the cards
     behind it right. so the inverse of what we have now... slightly
     smaller... a bit diagonal, and tighter horizontally... cut the stack
     off at 4 cards and just rely on the number from there").
     Sliver history: 12 → 8 (the 2026-08-12 tidy react, "tighten our
     headers card stack") → 5 here, with the deck now reading as a hand
     held front-card-out rather than a fan seen from behind.
     HOW THE FAN INVERTS: paint order used to do it for free — the boxes
     are slivers and each card's artwork overflows RIGHT across its
     neighbours, so the LAST one landed on top. Facing left means the
     FIRST must land on top instead, which needs an explicit z-index
     ladder (renderPicks writes it, descending, because it is the only
     place that knows the count). Every card behind then peeks out by
     exactly one sliver on the right.
     WHY :last-of-type CARRIES THE FULL WIDTH: the container has to be
     wide enough to hold the rightmost card's whole artwork, and the boxes
     themselves are only a sliver each. It is :last-of-type and not
     :last-child because the count span is the real last child — the
     old :last-child rule here had been silently dead for that reason.
     THE DIAGONAL rides --i (also written by renderPicks), and it goes UP
     now (2026-08-16 react: "have the cards stack up instead of down on
     the stagger. so the front card is at the bottom left of the stack"):
     cards sit on the container's bottom line (align-items: flex-end) and
     each card behind rises 2px on margin-bottom. The cap keeps the total
     under the mini's own height — the stack must never make the bar
     taller, now that the bar has a word to carry as well. */
  .hpick {
    position: relative; flex: 0 0 5px; width: 5px; height: 33px;
    margin-bottom: calc(var(--i, 0) * 2px);
  }
  .hpick:last-of-type { flex: 0 0 22px; width: 22px; }
  /* the COUNT is TIED TO THE FRONT CARD'S TOP-LEFT CORNER (2026-08-16
     react; rode the stack's top right before) — centred on the corner
     point itself, the corner-badge read. The corner is a CONSTANT seat:
     cards anchor left in the locked box and the fan rises BEHIND, so
     adds and deals never move it. top 6px = the 39px floor − the 33px
     mini (the front card's own top under flex-end). White seat so card
     ink never runs under it; quiet object, the anchor owns the click.
     Its z-index has to clear the ladder — the front card peaks at 4 and
     would bury a number sitting at 1. IT IS ALSO THE OVERFLOW: past 4
     picks the stack stops growing and the number carries the rest of the
     count on its own (his call — "it will be rare that someone is
     selecting more"). */
  .hpicks .hcount {
    position: absolute; top: 6px; left: 0; transform: translate(-50%, -50%);
    z-index: 10;
    font-family: var(--mono); font-size: 9px; font-weight: 700; line-height: 1;
    color: #000; background: #fff; padding: 1px 2px;
  }
  .hpick .d7f {
    position: absolute; top: 0; left: 0; width: 232px;
    transform: scale(.0948); transform-origin: 0 0; pointer-events: none;
  }
  .hpick .d7f .panel, .hpick .d7f .inframe { border-width: 4.3103cqw; }
  /* the belt to renderPicks' eager fix: a pre-load BOX. The spec's img is
     auto-sized off intrinsic dimensions, so before load it computes 0×0 —
     which is also what starved the lazy loader. Explicit size + contain
     reads identically at 22px and paints the moment bytes arrive. Scoped
     to the stack — the ONE CARD SPEC's global img rule is untouched. */
  .hpick .d7f .stage img { width: 78%; height: 79%; object-fit: contain; }
  /* (the hand-drawn .hpick.blank RETIRED 2026-08-16 — his react called it
     "the blank flat square": the empty seat renders the template's own
     boardless shell now (.mtblank, styled at the thread-3 block) with the
     count reading 0, so empty and full are the same object.) */
  /* YOUR PICKS page furniture (round 6, mobile-rendered only — renderLisst's
     dock branch): the offer row is the LETTER GRAMMAR one level up (label ·
     ruled fill — the tag/rule/write-here shape the composer's sheet uses),
     unscaled below the transform-scaled card so it stays readable. The copy
     button and the paste doors wear the drawer chip's black; the doors'
     labels ARE the destinations (the send button's never-read-it-twice law). */
  /* the wrapper cell must surrender its auto minimum — a grid item's
     min-width:auto is its min-content, and the unscaled 232px card inside
     would balloon the cell past its minmax(0,1fr) track (the shelfgrid
     balloon gotcha, one layer up; measured: 232px cell in a 164.5px track) */
  .pick-cell { min-width: 0; width: 100%; }
  /* PICKS CARDS SIT FULLY DECODED (2026-08-12, the tidy react: "make the
     cards in the picks view fully decoded") — the deck's own dress
     grammar, i.e. the .bay-item pre-finished idiom: the negative delay
     renders every wipe landed from frame one, rest IS the landed state.
     Chip fills + white glyphs + rails closed + mark shadow flipped; the
     text half (the status word) is landed statically by renderLisst.
     GATED to the phone — the desktop My Lisst grid keeps rest cards and
     real hovers. Flights still ride CLEAN off these cards (buildFly's
     held check reads classes, not CSS): a pluck undresses in one
     gesture, the lb landing dresses in one. */
  @media (max-width: 940px) {
    .lisst-card .fc-ref::before { transform-origin: left center; animation: chipwipe .44s ease -.44s forwards; }
    .lisst-card .fc-list::before { transform-origin: right center; animation: chipwipe .44s ease -.44s forwards; }
    .lisst-card .fchip :is(.ft, .fscript) { color: #fff; transition: none; }
    .lisst-card .inframe::before, .lisst-card .inframe::after { height: calc(50% - 6px); height: calc(50% - 2.5862cqw); }
    .lisst-card .fc-list .fscript .sh { transform: scaleX(1); }
    /* the remove ✕ wears the CASE's own square down here (round 4, his
       screenshot — the .bay-x chip, "square chip in the card's angular
       language"), landed TOP-LEFT on his word; the desktop My Lisst
       keeps its disc. THREE CLASSES DEEP on purpose: the light-ground
       disc override (body.light .lisst-remove, later in source) sits at
       two — a two-class rule here loses that tie silently on the
       forced-light phone. */
    .shelfgrid .lisst-card .lisst-remove {
      top: -8px; left: -8px; right: auto;
      width: 22px; height: 22px; border-radius: 0;
      background: #fff; color: #000; border: 1.5px solid #000;
      font-size: 11px; box-shadow: none;
    }
    /* THE BENCH (2026-08-16 round 7): first ✕ = set aside, red ✕ = gone.
       The card's ART dims (.d7f, never the scard — parent opacity would
       take the armed ✕ down with it); the offer box slides off toward
       its own column's screen edge (bx-l / bx-r, chosen from the cell's
       real midpoint) and KEEPS ITS SPACE — the bench never reflows the
       page, only the removal's re-render does. pointer-events dies with
       the box so an invisible ask can't catch caret taps. The armed ✕'s
       red rides the same three-class depth as the seat rule above (the
       light-ground disc override sits at two and wins any tie). */
    .shelfgrid .lisst-card .d7f { transition: opacity .3s ease; }
    .shelfgrid .lisst-card.benched .d7f { opacity: .38; }
    .shelfgrid .lisst-card.benched .lisst-remove { color: #d21f1f; border-color: #d21f1f; }
    .pick-ask { transition: transform .32s cubic-bezier(.4, 0, .6, 1), opacity .32s ease; }
    .pick-ask.bx-l, .pick-ask.bx-r { opacity: 0; pointer-events: none; }
    .pick-ask.bx-l { transform: translateX(-140%); }
    .pick-ask.bx-r { transform: translateX(140%); }
    .picks-line .ptag.off { display: none; }
    /* the real removal: the whole cell rides off its own side, then the
       re-render reflows the grid (the exit is ours, the reflow is its) */
    .pick-cell.cell-out-l, .pick-cell.cell-out-r {
      transition: transform .3s cubic-bezier(.4, 0, 1, 1), opacity .3s ease;
      opacity: 0;
    }
    .pick-cell.cell-out-l { transform: translateX(-110vw); }
    .pick-cell.cell-out-r { transform: translateX(110vw); }
  }
  /* the OFFER BOX (2026-08-13, tidy react round 2 — his outlined-field
     sketch in the house drawn-box language): an ink rect with the two
     mid-edge structural dots (the card frame's own posts, the
     · COLLECTIONS · grammar), the label BREAKING the top edge where the
     sketch's label floats. The label keeps round 1's caret answer — it
     inverts while the caret is in the box. No placeholder (his call). */
  /* 2.5px at REST (round 3: "as thick as the selected versions") — the
     old focus thicken IS the resting line now, so the focus answer is
     the label invert alone; dot/label offsets track the border's centre
     (dot: half-dot + border/2 = 3.75; label: border/2 = 1.25) */
  /* the side rails BREAK around the mid dots (round 5: "the slight gap
     between dots and connecting lines like that of our light box view
     cards" — the fv3 inframe's own 50%−6px grammar). The side borders
     are gone; each pseudo is one 5px column drawing rail-gap-dot-gap-
     rail as layered backgrounds (the dots used to BE these pseudos, and
     a box only has two). The rail column seats where the border was. */
  /* ROUND 4 (2026-08-16, his catch: "jagged corners like our half pixel
     render rounding errors"): the drawn kit goes WHOLE-PIXEL. 2.5px
     strokes are 7.5 DEVICE px at the phone's DPR 3, so the gradient
     rails rendered AA-fuzzy against the browser-snapped border and the
     corners stepped. Border 3px, rails 3px, pseudo offsets -1/-3, label
     top -1.5 — the round-3 knob pair re-derived (offsets track the
     border centre; re-derive again if the width ever changes). The box
     is UNSCALED furniture (it rides beside the card, outside
     lockCardScale's subtree), so it must play by whole-pixel rules —
     the cards' own fractional strokes live inside a continuous scale
     where everything blurs together or not at all. */
  .pick-ask, .picks-msg { position: relative; border: 3px solid currentColor; border-width: 3px 0; }
  .pick-ask::before, .picks-msg::before, .pick-ask::after, .picks-msg::after {
    content: ""; position: absolute; top: -3px; bottom: -3px; width: 5px;
    background:
      radial-gradient(circle closest-side, currentColor 96%, transparent) center / 5px 5px no-repeat,
      linear-gradient(currentColor, currentColor) top center / 3px calc(50% - 6px) no-repeat,
      linear-gradient(currentColor, currentColor) bottom center / 3px calc(50% - 6px) no-repeat;
  }
  .pick-ask::before, .picks-msg::before { left: -1px; }
  .pick-ask::after, .picks-msg::after { right: -1px; }
  .pick-ask .pa-l, .picks-msg .pm-l {
    position: absolute; top: -1.5px; left: 9px; transform: translateY(-50%);
    background: #fff; padding: 2px 5px; line-height: 1;
    font-size: 10px; letter-spacing: .14em;
    transition: background .18s ease, color .18s ease;
  }
  .pick-ask:focus-within .pa-l { background: #000; color: #fff; }
  /* THE PAIR READS AS A PAIR NOW (2026-08-16 round 2, superseding round
     3's read-equal margins — his catch: "have them sit closer to their
     card above. that way theres more room bellow. everything is a bit
     uniform in a way that makes it hard to read at a glance"): the box
     shrank (padding down a third; the input's 16px iOS no-zoom floor is
     the real height floor) and rides 14px under its card — the SHADOW
     LAW's ~6px reach leaves ~8px of visible air, tight enough to bind
     card + offer into one object, while the untouched 30px row-gap
     below becomes the BETWEEN-pairs air. Proximity does the grouping;
     the grid itself is untouched.
     ROUND 3 (same day, his react: "still sits as wide as the card"):
     the box NARROWS to 78% — a fixture at the card's foot, not a second
     card-width band. ~11 mono chars stay visible in the input at a
     173px cell — offers are short.
     ROUND 4 (same day): CENTRED under the card ("lets center them
     underneath their cards") — the round-3 left-rail read lost to
     symmetry under a symmetric card; margin auto does the seating. */
  .pick-ask { display: flex; width: 78%; margin: 14px auto 0; padding: 6px 10px 5px; }
  .pick-in {
    flex: 1; min-width: 0; background: none; border: 0; border-radius: 0;
    /* the thin WRITING LINE inside the box (round 5: "indicate text
       field") — 1px against the frame's 3, the letter's rule inside
       the drawn furniture */
    border-bottom: 1px solid currentColor;
    color: inherit;
    /* 16px is iOS's no-auto-zoom floor — anything smaller and focusing
       the field zooms the whole page (bitten in the sim) */
    font-family: var(--mono); font-size: 16px; padding: 2px 0;
  }
  .pick-in:focus { outline: none; }
  /* the copied-send flow is the envelope ceremony re-homed, so it wears
     the ceremony's own clothes and CENTRES like the back face it echoes.
     Inset 16px = the mobile shelfgrid's own side padding (one frame). */
  .picks-send { margin: 34px auto 8px; padding: 0 16px 160px; display: flex;
    flex-direction: column; gap: 18px; align-items: center; text-align: center;
    width: 100%; box-sizing: border-box; }
    /* the bottom buffer (128 → 100 in round 3 with his cuts, then 100 →
       160 on 2026-08-15): sized so the box's full-scroll rest seat sits AT
       the lock clamp (innerHeight - 280, the room the done row needs) —
       press the button at full scroll and the box does not move a pixel.
       Sim-derived PAIR, and the two numbers differ by a constant 120:
       MOVE THE CLAMP, MOVE THIS BY THE SAME AMOUNT.
       The 2026-08-15 growth is the ceremony's doing: its closing beat
       scrolls down to state MESSAGE and SEND, and at 100 the page ran out
       of document before SEND cleared iOS's floating toolbar — it had only
       103px under it, which the toolbar ate (Dylan: "send message slightly
       cut off due to the ios nav bar"). A buffer is only worth what the
       page can actually scroll to. */
  /* the MESSAGE BOX (round 2, same react): the offer box's larger
     sibling around the pre-written line — shared frame/dots/label rules
     above; this is display furniture, not a field, so no focus states */
  .picks-msg { width: 100%; box-sizing: border-box; padding: 16px 12px 14px; }
  .picks-line { font-size: 12px; letter-spacing: .08em; margin: 0; }
  /* the board tags go BLACK CHIP (his call: "black square white fill") —
     the drawer head manifest's own species, replacing the · separators;
     inline-block so the line wraps between chips, never inside one */
  .picks-line .ptag {
    display: inline-block; background: #000; color: #fff;
    padding: 3px 6px 2px; margin: 2px 3px; line-height: 1;
    letter-spacing: .14em; text-indent: .14em;
  }
  /* the COPY press = the send button's REST costume verbatim (· WORD ·
     between white 5px structural dots on the black slab). No engulf —
     hover choreography is desktop grammar; the press answers instead by
     flashing the engulf's LANDED state (white slab, ink word and dots). */
  .picks-copy {
    display: flex; align-items: center; justify-content: center; gap: 22px;
    padding: 13px 24px 12px; background: #000; border: 1.5px solid #000;
    cursor: pointer;
  }
  .picks-copy .pc-main {
    color: #fff; font-size: 14px; text-indent: .22em;   /* the tracking's trailing space, taken back */
    line-height: 1; transition: color .12s ease;
  }
  .picks-copy .pc-dot {
    flex: none; width: 5px; height: 5px; border-radius: 50%;
    background: #fff; transition: background .12s ease;
  }
  .picks-copy:active { background: #fff; }
  .picks-copy:active .pc-main { color: #000; }
  .picks-copy:active .pc-dot { background: #000; }
  /* THE VERB SWAP (round 8, his final touch): the button keeps copying on
     every press — the label catches up to that truth. SEND fades to the
     slab ON THE BANNER'S OWN CLOCK (pcopOut 5.5s @1.8s, the same
     animation), then COPY fades into the emptied seat (.9s at 7.3s — the
     banner clock's end). Stacked in one grid cell; both verbs are 4 mono
     chars so the slab never changes width. · done · re-renders SEND back. */
  .picks-copy .pc-verb { display: inline-grid; }
  .picks-copy .pc-verb > span { grid-area: 1 / 1; }
  .picks-copy .pc-copy { opacity: 0; }
  .sendmode .pc-send { animation: pcopOut 5.5s ease 1.8s forwards; }
  .sendmode .pc-copy { animation: pcVerbIn .9s ease 7.3s forwards; }
  @keyframes pcVerbIn { to { opacity: 1; } }
  /* THE WORD POP (2026-08-16 round 2, REPLACING the breathe loop — his
     correction: "i should have been more specific... After the message
     box lands, can we have the word 'message' grow big once and settle.
     and then the same for the send message text. more like the bounce
     that 'message copied' gets"): a ONE-SHOT grow-and-settle per word,
     fired as each object's stamp lands — the .82s delay sits just
     inside the .92s stamp, so the box touches down and THEN its word
     answers. The banner's in-then-pulse rhythm one register down.
     Independent scale property, NOT transform: the label already holds
     a translateY(-50%) seat and scale composes on top (the dotPulse
     lesson). --pop is the peak (the dealGrow var-in-keyframes idiom):
     the tiny label takes 1.45, the 14px button text 1.2 — it must stay
     inside the slab's 24px side padding at peak. Scoped under
     .picks-deal: a pop is a LANDING's answer, and only the ceremony
     lands these — re-renders just place them. */
  @keyframes paWordPop { 0%, 100% { scale: 1; } 45% { scale: var(--pop, 1.2); } 72% { scale: .97; } }
  .picks-deal .picks-msg.in .pm-l { --pop: 1.45; animation: paWordPop .55s cubic-bezier(.2, .8, .3, 1) .82s both; }
  .picks-deal .picks-copy.in .pc-main { --pop: 1.2; animation: paWordPop .55s cubic-bezier(.2, .8, .3, 1) .82s both; }
  .picks-doors { display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .picks-doors[hidden] { display: none; }   /* flex would beat the attribute */
  /* round 5: "send it @" wears the banner's own clothes — same register,
     same size, same entrance, .4s behind ("roughly the same size and same
     text as message copied, have it enter the same way too"). No pulse,
     no fade-out — the banner is the moment, this is the instruction that
     stays. The decode retired with the small-mono costume. */
  .picks-paste {
    margin: 0; color: #000;
    font-family: "Satoshi", var(--disp); font-weight: 900;
    text-transform: uppercase; letter-spacing: -0.02em; line-height: 1.05;
    font-size: clamp(28px, 7.5vw, 40px);
  }
  /* the doors are the envelope BACK FACE's own chip doors (.bb-chan) in
     the phone's seat: black soft square, white glyph, destination as the
     label — one grammar, two sides of the 940 boundary. The artwork is
     CLONED from #bb-reddit/#bb-mail at render (renderLisst), so the two
     seats cannot drift. The press TIGHTENS (the bay-close inset breathe,
     :active where desktop says :hover — never a transform). */
  /* round 4: the doors grow again (76px chips, 40px glyphs) and the row
     CENTERS BY THE ICONS, not the labels — each door column is exactly
     chip-wide and the label hangs absolutely below it (nowrap), so the
     long gmail address can't drag the pair off the centre axis. The
     labels hang toward the box; the JS doorsUp offset accounts for them. */
  .picks-chans { display: flex; gap: 48px; justify-content: center; }
  .picks-door { position: relative; display: flex; flex-direction: column; align-items: center;
    width: 76px; text-decoration: none; }
  /* round 7: the handle rides ABOVE the chip (bottom:100%), still hung
     absolutely off the icon-wide column so it can't steer the centring */
  .picks-door .pd-l {
    position: absolute; bottom: 100%; margin-bottom: 10px; left: 50%;
    transform: translateX(-50%); white-space: nowrap;
  }
  .picks-door .pdq { position: relative; width: 76px; height: 76px; display: grid; place-items: center; }
  /* the platform name INSIDE the chip's bottom edge, white on the black */
  .picks-door .pdt {
    position: absolute; left: 0; right: 0; bottom: 6px; z-index: 1;
    color: #fff; font-size: 9px; letter-spacing: .12em; text-indent: .12em;
    text-align: center;
  }
  .picks-door .pdq::before {
    content: ""; position: absolute; inset: 0; background: #000;
    border-radius: 7px; transition: inset .18s ease, border-radius .18s ease;
  }
  .picks-door:active .pdq::before { inset: 2.5px; border-radius: 6px; }
  .picks-door svg { position: relative; z-index: 1; width: 40px; height: 40px; top: -5px; }   /* glyph cedes the chip's bottom band to the platform name */
  .picks-door .bbrand { fill: #fff; }
  .picks-door .bstroke { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .picks-door .pd-l { font-size: 11px; letter-spacing: .08em; color: #444; }
  /* ---- THE SEND TAKEOVER (2026-08-13, Dylan's sketch) ----
     The press clears the room: everything above the message box (the
     .picks-above wrapper — masthead, links, cards) fades to white AND
     rides up off the screen in ONE motion (height + opacity + translate on
     one transition; the JS pins the measured height first so height can
     animate). The document shrinks with it, so the viewport's own scroll
     clamp does the "scroll up" for free — no scrollTo fighting the
     collapse. flow-root stops the children's margins collapsing through
     the wrapper, which would make the measured height lie by a few px.
     What remains fits one screen and CANNOT scroll — the point (his
     words: "the site needs to stay here. no scroll") is that a failed
     paste can come straight back and re-press.
     TIMING KNOBS (round 3, his beats): ride-out .55s clears the screen
     FIRST ("screen above the msg box should be clear before it starts");
     the banner fades in at .58s, PULSES once at 1.05s, and only then the
     doors + decode land (1.6s); the fade-out is the long goodbye — 5.5s
     starting at 1.8s ("slow fade out (5-6 seconds slow)"). One animation
     chain on .picks-copied carries all three beats; the doors' 1.6s is
     the setTimeout in the press handler — move one, move the other.
     ROUND 2 (his react: "lock the screen from the message box down, it
     rides the scroll up at the moment"): the collapse retired — a
     shrinking document rides everything up on the scroll clamp. Instead
     the press FREEZES THE PAGE (body.sendlock, the iOS body-fixed lock
     pinned at -scrollY — the classic; overflow:hidden alone doesn't hold
     iOS) and the lower group leaves the flow: .picks-send goes fixed at
     --lockY (the message box's own viewport seat, measured at the press
     and clamped so the done row always fits below and the doors always
     fit above), the banner goes fixed under the topbar, the doors go
     fixed with their BOTTOM at --doorsUp (14px above the locked box).
     The box never moves; the above only fades + rides (-55vh transform,
     zero layout) since nothing needs its space back. */
  .picks-above { display: flow-root; transition: opacity .55s ease, transform .55s ease; }
  .picks-above.out {
    opacity: 0; transform: translateY(-55vh); pointer-events: none;
  }
  body.sendlock { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; overscroll-behavior: none; }
  /* the phone is FORCED LIGHT — paint html to match, or iOS shows the
     dark ground as a black band above the fixed topbar whenever the
     toolbar collapse offsets the layout viewport (seen round 7, sim) */
  @media (max-width: 940px) { html { background: #fff; } }
  .picks-send.sendmode {
    position: fixed; left: 0; right: 0; top: var(--lockY, 40vh);
    margin: 0; z-index: 10;
  }
  .sendmode .picks-copied { position: fixed; left: 0; right: 0; top: calc(var(--tbh, 0px) + 8px); margin: 0; }
  /* TOP-anchored off lockY (round 5 fix): a bottom anchor in px is a lie
     on iOS — the toolbar re-expands on the tap and moves innerHeight
     between the press-time measure and the render (bitten: doors rode up
     43pt and the line's midpoint skewed with them). Everything in the
     locked state anchors to the viewport TOP now. --doorsTop = lockY-120:
     76 chip + 23 label hang + 21 clear of the box. */
  .sendmode .picks-doors { position: fixed; left: 0; right: 0; top: var(--doorsTop, 55vh); }
  .picks-copied {
    margin: 10px 0 0; color: #000;
    font-family: "Satoshi", var(--disp); font-weight: 900;
    text-transform: uppercase; letter-spacing: -0.02em; line-height: 1.05;
    font-size: clamp(28px, 7.5vw, 40px);
    animation: pcopIn .45s ease-out .58s backwards,
               pcopPulse .55s ease-in-out 1.05s,
               pcopOut 5.5s ease 1.8s forwards;
  }
  @keyframes pcopIn { from { opacity: 0; transform: translateY(6px) scale(.96); } }
  @keyframes pcopPulse { 50% { transform: scale(1.055); } }
  @keyframes pcopOut { to { opacity: 0; } }
  /* round 4 entrances: the doors fly in FROM THE SIDES — reddit off the
     left edge, mail off the right — meeting at the centre the icon-width
     columns define. The paste line left the doors block visually: fixed
     under the banner as "send it @" (same 1.6s reveal beat, same decode). */
  /* round 6, his sketch: the midpoint seat retires — the whole upper
     cluster rides UP and reads as one column: banner, then the line
     ~91px lower, then the doors right under it (--doorsTop = tbh + 206,
     collision-capped at lockY - 120 so small rooms degrade to the round-4
     seat; --pasteY = doorsTop - 91). Entrance = the banner's own pcopIn
     .4s behind, AND the banner's pulse .4s behind too ("give send it @
     the same bounce on arrival") — the same .45s-in-then-pulse rhythm,
     each beat offset .4s from its twin. */
  .sendmode .picks-paste {
    position: fixed; left: 0; right: 0; top: var(--pasteY, 40vh);
    animation: pcopIn .45s ease-out .98s backwards,
               pcopPulse .55s ease-in-out 1.45s;
  }
  /* round 7 staging: the HANDLES take the doors' flight (same paths, same
     1.6s beat), the chips follow the moment the handles land (+.6s delay
     = the flight's own length). The .pd-l keyframes carry the centring
     translateX(-50%) through the flight — a bare translateX would drop it. */
  .sendmode #pd-reddit .pd-l { animation: pdlInL .6s cubic-bezier(.2, .8, .3, 1) backwards; }
  .sendmode #pd-mail .pd-l { animation: pdlInR .6s cubic-bezier(.2, .8, .3, 1) backwards; }
  /* THE DOORS BOUNCE (2026-08-16 A/B): the chips overshoot past the seat
     and settle — the overshoot is baked INTO the arrival keyframes (one
     animation, no fill fight; a chained second one-shot would steal the
     transform mid-flight). .75s total so the bounce breathes; the .6s
     DELAY is the handle-flight pairing and does not move. Opacity lands
     at 55% so the bounce plays at full ink. No forwards fill — the doors
     end transform-free, keeping the :active inset press honest. */
  .sendmode #pd-reddit .pdq { animation: pdInL .75s cubic-bezier(.2, .8, .3, 1) .6s backwards; }
  .sendmode #pd-mail .pdq { animation: pdInR .75s cubic-bezier(.2, .8, .3, 1) .6s backwards; }
  @keyframes pdInL {
    0% { opacity: 0; transform: translateX(-70vw); }
    55% { opacity: 1; }
    68% { transform: translateX(2.4vw); }
    86% { transform: translateX(-.8vw); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes pdInR {
    0% { opacity: 0; transform: translateX(70vw); }
    55% { opacity: 1; }
    68% { transform: translateX(-2.4vw); }
    86% { transform: translateX(.8vw); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes pdlInL { from { opacity: 0; transform: translateX(calc(-50% - 70vw)); } to { transform: translateX(-50%); } }
  @keyframes pdlInR { from { opacity: 0; transform: translateX(calc(-50% + 70vw)); } to { transform: translateX(-50%); } }
  .picks-done {
    margin-top: 4px; padding: 8px 14px;   /* +18 flex gap = 22, half of round 2's 44 (his cut) */
    background: none; border: none; cursor: pointer;
    font-size: 10px; letter-spacing: .3em; text-indent: .3em; color: #444;
  }
  @media (prefers-reduced-motion: reduce) {
    .picks-above { transition: none; }
    .picks-copied, .sendmode .picks-paste,
    .sendmode .picks-door .pd-l, .sendmode .picks-door .pdq,
    .sendmode .pc-send, .sendmode .pc-copy { animation: none; }   /* banner stays, so SEND staying matches */
  }

  /* ============== THE PICKS CEREMONY (2026-08-15) ============== */
  /* Dylan's thread-4 spec, after reacting to the three quick variants
     (A deal / B draw / C state — all three RETIRED into this; his call
     was "make it even more ceremonious"). The arrival is a sequence now,
     not a stagger, and it starts before the page even changes:
        1. THE DEPARTURE — tap the header stack from ANYWHERE and the
           rest of the site fades out under the bar first (body.pxleave).
           The bar itself never blinks: it is the thing you tapped, and
           it is where the cards are about to come from.
        2. THE MASTHEAD ENTERS — · YOUR PICKS · states and pulses into
           the cleared field (the old variant C's keyframe survives here;
           it was the most ceremonious beat of the three).
        3. THE DEAL — each pick flies OUT OF THE STACK in the bar and
           lands in its own grid slot, one at a time, on the house
           bayFlight arc. This is pickCatch's flight run backwards: the
           bar caught the card on the way in, so it deals it on the way
           out. The bar sits at z 6600 and flights at 6500, so the card
           genuinely emerges from UNDER the chrome.
        4. THE OFFER FOLLOWS ITS CARD — the box under a pick arrives
           after that pick lands, before the next one launches. His
           order exactly: "card lands. then the offer box below it.
           then the next card."
        5. THE PAGE WALKS ITSELF DOWN — with a 2-wide grid, picks 3+
           live below the fold. Rather than deal a card off-screen, the
           page scrolls its landing spot into view FIRST and deals into
           it. His rule: "the page should scroll to the next cards
           landing spot rather than deal it off page."
        6. MESSAGE, then SEND — the tail, once every pick is down.
     THE MASTHEAD IS PINNED (his ask): .picks-mast is sticky under the
     topbar so · YOUR PICKS · never scrolls away while the page walks
     itself down. It needs to be a full-width WRAPPER, not the h2 itself
     — the h2 is an inline-block (the category posts hang off its
     padding), so a bare sticky h2 would leave the cards visibly
     scrolling past on both sides of it. The wrapper carries the white.
     LAYOUT MUST NOT MOVE DURING THE CEREMONY, or every measured landing
     rect is a lie: the hidden parts use visibility/opacity, NEVER
     display — the grid is at its final geometry from frame one, which
     is the same reason the deck's flights can measure a hidden slot. */
  /* THE BAR CARRIES THE PAGE NAME ON THE PHONE (2026-08-15; REWORKED
     2026-08-16 — THE WORD IS THE DOOR now, his thread-3 spec). Still the
     relay's own organ in a phone costume, one body — but the costume
     stopped being remove-only: the word wears FLANKING DOTS at ONE FIXED
     SPAN (--mspan, measured off the widest page name by sizeBarWord —
     "all the headers need to fit between dots that are the same
     distance"), it is TAPPABLE (the drop's door, like the desktop organ),
     and the tap answers with a phone-scale engulf: dots pull in, the slab
     wipes across, the word inverts. The desktop seatfx machinery is not
     rebuilt down here — the slab is the orb's own ::after, the pull is
     the same sibling-selector grammar one media block over. The word
     font matches the DROP ROWS (11px/.16em), not the desktop bar's 10px,
     so the select ceremony's chip can ride up into this seat without any
     resize — that is the whole reason the menu is wider than the header.
     #nbar.noword: home has no word (the mark names it), so the door and
     its dots stand down — written by clearWord, the word's one writer.
     (The old :empty display:none stays as the belt; it cannot carry the
     dots' hide because the relay's measuring ghost is a second, usually
     empty, .wlab inside the same orb — :has(.wlab:empty) would match
     forever.) */
  @media (max-width: 940px) {
    /* DEAD CENTER ON THE SCREEN (his react, 2026-08-16): as a flex middle
       the word centred in the space BETWEEN logo and stack, and the stack
       side is wider — so every word sat a hair left of true. Absolute
       against the bar (full-width, symmetric padding), out of the flex
       flow entirely: brand and picon keep their edges, the hpicks
       min-height keeps the bar's height, and the word's centre IS the
       screen's. Fits by arithmetic: the widest span (148) centred at 320
       still clears the stack by ~25px. parkDrop and the rider both
       measure #nbar's box, so the menu and the ride-up follow for free. */
    .nbar {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: flex; align-items: center; gap: 9px; min-width: 0;
    }
    .nbar .bardot {
      display: block; position: relative; z-index: 2;
      width: 5px; height: 5px; border-radius: 50%; background: #000;
      flex: 0 0 auto; pointer-events: none;
      transition: transform .3s ease;
    }
    .nbar.noword .bardot { display: none; }
    .nbar.noword .orb { visibility: hidden; pointer-events: none; }
    .nbar .orb {
      position: relative; display: flex; align-items: center; justify-content: center;
      width: var(--mspan, 148px); max-width: 100%; height: 34px;
      min-width: 0; text-decoration: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .nbar .orb::before { display: none; }
    /* the slab: the engulf fill at phone scale — the house chipwipe, left
       origin, under the word (wlab carries z 1) */
    .nbar .orb::after {
      content: ""; position: absolute; inset: 0; background: #000;
      transform: scaleX(0); transform-origin: left center; z-index: 0;
    }
    .nbar .organ.on .orb::after { animation: chipwipe .24s ease forwards; }
    .nbar .organ.left .orb::after { transform: scale(1, 1); transform-origin: center bottom; animation: chipdrop .28s ease; }
    /* the dots pull in and land on the slab's edge (rest gap 9 = pull 9 —
       the merge read); same sibling grammar as the drawn bar's */
    .nbar .organ.on + .bardot { transform: translateX(-9px); }
    .nbar .bardot:has(+ .organ.on) { transform: translateX(9px); }
    .nbar .wlab {
      display: block; position: relative; z-index: 1; min-width: 0; max-width: 100%;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .16em; text-indent: .16em; text-transform: uppercase;
      color: #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color .15s ease;
    }
    .nbar .organ.on .wlab { color: #fff; transition: color .15s ease .1s; }
    .nbar .wlab:empty { display: none; }
  }
  /* THE MASTHEAD STOPPED BEING CHROME (2026-08-15). With the bar carrying
     the name, the big title goes back to being page CONTENT: it states
     the page once, loudly, at the top of the ceremony, and then scrolls
     away like everything else. Retiring the sticky is what retires the
     whole family of bugs it brought — the collapsing-bar gap, the
     static-placement jump, and its half of the keyboard displacement. */
  .picks-mast { padding: 12px 0 12px; }
  /* (RETIRED 2026-08-15 with the sticky itself — the :has rule that zeroed
     .colpage-inner's top padding so the sticky's resting seat would equal
     its stuck seat. The masthead is page content now, so it needs no such
     trick and the page keeps its normal top air.) */
  /* THE HEADER GOES FULLY OPAQUE HERE (same react: "can we also make sure
     the site header has full opacity here. so nothing shows behind it...
     the card is barely viewable behind the header, and not in the 'your
     picks' header so it reads broken"). The bar is a .88 white with an
     8px blur everywhere else, which is the intended band — but sat right
     against the masthead's SOLID white it reads as a rendering fault
     rather than a material. On the picks page the two agree. body.on-picks
     is stamped by route(); ≤940 only, so the dark-ground desktop bar keeps
     its blur. */
  @media (max-width: 940px) {
    /* BOTH selectors on purpose. `body.light .topbar` re-declares this
       background ~150 lines BELOW here at equal specificity (0,2,1), and
       equal specificity is decided by source order — so the single-class
       form loses silently and the bar stays .88 translucent (bitten here;
       it is the same source-order gotcha as the .picon margin of
       2026-08-12). The two-class form outranks it, and the phone is
       always forced light so that is the form that actually runs. */
    body.on-picks .topbar,
    body.light.on-picks .topbar {
      background-color: #fff;
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
  }
  /* (RETIRED 2026-08-15 with the sticky itself — the upward white bleed
     that hid the gap under the bar. That gap was never the iOS toolbar I
     blamed it on: the bar collapses 84 → 60px when the ceremony deals the
     stack away, while --tbh keeps its boot value. Fixed at its cause, in
     .hpicks' min-height, and moot here now that nothing is pinned.) */
  /* the ceremony's held states — all layout-neutral (see above) */
  .picks-deal .picks-mast > h2 { opacity: 0; }
  .picks-deal .pick-cell .scard { visibility: hidden; }
  .picks-deal .pick-ask,
  .picks-deal .picks-msg,
  .picks-deal .picks-copy,
  .picks-deal .lisst-empty { opacity: 0; }
  /* …and their answers */
  .picks-deal .picks-mast.in > h2 { animation: paStateH .82s cubic-bezier(.2, .8, .3, 1) both; }
  .picks-deal .pick-cell.dealt .scard { visibility: visible; }
  .picks-deal .pick-ask.in,
  .picks-deal .lisst-empty.in { animation: paRise .42s cubic-bezier(.2, .8, .3, 1) both; }
  /* THE CLOSING TWO BEATS get a heavier landing than the offer boxes (his
     react: "give MESSAGE and the SEND MESSAGE button some more emphasis or
     bounce on landing. so it reads intuitively — heres the message —
     heres how you send it"). Each one rises, overshoots, and settles —
     the same in-then-pulse shape the send takeover's banner uses, so the
     page's two loudest objects announce themselves in the house rhythm
     rather than a new one. They are deliberately far apart in time (see
     PX.tail): the pause is what makes them read as two statements
     instead of one block arriving.
     ROUND 2 (2026-08-16): the arrival slowed .62 → .92 and the beats
     around it stretched (PX.tail/rest; round 5 tightened tail back so
     the two pops read as a pair) — and each landing is answered by its
     word's own pop (paWordPop, at the .picks-copy CSS). The stamp
     duration and the pop's .82s delay are a knob PAIR: the pop must
     start as its stamp settles, so move them together. */
  .picks-deal .picks-msg.in,
  .picks-deal .picks-copy.in { animation: paStamp .92s cubic-bezier(.2, .8, .3, 1) both; }
  @keyframes paStamp {
    0%   { opacity: 0; transform: translateY(16px) scale(.97); }
    55%  { opacity: 1; transform: translateY(0) scale(1.045); }
    78%  { transform: scale(.995); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* THE CARET ON THE FIRST OFFER (his react: "lets have our first offer
     box show a flashin caret to further emphasize the text field as being
     fillable"). It is DRAWN, not focused — focusing the input would throw
     the iOS keyboard up over the page the ceremony just finished laying
     out. Its seat is measured off the real input at show time rather than
     guessed in CSS, because the row is a flex box whose label width
     changes with the copy. Retires the moment the field is actually
     touched, its job done. */
  .pa-caret {
    position: absolute; width: 2px; background: #000; pointer-events: none;
    animation: paCaret 1.06s step-end infinite;
  }
  @keyframes paCaret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  /* THE KEYBOARD MOVES THE VIEWPORT, NOT THE PAGE (2026-08-15, Dylan on
     real glass: "selecting the offer box scrolls down to center the offer
     box but pulls the picks header and the sites header with it. then the
     header poofs until you scroll").
     iOS opens the keyboard by shrinking the VISUAL viewport and scrolling
     it INSIDE the layout viewport. position: sticky pins to the LAYOUT
     viewport — so both headers stay glued to a top that is now off-screen,
     which reads as them being dragged away and then vanishing until a
     scroll re-syncs the two. --vvTop is the visual viewport's offset
     within the layout one; adding it to each sticky seat puts the chrome
     back at the top the reader can actually see.
     ONLY WHILE AN OFFER FIELD IS FOCUSED (body.kbd). Safari's address-bar
     collapse also moves offsetTop during ordinary scrolling, and tracking
     it then would make the bar twitch its way down the page. */
  @media (max-width: 940px) {
    body.kbd .topbar { top: var(--vvTop, 0px); }
    /* (the masthead's twin of this rule retired with its sticky — page
       content cannot be stranded by the viewport split, only chrome can) */
  }
  @keyframes paStateH {
    0%   { opacity: 0; transform: translateY(20px) scale(1); }
    50%  { opacity: 1; transform: translateY(0) scale(1); }
    72%  { transform: scale(1.055); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes paRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  /* (paLand RETIRED 2026-08-16 — his react: "the cards flash when they
     land, can we remove that". The landed card used to ramp .35 → 1 as a
     settle beat, which read as a flash. The fly holds its last frame to
     the swap and lands dressed on a dressed card, so rest == rest and
     the handoff is a clean cut with no ramp at all.) */
  /* THE STACK IS DEALT AWAY (his react: "have the deal happen from the
     top card on the stack up top and have it stay gone on deal... the
     idea is that the mini cards up top feel like actual cards. so you
     deal them and now there are none up top. a move anywhere else should
     repopulate them").
     THE RULE: a pick is either in your hand or on the table, never both.
     Every deal takes the TOP mini, it slides out right and does not come
     back, and the box collapses so the stack visibly shrinks under the
     count. By the last landing the bar is empty and the page holds all
     of them. Leaving the page repopulates it (route → renderPicks, and
     renderPicks itself renders empty while you are still on picks, so a
     mid-page re-render cannot quietly refill it).
     An earlier cut had the mini return at touchdown — "absent only while
     its card is in the air" — which kept the stack honest per-frame but
     lost exactly the thing he was after: the minis reading as the cards
     themselves rather than as a picture of them. */
  .hpick.hp-out  { animation: hpOut .09s cubic-bezier(.4, 0, 1, 1) forwards; }   /* halved with PX.hand (the ×2 react) */
  .hpick.hp-gone { display: none; }   /* the box collapses so the stack really shrinks */
  @keyframes hpOut { to { opacity: 0; transform: translateX(30px); } }
  /* THE FLY GROWS INSIDE THE FLIGHT — Dylan's catch, "getting a weird
     animation on the card flight". The header mini is NOT a small card:
     it is a full 232px card under transform: scale(.1078) inside an 8px
     clipping window (.hpick .d7f). So a fly built at the MINI'S BOX width
     rendered a whole template card into 8px and flew as garbage.
     The fix is pickCatch's own shape run backwards: build the fly at the
     DESTINATION card's size, so the template renders at the width it was
     drawn for, and let an inner wrapper carry the growth from mini scale
     up to full. bayFlight owns the path; this owns the size. The two
     transforms compose because they sit on different elements — the
     wrapper's scale would otherwise be overwritten by bayFlight's
     per-frame write to the fly's own transform. */
  .deal-grow { animation: dealGrow cubic-bezier(.15, .75, .35, 1) both; transform-origin: 50% 50%; }
  @keyframes dealGrow { from { transform: scale(var(--g0, .15)); } to { transform: scale(1); } }
  /* THE DEPARTURE: the site under the bar drains, the bar stays. The
     transition lives ON the state class, so dropping the class snaps
     back instantly instead of fading the new page in over the top of
     its own ceremony (the arriving page is held hidden anyway). */
  body.pxleave #home, body.pxleave #colpage {
    opacity: 0; transition: opacity .3s ease; pointer-events: none;
  }
  /* THE DEAL SHIELD (round 5: "we also need to lock the page until the
     send message button appears. right now you can disrupt the picks
     deal with various touches") — a transparent pseudo over EVERYTHING,
     bar included: the stack mid-deal is dealing itself, and a second
     departure through it would race the first. z 6700 is a NEW TOP RUNG
     over the topbar's 6600 (the z-ladder gains a member, deliberately).
     touch-action:none keeps iOS from panning with touches that start on
     it; the ceremony's own glides write scroll programmatically and are
     unaffected. Up with the ceremony's gate, DOWN the moment SEND lands
     (its pop plays on an unlocked page); route() clears it as the belt
     so no escape path leaves the page sealed. */
  body.dealing::after {
    content: ""; position: fixed; inset: 0; z-index: 6700;
    touch-action: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .picks-deal .picks-mast > h2, .picks-deal .pick-cell .scard,
    .picks-deal .pick-ask, .picks-deal .picks-msg,
    .picks-deal .picks-copy, .picks-deal .lisst-empty {
      opacity: 1; visibility: visible; animation: none !important;
    }
    body.pxleave #home, body.pxleave #colpage { opacity: 1; transition: none; }
    .pick-ask, .pick-cell, .shelfgrid .lisst-card .d7f { transition: none; }
  }

  /* ================= THREAD 3, MOBILE (2026-08-16): the focus veil, the
     load intro, the menu-select ceremony ================================
     THE FOCUS VEIL (.fveil): one fixed frost under the bar — white tint +
     backdrop blur — shared by the two ceremonies. "The site gains focus
     from the top working its way down" is the veil RIDING DOWN out of the
     viewport (.down): its top edge is the focus line, so the reveal is
     top-first by construction. blur is ALWAYS on (invisible behind the
     intro's opaque white) so only background-color and transform ever
     animate — animating backdrop-filter itself is compositor-hostile.
     Z RUNG: 6400 — above every page organ (bay 5500, lb 5000), under the
     flights (6500) and the bar (6600). The intro lifts the home masthead
     to 6450 so the drawing logo rides ABOVE the veil while everything
     else sits under it. The z ladder gains two members, deliberately. */
  .fveil {
    /* bottom OVERSCAN (-160): fixed elements end at the LAYOUT viewport,
       and iOS paints page content in the band behind the floating toolbar
       (sim-caught: raw cards showing under the intro's opaque white). The
       reveal's 103% ride already clears the taller box. */
    position: fixed; top: var(--tbh, 64px); left: 0; right: 0; bottom: -160px;
    z-index: 6400; visibility: hidden; opacity: 0; pointer-events: none;
    background: rgba(255, 255, 255, .62);
    /* ONE transition list, no per-state overrides (2026-08-16, his "weird
       pop" catch): .on used to carry its own shorter list to dodge a
       visibility delay, and a state's transition REPLACES the base — so
       while .on held, transform had NO transition and the reveal SNAPPED
       in one frame instead of riding down. Visibility needs no transition
       at all: every hide goes through fveil.clear(), which snaps classes
       off under transition:none. */
    transition: opacity .35s ease, background-color .6s ease,
                transform .8s cubic-bezier(.22, 1, .36, 1);
  }
  /* the blur lives on the ACTIVE states only — at rest there is no live
     backdrop layer for the compositor to keep (and to tear down late) */
  .fveil.on {
    visibility: visible; opacity: 1;
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
  }
  .fveil.down { transform: translateY(103%); visibility: visible; }
  /* THE INTRO (his spec: "on initial site load, the logo draw needs to be
     the only thing on the screen"). Armed by the tiny script at the top of
     <body> — phone + home + no reduced motion — so the very first paint is
     already the intro's: veil opaque from the viewport TOP (the bar strip
     included; the bar goes transparent so the screen is pure white), bar
     pieces parked off-screen left/right, tick held dark. The main script
     then poses the logo big (inline transform, .intro-pose gates the
     flash), lets the SMIL draw play, and walks the classes:
       .intro-shrink  the pose transitions home (.85s) + veil ghosts to
                      the frost (the page appears BEHIND it, dim + blurred)
       .intro-tick    the decode's first run (startTick fires here)
       .intro-bar     brand in from the left, picks seat in from the right
       .down          the reveal, top-first
     The shield (::after, z 6700 — the deal shield's idiom) holds input for
     the whole ride; route() never fires because nothing can be touched. */
  @media (max-width: 940px) {
    body.intro::after {
      content: ""; position: fixed; inset: 0; z-index: 6700; touch-action: none;
    }
    /* visibility/opacity restated HERE because the arm script runs before
       any of the main JS: the very first paint must already be the opaque
       veil, not the base rule's hidden one */
    body.intro .fveil { visibility: visible; opacity: 1; top: 0; background: rgba(255, 255, 255, 1); }
    body.intro.intro-shrink .fveil { background: rgba(255, 255, 255, .62); }
    /* NOTHING PAINTS BELOW THE LOGO PRE-SHRINK (2026-08-16, his phone
       screenshot: collection tiles bleeding through behind the iOS
       address pill during the big draw). A fixed veil ends at the LAYOUT
       viewport, and how far past it a device actually paints the -160
       overscan is the device's business — his glass showed a band the
       sim never did. So the intro empties the band at the source: the
       page below the masthead holds visibility until the shrink beat,
       where it appears BEHIND the frost — which was already that beat's
       whole design. visibility, never display (layout must not move,
       the pose is measured off the real seat). .shop is display:none on
       the phone already; #colpage never renders under an intro (home
       only). */
    body.intro:not(.intro-shrink) .spine > :not(.masthead) { visibility: hidden; }
    body.intro .topbar {
      background-color: transparent;
      -webkit-backdrop-filter: none; backdrop-filter: none;
      transition: background-color .55s ease;
    }
    body.intro.intro-bar .topbar { background-color: rgba(0, 0, 0, .86); }
    body.light.intro.intro-bar .topbar { background-color: rgba(255, 255, 255, .88); }
    body.intro .bar-brand { transform: translateX(-70vw); }
    body.intro .picon { transform: translateX(70vw); }
    /* the home word (AVRG, 2026-08-16 A/B) holds back through the draw and
       fades in with the bar pieces — a third flyer would crowd the two-edge
       entrance, so the centre seat simply arrives */
    body.intro .nbar { opacity: 0; }
    body.intro.intro-bar .bar-brand,
    body.intro.intro-bar .picon { transform: none; transition: transform .6s cubic-bezier(.22, 1, .36, 1); }
    body.intro.intro-bar .picon { transition-delay: .07s; }
    body.intro.intro-bar .nbar { opacity: 1; transition: opacity .55s ease .18s; }
    /* the masthead rides above the veil (logo + tick are the intro's only
       actors); the pose flash gate hides it until the big transform lands */
    body.intro .masthead { position: relative; z-index: 6450; }
    body.intro:not(.intro-pose) .masthead { opacity: 0; }
    body.intro .masthead .brand { transition: none; }
    /* .85s IS COUPLED TO DRAW_HOME (the shared const at the drivers): this
       is the flight that beat starts — move one and re-derive the other */
    body.intro.intro-shrink .masthead .brand { transition: transform .85s cubic-bezier(.22, 1, .36, 1); }
    body.intro #tick { opacity: 0; }
    body.intro.intro-tick #tick { opacity: 1; transition: opacity .4s ease; }
  }
  /* THE MENU-SELECT CEREMONY (body.mnav): tap a row and the page below
     blurs under the veil while the menu resolves to one word — the other
     rows FADE (an animation, not a transition: rowin's `both` fill holds
     opacity and a transition would lose to it — the softout law), the
     chase dots hop/pull/seat on the selection, the row FILLS (its own .on
     chip), and the RIDER — the filled box between two dots, built at the
     drawn box's size — rides up into the bar's word seat. The bar's own
     organ hides for the ride (the old word drains invisibly via
     closeDrop's organ drain) and comes back at touchdown (.mword), where
     the new name DECODES back to black text between the dots the rider
     just landed on. Shield at 6700 for the whole ride — the ceremony's
     own hash flip is the only route that can fire. */
  body.mnav::after {
    content: ""; position: fixed; inset: 0; z-index: 6700; touch-action: none;
  }
  body.mnav #og-shop { opacity: 0; transition: opacity .15s ease; }
  body.mnav.mword #og-shop { opacity: 1; transition: opacity .2s ease; }
  body.mnav .nbar .bardot { transition: none; }
  .drop.selecting .dlist { pointer-events: none; }
  .drop.selecting .drow:not(.msel) { animation: mrowfade .25s ease forwards; }
  .drop.selecting .drow.msel.on::before { animation-duration: .26s; }
  @keyframes mrowfade { to { opacity: 0; } }
  /* the rider: chip + word + flanking dots, absolute in the bar's space
     (the drop's own coordinate frame), moved by one transform transition */
  .mride {
    position: absolute; z-index: 95; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    transition: transform .5s cubic-bezier(.22, 1, .36, 1), opacity .18s ease;
  }
  .mride .mrw {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .16em; text-indent: .16em; text-transform: uppercase;
    color: #fff; white-space: nowrap;
  }
  .mride .md {
    position: absolute; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    background: #000; transform: translate(-50%, -50%);
  }
  .mride .md.l { left: 0; }
  .mride .md.r { left: 100%; }
  /* touchdown: the chip fades off the seat while its dots ride OUT to the
     bar's rest posts (orb edge + 9 gap + half-dot = 11.5) — the un-merge,
     mirroring the engulf's drain, so the crossfade to the real bardots is
     a hand-off, not a jump */
  .mride.gone { opacity: 0; }
  .mride.gone .md { transition: left .25s ease; }
  .mride.gone .md.l { left: -11.5px; }
  .mride.gone .md.r { left: calc(100% + 11.5px); }
  /* THE BOARDLESS MINI (his react: "the same mini card the stacks get
     instead of the blank flat square... with a 0 in the count slot") —
     the empty bar seat renders the fv3 template's own shell (panel,
     shadow, inner frame, gap dots) with nothing on it. The card's natural
     anatomy is padding + square stage + caption zone; with no caption the
     shell falls short of the 348px reference the .0948 scale expects
     (33px mini), so the height is pinned and the stage stretches to fill.
     348 = 33 / .0948 — re-derive if the mini scale ever moves. */
  .hpick .d7f.mtblank { height: 348px; }
  .hpick .d7f.mtblank .panel { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
  .hpick .d7f.mtblank .stage { aspect-ratio: auto; flex: 1; }
  @media (prefers-reduced-motion: reduce) {
    .fveil, body.mnav #og-shop, .mride { transition: none; }
    .drop.selecting .drow:not(.msel) { animation: none; opacity: 0; }
  }

  /* THE GROUND PICK RETIRED 2026-08-20 (with the menu's GROUND row): light
     is the one ground for launch. The parked future of the thread is the
     three-scheme sun / cloudy-sun / moon picker — open-threads. */

  /* ================= light ground: the inversion =================
     j-cards-white idiom. --bg/--bone/--soft/--hint flip via inheritance
     (the belt edge fades, body text, restock border, colnav disc all ride
     the vars); --ink stays the constant dark ring/shadow color on both
     grounds, so anything that used --ink as text-on-bone gets an explicit
     color override here instead. */
  body.light {
    --bg: #fff;
    --bone: #111;
    --soft: #444;
    --hint: #767676;
  }
  body.light ::selection { background: #000; color: #fff; }

  /* top bar */
  body.light .topbar { background-color: rgba(255, 255, 255, .88); border-bottom-color: #e2e2e2; }
  body.light .topbar .tab { color: #000; border-color: #000; }
  body.light .topbar .tab:hover { background: #000; color: #fff; }

  /* spine */
  body.light .masthead svg { color: #111; }
  body.light .tick { color: #000; }
  body.light .video-wrap video, body.light .vtile video { background: #eee9df; }
  body.light .dm-mini { color: #000; border-color: #000; }
  body.light .dm-mini:hover { background: #000; color: #fff; }
  body.light .dm-mini.glitch-run, body.light .lb-dm-btn.glitch-run { background: #000; color: #fff; }

  /* shelves */
  body.light .band h2 .hl { color: #000; }
  body.light .bandsub { color: #000; }
  body.light .cap .rf { color: #000; }
  body.light .frame { background: #eee9df; }
  body.light .belt {
    background:
      linear-gradient(180deg,
        rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 13%,
        rgba(255, 255, 255, 0) 87%, rgba(255, 255, 255, 1) 100%),
      linear-gradient(90deg,
        rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, .13) 18%,
        rgba(0, 0, 0, .13) 82%, rgba(0, 0, 0, 0) 100%);
  }
  body.light .belt::before { background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0)); }
  body.light .belt::after { background: linear-gradient(to left, #fff, rgba(255, 255, 255, 0)); }

  /* collection pages */
  body.light .colpage-inner h2 { color: #000; }
  /* the foot's light dress: the label darkens; the mark is the circle
     sticker (colnavHtml) so it needs no rule here */
  body.light .colnav-home .label { color: #777; }
  body.light .colnav-home:hover .label { color: #000; }

  /* lightbox */
  body.light .lb-scrim { background: rgba(248, 247, 244, .9); }
  /* white fill so the object-fit:contain letterbox vanishes into the scrim
     (dark ground hides it with the near-black frame fill instead) */
