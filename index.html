  /* ===================== THE LANDING — THE DESKTOP ARRIVAL ==============
     BAKED 2026-08-22 (Dylan's bench index). This IS the desktop home
     arrival — it plays on every fresh desktop home boot, and the switch
     that carried it here is gone. ONE landing: he picked D out of four
     (2026-08-21), A/B/C were deleted, he reacted on it twice, tuned it on
     the bench, and called the bake. Nothing below is provisional.

     ROUND 2, his diagnosis off the frames: "right now sections fade in top
     to bottom (barely) and then swipe in top to bottom" — the swipe was the
     VEIL EDGE cutting across the bands while they were still arriving. And
     "'behind it' i meant just the clamp photo below, after."

     SO THE RIDE IS: the mark draws BIG in the upper third of a white
     screen → it starts home AND THE VEIL LEAVES FIRST, over a page that is
     still empty, so there is nothing for its edge to wipe → the mark seats,
     the tick decodes, the video slides in from off-screen left → the clamp
     photo lands BELOW the video → and on clear ground the sections land ONE
     AT A TIME: a header, then its carousel a beat later, with the next
     header starting while the last carousel is still finishing.

     THE SECTION CHOREOGRAPHY IS FINAL — his bake note: "you guys nailed
     the section load in ask. no tweaks there. its solid." The cascade
     knobs ship exactly as they were tuned; four clocks moved at the bake
     (travel, poseY, drawSpeed, vidAt) and nothing else did.

     EVERY BEAT IS A KNOB. LAND_TUNE at the driver owns the clocks and is
     handed to the bench BY REFERENCE through the shim; the visual speeds
     ride the custom properties below so an override can drive them. The
     fallbacks in every var() are the shipped values — if the driver never
     runs, this block still reads as the landing it is.

     A SECTION IS KEYED BY COLLECTION IDENTITY, never document order: the
     driver stamps data-land-chunk on each band by looking its id up in
     COLLECTIONS, so his order (originals → shaped → routed) survives any
     reshuffle of the data.

     THE ARM is a second tiny script at the top of <body> (the intro arm's
     precedent and its reason: the browser can paint before the main script
     runs, so a held page must already be held at the FIRST paint). It arms
     on desktop 941+ · motion allowed · bare home route — the phone intro
     arm's shape, one gate up. Off any of those the body never gains .land
     and not one rule below matches, so a deep link, a phone and a
     reduced-motion visit each read exactly as they always did.

     Z RUNGS — NO NEW ONES. The ride REUSES the focus veil (.fveil, 6400)
     and the phone intro's masthead lift (6450); the input shield is the
     shields rung (6700). Every rule is scoped desktop AND body.land, so
     the phone ceremony cannot see any of it.
     TODO(T1): landing beat — the draw's touchdown wants a sound. */
  @media (min-width: 941px) {
    /* THE HOLD — everything but the masthead waits. Opacity and
       pointer-events only (the video and the clamp carry transforms of
       their own): the boxes stay laid out, so lockCardScale and the
       conveyor measure the same page they always did. */
    body.land #home .spine > :not(.masthead):not(.video-wrap):not(.land-clamp),
    body.land #home .bandhead,
    body.land #home .belt {
      opacity: 0; pointer-events: none;
    }
    body.land #home .bandhead {
      transform: translateY(10px);
      transition: opacity var(--landHeadDur, 520ms) ease,
                  transform var(--landHeadDur, 520ms) cubic-bezier(.22, 1, .36, 1);
    }
    body.land #home .belt { transition: opacity var(--landCarDur, 620ms) ease; }
    body.land #home .spine > :not(.masthead):not(.video-wrap):not(.land-clamp) {
      transition: opacity var(--landCarDur, 620ms) ease;
    }
    /* the tick holds its beat — startTick is deferred at boot the same way
       the intro defers it. The .4s is the phone pair's; there is no base
       #tick transition, so dropping it here is a SNAP (bitten once). */
    body.land #tick { opacity: 0; }
    body.land.land-tick #tick { opacity: 1; transition: opacity .4s ease; }
    /* THE SNAP — one frame with no transitions anywhere on the held set, so
       the ride can take the page to its start pose INSTANTLY. A replay
       (benchLandPlay) begins on a fully dressed page, and without this the
       hold would be a 600ms fade-OUT before the draw. Same law as
       fveil.clear()'s transition:none + reflow, scoped to our own organs
       rather than inline. Never held for more than a reflow. */
    body.land.land-snap #home .bandhead,
    body.land.land-snap #home .belt,
    body.land.land-snap #home .video-wrap,
    body.land.land-snap #home .spine > :not(.masthead),
    body.land.land-snap #tick,
    body.land.land-snap .fveil,
    body.land.land-snap .land-clamp { transition: none; }

    /* ---- THE SECTIONS LAND ONE AT A TIME ----
       header and carousel are SEPARATE beats now (his spec: "the section
       header and its carousel land a section at a time ... originals lands
       just before its carousel / the carousel lands / next section has
       started"). Six classes, three sections, two organs each. */
    body.land.land-h1 #home .band[data-land-chunk="1"] .bandhead,
    body.land.land-h2 #home .band[data-land-chunk="2"] .bandhead,
    body.land.land-h3 #home .band[data-land-chunk="3"] .bandhead {
      opacity: 1; transform: none; pointer-events: auto;
    }
    body.land.land-c1 #home .band[data-land-chunk="1"] .belt,
    body.land.land-c2 #home .band[data-land-chunk="2"] .belt,
    body.land.land-c3 #home .band[data-land-chunk="3"] .belt {
      opacity: 1; pointer-events: auto;
    }
    /* a band the stamp missed (a new collection, a renamed id) must not be
       stranded invisible — the tail beat sweeps up whatever has no chunk */
    body.land.land-tail #home .band:not([data-land-chunk]) .bandhead,
    body.land.land-tail #home .band:not([data-land-chunk]) .belt,
    body.land.land-tail #home .spine > :not(.masthead):not(.video-wrap):not(.land-clamp) {
      opacity: 1; transform: none; pointer-events: auto;
    }

    /* ---- THE VIDEO COMES IN FROM SCREEN LEFT (his note) ----
       -120% of a 324px column clears the split's own left padding (max
       40px) with room, so it starts genuinely off-glass. Left overflow
       creates no scrollable area in LTR, so this cannot widen the page.
       IT CARRIES ITS OWN HOLD, and is excluded from the shared one above
       ON PURPOSE: that selector is MORE SPECIFIC than this one, and a
       state's transition REPLACES the base list rather than merging with
       it (the .fveil bite, gotchas.md). Held by it, the video's list lost
       `transform` and the slide SNAPPED while only the fade played —
       measured, transform read `none` 2ms in. One organ, one list. */
    body.land #home .video-wrap {
      opacity: 0; pointer-events: none;
      transform: translateX(-120%);
      transition: opacity var(--landVidDur, 620ms) ease,
                  transform var(--landVidDur, 620ms) cubic-bezier(.22, 1, .36, 1);
    }
    body.land.land-vid #home .video-wrap {
      opacity: 1; transform: none; pointer-events: auto;
    }

    /* ---- the veil, the pose, the bar ---- */
    body.land::after {
      content: ""; position: fixed; inset: 0; z-index: 6700;
    }
    /* visibility/opacity restated here for the same reason the intro
       restates them: the arm script runs before any of the main JS, and
       the first paint must already be the opaque veil */
    body.land .fveil {
      visibility: visible; opacity: 1; top: 0; background: rgba(255, 255, 255, 1);
    }
    body.land.land-shrink .fveil { background: rgba(255, 255, 255, .62); }
    /* the bar rides at 6600, ABOVE the veil, so it would sit on the white
       through the whole draw. The phone parks its two pieces off-screen;
       up here the drawn bar is one object over a full-width seat, so it
       simply holds and arrives — the ladder is untouched either way. */
    body.land .topbar { opacity: 0; }
    body.land.land-bar .topbar { opacity: 1; transition: opacity .55s ease; }
    /* the masthead rides above the veil (the drawing logo is the only
       actor up there); the pose gate hides it until the big transform
       has landed, so no frame paints the mark at its seat first */
    body.land .masthead { position: relative; z-index: 6450; }
    body.land:not(.land-pose) .masthead { opacity: 0; }
    body.land .masthead .brand { transition: none; }
    /* --landTravel IS LAND_TUNE.travel — the driver writes it and derives
       the seat beat (and therefore the tick, the video and the cascade)
       from the same number, so the flight and the clock cannot drift. */
    body.land.land-shrink .masthead .brand {
      transition: transform var(--landTravel, 850ms) cubic-bezier(.22, 1, .36, 1);
    }

    /* ---- THE CLAMP PHOTO, BELOW THE VIDEO (his correction: "'behind it'
       i meant just the clamp photo below, after. so video comes in then
       the clamp photo. my bad") ----
       A REAL element the driver builds and inserts after .video-wrap, not
       a pseudo and not markup: it exists only while the switch does, and
       it takes its box at ARM time so its arrival is a fade, never a
       reflow under the reader. Dressed to the video it follows — same
       radius, same ink ring, same hard shadow, column width.
       ITS STATE IS ITS OWN CLASS, not the body's, so it SURVIVES the
       clear: this is the one beat that leaves something behind rather
       than revealing markup that was always there. A ride cancelled
       before it lands removes the node instead.
       IT IS EXCLUDED FROM THE SHARED SPINE HOLD for the same reason the
       video is — it lands inside .spine, and that selector (1,4,1) far
       outranks .land-clamp.in (0,2,0), so the photo was being held past
       its own beat and only appearing when the TAIL swept the spine.
       It looked right on a first run and read 0 on a replay, which is
       how it was caught. One organ, one hold. */
    .land-clamp {
      display: block; margin: 14px 0 0; width: 100%;
      opacity: 0; transform: translateY(14px);
      transition: opacity var(--landClampDur, 520ms) ease,
                  transform var(--landClampDur, 520ms) cubic-bezier(.22, 1, .36, 1);
    }
    .land-clamp img {
      display: block; width: 100%; aspect-ratio: 5 / 4; object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 0 0 2px var(--ink), 9px 11px 0 -1px rgba(32, 26, 21, .34);
    }
    .land-clamp.in { opacity: 1; transform: none; }
  }
  /* ======================= end THE LANDING ============================== */
</style>

  <!-- THE INTRO ARM (2026-08-16, thread 3): the load ceremony's gate must

       body and the browser can paint before it, which would flash the full

  <script>
    (function () {
      try {
        /* the gate, one term per line since the belt below hangs off it —
           same three questions in the same order as before, and the same
           order the landing arm asks them */
        if (!matchMedia("(max-width: 940px)").matches) return;
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        if ((location.hash || "").replace(/^#/, "")) return;
        document.body.classList.add("intro");
        /* THE ARM'S OWN BELT (2026-08-21) — HIS BUG, NOT A THEORY: "i had
           this bug actually happen a few nights ago. page got stuck on
           loading, had to refresh." His phone, sealed on a white page.
           THE HAZARD: the class written one line up holds every scrap of
           content invisible behind an opaque veil from the FIRST paint,
           but every hand that lowers it — the driver at the main script's
           tail, and the driver's own 12s dead-man — lives in the main
           script at the end of body. Anything that kills that script
           before the driver runs (a bad data.js row, an API an old phone
           browser doesn't have, a truncated file on a flaky connection)
           takes the intro's exits down with it and strands the phone on a
           sealed page forever. This belt is the only failsafe that
           survives that, so it may reference nothing from the main script
           — same law as the arm it rides in. Ported from THE LANDING ARM's
           belt below (the desktop half already carried one).
           GATED ON THE CLASS, which is how it coordinates with the driver:
           a ride that cleared normally took `intro` off first thing in
           clearIntro, so this wakes to nothing and touches nothing. That
           matters more on the phone than it does downstairs — `.fveil` is
           SHARED with the menu-select ceremony (fveil.up()), which is
           reachable seconds after the intro clears, and an ungated strip
           would tear the frost off a ride that was going fine.
           13000, ONE SECOND BEHIND THE DRIVER'S OWN DEAD-MAN, on purpose:
           both clocks start at load but the main script's starts later (it
           has the whole file to parse first), so a matching 12000 here
           would fire FIRST and win a race it should lose — the driver's
           clearIntro is the better exit (it snaps the veil and starts the
           tick, this can do neither). Behind it, a stalled-but-alive
           script still gets the full clear and this stays a no-op. Past
           every beat either way: the ride's own clear lands ~5.1s in. */
        setTimeout(function () {
          if (!document.body.classList.contains("intro")) return;
          document.body.classList.remove("intro", "intro-pose", "intro-shrink", "intro-tick", "intro-bar");
          /* .fveil.on is UNSCOPED — dropping the intro classes alone would
             leave the frost sheet behind if the script died after the

             a death between the two would leave the mark parked huge over
             the page we just uncovered */
          var br = document.querySelector(".masthead .brand");
          if (br) br.style.transform = "";
        }, 13000);
      } catch (e) {}
    })();

  <script>
    (function () {

        setTimeout(function () {

    /* ---- card style. FRAME V3 IS THE ONLY CARD (2026-08-01): the Card
       comparison row is retired, so photo/paper/zoned no longer ship a way
       in. Pinned rather than read from storage on purpose — a stale
       `avrg-k-paper` in someone's browser would otherwise strand them on a
       treatment with no control left to escape it. The other treatments'
       CSS survives for now and goes at the port (PORT.md, vault repo). ---- */
    const CARD = "framev3";
    document.body.dataset.card = CARD;

    /* ---- lightbox layout: THE DECK IS THE LIGHTBOX (2026-08-01). Dylan

       Pinned like CARD, and for the same reason: no control left to escape
       a stale stored value. Still a named const because three conditions
       read it; they are constant-false/true now, and the thumb-strip paths
       behind them are unreachable — that sweep goes WITH the pre-rework
       CSS/markup at the port, per Dylan's "handle it when we port". ---- */
    const LB = "deck";
    document.body.dataset.lb = LB;

    /* neighbour deck knobs — TUNING LEGEND:
         scale  .52  neighbour width as a fraction of the hero card's width
         gapX   18   px of air between the hero's edge and a neighbour
         drop   .30  how far DOWN the diagonal sits, as a fraction of hero
                     height (0 = shoulder to shoulder, .5 = half a card low)
         fade   .5   resting opacity — neighbours are on deck, not competing
         lean   8    px the neighbour leans toward the hero seat on hover
         headAt .667 where the header's CENTRE sits in the gap between the
                     topbar and the card's top edge, as a fraction of that gap
                     (0 = tucked under the bar, 1 = touching the card). Dylan,
                     2026-08-01: "place the text 2/3 down from the header in
                     regards to the space between the header and the top of
                     the card." PROPORTIONAL, not a px gap off the card — the
                     sheet's free space changes with viewport height, and a
                     fixed gap would put the header in a different place in
                     that space at every window size.
         headClr 12  min px the header keeps from BOTH ends of that gap; it is
                     what the card's padding deficit is solved against
         mob    {}   phone overrides, merged under 720 (the sheet breakpoint)

       REACT 1 (Dylan, 2026-07-26): the first pass read BUSY — the neighbours
       competed with the inspection instead of sitting behind it. His recipe:
       smaller, tucked further down the page. Sizes confirmed good after.

       REACT 2 (same session): opacity WAY up. "15 pct opacity tweak" means 15%
       off full, not 15 points above the faded site — at .37 they read as a
       background artifact rather than a card ready to be swapped in. .85 is the
       band: clearly a live object, still deferring to the hero at 1. These are
       cards on deck, not scenery. */
    const NB_TUNE = {
      /* gapX 18 → 44 (2026-08-12, Dylan: "move the flankers out ... to about
         where its board edge starts" — the gap now reads as the flanker's own
         card-margin, so the hero's rail sits where the neighbour's board
         would begin) */
      scale: .42, gapX: 44, drop: .46, fade: .85, lean: 8, headAt: .667, headClr: 12,
      /* MOTION (see the deck-in-motion block below):
           xDur     900  ms of the four-body exchange, one arrow press
                         (420 → 900 on 2026-08-12, Dylan: "lets slow the
                         conveyor itself" — the strip-lab's step clock landed
                         on the whole exchange; the counter's numbers, the
                         strip's press clock and the landing click all split
                         this same number, so one knob moved the whole beat.
                         mob keeps 420: the phone's slide is its own faster
                         gesture and the counter must not outlast it)
           xEase         the house flight ease, same curve as .lb-card's
           dealDur  380  ms for the neighbours to slide out from behind the hero
                         on open
           dealBack 220  ms to tuck back under on close — deliberately shorter
                         than the card's .55s return so they are away before the
                         hero has travelled far */
      xDur: 900, xEase: "cubic-bezier(.22,1,.36,1)", dealDur: 380, dealBack: 220,
      /* headOut .42  the EXIT's share of xDur for the header's two numbers.
                      The whole swap spans one shuffle exactly — exit from the
                      press, new values landing with the card (Dylan: "start on
                      card swap and end on new card land") — so the enter takes
                      the remainder and gets the longer, settling half. */
      headOut: .42,
      /* hover takes it the rest of the way to full: from .85 that is a small,
         honest lift ("this one is next"), not a change of billing */
      hov: 1,
      /* THE PHONE TUCKS. The hero already takes 84vw, so a positive gap left a
         13px hairline of neighbour on a 390 screen — measured, not guessed.
         A NEGATIVE gap slides each neighbour partly BEHIND the hero instead:
         they paint below the card (source order, see the CSS), so the overlap
         reads as a deck stacked on either shoulder rather than two slivers,
         and the hero keeps its full size. -39 puts ~70px of clear card on each
         side at 390, symmetric. */
      mob: { scale: .5, gapX: -39, drop: .5, xDur: 420 }
    };


    /* taglines: rotating, minus the "middle" one; the box height is fixed in CSS */
    const tags = (SITE.taglines || []).filter(t => !/^by no means the m/i.test(t));
    const tick = document.getElementById("tick");
    let ti = 0;

    /* decode swap: incoming phrase resolves out of junk glyphs, left to right.
       no color change — white the whole time. spaces stay spaces so the
       two-line wrap doesn't jump mid-scramble. */
    const GLYPHS = "#%&?{}<>*+=/";
    let decodeTimer = null;
    function decodeTo(text) {
      clearInterval(decodeTimer);
      const chars = [...text];
      const resolveAt = chars.map((c, i) => i * 0.55 + 3 + Math.random() * 5);
      let f = 0;
      decodeTimer = setInterval(() => {
        f++;
        let out = "", done = true;
        for (let i = 0; i < chars.length; i++) {
          if (chars[i] === " ") { out += " "; continue; }
          if (f >= resolveAt[i]) { out += chars[i]; }
          else { out += GLYPHS[(Math.random() * GLYPHS.length) | 0]; done = false; }
        }
        tick.textContent = out;
        if (done) clearInterval(decodeTimer);
      }, 35);
    }

    /* the intro owns the FIRST decode (2026-08-16): on an intro boot the
       tick holds empty until the ceremony's own beat calls startTick —
       otherwise the rotation interval would start churning a hidden line
       mid-draw and the reveal would catch it mid-phrase. One starter,
       two callers, called once. */
    let tickStarted = false;
    function startTick() {
      if (tickStarted) return;
      tickStarted = true;
      if (reduced) { tick.textContent = tags[0] || ""; return; }
      if (tags.length) decodeTo(tags[0]);
      if (tags.length > 1) setInterval(() => {
        ti = (ti + 1) % tags.length;
        decodeTo(tags[ti]);
      }, 4400);
    }
    /* THE LANDING (permanent, baked 2026-08-22): the .land term is the
       desktop arrival's seat at the same deferral the phone intro uses —
       it holds the first decode until the mark is home. Unarmed (a deep
       link, a phone, reduced motion) neither class is on the body and this
       line reads exactly as it did before either ceremony existed. */
    if (!document.body.classList.contains("intro") &&
        !document.body.classList.contains("land")) startTick();

    /* quiet decode on button hovers: a shorter, calmer cousin of the tagline
       scramble. Delegated so re-rendered pages (colnav, lisst, shop-all) stay
       wired. DM buttons are excluded — they wear the glitch (CSS) instead;
       lb-list-btn is excluded because its label changes state on click. */
    const canHover = matchMedia("(hover: hover)").matches;
    const HOVER_DECODE = ".tab, .colnav-btn, .inq-send";
    /* filled in by the card-decode block below when the page can hover;
       no-ops otherwise, so callers never need to check */
    let cardDressOn = () => {}, cardDressOff = () => {};
    /* the tag↔board link (2026-08-04): the dress WITHOUT a cursor. Used by
       the letter's board tags and the drawer head's manifest, both ways. */
    const cardLit = (card, on) => {
      if (!card || reduced || !canHover) return;
      card.classList.toggle("lit", on);
      if (on) cardDressOn(card); else cardDressOff(card);
    };
    if (!reduced && canHover) document.addEventListener("pointerover", e => {
      const btn = e.target.closest && e.target.closest(HOVER_DECODE);
      if (!btn || btn.dataset.decoding) return;
      const chars = [...btn.textContent];
      if (!chars.length || chars.length > 40) return;
      btn.dataset.decoding = "1";
      const resolveAt = chars.map((c, i) => i * 0.4 + 1 + Math.random() * 2.2);
      let f = 0;
      const t = setInterval(() => {
        f++;
        let out = "", done = true;
        for (let i = 0; i < chars.length; i++) {
          if (!/\S/.test(chars[i])) { out += chars[i]; continue; }
          if (f >= resolveAt[i]) { out += chars[i]; }
          else { out += GLYPHS[(Math.random() * GLYPHS.length) | 0]; done = false; }
        }
        btn.textContent = out;
        if (done) { clearInterval(t); delete btn.dataset.decoding; }
      }, 30);
    });

    /* DM glitch: one run per real entry, driven by a class so mid-run
       hit-test dropouts (see the CSS comment) can't cancel or re-queue it */
    const GLITCH_SEL = ".dm-mini, .lb-dm-btn, .bay-msg";   /* the drawer's contact chrome is DM chrome */
    if (!reduced && canHover) {
      document.addEventListener("pointerover", e => {
        const btn = e.target.closest && e.target.closest(GLITCH_SEL);
        if (!btn || btn.classList.contains("glitch-run")) return;
        if (btn.contains(e.relatedTarget)) return;   /* internal move, not an entry */
        btn.classList.add("glitch-run");
      });
      document.addEventListener("animationend", e => {
        if (e.animationName === "dm-glitch") e.target.classList.remove("glitch-run");
      });
    }

    /* frame v3 card: on card entry the ref chip decodes to AVRG, the name
       decodes to dims (PH_DIMS boards only) and the status word decodes in
       beside its dot; all restore on exit. The .left class arms the chip
       exit animation (see the CSS comment). */
    function decodeInto(el, text) {
      clearInterval(el._t);
      const chars = [...text];
      const resolveAt = chars.map((c, i) => i * 0.4 + 1 + Math.random() * 2.2);
      let f = 0;
      el._t = setInterval(() => {
        f++;
        let out = "", done = true;
        for (let i = 0; i < chars.length; i++) {
          if (!/\S/.test(chars[i])) { out += chars[i]; continue; }
          if (f >= resolveAt[i]) { out += chars[i]; }
          else { out += GLYPHS[(Math.random() * GLYPHS.length) | 0]; done = false; }
        }
        el.textContent = out;
        if (done) clearInterval(el._t);
      }, 30);
    }
    /* THE LB COLLAPSE (2026-08-16 A/B, decode-slowmo's clps grammar at his
       dials: flicker 90ms · swap 1.5s · position lock ON · collapse).
       Two phases: the current text corrupts ends→center over 45% of the
       swap, then the new text resolves center→out over 55%. POSITION LOCK:
       each phase renders its chars as .dcell spans frozen at their own
       measured widths, so a wide churn glyph never shoves the line; the
       cells rebuild once at the phase boundary (name-widths → dims-widths,
       symmetric about the centred .info — the lab-approved breath, not a
       bug). Handle is el._t, NULLED on every clear (decodeEl's lesson) —
       any existing clearInterval(el._t) + textContent write kills a
       running collapse and flattens the spans, so every external reset
       path (cardDressOff, setFlip, populate, the shelf-switch kill) works
       unchanged. Interval-driven, never rAF (the timeout-pump law).
       LB-ONLY caller set: stayLand's name land + dockDress's arrival —
       grid hovers keep decodeInto's quick house scramble. */
    const CLPS_TICK = 90, CLPS_MS = 1500;
    function decodeCollapse(el, text) {
      clearInterval(el._t); el._t = null;
      if (reduced) { el.textContent = text; return; }
      const from = el.textContent;
      const w = (len, i) => { const x = len === 1 ? 0 : i / (len - 1); return Math.min(x, 1 - x) * 2; };
      /* the lab's schedule: 12% base delay + 70% directional spread + 18% jitter */
      const sched = (chars, inward, ms) =>
        chars.map((c, i) => (0.12 + 0.7 * (inward ? w(chars.length, i) : 1 - w(chars.length, i)) + Math.random() * 0.18) * ms);
      const cells = str => {
        el.textContent = "";
        [...str].forEach(ch => {
          const s = document.createElement("span");
          s.className = "dcell"; s.textContent = ch; el.appendChild(s);
        });
        const ws = [...el.children].map(s => s.getBoundingClientRect().width);
        [...el.children].forEach((s, i) => { s.style.width = ws[i] + "px"; });
      };
      const paint = (chars, showReal) => {
        for (let i = 0; i < chars.length; i++) {
          if (!/\S/.test(chars[i])) continue;
          el.children[i].textContent = showReal(i) ? chars[i] : GLYPHS[(Math.random() * GLYPHS.length) | 0];
        }
      };
      const phase = (chars, at, corrupt, done) => {
        let f = 0;
        el._t = setInterval(() => {
          f++; const t = f * CLPS_TICK;
          paint(chars, corrupt ? (i => t < at[i]) : (i => t >= at[i]));
          if (chars.every((c, i) => !/\S/.test(c) || t >= at[i])) {
            clearInterval(el._t); el._t = null; done();
          }
        }, CLPS_TICK);
      };
      const A = [...from], B = [...text];
      cells(from);
      phase(A, sched(A, true, CLPS_MS * 0.45), true, () => {
        cells(text);
        phase(B, sched(B, false, CLPS_MS * 0.55), false, () => { el.textContent = text; });
      });
    }
    /* the chip joins the card-hover decode family: at rest it is the bare
       deck mark (the + retired 2026-08-05, same react as the tag); the
       dress scrambles a random want-word in beside it — inflected, no
       immediate repeats — and the leave clears it. The mark never decodes
       (svg can't ride a textContent scramble) — it is the constant
       DESTINATION, the text is your relationship to it. The ✓ state keeps
       its meaning and never plays. */
    const WANTS = ["Want?", "Like?", "Need?", "Mine !"];
    function wantWord(card) {
      const lft = card.querySelector(".fc-list .ft");
      if (!lft || /✓/.test(lft.textContent)) return null;
      const pool = WANTS.filter(w => w !== lft.dataset.lastWant);
      const pick = pool[(Math.random() * pool.length) | 0];
      lft.dataset.lastWant = pick;
      return { lft, pick };
    }
    /* THE PHONE CHIP'S WORDS (round 4, REVISED round 5 2026-08-13: rest
       went quiet — "tuck [the blank mini] into the bottom right of our
       cards pre decode"): a free card's rest chip is the blank mini
       ALONE now (the round-4 static want words retired to git after one
       react), the decode is ADD (dockDress lands it at the lb arrival),
       and a ✓ chip still prints Mine ! — the one want word that
       survived, the pool's own word for the on-lisst state. Scoped to
       .scard so tiny renditions (header minis, band clones) stay out. */
    function landWants(root) {
      if (!dockActive()) return;
      (root || document).querySelectorAll(".scard .fc-list .ft").forEach(lft => {
        if (/✓/.test(lft.textContent)) lft.textContent = "Mine !";
      });
    }
    /* THE MOBILE DIMS DECODE NARROWED (2026-08-16 A/B react, supersedes
       the same-day in-view IO decode): grid cards rest on their names —
       dims decode only where there's no hover to earn them: the lb view
       (dockDress) and YOUR PICKS (static land). Desktop keeps the hover
       decode. The IO armer lives at git 762f975 if in-view ever returns. */
    /* the four decode-able reads, carried card-to-card so a mid-decode pluck
       is seamless (buildFly's idiom, shared with the lb open and the deck
       exchange's demoting clone) */
    const DRESS_TEXTS = [".fc-ref .ft", ".nmt", ".sttxt", ".fc-list .ft"];
    function copyCardTexts(from, to) {
      DRESS_TEXTS.forEach(sel => {
        const a = from.querySelector(sel), f = to.querySelector(sel);
        if (a && f) f.textContent = a.textContent;
      });
    }
    /* THE DIMS REST (2026-08-18): on YOUR PICKS and on the drawer's
       shelves a card's standing name line is its DIMS. Both surfaces hold
       boards already CHOSEN — the read that matters there is the size, not
       the print — while the collection grids and the home belts, where a
       board is still being met, keep resting on the name. The WRAPPER is
       the law (.lisst-card / .bay-item, plus the .dimsrest marker a
       bay-bound fly wears so its mid-air drain lands rest == rest), so
       every render path on those surfaces inherits it without asking.
       Two exemptions, both older laws: an unmeasured board (empty
       data-dims — the tail) falls back to its name, and a flipped card
       rests on UNDERSIDE everywhere. */
    const DIMS_REST = ".lisst-card, .bay-item, .dimsrest";
    const restsDims = card => !!(card && card.closest && card.closest(DIMS_REST));
    /* the ONE reader of a card's resting name — every writer below asks it */
    function restNm(card) {
      const nmt = card && card.querySelector(".nmt");
      if (!nmt) return "";
      if (card.classList.contains("flipped")) return "UNDERSIDE";
      return (restsDims(card) && nmt.dataset.dims) || nmt.dataset.nm || "";
    }
    /* land the dims rest STATICALLY on a freshly rendered dims-rest surface
       — rest IS the landed state (the deck's dress law), so no scramble
       replays on a page or case render */
    function landDims(root) {
      (root || document).querySelectorAll(".nmt").forEach(nmt => {
        const card = nmt.closest(".d7f");
        if (!restsDims(card)) return;
        const txt = restNm(card);
        if (!txt || nmt.textContent === txt) return;
        clearInterval(nmt._t); nmt._t = null;   /* decodeEl's lesson: null the handle */
        nmt.textContent = txt;
      });
    }
    /* the persistent dress's text half (Dylan, 2026-08-01: the fills just
       stay): land the decoded reads on the lb card, scrambling ONLY what
       actually changes — decoding "AVRG" into "AVRG" would be the exact
       re-animation this pass rules out. Runs at open (after the source's
       texts ride over) and after every mid-lb populate (deck exchange). */
    function stayLand() {
      if (!lbCard.classList.contains("stay")) return;
      const land = (el, txt) => {
        if (!el || !txt || el.textContent === txt) return;
        if (reduced) { clearInterval(el._t); el.textContent = txt; }
        else decodeInto(el, txt);
      };
      land(document.getElementById("lb-fv3-ref"), "AVRG");
      const nmt = document.getElementById("lb-fv3-nmt");
      /* the name→dims land rides THE COLLAPSE (item 2's grammar; reduced
         short-circuits inside it) — the changed-only guard stays, so a
         carried dims read never re-plays */
      const ntxt = nmt.dataset.dims || nmt.dataset.nm;
      if (nmt && ntxt && nmt.textContent !== ntxt) decodeCollapse(nmt, ntxt);
      const stx = document.getElementById("lb-fv3-sttxt");
      land(stx, stx.dataset.txt);
      /* a want word that rode over from the source stays put — re-rolling it
         would re-scramble a read that didn't change */
      const lft = lbCard.querySelector(".fc-list .ft");
      if (lft && WANTS.includes(lft.textContent)) lft.dataset.lastWant = lft.textContent;
      else { const want = wantWord(lbCard); if (want) land(want.lft, want.pick); }
    }
    if (canHover) {
      /* EXTRACTED (2026-08-04): the entry/exit decode is now a named pair
         so the letter's board tags can fire it on a card that has no
         cursor on it. The delegated listeners below are unchanged callers;
         cardLit()/cardUnlit() add the .lit dress on top. */
      cardDressOn = card => {
        card.classList.remove("left");
        const ref = card.querySelector(".fc-ref .ft");
        const stx = card.querySelector(".sttxt");
        const nmt = card.querySelector(".nmt");
        const dims = nmt && nmt.dataset.dims;
        const want = wantWord(card);
        /* a dims-rest card is ALREADY showing its dims (THE DIMS REST) —
           decoding dims into dims would be the same re-animation stayLand
           rules out, so the changed-only guard rides here too */
        const newDims = dims && nmt.textContent !== dims;
        if (reduced) {
          if (ref) ref.textContent = "AVRG";
          if (stx) stx.textContent = stx.dataset.txt;
          if (newDims) nmt.textContent = dims;
          if (want) want.lft.textContent = want.pick;
          return;
        }
        if (ref) decodeInto(ref, "AVRG");
        if (stx) decodeInto(stx, stx.dataset.txt);
        if (newDims) decodeInto(nmt, dims);
        if (want) decodeInto(want.lft, want.pick);
      };
      cardDressOff = card => {
        card.classList.add("left");
        const ref = card.querySelector(".fc-ref .ft");
        const stx = card.querySelector(".sttxt");
        const nmt = card.querySelector(".nmt");
        if (ref) { clearInterval(ref._t); ref.textContent = ref.dataset.ref; }
        if (stx) { clearInterval(stx._t); stx.textContent = ""; }
        /* rest is whatever the card's surface rests on — the print name, the
           dims (THE DIMS REST), or UNDERSIDE on a flipped card */
        if (nmt) { clearInterval(nmt._t); nmt._t = null; nmt.textContent = restNm(card); }
        const lft = card.querySelector(".fc-list .ft");
        if (lft && !/✓/.test(lft.textContent)) {
          /* rest is the bare deck mark — decodeInto("") is an instant
             clear that also kills a mid-scramble interval */
          if (reduced) lft.textContent = "";
          else decodeInto(lft, "");
        }
      };
      document.addEventListener("pointerover", e => {
        const card = e.target.closest && e.target.closest(".d7f");
        if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
        if (lbFlying && card === lbCard) return;   /* frozen for the return flight */
        /* the persistent dress: a stay'd lb card is already landed — entry
           re-decodes nothing (the sun and the board grow are the only hover
           answers left, and they live elsewhere) */
        if (card === lbCard && card.classList.contains("stay")) return;
        /* a LIT card is spoken for (2026-08-09) — the letter's tag hover
           or a focused board line is holding its dress; the pointer's own
           entry/exit must not restart or drain it */
        if (card.classList.contains("lit")) return;
        cardDressOn(card);
      });
      document.addEventListener("pointerout", e => {
        const card = e.target.closest && e.target.closest(".d7f");
        if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
        if (lbFlying && card === lbCard) return;   /* the card leaves the cursor mid-flight — that's not a hover exit */
        /* the persistent dress never drains on exit — leaving the card is the
           sun's business (it eases the board home), not the fills' */
        if (card === lbCard && card.classList.contains("stay")) return;
        if (card.classList.contains("lit")) return;   /* spoken for — see the entry guard */
        cardDressOff(card);
      });
      /* CHIP AIM (2026-08-08 late): aiming at the chip itself decodes the
         want-word to the action — ADD+ — while the mark's shadow flips to
         the drawer's left (CSS, the aim rule). The accent rung retired
         with this; the chip speaks by flip + decode, not colour. Leaving
         the chip hands the want-word back; leaving the CARD through the
         chip defers to the card exit's clear (these run AFTER the card
         handlers, and a restore after cardDressOff would redress a bare
         chip) — except on the stay'd lb card, whose exits never clear, so
         the chip restores its own word. The ✓ never plays, same law as
         the dress. ADD+ at 4ch sits inside the "Mine !" reservation — the
         box never resizes. */
      document.addEventListener("pointerover", e => {
        const chip = e.target.closest && e.target.closest(".d7f .fc-list");
        if (!chip || (e.relatedTarget && chip.contains(e.relatedTarget))) return;
        const lft = chip.querySelector(".ft");
        if (!lft || /✓/.test(lft.textContent)) return;
        if (reduced) { clearInterval(lft._t); lft.textContent = "ADD+"; }
        else decodeInto(lft, "ADD+");
      });
      document.addEventListener("pointerout", e => {
        const chip = e.target.closest && e.target.closest(".d7f .fc-list");
        if (!chip || (e.relatedTarget && chip.contains(e.relatedTarget))) return;
        const lft = chip.querySelector(".ft");
        if (!lft || /✓/.test(lft.textContent)) return;
        const card = chip.closest(".d7f");
        const leftCard = !e.relatedTarget || !card.contains(e.relatedTarget);
        if (leftCard && !(card === lbCard && card.classList.contains("stay"))) return;
        if (reduced) { clearInterval(lft._t); lft.textContent = lft.dataset.lastWant || ""; }
        else decodeInto(lft, lft.dataset.lastWant || "");
      });
    }

    const handle = (typeof CONTACT === "object" && CONTACT && CONTACT.reddit) || "u/avrg";
    const rname = handle.replace(/^\/?u\//i, "");
    /* primed PM compose: recipient + subject + body prefilled (classic messages,
       not chat — chat has no prefill URL). Lands in reddit.com/message/inbox. */
    const composeUrl = (subject, body) =>
      "https://www.reddit.com/message/compose/?to=" + encodeURIComponent(rname) +
      "&subject=" + encodeURIComponent(subject) +
      "&message=" + encodeURIComponent(body);
    const siteUrl = () => location.href.split("#")[0];
    const genericDm = () => composeUrl("AVRG inquiry", "hey! coming from the AVRG site — ");
    /* (#nav-dm — the phone bar's DM seat — retired 2026-08-12, the tidy
       react. The lb's DM cta is the one bar-adjacent DM left to write.) */
    const lbDmEl = document.getElementById("lb-dm");
    if (lbDmEl) { lbDmEl.href = genericDm(); lbDmEl.textContent = "DM " + handle + " →"; }

    /* home band naming: short titles + one-line "how" subs */

    const CANVA = {

    /* EVERY REF IS THE SAME WIDTH (Dylan, 2026-08-04, on the letter's tag

            '<div class="dims">' + m.dims + '</div>' +
            '<div class="r2">' + stHtml(m) + (m.st === "gone" ? "" : '<button class="wchip">+ List</button>') + '</div>' +

    /* every card is the framev3 treatment (the photo-card renderer this

    const cleanDesc = s => (s || "").replace(/ Hover.*$/, "");

      '<a class="tab" href="#my-lisst" id="nav-lisst"></a>';

    /* ========= the header: the drawn bar + the drop =========

    let navLean = false;   /* bar-script hover points at the deck — the bay's inspection lean (the DECK organ's job until 2026-08-08) */
    const drawnBarOn = () => matchMedia("(min-width: 941px)").matches;
    /* mini-bay rows: real links, real counts — the collections live here */
    const dpanel = document.getElementById("dpanel");
    /* the Home row is MOBILE-ONLY (hidden by CSS on desktop, where the logo

      /* DM rides in the menu AND stays exposed in the bar (Dylan's call) so

         only: up on desktop the drawn bar carries its own DM organ, and a

    const drop = document.getElementById("drop");

    function parkDrop() {

       engulfed for the drop's whole life and the dots stay pulled with it,
       so the drop's inner lines are continuations of the held button's own
       frame verticals. Panel = pulled span + 2×(--iin + the line's 1px
       half). Measured as rest centres (see cx — the pull rides
       transform:translateX and a mid-flight measure would lie) plus the
       dots' own --dpl/--dpr pull targets written by buildSeatFx.
       ≤940 has no bardots: the 212px CSS fallback carries the phone. */
    function sizeDrop() {
      /* PHONE (2026-08-16): the panel is WIDER THAN THE HEADER WORD on
         purpose — his ruling: the selected section rides the menu up into
         the bar seat with no resize. That works iff the chase dots' SEATED
         span equals the bar's own dot span: seated dots sit (--iin + 1 +
         --travel) inside each panel edge, so panel = --mspan + 2×(iin +
         1 + travel). The drop's inner lines therefore land OUTSIDE the
         bar dots down here — the desktop's lines-under-the-bar-dots law
         deliberately does not cross the boundary. */
      if (!drawnBarOn()) {
        const ms = parseFloat(getComputedStyle(topbarEl).getPropertyValue("--mspan")) || 148;
        const iin = parseFloat(getComputedStyle(drop).getPropertyValue("--iin")) || 9;
        const tv = parseFloat(getComputedStyle(drop).getPropertyValue("--travel")) || 16;
        drop.style.setProperty("--dw", Math.round(ms + 2 * (iin + 1 + tv)) + "px");
        return;
      }
      const o = document.getElementById("og-shop");
      const ld = o && o.previousElementSibling, rd = o && o.nextElementSibling;
      if (!ld || !rd || !ld.classList.contains("bardot") || !rd.classList.contains("bardot")) return;
      const cx = el => {
        /* the engulf pull rides transform:translateX on the dots — subtract
           the live matrix so a mid-pull measure still lands on rest centres */

        const tf = getComputedStyle(el).transform;
        return r.left + r.width / 2 - (tf && tf !== "none" ? new DOMMatrixReadOnly(tf).m41 : 0);

      const iin = parseFloat(getComputedStyle(drop).getPropertyValue("--iin"));
      drop.style.setProperty("--dw", Math.round((cx(rd) - pr) - (cx(ld) + pl) + 2 * (iin + 1)) + "px");
    }
    function openDrop() {

      parkDrop();

         desktop's hover drop never takes it. AND THE WORD ENGULFS
         (2026-08-16): whatever door opened the menu — the word's own tap
         or the logo's — the bar word answers with the fill and holds it
         for the menu's whole life, the organ-follows-the-menu law one
         costume down. closeDrop's existing drain undresses it. Home has
         no word (noword) and nothing engulfs. */

           COLLECTIONS button stays filled the whole time its drop is open —

    /* ---- the drop chase (the drop-lab port, 2026-08-14) ----------------
       HOP (down the inner line, 240ms) → PULL (in by --travel, 170ms,
       clamped per open so the box never crosses the widest visible row's
       text) → SEAT (a 70ms beat so the draw answers the landing, never
       overlaps it) → DRAW (four svg quarters born at the seated dots,
       360ms). A re-target retracts the box IN PLACE at the rate it opened —
       its geometry is STAMPED at draw time, not bound to the dots — while
       the dots ride home (--tp) and re-hop at once. */
    const chase = (() => {
      const DRAW = 360, HOP = 380, PULL = 170, SEAT = 70;   /* HOP mirrors --tv */
      const s = { phase: "idle", target: null, drawAt: 0, tv: 0, cy: 0, t: [] };
      const kill = () => { s.t.forEach(clearTimeout); s.t = []; };
      const at = (fn, t) => s.t.push(setTimeout(fn, t));
      const cnum = v => parseFloat(getComputedStyle(drop).getPropertyValue(v));
      const lineX = () => {
        const iin = cnum("--iin");
        return [iin + 1, dpanel.getBoundingClientRect().width - (iin + 1)];
      };
      const setX = (a, b) => {
        drop.style.setProperty("--clx", a.toFixed(1) + "px");
        drop.style.setProperty("--crx", b.toFixed(1) + "px");
      };
      const measureTravel = () => {
        const want = cnum("--travel"), [a, b] = lineX();
        let wide = 0;
        dpanel.querySelectorAll(".drow").forEach(row => {
          const kids = [...row.children];
          if (!kids.length) return;
          const l = Math.min(...kids.map(k => k.getBoundingClientRect().left));
          const r = Math.max(...kids.map(k => k.getBoundingClientRect().right));
          wide = Math.max(wide, r - l);
        });
        const room = ((b - a) - 4 - wide - 12) / 2;   /* 2px borders each side + 6px air */
        s.tv = Math.max(4, Math.min(want, room));
      };
      const rest = () => {
        kill(); s.phase = "idle"; s.target = null;
        drop.querySelector(".chase").classList.remove("drawn");
        drop.style.setProperty("--tdc", DRAW + "ms");
        /* px, not 50% — the gap corrects by --iin off the same number (see
           the .sg rules), and a % would mean two different halves */
        drop.style.setProperty("--cy", (dpanel.getBoundingClientRect().height / 2).toFixed(1) + "px");
        setX(...lineX());
        measureTravel();
      };
      const startSeq = () => {
        const row = s.target;
        const pr = dpanel.getBoundingClientRect(), rr = row.getBoundingClientRect();
        s.phase = "hop";
        s.cy = rr.top + rr.height / 2 - pr.top;
        drop.style.setProperty("--tdc", DRAW + "ms");
        drop.style.setProperty("--cy", s.cy.toFixed(1) + "px");
        at(() => {
          s.phase = "pull";
          const [a, b] = lineX(), tv = s.tv || cnum("--travel");
          setX(a + tv, b - tv);
          at(() => {
            s.phase = "draw"; s.drawAt = performance.now();
            /* the stamp: the box materialises where the dots seated and owns
               that seat until the next stamp — a bail retracts it right here */
            const bx = a + tv, bw = (b - tv) - bx, H = cnum("--dbh");
            const half = H / 2, gg = Math.min(cnum("--bgap"), half - 1);
            const box = drop.querySelector(".cbox");
            box.style.left = bx.toFixed(1) + "px";
            box.style.top = (s.cy - half).toFixed(1) + "px";
            box.style.width = bw.toFixed(1) + "px";
            box.style.height = H + "px";
            box.setAttribute("viewBox", "0 0 " + bw.toFixed(1) + " " + H);
            const ds = [
              "M 0 " + (half - gg) + " L 0 0 L " + (bw / 2).toFixed(1) + " 0",
              "M 0 " + (half + gg) + " L 0 " + H + " L " + (bw / 2).toFixed(1) + " " + H,
              "M " + bw.toFixed(1) + " " + (half - gg) + " L " + bw.toFixed(1) + " 0 L " + (bw / 2).toFixed(1) + " 0",
              "M " + bw.toFixed(1) + " " + (half + gg) + " L " + bw.toFixed(1) + " " + H + " L " + (bw / 2).toFixed(1) + " " + H
            ];
            box.querySelectorAll("path").forEach((p, i) => p.setAttribute("d", ds[i]));
            drop.querySelector(".chase").classList.add("drawn");
            at(() => { s.phase = "set"; }, DRAW);
          }, PULL + SEAT);   /* the seated beat */
        }, HOP);
      };
      const bail = then => {
        kill();
        /* how much of the box is on screen is what has to come off — it
           closes in its stamped seat on its own clock; the dots only ever
           wait out their own return leg */
        const p = s.phase === "set" ? 1 :
          s.phase === "draw" ? Math.min(1, (performance.now() - s.drawAt) / DRAW) : 0;
        drop.style.setProperty("--tdc", Math.max(90, DRAW * p) + "ms");
        drop.querySelector(".chase").classList.remove("drawn");
        setX(...lineX());
        s.phase = "rev";
        at(() => { s.phase = "idle"; then(); }, PULL);
      };
      const to = row => {
        if (row === s.target && s.phase !== "idle") return;
        s.target = row;
        if (s.phase === "idle") { row ? startSeq() : rest(); return; }
        if (s.phase === "rev") return;   /* the reversal reads s.target when it lands */
        if (s.phase === "hop" && row) { kill(); startSeq(); return; }
        bail(() => { if (s.target) startSeq(); else rest(); });
      };
      /* st: the select ceremony reads the phase instead of guessing the
         clock — a touch tap's pointerover may have started the hop early */
      return { to, rest, st: () => s.phase };
    })();

    /* the chase reset is mouse-gated too now (2026-08-16): a lifted finger

    drop.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { chase.to(null); closeDrop(); } });

    function buildSeatFx() {
      document.querySelectorAll(".seatfx").forEach(s => s.remove());
      if (!drawnBarOn()) return;
      const NS = "http://www.w3.org/2000/svg";
      const barR = topbarEl.getBoundingClientRect();
      const basePull = parseFloat(getComputedStyle(topbarEl).getPropertyValue("--dotpull")) || 0;
      document.querySelectorAll(".nbar .organ").forEach(o => {
        const orb = o.querySelector(".orb");
        const ld = o.previousElementSibling, rd = o.nextElementSibling;
        if (!ld || !rd || !ld.classList.contains("bardot") || !rd.classList.contains("bardot")) return;
        const orR = orb.getBoundingClientRect(), lr = ld.getBoundingClientRect(), rr = rd.getBoundingClientRect();
        const lcx = lr.left + lr.width / 2, rcx = rr.left + rr.width / 2;
        const pad = 14;
        const W = rcx - lcx + pad * 2, H = barR.height;
        const y1 = 13, y2 = H - 13, cy = H / 2, cx = W / 2;
        const dl = pad, dr = W - pad;             /* REST dot centers in overlay space */
        /* the pull, clamped per organ so the frame line can never close
           into the word box (the bar gap is a clamp() — at narrow desktop
           widths the dots sit nearer the word). Symmetric on purpose: an
           off-centre card would read as a mistake, so the tighter side
           governs both. Written onto the DOTS (--dpl/--dpr) because a
           shared dot serves two organs and each may clamp differently. */
        const P = Math.max(0, Math.min(basePull, orR.left - lcx - 4, rcx - orR.right - 4));
        ld.style.setProperty("--dpl", P + "px");
        rd.style.setProperty("--dpr", P + "px");
        const fl = dl + P, fr2 = dr - P;          /* frame line = the PULLED dots */
        const fx1 = fl - 9, fx2 = fr2 + 9;        /* slab: 9px past the frame, the mini card's inset */
        /* Hit area DELIBERATELY stays at the old footprint — the REST dot
           centres (+9 at the ends) — even though the drawn card now pulls
           inside it. Drawn ⊆ hit is the safe direction of the general law
           (the promise is never bigger than the listener), and shrinking
           the hit to the pulled card would open dead strips between organs
           where crossing the bar drops one button before the next arms —
           a flickery crossing for at most ~12px of honesty. Interior edges
           still tile at the shared dot centre: no gap, no overlap. */
        const endL = !(ld.previousElementSibling || {}).classList?.contains("organ");
        const endR = !(rd.nextElementSibling || {}).classList?.contains("organ");
        o.style.setProperty("--hitl", (orR.left - lcx + (endL ? 9 : 0)) + "px");
        o.style.setProperty("--hitr", (rcx - orR.right + (endR ? 9 : 0)) + "px");
        const ry1 = y1 + 4, ry2 = y2 - 4;         /* inner ring top/bottom */
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "seatfx");
        svg.setAttribute("viewBox", "0 0 " + W + " " + H);
        svg.style.left = (lcx - orR.left - pad) + "px";
        svg.style.top = (barR.top - orR.top) + "px";
        svg.style.width = W + "px"; svg.style.height = H + "px";
        /* the peeling horizontals: at rest they overlap the real rails
           exactly, so rest is invisible for free */
        [["t", 1], ["b", H - 1]].forEach(([c, y]) => {
          const nr = document.createElementNS(NS, "path");
          nr.setAttribute("class", "nrail " + c);
          nr.setAttribute("d", "M" + fx1 + " " + y + " H" + fx2);
          svg.appendChild(nr);
        });
        svg.style.setProperty("--ny", (y1 - 1) + "px");
        /* the drain floors on the seat's own bottom edge */
        svg.style.setProperty("--dfloor", (H - y1) + "px");
        const fr = document.createElementNS(NS, "rect");
        fr.setAttribute("class", "fr");
        fr.setAttribute("x", fx1); fr.setAttribute("y", y1);
        fr.setAttribute("width", fx2 - fx1); fr.setAttribute("height", y2 - y1);
        fr.setAttribute("rx", 0);
        svg.appendChild(fr);
        /* four ring quarters — REVERSED 2026-08-01 (Dylan): they are born at
           the top and bottom CENTERS and draw OUTWARD, docking into the
           newly-placed dots (which travelled in and flipped while the fill
           wiped). The draw follows the path direction, so the reversal is
           the path string; the old weld-at-centre read is inverted into a
           reach-the-dots read, and the completion pulse now answers the
           lines ARRIVING at the dots.
           DOT GAP 2026-08-14 (Dylan, with the drop port): the quarters stop
           5px short of the dot centre — the same ±gap the drop's drawn box
           keeps (--bgap), so the dot sits centred in a gap in the ring the
           way it sits in every other line of the grammar. */
        const rg = 5;
        [
          "M" + cx + " " + ry1 + " H" + fl + " V" + (cy - rg),
          "M" + cx + " " + ry2 + " H" + fl + " V" + (cy + rg),
          "M" + cx + " " + ry1 + " H" + fr2 + " V" + (cy - rg),
          "M" + cx + " " + ry2 + " H" + fr2 + " V" + (cy + rg)

          p.setAttribute("class", "st");
          p.setAttribute("d", d);
          p.setAttribute("pathLength", "1");
